# cargo-deny configuration (SPR-001 T-03).
# REF: ADR-0021 as amended on 2026-10-16 (personal-use mode): Rehoboam is a private experiment that is
#      never distributed, so any licence may be used and licences do not gate a change.
#
# The PR tier (bin/check_all.sh) runs `cargo deny check bans sources`, which blocks, and
# `cargo deny list`, which does not: it writes every dependency's licence to
# artifacts/licence_ledger.txt so that a future decision to share the code can see what would need
# replacing. Advisories run on a schedule only (.github/workflows/advisories.yml): a newly published
# advisory can turn the check red with no change in the repository, and a gate that changes colour by
# itself is flaky (GOV-002 §1 law 8).
#
# There is deliberately no [licenses] section and `cargo deny check licenses` is not part of any gate.
# Do not run a bare `cargo deny check` (all checks) as a gate.

[graph]
all-features = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between private workspace crates carry no version requirement. Wildcards in
# registry dependencies, and in any publishable crate, are still denied.
allow-wildcard-paths = true
deny = []

[sources]
# crates.io only. A git or alternative-registry source is a C2 decision recorded here.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
# Scheduled job only (see the header). Yanked crates are treated as advisories for the same reason.
yanked = "deny"
ignore = [
    # Transitive dev-dependencies of rh-bench via iai-callgrind (unmaintained notices, non-production):
    "RUSTSEC-2025-0141", # bincode 1.3.3 unmaintained
    "RUSTSEC-2026-0173", # proc-macro-error2 2.0.1 unmaintained
]
