# The PR tier on GitHub-hosted runners (SPR-001 T-05; GOV-008 §1; docs/13 §4.3).
# It runs bin/check_all.sh, the same script developers run locally, and always uploads its report.
#
# The plan is GitHub Free (Q-INFRA-1): this workflow reports but cannot block a merge, and there is
# no merge queue. The Architect enforces "no green check_report.md, no merge" by hand (docs/13 §4.4).
# Minutes are limited (about 2,000 a month), so the tools are installed as prebuilt binaries and
# superseded runs on the same ref are cancelled.
name: ci

# Pushes to main and every pull request; not every branch push as well, which would run each
# pull request twice and spend Free-plan minutes (GOV-005 §4.1: every sprint opens a draft PR early).
on:
  push:
    branches: [main]
  pull_request:
    # `edited`: a title change re-runs the baseline gate's C3 rule (VER-SPR-008 MAJ-1).
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

# Only pull_request runs are cancelled by a newer one (VER-SPR-008-TEST GAP-8). A push run on main
# checks the baseline over its own before..after range; cancelling it would let the next push's
# range skip the cancelled commits, so a baseline change in them would never be checked against
# the C3 or [perf-baseline] rule. Queueing is not enough either: GitHub keeps at most ONE pending
# run per concurrency group and a newer one replaces it, even with cancel-in-progress false, so of
# three quick pushes the middle one's range would never run (SPR-009 review 3). Each push therefore
# gets its own group (its SHA); pull requests share one per ref, and a newer push cancels the older
# run. The push trigger is main only, so a push that opens a new branch never runs here.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-all:
    # Three parallel jobs, one per part of the chain (SPR-009 review 2b; BCK-002 A-38, A-63), so the
    # tier fits V-PERF-04's 15 minutes on a slow runner: `core` (lints, builds, workspace and by-name
    # tests, Python, specs), `golden` (the release build, golden runs with the vitals observer,
    # baselines, ladders, performance gates) and `stream` (the stream, serve, tail, sift, replay,
    # rungs and twin gates, on run directories of its own). Every gate runs on every PR, in exactly
    # one of them, unless a path scope reports it SKIP (BCK-002 A-64).
    name: PR tier (bin/check_all.sh --part ${{ matrix.part }})
    runs-on: ubuntu-24.04
    # 20 minutes guards the 15-minute PR budget (V-PERF-04): a part that runs past it is a red
    # tier, not a slow green one (BCK-002 A-38, SPR-011). python/tests/test_ci_workflow.py pins it.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [core, golden, stream]
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
      # SPR-008 T-04: the golden baseline may change only in a C3 change (bin/check_baseline.py):
      # a PR whose title carries [C3], or on a push a commit in before..after whose subject does.
      # The rule fails closed (VER-SPR-008 MAJ-1). Passed through the environment, never
      # interpolated into a script.
      # The real event name (pull_request, push or workflow_dispatch): inside Actions, bin/perf_gate.py
      # refuses an event it does not know rather than treat it as local (SPR-009 review 6).
      RH_EVENT: ${{ github.event_name }}
      RH_PR_TITLE: ${{ github.event.pull_request.title }}
      RH_BASELINE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      RH_PUSH_BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
      RH_PUSH_AFTER: ${{ github.event_name == 'push' && github.sha || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: a push needs before..after for the C3 rule and the bisect (SPR-008 MAJ-1,
          # MIN-4), and the perf-baseline integrity gate needs the merge base of HEAD and the base
          # branch on every event (SPR-009 ruling 3).
          fetch-depth: 0

      - name: The base branch, for the baseline gates and the bisect (SPR-008, SPR-009)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        # Full depth, like the checkout: a --depth=1 fetch would make the clone shallow again.
        run: git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      # The director's ruling of 2026-10-17: a change whose every file is documentation (docs/,
      # CODEX/, *.md) skips the golden and stream parts' work, which cannot move for it, and reports
      # green; the core part always runs in full. bin/ci_scope.py fails closed (an unknown scope
      # runs everything). Every later step of this job carries the verdict in its `if`, which
      # python/tests/test_ci_workflow.py pins. Inside the core part, bin/check_all.sh asks the same
      # script which path-scoped gates a change needs (`scope`; BCK-002 A-64), from RH_EVENT and
      # the base or push range in this job's env.
      - name: Scope (documentation-only changes skip the golden and stream parts)
        id: scope
        env:
          CHECK_PART: ${{ matrix.part }}
        run: python3 -I bin/ci_scope.py --part "$CHECK_PART"

      - name: Rust toolchain (pinned by rust-toolchain.toml)
        if: steps.scope.outputs.run == 'true'
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.run == 'true'
        with:
          # One cache per part: they build different profiles and targets (the stream part's
          # release tests are not the golden part's benches). The stream part builds its release
          # dependencies with overflow checks (check_all.sh `part`; PR #89's review C5), which this
          # action cannot see, so its key names them: a cache restored by its exact key is never
          # saved again, and one keyed `stream` holds the build without them.
          key: ${{ matrix.part == 'stream' && 'stream-overflow-checks' || matrix.part }}

      - name: cargo-nextest, cargo-deny and iai-callgrind-runner (prebuilt binaries)
        if: steps.scope.outputs.run == 'true'
        uses: taiki-e/install-action@v2
        with:
          # iai-callgrind-runner must be the version of the iai-callgrind crate in Cargo.lock (SPR-009).
          tool: cargo-nextest@0.9,cargo-deny@0.20,iai-callgrind-runner@0.16.1

      - name: valgrind from the runner's package manager (SPR-009 ruling 2)
        if: matrix.part == 'golden' && steps.scope.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
          valgrind --version

      - name: uv and Python 3.12
        if: steps.scope.outputs.run == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Python environment from the lock (RUN-001 §4)
        if: steps.scope.outputs.run == 'true'
        run: uv sync --frozen --project python

      - name: bin/check_all.sh
        if: steps.scope.outputs.run == 'true'
        # A changed perf baseline needs [perf-baseline] in the PR title (RH_PR_TITLE, job env) and a
        # reason in its body (SPR-009 ruling 3). Passed through the environment, never interpolated.
        env:
          RH_PR_BODY: ${{ github.event.pull_request.body }}
          CHECK_PART: ${{ matrix.part }}
        run: bin/check_all.sh --part "$CHECK_PART"

      - name: Instruction counts of this run and their difference from the baseline (SPR-009 R-8)
        if: always() && matrix.part == 'golden' && steps.scope.outputs.run == 'true'
        run: |
          cat artifacts/perf/instructions.txt || echo "no instruction counts: the tier stopped before the gate"
          diff crates/rh-bench/baselines/instructions_v1.txt artifacts/perf/instructions.txt && echo "identical to the baseline" || true

      # docs/13 §4.5: on a golden-run mismatch, the bisect runs automatically (base revision
      # against this head) and its report is attached below (SPR-008 ruling 7).
      - name: Divergence bisect on a golden mismatch (SPR-008 T-03)
        if: failure() && matrix.part == 'golden' && steps.scope.outputs.run == 'true'
        run: bin/golden_bisect_ci.sh

      - name: Upload the check report, the licence ledger, the golden ladders, any bisect report and the perf counts
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: check-report-${{ matrix.part }}
          path: |
            artifacts/check_report.md
            artifacts/licence_ledger.txt
            artifacts/bisect_report.txt
            target/golden/smoke_yearly_t1.ladder
            target/golden/smoke_yearly_tN.ladder
            artifacts/perf/
          if-no-files-found: warn
