# The PR tier on GitHub-hosted runners (SPR-001 T-05; GOV-008 §1; docs/13 §4.3).
# It runs bin/check_all.sh, the same script developers run locally, and always uploads its report.
#
# The plan is GitHub Free (Q-INFRA-1): this workflow reports but cannot block a merge, and there is
# no merge queue. The Architect enforces "no green check_report.md, no merge" by hand (docs/13 §4.4).
# Minutes are limited (about 2,000 a month), so the tools are installed as prebuilt binaries and
# superseded runs on the same ref are cancelled.
name: ci

# Pushes to main and every pull request; not every branch push as well, which would run each
# pull request twice and spend Free-plan minutes (GOV-005 §4.1: every sprint opens a draft PR early).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-all:
    name: PR tier (bin/check_all.sh)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          # The baseline-integrity gate compares committed baselines with the merge base of HEAD and
          # origin/main (SPR-009 ruling 3), so the history must be there.
          fetch-depth: 0

      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: cargo-nextest, cargo-deny and iai-callgrind-runner (prebuilt binaries)
        uses: taiki-e/install-action@v2
        with:
          # iai-callgrind-runner must be the version of the iai-callgrind crate in Cargo.lock (SPR-009).
          tool: cargo-nextest@0.9,cargo-deny@0.20,iai-callgrind-runner@0.16.1

      - name: valgrind from the runner's package manager (SPR-009 ruling 2)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
          valgrind --version

      - name: uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Python environment from the lock (RUN-001 §4)
        run: uv sync --frozen --project python

      - name: bin/check_all.sh
        # A changed perf baseline needs [perf-baseline] in the PR title and a reason in its body
        # (SPR-009 ruling 3). Passed through the environment, never interpolated into the script.
        env:
          RH_PR_TITLE: ${{ github.event.pull_request.title }}
          RH_PR_BODY: ${{ github.event.pull_request.body }}
        run: bin/check_all.sh

      - name: Upload the check report and the licence ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-report
          path: |
            artifacts/check_report.md
            artifacts/licence_ledger.txt
            artifacts/perf/
          if-no-files-found: warn
