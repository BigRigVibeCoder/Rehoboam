# The PR tier on GitHub-hosted runners (SPR-001 T-05; GOV-008 §1; docs/13 §4.3).
# It runs bin/check_all.sh, the same script developers run locally, and always uploads its report.
#
# The plan is GitHub Free (Q-INFRA-1): this workflow reports but cannot block a merge, and there is
# no merge queue. The Architect enforces "no green check_report.md, no merge" by hand (docs/13 §4.4).
# Minutes are limited (about 2,000 a month), so the tools are installed as prebuilt binaries and
# superseded runs on the same ref are cancelled.
name: ci

# Pushes to main and every pull request; not every branch push as well, which would run each
# pull request twice and spend Free-plan minutes (GOV-005 §4.1: every sprint opens a draft PR early).
on:
  push:
    branches: [main]
  pull_request:
    # `edited`: a title change re-runs the baseline gate's C3 rule (VER-SPR-008 MAJ-1).
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

# Only pull_request runs are cancelled by a newer one (VER-SPR-008-TEST GAP-8). A push run on main
# checks the baseline over its own before..after range; cancelling it would let the next push's
# range skip the cancelled commits, so a baseline change in them would never be checked against
# the C3 rule. Pushes queue instead. The push trigger is main only, so a push that opens a new
# branch (no previous commit) never runs here.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-all:
    name: PR tier (bin/check_all.sh)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
      # SPR-008 T-04: the golden baseline may change only in a C3 change (bin/check_baseline.py):
      # a PR whose title carries [C3], or on a push a commit in before..after whose subject does.
      # The rule fails closed (VER-SPR-008 MAJ-1). Passed through the environment, never
      # interpolated into a script.
      RH_EVENT: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && github.event_name || 'local' }}
      RH_PR_TITLE: ${{ github.event.pull_request.title }}
      RH_BASELINE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      RH_PUSH_BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
      RH_PUSH_AFTER: ${{ github.event_name == 'push' && github.sha || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: a push needs before..after for the C3 rule and the bisect (SPR-008 MAJ-1,
          # MIN-4), and the perf-baseline integrity gate needs the merge base of HEAD and the base
          # branch on every event (SPR-009 ruling 3).
          fetch-depth: 0

      - name: The base branch, for the baseline gates and the bisect (SPR-008, SPR-009)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        # Full depth, like the checkout: a --depth=1 fetch would make the clone shallow again.
        run: git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: cargo-nextest, cargo-deny and iai-callgrind-runner (prebuilt binaries)
        uses: taiki-e/install-action@v2
        with:
          # iai-callgrind-runner must be the version of the iai-callgrind crate in Cargo.lock (SPR-009).
          tool: cargo-nextest@0.9,cargo-deny@0.20,iai-callgrind-runner@0.16.1

      - name: valgrind from the runner's package manager (SPR-009 ruling 2)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
          valgrind --version

      - name: uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Python environment from the lock (RUN-001 §4)
        run: uv sync --frozen --project python

      - name: bin/check_all.sh
        # A changed perf baseline needs [perf-baseline] in the PR title (RH_PR_TITLE, job env) and a
        # reason in its body (SPR-009 ruling 3). Passed through the environment, never interpolated.
        env:
          RH_PR_BODY: ${{ github.event.pull_request.body }}
        run: bin/check_all.sh

      - name: Instruction counts of this run and their difference from the baseline (SPR-009 R-8)
        if: always()
        run: |
          cat artifacts/perf/instructions.txt || echo "no instruction counts: the tier stopped before the gate"
          diff crates/rh-bench/baselines/instructions_v1.txt artifacts/perf/instructions.txt && echo "identical to the baseline" || true

      # docs/13 §4.5: on a golden-run mismatch, the bisect runs automatically (base revision
      # against this head) and its report is attached below (SPR-008 ruling 7).
      - name: Divergence bisect on a golden mismatch (SPR-008 T-03)
        if: failure()
        run: bin/golden_bisect_ci.sh

      - name: Upload the check report, the licence ledger, the golden ladders, any bisect report and the perf counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-report
          path: |
            artifacts/check_report.md
            artifacts/licence_ledger.txt
            artifacts/bisect_report.txt
            target/golden/smoke_yearly_t1.ladder
            target/golden/smoke_yearly_tN.ladder
            artifacts/perf/
          if-no-files-found: warn
