# The nightly tier: tests too slow for the PR tier, marked #[ignore] in the code (SPR-002 T-06;
# GOV-002; docs/13 §4.3). Today that is the V-DET-20 full sweep (10^6 draws per stream, docs/09) and
# the rh-sample statistics against the exact distributions at 64 times the PR samples (SPR-003, V-DET-09);
# SPR-008 adds the golden tier: the smoke world's monthly hash ladders for 1,000 sim-years at 1, 2,
# 4 and N threads x 3 repeats (V-DET-01, V-DET-02; the G0 criterion), V-DET-11 on 64 injected
# perturbations, and the monthly ladder uploaded as the cross-machine reference (ruling 8).
#
# Same toolchain, cache and tool installs as ci.yml. A daily run on GitHub Free spends a few
# minutes of the monthly allowance; run it by hand with workflow_dispatch.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"  # 03:17 UTC daily, off the top of the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The director's ruling of 2026-10-17: a scheduled nightly is skipped when main has not moved
  # since the last successful nightly (the same commit gives the same results). A manual run
  # (workflow_dispatch) always runs. A failed nightly is not "successful", so the next one
  # re-runs on the same commit. python/tests/test_ci_workflow.py pins the gate.
  freshness:
    name: New commits on main since the last successful nightly?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "a $EVENT run: runs"; exit 0
          fi
          last=$(gh run list --repo "$REPO" --workflow nightly.yml --branch main --status success \
            --limit 1 --json headSha --jq '.[0].headSha // ""') || last=""
          if [ -n "$last" ] && [ "$last" = "$HEAD_SHA" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "main is at $HEAD_SHA, the commit of the last successful nightly: skipped"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "main is at $HEAD_SHA; the last successful nightly ran on ${last:-none}: runs"
          fi

  ignored-tests:
    name: Nightly tier (ignored tests)
    needs: freshness
    if: needs.freshness.outputs.run == 'true'
    runs-on: ubuntu-24.04
    # 30 minutes for the ignored tests, and the effect-language fuzz's nightly tier (SPR-017 T-08).
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: cargo-nextest (prebuilt binary)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9

      - name: Ignored tests (V-DET-20 full sweep; rh-sample statistics, nightly tier)
        run: cargo nextest run --workspace --locked --run-ignored ignored-only --no-fail-fast --no-capture

      # SPR-017 T-08: 64 times the PR tier's 16 seeds, effect_ref.py against the release evaluator.
      # Both sides are the standard library and rh-cli, so the runner's Python 3.12 runs it.
      - name: V-WC-10 differential fuzz, nightly tier (1,024 seeds; SPR-017 T-08)
        run: |
          cargo build --release --locked -p rh-cli
          python3 -I bin/effect_fuzz.py --seeds 1-1024 --rust-bin target/release/rh-cli --out target/fuzz-nightly --assert-coverage

  golden:
    name: Nightly golden tier (smoke, 1,000 years, monthly; SPR-008)
    needs: freshness
    if: needs.freshness.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: cargo-nextest (prebuilt binary)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9

      # SPR-013 T-13: V-SCALE-04's chronicle checks (twin_check.py, check_segments.py) read the
      # sealed segments with DuckDB, from the locked environment as the PR tier does.
      - name: uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Python environment from the lock (RUN-001 §4)
        run: uv sync --frozen --project python

      - name: V-DET-01/02 monthly ladders at 1, 2, 4 and N threads x 3 (smoke, solo, household, hamlet); V-SCALE-01/04; V-INV-02; V-DET-11 x 64
        run: bin/golden_nightly.sh

      - name: Upload the monthly ladder (the cross-machine reference)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-nightly-ladder
          path: artifacts/nightly/smoke_monthly_1000y.ladder
          if-no-files-found: warn
