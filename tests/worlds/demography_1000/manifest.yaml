# Test fixture world for SPR-028 (M9 validation harness): 1,000 synthesized persons under
# M2.demography's defaults, M1.regions F0 (1 region -> 1 settlement) and S3.migration F0 (residence).
# Used for V-SF-01 (r), V-SF-02 (q(15)), and V-SF-02b (l(65)/l(15)) ensembles and calibration gates.
manifest_version: 0
registry_version: "0.2.0"
world:
  id: demography_1000
  display_name: "One thousand synthesized persons demography fixture"
  template: feudal_realm
  seed: 1
  calendar: {days_per_year: 360, months: 12, seasons: 4, epoch_label: "Fixture era"}
  horizon: {years: 1000, label: historical}
  fidelity_profile: {M2.demography: F1, M1.regions: F0, S3.migration: F0}
geography:
  raster_resolution: 64
  region_count: 1
  heightmap_template: flat
  climate: {zone: temperate_maritime, harvest_sigma: 0.15, autocorr: 0.1, spatial_share: 0.9, volcanic_rate: 0.0}
  ecology: {livestock_kg_per_capita: 0, wild_prey_tonnes: 0}
peoples:
  - archetype: human
    population: 1000
    class_shares: {commoner: 1.0, burgher: 0.0, elite: 0.0}
    cultures:
      - {id: fixturefolk, name: "Fixture folk", naming_seed: "plain rural names", value_bias: {tradition: 0.3}}
    faiths:
      - {id: hearth, name: "Hearth custom", doctrine_tags: []}
cast: []
households: []
systems:
  M2.demography: {}
  M1.regions: {}
  S3.migration: {}
narrative:
  pattern_packs: [solitary_life]
  default_style_card: historian
presentation:
  era_art: lofi_plain
  palette: mono
