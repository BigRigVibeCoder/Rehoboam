# Positive-control fixture for bin/lint_arch.py (SPR-009 T-05; tests/lint_fixtures/README.md); not
# in the Rehoboam workspace. rh-bench is on the allow-list but its own lint tables drop the
# workspace's clippy denies (rule unsafe-allow).
[workspace]
members = ["rh-bench"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
