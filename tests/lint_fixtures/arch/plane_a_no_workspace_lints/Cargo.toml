# Positive-control fixture for bin/lint_arch.py (VER-SPR-003-TEST GAP-9; tests/lint_fixtures/README.md); not
# in the Rehoboam workspace. rh-sample declares no [lints] at all, so none of the workspace denies apply to
# it: the rule lints must refuse it.
[workspace]
members = ["rh-sample"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
