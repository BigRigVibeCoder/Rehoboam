# Positive-control fixture for bin/lint_arch.py (VER-SPR-003-TEST GAP-9; tests/lint_fixtures/README.md); not
# in the Rehoboam workspace. rh-sample replaces the workspace lints with its own [lints.clippy] table that
# allows disallowed_methods, which would let `x.ln()` through clippy: the rule lints must refuse it.
[workspace]
members = ["rh-sample"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
