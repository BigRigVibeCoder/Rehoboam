# Positive-control fixture for bin/lint_arch.py (VER-SPR-009-TEST GAP-21; tests/lint_fixtures/README.md); not
# in the Rehoboam workspace. A tool crate declares a #[global_allocator] in src/target/alloc.rs: a
# source directory named `target` is code, and lint_arch must scan it (rule global-allocator).
[workspace]
members = ["rh-tool"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
