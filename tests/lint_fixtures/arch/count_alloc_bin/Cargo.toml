# Positive-control fixture for bin/lint_arch.py (SPR-009 T-05; tests/lint_fixtures/README.md); not
# in the Rehoboam workspace. rh-bench has a [[bin]] target that requires count-alloc: only
# bench targets may (rule count-alloc).
[workspace]
members = ["rh-bench"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
