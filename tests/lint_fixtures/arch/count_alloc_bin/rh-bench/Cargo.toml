[package]
name = "rh-bench"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata.rehoboam]
plane = "tool"
kind = "tool"

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"

[features]
count-alloc = []

[[bin]]
name = "counted"
path = "src/main.rs"
required-features = ["count-alloc"]
