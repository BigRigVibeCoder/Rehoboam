# Positive-control fixture for bin/lint_arch.py (tests/lint_fixtures/README.md); not in the Rehoboam workspace.
# rh-sample, the float zone (SPR-003 ruling), relabelled out of plane A, where lint_forbidden would not scan
# it at all: the pinned labels refuse it.
[workspace]
members = ["rh-sample"]
resolver = "3"

# Every plane-A crate inherits these lints (bin/lint_arch.py rule lints, VER-SPR-003-TEST GAP-9).
[workspace.lints.rust]
unsafe_code = "forbid"
