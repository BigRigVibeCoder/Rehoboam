# T-01 compile-fail positive controls for rh-core::fixed (SPR-010; tests/lint_fixtures/README.md); not in
# the Rehoboam workspace. Each crate but fixed-ok is plane-A code that breaks one rule of the fixed-point
# types and must fail `cargo check -p <crate>` with its own error: no implicit mixing of Q8_8, Q16_16 and
# Money, and no conversion from or to a float. fixed-ok uses the same API correctly and must compile.
[workspace]
members = [
    "fixed-ok", "mix-q8-q16", "mix-money-q16", "float-from", "float-into", "float-cast",
    # SPR-011 T-01: Prob32 never mixes with Q16_16 and never converts to or from a float.
    "mix-prob-q16", "mix-prob-arith", "prob-into-q16", "prob-float-from", "prob-float-cast",
    # SPR-016 T-01: Q32_32 never mixes with Q16_16 or Prob32 and never converts to or from a float.
    "mix-q32-q16", "q32-float-cast", "q32-float-from", "q32-into-prob",
]
resolver = "3"
