    { path = "std::time::SystemTime::now", reason = "wall clock (GOV-003 §2, V-DET-19)" },
    { path = "rand::thread_rng", reason = "thread-local RNG; use the keyed RNG (ADR-0006)", allow-invalid = true },
    { path = "rand::rng", reason = "thread-local RNG; use the keyed RNG (ADR-0006)", allow-invalid = true },
