# Planted fixture for lint_odd.py's absent-owner checks on [[reads]] (EVO-001; REV-P1a NEW-4; R12): an identity read requires
# its owner and has no `neutral`; a rate or mode read of an owner that may be absent carries a typed `neutral` (typed by the
# owner's [[owns]], or by the Registry [era_state] for M6, which has no spec; named by the in-coupling's prose). Never a
# contract. Case `mistyped`: the rate read's neutral is a string on a q8_8 column; must FAIL
