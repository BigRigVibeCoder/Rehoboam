# Positive control for the spec-loader rule of bin/lint_forbidden.py (BCK-002 A-47; SPR-012 T-07;
# tests/lint_fixtures/README.md); not in the Rehoboam workspace. Seven forms must FAIL, one violation
# each: rh-sys-x names rh-registry's spec loaders in src/ in five (a grouped import, a renamed
# import, a path call, a function pointer, a bare use), and rh-registry's src/lib.rs re-exports one
# under another name and exports a macro that calls the other (review MAJ-2). Never reported:
# rh-sys-x's tests/, and rh-registry/src/ownership.rs, the loaders' home, which defines and calls them.
[workspace]
members = ["rh-registry", "rh-sys-x"]
resolver = "3"
