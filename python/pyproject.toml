# Python tooling for Rehoboam (SPR-001 T-02; GOV-003 §3; GOV-008 §4).
#
# One uv project holds the interpreter's dependencies for every Python check in bin/check_all.sh,
# and the repository's Python packages: the python/rehoboam_*/ directories (PY-PKG; README.md).
#   Set up or refresh:  uv sync --frozen --project python      (creates python/.venv and installs
#                       the packages in editable mode)
#   Change a dependency: edit this file, run `uv lock --project python`, commit both files.
#   Add a package: one line in [tool.uv.build-backend] module-name below (README.md says how).
# The [tool.*] sections below are written for the repository root as the working directory:
# bin/check_all.sh runs ruff, mypy and pytest from there with --config/-c python/pyproject.toml.

[build-system]
# The exact pin is the uv release CI installs (.github/workflows/ci.yml, setup-uv `version`): uv
# then builds with the copy of uv_build bundled in its own binary and downloads nothing; another uv
# fetches this one wheel (no dependencies). Published to PyPI 2026-07-23. Move it with that pin.
requires = ["uv_build==0.11.32"]
build-backend = "uv_build"

[project]
name = "rehoboam-tools"
version = "0.0.0"
description = "Python tooling around the Rehoboam engine: spec checks and repository lints"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Used by the spec prototypes under specs/ (manifest validator, chronicle SQL twin).
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "duckdb>=1.5",   # GOV-008 §4
]

[dependency-groups]
dev = [
    "ruff>=0.16",
    "mypy>=2.0",
    "pytest>=8.3",
]

[tool.uv]
# DECISION: a packaged project, installed in editable mode by `uv sync`, so that `python -I -m
# rehoboam_<name>` runs from the repository root with python/.venv's interpreter: the editable
# install is a .pth file naming python/, which site processes under -I (not under -S). Its packages
# are flat, top-level directories python/rehoboam_<name>/ (05.0 §6), declared one by one in
# [tool.uv.build-backend] below; python/tests/test_packaging.py pins that list to the directories.
# ALTERNATIVES CONSIDERED: hatchling with an explicit package list (its own dependencies, packaging,
# pathspec, pluggy and trove-classifiers, are not in uv.lock and would float at every sync); a uv
# workspace with one member per package (each package then has its own pyproject.toml, a nested
# layout and its own lock entry); a src/ layout (the plans and 05.0 §6 name python/rehoboam_*/).
# TRADEOFF: the editable install puts python/ itself on sys.path, so tests/ is importable as a
# namespace package; test_packaging.py forbids top-level modules there. REF: PY-PKG (REV-WAVE8 S6);
# uv's build-backend documentation, 0.11.32 (module-name as a list, module-root); GOV-008 §2.
package = true

[tool.uv.build-backend]
# The repository's packages, one per line, alphabetical: adding one is a one-line change here, and
# leaves uv.lock unchanged (uv.lock records the project as `editable = "."`, not its modules).
module-root = ""
module-name = [
    "rehoboam_tools",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# DEBT (SPR-001): the planning-phase prototypes predate this configuration and do not pass it; they
# are excluded by exact path so that every new Python file is checked. Remove an entry when its file
# is brought up to GOV-003 §3.
extend-exclude = [
    "bin/gen_manifest.py",
    "specs/chronicle/selftest.py",
    "specs/demography/selftest_brass.py",
    "specs/economy/selftest_economy.py",
    "specs/manifest/manifest_v0.py",
    "specs/sifting/lint_patterns.py",
    "specs/stream/compress_probe.py",
    "specs/stream/selftest_virtual_telemetry.py",
    "specs/systems/lint_odd.py",
    # Red-team prototypes: illustrative evidence for design proposals, not product code (docs/red_team/).
    "docs/red_team/prototypes",
]

[tool.ruff.format]
# Ruff can also format Python examples inside Markdown; docs are prose, not checked code.
exclude = ["*.md"]

[tool.ruff.lint]
# GOV-003 §1, §3: types everywhere (ANN), Google-style docstrings (D), complexity <= 10 (C90),
# plus correctness and modernisation rule sets.
select = ["E", "W", "F", "I", "B", "UP", "N", "ANN", "D", "C90", "SIM", "RUF", "PL", "PTH"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Tests compare against literal expectations by design.
"python/tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["bin", "python", "specs"]
# bin/ holds stdlib-only scripts that the tests import as top-level modules.
mypy_path = "bin"
exclude = ['^python/\.venv/']

[[tool.mypy.overrides]]
# DEBT (SPR-001): the same prototypes as ruff's extend-exclude, by module name. They are still parsed
# (a syntax error fails), but their type errors are not reported. Any other file under bin/, python/
# or specs/ is checked strictly. Remove a module when its file is brought up to GOV-003 §3.
module = [
    "gen_manifest",
    "selftest",
    "selftest_brass",
    "selftest_economy",
    "manifest_v0",
    "lint_patterns",
    "compress_probe",
    "selftest_virtual_telemetry",
    "lint_odd",
    "prototype_1_tantrum_spiral",
    "prototype_2_story_sifter_motifs",
    "prototype_3_epistemic_ghost_king",
    "prototype_4_micropolis_siege",
    "prototype_5_vow_collision",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["python/tests"]
# Relative to this file (pytest resolves ini paths against the config file); testpaths against the rootdir.
pythonpath = ["../bin"]
addopts = ["-ra", "--strict-markers", "-p", "no:cacheprovider"]
