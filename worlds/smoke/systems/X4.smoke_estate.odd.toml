# ODD-R v2 system spec (ADR-0033) of a DUMMY system of the smoke world (SPR-008 rulings 1-3).
# It never enters the real Registry: its id is in worlds/smoke/registry_overlay.toml only, and bin/check_all.sh
# lints it with lint_odd.py --specs worlds/smoke/systems --overlay worlds/smoke/registry_overlay.toml.
# Its numbers are design values that keep a 1,000-year run bounded and busy; nothing here is calibrated.
odd_r = 2
params = []

[system]
id = "X4.smoke_estate"
name = "Smoke world: estates"
spec_version = "0.1.0"
fidelity = "F0"
status = "frozen"
crate = "rh-sys-smoke"
adrs = ["ADR-0006", "ADR-0024", "ADR-0025", "ADR-0033"]
requirements = ["DET-4", "DET-5"]

[purpose]
statement = "Applies the Settle commands queued for it in (tick, phase, PersonId, seq) order, emitting INHERITANCE caused by the death that triggered it and sending some estates to the market for audit, and keeps a daily gossip count over the living. It is the smoke world's lifecycle-command owner and its Activity and Contagion phases, and shares the Activity level with the market (DEF-2)."
role = "substrate"
patterns = []
not_yet = ["Not a model: a dummy system that exercises the engine for the golden run"]

[[owns]]
column = "estate.heirs"
entity = "person"
type = "i64"
plane = "A"
meaning = "Estates settled per person row"
fixed_point = false
[[owns]]
column = "estate.order"
entity = "world"
type = "i64"
plane = "A"
meaning = "A running hash of the order in which commands were applied (one row)"
fixed_point = false
[[owns]]
column = "estate.gossip"
entity = "world"
type = "i64"
plane = "A"
meaning = "Days on which the living count was odd (one row)"
fixed_point = false

[[emits]]
kind = "INHERITANCE"
when = "a Settle command is applied"
[[commands]]
target = "X7.smoke_market"
command = "Audit"
why = "a settled estate is audited by the market (DEF-2: the Activity siblings exchange commands)"
[[reads]]
column = "person.alive"
owner = "X3.smoke_vital"
lag = "same_instant"
use = "identity"
neutral = false

[scales]
spatial = "The smoke world: 4 regions and 64 person rows"
temporal = "Day pulse"
extent = "1,000 sim-years in CI (SPR-008 ruling 5)"
restart = "Its owned columns"

[[fidelity_ladder]]
level = "F0"
representation = "The dummy rules below"
status = "available"

[[schedule]]
pulse = "Day"
phase = "Activity"
steps = ["settle: apply the queued Settle commands in queue order"]
when = "always"
[[schedule]]
pulse = "Day"
phase = "Contagion"
steps = ["gossip: count the days on which the living count is odd"]
when = "always"

[[rng]]
purpose = "gossip_noise"
key = ["world", "day"]
use = "a keyed coin added to the gossip parity"
[[rng]]
purpose = "settle_fee"
key = ["person", "day"]
use = "the fee of a settlement, and whether it is audited"

[design]
basic_principles = "n/a: a dummy system of the smoke world (SPR-008); it exists to exercise the engine, not to model anything"
emergence = "n/a: no modelled behaviour; only the engine's determinism is under test"
adaptation = "n/a: no agents adapt"
objectives = "n/a: no agents with objectives"
learning = "n/a: no learning"
prediction = "n/a: no prediction"
sensing = "Reads only its declared columns, through the engine's SystemView"
interaction = "Through declared reads, lifecycle commands and events only (05.1 §2)"
stochasticity = "Keyed draws only (ADR-0006), under the purposes in [[rng]]"
collectives = "n/a: no collectives"
observation = "The hash ladder of the smoke run (SPR-008 ruling 4); no plane-B or plane-C output"
era_state = []
scale_behaviour = "n/a: one fixed scale; the smoke world is small on purpose"

[initialization]
state = "No estates settled, order hash 0, gossip 0"
from_manifest = []

[input_data]
drivers = []

[[submodels]]
name = "settle"
summary = "for each queued command in order: heirs[row] += 1 + (u mod 2), order := order x 31 + PersonId; emit INHERITANCE caused by the command's cause; with chance 1/4 send Audit to the market"
earns_its_place_by = ["V-DET-01", "V-DET-02", "V-DET-11"]
[[submodels]]
name = "gossip"
summary = "gossip += (living + u mod 2) mod 2"
earns_its_place_by = ["V-DET-01", "V-DET-02", "V-DET-11"]

[[invariants]]
id = "INV-X4-01"
statement = "Every heir count is non-negative"
test = "V-DET-02"
[[invariants]]
id = "INV-X4-02"
statement = "The gossip count is non-negative"
test = "V-DET-02"


[isolation]
forcing = []
horizon = "1,000 sim-years"
expect = "Every Settle is applied the day it is queued or the next; nothing stays queued"

[verification]
tests = ["V-DET-01", "V-DET-02", "V-DET-11"]
prototype = ""
