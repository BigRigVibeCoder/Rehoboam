# ODD-R v2 system spec (ADR-0033) of a DUMMY system of the smoke world (SPR-008 rulings 1-3).
# It never enters the real Registry: its id is in worlds/smoke/registry_overlay.toml only, and bin/check_all.sh
# lints it with lint_odd.py --specs worlds/smoke/systems --overlay worlds/smoke/registry_overlay.toml.
# Its numbers are design values that keep a 1,000-year run bounded and busy; nothing here is calibrated.
odd_r = 2
params = []

[system]
id = "X2.smoke_harvest"
name = "Smoke world: harvest"
spec_version = "0.1.0"
fidelity = "F0"
status = "frozen"
crate = "rh-sys-smoke"
adrs = ["ADR-0006", "ADR-0024", "ADR-0025", "ADR-0033"]
requirements = ["DET-4", "DET-5"]

[purpose]
statement = "Grows a fixed-point grain stock per region each season from a lagged read of the weather, and evens stocks between regions each month. It is the smoke world's Season pulse and its Production and Exchange phases."
role = "substrate"
patterns = []
not_yet = ["Not a model: a dummy system that exercises the engine for the golden run"]

[[owns]]
column = "harvest.stock"
entity = "region"
type = "q16_16"
plane = "A"
meaning = "Grain stock per region, Q16.16 bits"
fixed_point = true
[[owns]]
column = "harvest.last_yield"
entity = "region"
type = "q16_16"
plane = "A"
meaning = "The last season's yield per region, Q16.16 bits"
fixed_point = true

[[reads]]
column = "weather.temp"
owner = "X1.smoke_weather"
lag = "lagged"
use = "rate"
required = false
neutral = 0.0

[scales]
spatial = "The smoke world: 4 regions and 64 person rows"
temporal = "Season pulse (grow) and Month pulse (trade)"
extent = "1,000 sim-years in CI (SPR-008 ruling 5)"
restart = "Its owned columns"

[[fidelity_ladder]]
level = "F0"
representation = "The dummy rules below"
status = "available"

[[schedule]]
pulse = "Season"
phase = "Production"
steps = ["grow: add a yield that depends on the lagged temperature and a keyed draw; spoil a share"]
when = "always"
[[schedule]]
pulse = "Month"
phase = "Exchange"
steps = ["trade: move an eighth of each region's surplus over the mean to the poorest region"]
when = "always"

[[rng]]
purpose = "yield_noise"
key = ["region", "season"]
use = "the seasonal yield shock: one rh-sample Poisson call per region on its own stream (05.1 §6 item 3); mean 5 (inversion) in three regions, 12 (PTRS) in the fourth"

[design]
basic_principles = "n/a: a dummy system of the smoke world (SPR-008); it exists to exercise the engine, not to model anything"
emergence = "n/a: no modelled behaviour; only the engine's determinism is under test"
adaptation = "n/a: no agents adapt"
objectives = "n/a: no agents with objectives"
learning = "n/a: no learning"
prediction = "n/a: no prediction"
sensing = "Reads only its declared columns, through the engine's SystemView"
interaction = "Through declared reads, lifecycle commands and events only (05.1 §2)"
stochasticity = "Keyed draws only (ADR-0006), under the purposes in [[rng]]"
collectives = "n/a: no collectives"
observation = "The hash ladder of the smoke run (SPR-008 ruling 4); no plane-B or plane-C output"
era_state = []
scale_behaviour = "n/a: one fixed scale; the smoke world is small on purpose"

[initialization]
state = "Every region holds 100 units"
from_manifest = []

[input_data]
drivers = []

[[submodels]]
name = "grow"
summary = "yield = 20 + clamp(temp, 0, 30)/2 + (Poisson(m) - m), m = 5, 5, 5, 12 by region; stock := stock * 7/8 + yield, capped at 10,000"
earns_its_place_by = ["V-DET-01", "V-DET-02", "V-DET-11"]
[[submodels]]
name = "trade"
summary = "each region above the mean gives (stock - mean)/8 to the region with the least stock"
earns_its_place_by = ["V-DET-01", "V-DET-02", "V-DET-11"]

[[invariants]]
id = "INV-X2-01"
statement = "Every stock lies in [0, 10,000] units"
test = "V-DET-02"

[[couplings]]
system = "X1.smoke_weather"
direction = "in"
via = "weather.temp"
lag = "lagged"
column = "weather.temp"
form = "yield += clamp(temp, 0, 30) / 2"
neutral = "0 degrees"
output_bounds = ["0", "15"]
data_range = "design value: the smoke world's temperatures, [-40, 60]"
beyond_range = "clamped to [0, 30]"
source = "design value"

[isolation]
forcing = [{ input = "weather.temp", series = "constant", note = "10 degrees" }]
horizon = "1,000 sim-years"
expect = "Stocks stay inside [0, 10,000] and never all reach a bound"

[verification]
tests = ["V-DET-01", "V-DET-02", "V-DET-11"]
prototype = ""
