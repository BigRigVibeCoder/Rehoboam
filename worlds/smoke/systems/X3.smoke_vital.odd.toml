# ODD-R v2 system spec (ADR-0033) of a DUMMY system of the smoke world (SPR-008 rulings 1-3).
# It never enters the real Registry: its id is in worlds/smoke/registry_overlay.toml only, and bin/check_all.sh
# lints it with lint_odd.py --specs worlds/smoke/systems --overlay worlds/smoke/registry_overlay.toml.
# Its numbers are design values that keep a 1,000-year run bounded and busy; nothing here is calibrated.
odd_r = 2
params = []

[system]
id = "X3.smoke_vital"
name = "Smoke world: vital events"
spec_version = "0.1.0"
fidelity = "F0"
status = "frozen"
crate = "rh-sys-smoke"
adrs = ["ADR-0006", "ADR-0024", "ADR-0025", "ADR-0033"]
requirements = ["DET-4", "DET-5"]

[purpose]
statement = "Samples a death time for living persons as a timer, cures some pending deaths by cancelling the timer, revives dead rows as births, and on a firing timer marks the death, emits X_DEATH and asks the estate to settle it. It is the smoke world's timers and its Vital phase."
role = "substrate"
patterns = []
not_yet = ["Not a model: a dummy system that exercises the engine for the golden run"]

[[owns]]
column = "person.alive"
entity = "person"
type = "bool"
plane = "A"
meaning = "1 alive, 0 dead"
fixed_point = false
[[owns]]
column = "person.pending"
entity = "person"
type = "bool"
plane = "A"
meaning = "1 while a death timer is pending"
fixed_point = false
[[owns]]
column = "person.deaths"
entity = "world"
type = "i64"
plane = "A"
meaning = "Deaths so far (one row)"
fixed_point = false

[[emits]]
kind = "X_DEATH"
when = "a death timer fires"
[[emits]]
kind = "CURED"
when = "a pending death is cancelled"
[[emits]]
kind = "BIRTH"
when = "a dead row is revived"
[[commands]]
target = "X4.smoke_estate"
command = "Settle"
why = "a death leaves an estate to settle"
[[reads]]
column = "harvest.stock"
owner = "X2.smoke_harvest"
lag = "same_instant"
use = "mode"

[scales]
spatial = "The smoke world: 4 regions and 64 person rows"
temporal = "Month pulse; death timers fire at their own minute (05.1 §4.1)"
extent = "1,000 sim-years in CI (SPR-008 ruling 5)"
restart = "Its owned columns and its pending timers in the agenda"

[[fidelity_ladder]]
level = "F0"
representation = "The dummy rules below"
status = "available"

[[schedule]]
pulse = "Month"
phase = "Vital"
steps = ["sample_deaths: schedule death timers, cure some pending ones, revive some dead rows"]
when = "always"

[[rng]]
purpose = "death_time"
key = ["person", "month"]
use = "whether and when a death is scheduled; also the re-sample after a material input"
[[rng]]
purpose = "cure"
key = ["person", "month"]
use = "whether a pending death is cured"
[[rng]]
purpose = "birth"
key = ["person", "month"]
use = "whether a dead row is revived"

[design]
basic_principles = "n/a: a dummy system of the smoke world (SPR-008); it exists to exercise the engine, not to model anything"
emergence = "n/a: no modelled behaviour; only the engine's determinism is under test"
adaptation = "n/a: no agents adapt"
objectives = "n/a: no agents with objectives"
learning = "n/a: no learning"
prediction = "n/a: no prediction"
sensing = "Reads only its declared columns, through the engine's SystemView"
interaction = "Through declared reads, lifecycle commands and events only (05.1 §2)"
stochasticity = "Keyed draws only (ADR-0006), under the purposes in [[rng]]"
collectives = "n/a: no collectives"
observation = "The hash ladder of the smoke run (SPR-008 ruling 4); no plane-B or plane-C output"
era_state = []
scale_behaviour = "n/a: one fixed scale; the smoke world is small on purpose"

[initialization]
state = "All 64 persons alive, none pending, no deaths"
from_manifest = []

[input_data]
drivers = []

[[submodels]]
name = "sample_deaths"
summary = "living, not pending: with chance 1/(12 - famine) schedule a death 1 to 86,400 minutes ahead; pending: cure with chance 1/5 (cancel its timers, emit CURED); dead: revive with chance 1/3 (emit BIRTH). famine = 6 when the poorest region's stock is under 20 units. A firing timer marks the death, emits X_DEATH and submits Settle caused by it"
earns_its_place_by = ["V-DET-01", "V-DET-02", "V-DET-11"]

[[invariants]]
id = "INV-X3-01"
statement = "A pending death belongs to a living person"
test = "V-DET-02"
[[invariants]]
id = "INV-X3-02"
statement = "alive and pending are 0 or 1"
test = "V-DET-02"


[isolation]
forcing = [{ input = "harvest.stock", series = "step", note = "from 100 to 10 units at year 10" }]
horizon = "1,000 sim-years"
expect = "The population neither dies out nor saturates; deaths and births both continue"

[verification]
tests = ["V-DET-01", "V-DET-02", "V-DET-11"]
prototype = ""
