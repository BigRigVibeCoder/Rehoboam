# The Rehoboam Cargo workspace (SPR-001 T-01).
# REF: docs/05_architecture/05.0_overview.md §6 (crate layout); GOV-003 §2 (Rust rules); GOV-008 §4 (toolchain).
#
# Every crate declares its plane (ADR-0024) and kind in [package.metadata.rehoboam]:
#   plane = "A" (authoritative) | "B" (observation) | "C" (narrative) | "tool" (hosts and tools)
#   kind  = "core" | "machinery" | "contract" | "system" | "tool"
# bin/lint_arch.py reads them to enforce the crate-boundary law (docs/13 §3; V-INSP-03, V-PLN-01), and
# bin/lint_forbidden.py scans every plane-A crate for forbidden APIs (V-DET-19).

[workspace]
resolver = "3"
members = ["crates/*"]
# Lint fixtures are deliberately broken mini-workspaces (positive controls); they never join this one.
exclude = ["tests/lint_fixtures"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
# Pedantic is advisory locally; CI and bin/check_all.sh run clippy with -D warnings.
pedantic = { level = "warn", priority = -1 }
# GOV-003 §2: no unwrap/expect in library code; panic! only for violated invariants. Each exception
# is an #[allow(..., reason = "INVARIANT: ...")], and every allow must carry a reason.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
allow_attributes_without_reason = "deny"
# Second line of defence behind bin/lint_forbidden.py (V-DET-19); the lists live in clippy.toml.
disallowed_types = "deny"
disallowed_methods = "deny"

# SPR-002: rh-ids's ChaCha8 code is generic and is instantiated in rh-ids itself, so it runs at
# rh-ids's opt-level; unoptimised, the V-DET-16/V-DET-20 tests in the PR tier take minutes. This
# changes speed only: debug assertions and overflow checks stay on, and the code is integer-only,
# so its outputs are bit-identical at every opt-level.
[profile.dev.package.rh-ids]
opt-level = 3
[profile.dev.package.rand_chacha]
opt-level = 3
[profile.dev.package.ppv-lite86]
opt-level = 3
