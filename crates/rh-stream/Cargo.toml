[package]
name = "rh-stream"
description = "World Stream v0: channel-A records, the canonical text form, sealed Parquet segments"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# SPR-011 ruling 13: the one writer of channel A (and the reader). Plane A, so the forbidden-API
# gate scans it; file I/O is allowed in src/seal.rs alone (lint_forbidden FILE_IO_FILES).
[package.metadata.rehoboam]
plane = "A"
kind = "machinery"

[lints]
workspace = true

[dependencies]
rh-core = { version = "0.0.0", path = "../rh-core" }
rh-events = { version = "0.0.0", path = "../rh-events" }
rh-ids = { version = "0.0.0", path = "../rh-ids" }
# XXH3-128 (the canonical digest) and XXH3-64 (MatchId), and the journal row an INPUT mirrors.
rh-snapshot = { version = "0.0.0", path = "../rh-snapshot" }
# SPR-011 ruling 13, reviewed by the Architect (SPR-013): the low-level column writer only (no
# `arrow` feature), zstd only; the writer properties are pinned in parquet_io.rs.
parquet = { version = "=60.0.0", default-features = false, features = ["zstd"] }
# Already in the lock through parquet (no new crate): parquet's in-memory reader reads `Bytes`.
bytes = { version = "=1.12.1", default-features = false }
