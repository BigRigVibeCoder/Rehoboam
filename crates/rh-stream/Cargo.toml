[package]
name = "rh-stream"
description = "World Stream v0: channel-A records, the canonical text form, sealed Parquet segments"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# SPR-011 ruling 13: the one writer of channel A (and the reader). Plane A, so the forbidden-API
# gate scans it; file I/O is allowed in src/seal.rs alone (lint_forbidden FILE_IO_FILES).
[package.metadata.rehoboam]
plane = "A"
kind = "machinery"

[lints]
workspace = true

[dependencies]
rh-core = { version = "0.0.0", path = "../rh-core" }
rh-events = { version = "0.0.0", path = "../rh-events" }
rh-ids = { version = "0.0.0", path = "../rh-ids" }
# XXH3-128 (the canonical digest) and XXH3-64 (MatchId), and the journal row an INPUT mirrors.
rh-snapshot = { version = "0.0.0", path = "../rh-snapshot" }
# SPR-011 ruling 13, reviewed by the Architect (SPR-013): the low-level column writer only (no
# `arrow` feature), zstd only; the writer properties are pinned in parquet_io.rs.
parquet = { version = "=60.0.0", default-features = false, features = ["zstd"] }
# Already in the lock through parquet (no new crate): parquet's in-memory reader reads `Bytes`.
bytes = { version = "=1.12.1", default-features = false }
# SPR-026 T-02 (REV-SPR-026 R22, pre-approved for rh-stream alone): the live edge's one snapshot.
# 1.7.1 (2024-03-23) is the newest release with no dependency: 1.8.0 and later depend on
# rustversion, a crate the review did not cover. MIT OR Apache-2.0; default features off.
arc-swap = { version = "=1.7.1", default-features = false }

[features]
# The planted control of SPR-026 T-02: the window moves at a year end before the dropped year is on
# disk (I4 broken); a viewer must detect `I1 broken`. Never in a release build (BCK-002 A-52).
mutant-window-gap = []
# DEF-2: LiveEdge::bytes() counts the window alone, understating live bytes while completed years wait in the seal queue.
mutant-bytes-window-only = []
# DEF-2: the seal queue counts canonical text bytes instead of allocated records, understating the queue by ~2.5x.
mutant-bytes-queue-canonical = []
