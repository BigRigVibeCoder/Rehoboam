[package]
name = "rh-manifest"
description = "Load-time front end: YAML 1.1 reader, float view of the Registry, manifest validation and JSON Schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# Tool plane (SPR-004 ruling A, 2026-10-16): load-time validation reproduces the reference's float
# checks, so it cannot live in plane A. bin/lint_arch.py pins this crate to (tool, tool), and no
# plane-A crate may depend on it (plane-A closure).
[package.metadata.rehoboam]
plane = "tool"
kind = "tool"

[lints]
workspace = true

[features]
# SPR-017 T-05: forwards rh-registry's planted effect-language mutants to the golden runner.
mutant-effect = ["rh-registry/mutant-effect"]

[dependencies]
# SPR-011 T-04 (ruling 9): rh_manifest::compile builds the plane-A WorldSpec. The edge points from the
# tool plane into plane A only; no plane-A crate depends on this one (bin/lint_arch.py).
rh-core = { version = "0.0.0", path = "../rh-core" }
rh-ids = { version = "0.0.0", path = "../rh-ids" }
rh-registry = { version = "0.0.0", path = "../rh-registry" }
saphyr-parser = "=0.2.2"
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=1.1.8"

[dev-dependencies]
# SPR-017 T-07: tests/effect_host.rs drafts the verb's event on an rh-core stub world.
rh-events = { version = "0.0.0", path = "../rh-events" }
