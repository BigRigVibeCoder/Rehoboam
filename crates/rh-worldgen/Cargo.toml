[package]
name = "rh-worldgen"
description = "World generation: founders, the elevation raster, regions, seats and routes (SPR-011, SPR-018)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# SPR-012 T-06: plane A, machinery, pinned in bin/lint_arch.py. It writes initial values only:
# the founders, into the columns whose owner initialises from the manifest (ruling 10).
[package.metadata.rehoboam]
plane = "A"
kind = "machinery"

[lints]
workspace = true

[dependencies]
rh-core = { version = "0.0.0", path = "../rh-core" }
rh-ids = { version = "0.0.0", path = "../rh-ids" }
rh-registry = { version = "0.0.0", path = "../rh-registry" }
toml = "=1.1.8"

# SPR-012 T-06 V-INV-11: genesis tables through a keyframe, with the real M2 system registered.
[dev-dependencies]
rh-events = { version = "0.0.0", path = "../rh-events" }
rh-snapshot = { version = "0.0.0", path = "../rh-snapshot" }
rh-sys-demography = { version = "0.0.0", path = "../rh-sys-demography" }
