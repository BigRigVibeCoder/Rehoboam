[package]
name = "rh-core"
description = "World, tables, scheduler, RNG context, time and invariants"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.rehoboam]
plane = "A"
kind = "core"

[lints]
workspace = true

# SPR-005: the keyed RNG for StepCtx::rng. rh-core sits at the bottom with rh-ids: rh-registry
# depends on rh-core, never the reverse (Architect ruling 2026-10-16).
[dependencies]
# SPR-006: the event schema and the emission-order log (plane A, no third-party dependency).
rh-events = { version = "0.0.0", path = "../rh-events" }
rh-ids = { version = "0.0.0", path = "../rh-ids" }


# SPR-006: the integration tests build event drafts and read the log.
[dev-dependencies]
rh-events = { version = "0.0.0", path = "../rh-events" }

[features]
# The planted engine of SPR-014 T-01 (EVO-001 option D1): every binding of an owner gets its whole
# inbox, not only the binding its spec names. `tests/agenda_events.rs` V-DET-21 must FAIL with
# "delivered to a non-draining job". No build of a world enables it.
mutant-deliver-every-job = []
# SPR-038 S11 (T-02): positional compaction puts each column back with its old version. The
# per-instant cache test (`rh-snapshot`'s `tests/per_instant_cache.rs`, run with
# `--features rh-core/mutant-compact-keeps-version`) must FAIL. No build of a world enables it.
mutant-compact-keeps-version = []
# SPR-038 T-03, the reference of the differential test (S12, T4): `Engine::set_gating(Gating::Off)`
# runs every check, compaction and lagged copy at every instant. Not cfg(test): rh-core/tests and
# rh-snapshot/tests need it. `rh-cli run` and bin/regen_baseline.sh refuse a build with it (A-52).
reference-gating-off = []
# SPR-038 T-03's planted engines, each of which a named gate must FAIL. No build of a world enables
# them. The put-back ignores person.alive's written flag (a dead row survives the instant):
mutant-unmarked-put-back = []
# The guard's pre-image is taken after the step (the entry-field refusal goes unseen):
mutant-late-pre-image = []
# A lagged column is never copied again after its first copy (the differential test's lagged reader):
mutant-stale-lagged-snapshot = []

# SPR-038 T-03: the differential test against Gating::Off needs the reference feature.
[[test]]
name = "per_instant"
required-features = ["reference-gating-off"]
