[package]
name = "rh-golden"
description = "Golden runs: the smoke runner, hash ladders, baselines and the divergence bisect (SPR-008)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# A host around the engine (docs/13 §4.3, §4.5): it runs worlds, journals their inputs, writes
# keyframes and hash ladders, and bisects divergences. Never linked into plane A.
[package.metadata.rehoboam]
plane = "tool"
kind = "tool"

[lints]
workspace = true

[dependencies]
rh-core = { version = "0.0.0", path = "../rh-core" }
rh-ids = { version = "0.0.0", path = "../rh-ids" }
rh-registry = { version = "0.0.0", path = "../rh-registry" }
rh-snapshot = { version = "0.0.0", path = "../rh-snapshot" }
rh-sys-smoke = { version = "0.0.0", path = "../rh-sys-smoke" }
# SPR-012 T-08: manifest worlds (`worlds/<id>/world.toml`): compile, genesis, the built systems.
rh-manifest = { version = "0.0.0", path = "../rh-manifest" }
rh-sys-demography = { version = "0.0.0", path = "../rh-sys-demography" }
rh-worldgen = { version = "0.0.0", path = "../rh-worldgen" }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.8"
# SPR-013 T-09: the World Stream of a manifest world's run.
rh-stream = { version = "0.0.0", path = "../rh-stream" }
