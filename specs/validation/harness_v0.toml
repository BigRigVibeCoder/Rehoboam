min_samples = 100
test_method = "crn_paired"

[bands."V-SF-03e"]
id = "V-SF-03e"
fact = "General famines per polity-century"
kind = "Emergent"
role = "Held-out"
level = "Polity"
status = "soft"
statistic = "General famines per polity-century in pressured windows 2-5"
unit = "count/century"
min_samples = 30
