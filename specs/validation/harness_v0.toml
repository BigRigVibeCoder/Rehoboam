# harness_v0.toml: machine-readable stylized fact declarations (SPR-028)
# Format: rehoboam/m9/bands/v0
# Governed by: docs/09_verification_and_validation.md §3.1, specs/validation/harness_v0.md

[schema]
format = "rehoboam/m9/bands/v0"
version = "0.1.0"

[bands."V-SF-01.r"]
id = "V-SF-01.r"
fact = "Long-run growth rate without technology shocks"
kind = "Identity"
role = "Calibration"
level = "System"
status = "gate_g1a"
statistic = "Seed-mean growth rate r with two-sided 99.9% Student-t interval"
unit = "%/yr"
min_samples = 32
lower_bound = -0.001
upper_bound = 0.003
test_method = "student_t"
alpha = 0.001

[bands."V-SF-01.pop"]
id = "V-SF-01.pop"
fact = "Population range per seed"
kind = "Identity"
role = "Calibration"
level = "System"
status = "report"
statistic = "Per-seed population ratio N(y)/N_0 compared against expected spread"
unit = "ratio"
min_samples = 32
lower_bound = 0.3
upper_bound = 5.0
test_method = "range_report"

[bands."V-SF-02"]
id = "V-SF-02"
fact = "Child mortality to age 15 (agrarian)"
kind = "Identity"
role = "Calibration"
level = "Individual"
status = "gate_g1a"
statistic = "Cohort child mortality q(15) from life-course log with two-sided 99.9% Student-t interval"
unit = "probability"
min_samples = 400
lower_bound = 0.35
upper_bound = 0.55
test_method = "student_t"
alpha = 0.001

[bands."V-SF-02b"]
id = "V-SF-02b"
fact = "Adult mortality shape"
kind = "Identity"
role = "Calibration"
level = "Individual"
status = "gate_g1a"
statistic = "Adult survival ratio l(65)/l(15) from life-course log within manifest-implied tolerance"
unit = "ratio"
min_samples = 400
tolerance = 0.03
test_method = "student_t"
alpha = 0.001

[bands."V-SF-03"]
id = "V-SF-03"
fact = "Famine mortality crises (agrarian windows)"
kind = "Emergent"
role = "Calibration"
level = "Settlement"
status = "gate_g1b"
statistic = "Crises per settlement-century: any class 2-5, medium or worse 1-3, major 0.1-0.5"
unit = "crises/century"
min_samples = 10
test_method = "bootstrap"

[bands."V-SF-03a"]
id = "V-SF-03a"
fact = "Harvest shortfalls (temperate zones)"
kind = "Identity"
role = "Calibration"
level = "Region"
status = "gate_g1b"
statistic = "Detrended composite staple yield CV and shortfall frequencies"
unit = "probability"
min_samples = 200
test_method = "clopper_pearson"

[bands."V-SF-03b"]
id = "V-SF-03b"
fact = "Price response and famine price amplitude"
kind = "Emergent"
role = "Calibration"
level = "Region"
status = "report"
statistic = "Mean absolute YoY price change and peak/normal price ratio in worst famine"
unit = "ratio"
min_samples = 100
test_method = "bootstrap"

[bands."V-SF-03c"]
id = "V-SF-03c"
fact = "What triggers famine"
kind = "Emergent"
role = "Held-out"
level = "Region"
status = "gate_g1b"
statistic = "Share of crisis windows following consecutive shortfalls or siege >= 70%"
unit = "share"
min_samples = 20
lower_bound = 0.70
test_method = "clopper_pearson"

[bands."V-SF-03d"]
