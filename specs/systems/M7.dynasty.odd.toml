# ODD-R v2 system spec (ADR-0033): succession and dynasts F1, WP P1.7 (moved into P1a, docs/11 v1.3). Draft.
# The ruler-exit hazards are sourced (Eisner 2011; Kokkonen & Sundell 2014; R12 §1–2); the arbitration, regency,
# dormancy and vocation rules are design values. V-SF-06c is a HELD-OUT band (09 §3.1): nothing here is tuned to it,
# and its source (Blaydes & Chaney 2013) is deliberately not used to set any parameter.
# lint_odd.py checks this file against the Registry, the other specs and the test catalogue.
odd_r = 2

[system]
id = "M7.dynasty"
name = "Succession and dynasts"
spec_version = "0.1.0"
fidelity = "F1"
status = "draft"
crate = "rh-sys-dynasty"
adrs = ["ADR-0027", "ADR-0035", "ADR-0025", "ADR-0026", "ADR-0007", "ADR-0009", "ADR-0006", "ADR-0024"]
requirements = ["SIM-3", "SIM-9", "SIM-13", "SAGA-13", "DET-13"]

[purpose]
statement = "Keep houses, landed titles (seats), court offices and claims; decide who holds each title when its holder dies or is deposed, in the same instant (immediate succession), by the title's succession law, claims and the candidates' hold on the court; draw the competing ruler-exit hazards (murder, deposition) of sovereigns as functions of institutional state; and decide which great-house members are named actors (dormancy, SIM-9) and what later children do (vocations), without ever enforcing a count."
role = "stylized_fact_producer"
patterns = [
  { test = "V-SAGA-19", pattern = "Every titleholder death ends its instant with SUCCEED or INTERREGNUM_CRISIS; no title is without a holder across a tick boundary unless a declared interregnum holds it", kind = "identity", role = "sole" },
  { test = "V-SF-06", pattern = "Ruler murders per 1,000 ruler-years inside the band of the world's institutional state; violent share of ruler deaths 15–30%", kind = "identity", role = "sole" },
  { test = "V-SF-06b", pattern = "Share of reigns ending in domestic deposition (murder or non-lethal deposition) by succession law; primogeniture vs elective HR inside [0.17, 0.63]", kind = "identity", role = "sole" },
  { test = "V-SF-06d", pattern = "A murdered predecessor raises the odds of the next ruler's murder: OR 1.5–4 (identity in isolation through predecessor_killed_or; coupled, minds' revenge adds to it)", kind = "identity", role = "contributing" },
  { test = "V-SF-06c", pattern = "Mean completed reign longer under constrained rulers (17–22 years) than unconstrained (8–15): a HELD-OUT prediction from K&S's parliament effect and M2's mortality, never tuned to", kind = "emergent", role = "contributing" },
  { test = "V-ERA-03", pattern = "Murder and deposition rates fall with executive constraint, not with the date", kind = "emergent", role = "contributing" },
  { test = "V-INV-12", pattern = "Ruling houses and active great-house members are named from world start; dormancy and re-promotion follow simulation criteria only; genealogy reconstructs from the life-course log", kind = "identity", role = "sole" },
  { test = "V-INV-03", pattern = "Every titleholder death, whatever its cause, reaches succession through the one death path", kind = "identity", role = "contributing" },
]
not_yet = [
  "Battle deaths of rulers (M8, P4) and civil war after a failed interregnum (V-COUP-01 truncates at the INTERREGNUM_CRISIS or regency until M8)",
  "Treasury size and military proximity: at F1 arbitration uses who holds the title's steward and marshal offices as proxies; M4's treasury (P1b) and M8's armies (P4) replace them",
  "Executive constraint is held at the manifest's reference value until M6-lite (P1.6a); V-SF-06c and V-ERA-03 cannot be evaluated before then (G1b)",
  "succession_institutionalisation is owned and held constant: its effect on hazards and its endogenous change are SIM-14 (P4)",
  "Tenure-dependent hazards: K&S's smoothed hazards fall for about 40 years then rise (R12 §2); F1 hazards are constant within a reign",
  "Eisner's second-order contagion (OR 2.4 two reigns back) and the accession-age effects (Eisner: victims acceded younger; K&S: younger is safer) are not modelled; the two sources disagree",
  "Hazard ratios for ultimogeniture, partition and sortition are not estimated in any source read: ultimogeniture borrows primogeniture_hr, partition and sortition the reference (1.0)",
  "Inherited claims, cadet branches and title creation or destruction are F2 / SIM-14 (P4); successor purges (the Registry hazard successor_purge) arise only from minds' feuds at F1",
  "Property inheritance (TransferHoldings to M4 by the house's inheritance rule) waits for M4 F0 (P1b)",
  "The named-actor count has no band: rebuilt prototype 7 ended at 98 active nobles with no count rule; it is reported and scales with population (08), never enforced (RT-2026-10-16 item 12)",
]

# ----------------------------------------------------------------------------- owned columns
[[owns]]
column = "house.id"
entity = "house"
type = "u64"
plane = "A"
meaning = "HouseId = H64(seed, \"house\", k) for a manifest dynasty; never reused. F1 creates no houses in-run (cadet branches are F2)"
fixed_point = false
[[owns]]
column = "house.great"
entity = "house"
type = "bool"
plane = "A"
meaning = "A great house (SIM-9): its members are candidates for naming from world start"
fixed_point = false
[[owns]]
column = "house.extinct_at"
entity = "house"
type = "i64"
plane = "A"
meaning = "Sim-time its last living member died (HOUSE_EXTINCT), or 0"
fixed_point = false
[[owns]]
column = "person.house"
entity = "person"
type = "u64"
plane = "A"
meaning = "HouseId of the person, or 0. Set at birth from the parent the house's law follows (the father under agnatic and cognatic laws at F1), or by the manifest for founders"
fixed_point = false
[[owns]]
column = "person.vocation"
entity = "person"
type = "enum"
plane = "A"
meaning = "Registry [vocations] id: none | holy_orders | mercenary | household. Drawn once at majority for later children (RT-2026-10-16 item 12); they stay in the ledger"
fixed_point = false
[[owns]]
column = "title.id"
entity = "title"
type = "u64"
plane = "A"
meaning = "TitleId = H64(seed, \"title\", k) from the manifest; the set of titles is fixed at world creation (finite seats)"
fixed_point = false
[[owns]]
column = "title.tier"
entity = "title"
type = "enum"
plane = "A"
meaning = "Registry [title_tiers] id: sovereign | major | minor. Only sovereign titles carry the ruler-exit hazards"
fixed_point = false
[[owns]]
column = "title.liege"
entity = "title"
type = "u64"
plane = "A"
meaning = "TitleId of the liege title, or 0 for a sovereign"
fixed_point = false
[[owns]]
column = "title.polity"
entity = "title"
type = "u32"
plane = "A"
meaning = "PolityId (M6) of the realm a sovereign title rules, or 0 for a vassal title"
fixed_point = false
[[owns]]
column = "title.law"
entity = "title"
type = "enum"
plane = "A"
meaning = "Registry [succession_laws] id; eligibility and order are effect-language expressions (P1.15) over bounded kin relations"
fixed_point = false
[[owns]]
column = "title.holder"
entity = "title"
type = "u64"
plane = "A"
meaning = "PersonId of the living holder, or 0 while awaiting arbitration (inside one instant only) or in a declared interregnum"
fixed_point = false
[[owns]]
column = "title.state"
entity = "title"
type = "enum"
plane = "A"
meaning = "held | awaiting (holder died or was deposed this instant; arbitration timer due later this instant) | interregnum (INTERREGNUM_CRISIS; resolution timer pending). awaiting never survives a tick boundary"
fixed_point = false
[[owns]]
column = "title.held_since"
entity = "title"
type = "i64"
plane = "A"
meaning = "Sim-time the current holder succeeded (reign length for V-SF-06c and V-SF-07's dynasty tenures)"
fixed_point = false
[[owns]]
column = "title.predecessor_exit"
entity = "title"
type = "enum"
plane = "A"
meaning = "How the previous holder's reign ended: none | natural | murdered | deposed | other_violent (battle, execution, accident). The feud stock: it switches the predecessor multipliers"
fixed_point = false
[[owns]]
column = "title.regent"
entity = "title"
type = "u64"
plane = "A"
meaning = "PersonId of the regent while the holder is under majority_age, or 0"
fixed_point = false
[[owns]]
column = "title.exit_timer"
entity = "title"
type = "u64"
plane = "A"
meaning = "TimerId of a pending deposition or interregnum-resolution timer, or 0; cancelled when the holder dies first"
fixed_point = false
[[owns]]
column = "polity.succession_institutionalisation"
entity = "polity"
type = "q8_8"
plane = "A"
meaning = "Era-state variable owned by M7 (Registry [era_state]); in [0, 1]; from the manifest, constant at F1 (changes are SIM-14, P4)"
fixed_point = true
[[owns]]
column = "office.id"
entity = "office"
type = "u64"
plane = "A"
meaning = "OfficeId = H64(title, kind); offices are declared per title by the manifest (finite)"
fixed_point = false
[[owns]]
column = "office.title"
entity = "office"
type = "u64"
plane = "A"
meaning = "TitleId whose court the office belongs to"
fixed_point = false
[[owns]]
column = "office.kind"
entity = "office"
type = "enum"
plane = "A"
meaning = "Registry [office_kinds] id (chancellor, marshal, steward, spymaster, chaplain)"
fixed_point = false
[[owns]]
column = "office.holder"
entity = "office"
type = "u64"
plane = "A"
meaning = "PersonId of the holder, or 0 when vacant (offices may be vacant; titles may not)"
fixed_point = false
[[owns]]
column = "claim.id"
entity = "claim"
type = "u64"
plane = "A"
meaning = "ClaimId = H64(claimant, title, since); never reused"
fixed_point = false
[[owns]]
column = "claim.claimant"
entity = "claim"
type = "u64"
plane = "A"
meaning = "PersonId of the claimant"
fixed_point = false
[[owns]]
column = "claim.title"
entity = "claim"
type = "u64"
plane = "A"
meaning = "TitleId claimed"
fixed_point = false
[[owns]]
column = "claim.cause_event"
entity = "claim"
type = "u64"
plane = "A"
meaning = "EventId of the SUCCEED or DEPOSED event that created it (provenance)"
fixed_point = false
[[owns]]
column = "claim.pressed"
entity = "claim"
type = "bool"
plane = "A"
meaning = "Pressed by the claimant (a PressClaim command applied); only pressed claims enter arbitration"
fixed_point = false
[[owns]]
column = "claim.status"
entity = "claim"
type = "enum"
plane = "A"
meaning = "active | realised (the claimant took the title) | renounced | void (the claimant died). The last three are absorbing"
fixed_point = false
[[owns]]
column = "petition.person"
entity = "petition"
type = "u64"
plane = "A"
meaning = "PersonId of a petitioner for a seat or office (from T1.minds' PetitionSeat); cleared when granted, refused at the next regrant, or the petitioner dies"
fixed_point = false
[[owns]]
column = "petition.target"
entity = "petition"
type = "u64"
plane = "A"
meaning = "TitleId or OfficeId petitioned for"
fixed_point = false

# ----------------------------------------------------------------------------- events
[[emits]]
kind = "SUCCEED"
when = "Arbitration names a holder (immediate succession, the regrant of a title held in demesne excepted, which is SEAT_GRANTED); roles: actor = the successor, target = the predecessor; motive edge to the death or deposition"
[[emits]]
kind = "INTERREGNUM_CRISIS"
when = "Arbitration of a sovereign title finds no candidate, or no candidate leads the runner-up by contest_margin; the title is held by the declared interregnum until its resolution timer"
[[emits]]
kind = "DEPOSED"
when = "A sovereign's deposition timer fires: actor = the leading pressed claimant (or none), target = the ruler, who lives and gains a claim"
[[emits]]
kind = "REGENCY_BEGUN"
when = "A successor under majority_age succeeds: the regent is named by rule"
[[emits]]
kind = "REGENCY_ENDED"
when = "The holder reaches majority_age, or a regent dies and the next is named (a new REGENCY_BEGUN follows)"
[[emits]]
kind = "CLAIM_CREATED"
when = "A succession passes over the legal heir (the heir gains a claim) or a ruler is deposed (the deposed gains one)"
[[emits]]
kind = "CLAIM_PRESSED"
when = "A PressClaim command from T1.minds is applied"
[[emits]]
kind = "CLAIM_RENOUNCED"
when = "A RenounceClaim command is applied"
[[emits]]
kind = "SEAT_GRANTED"
when = "A title held in demesne or a vacant office is granted to a petitioner or an eligible kin (finite seats, re-grant)"
[[emits]]
kind = "HOUSE_EXTINCT"
when = "The last living member of a house dies"

# ----------------------------------------------------------------------------- lifecycle commands sent
[[commands]]
target = "M2.demography"
command = "ScheduleDeath"
why = "A sovereign's background murder: {ruler, tick, cause = murder, culprit, cause = the hazard draw}; every death goes through M2's single death path (05.1 §2 rule 2)"
[[commands]]
target = "T1.minds"
command = "Promote"
why = "A person meets the naming criteria (SIM-9): a seat, office, claim or active vow, or within dormancy_degrees of a holder"
[[commands]]
target = "T1.minds"
command = "Demote"
why = "A named great-house member meets the dormancy criteria; minds defers it while a break is pending or refractory"
[[commands]]
target = "T1.minds"
command = "OpinionModifier"
why = "PASSED_OVER (the legal heir about the successor), DEPOSED_BY (the deposed about the deposer), CLAIM_PRESSED_BY (the holder about the claimant), GRANTED_BY (the grantee about the granter); minds owns opinions"
[[commands]]
target = "M4.economy"
command = "TransferHoldings"
why = "Property inheritance through the death path by the house's [inheritance_rules] id (P1b, when M4 F0 lands)"

# ----------------------------------------------------------------------------- reads
[[reads]]
column = "person.alive"
owner = "M2.demography"
lag = "same_instant"
use = "identity"
[[reads]]
column = "person.death_cause"
owner = "M2.demography"
lag = "same_instant"
use = "mode"
[[reads]]
column = "person.birth_tick"
owner = "M2.demography"
lag = "lagged"
use = "identity"
[[reads]]
column = "person.sex"
owner = "M2.demography"
lag = "lagged"
use = "identity"
[[reads]]
column = "person.mother"
owner = "M2.demography"
lag = "lagged"
use = "identity"
[[reads]]
column = "person.father"
owner = "M2.demography"
lag = "lagged"
use = "identity"
[[reads]]
column = "person.named"
owner = "T1.minds"
lag = "previous_pulse"
use = "identity"
[[reads]]
column = "vow.vower"
owner = "S7.vows"
lag = "previous_pulse"
use = "identity"
[[reads]]
column = "vow.status"
owner = "S7.vows"
lag = "previous_pulse"
use = "identity"
[[reads]]
column = "polity.exec_constraint"
owner = "M6.polity"
lag = "previous_pulse"
use = "rate"

[scales]
spatial = "houses, titles (sovereign, major, minor seats), offices and claims; a realm is a sovereign title and its vassal titles"
temporal = "Day pulse at the instants of deaths, deposition and interregnum timers and queued commands; Month pulse for the sovereigns' exit hazards (sampled for the following month); Year pulse for regrants, vocations and dormancy"
extent = "every house and title of the manifest: typically 1 to 20 houses, 5 to 200 titles; persons of great houses only for dormancy and vocations"
restart = "Owned columns plus M7's pending timers (arbitration, deposition, interregnum resolution, regency end) restore the system exactly"

[[fidelity_ladder]]
level = "F0"
representation = "Heir = eldest child (05.1 §3); no hazards"
status = "available"
[[fidelity_ladder]]
level = "F1"
representation = "Succession-law enum, competing exit hazards of sovereigns at the reference institutional state, immediate arbitration, claims, regencies, finite seats and re-grants, vocations, great-house dormancy"
status = "target"

# ----------------------------------------------------------------------------- schedule
[[schedule]]
pulse = "Day"
phase = "Polity"
steps = ["on_death: for each titleholder, regent, office holder, claimant or house member who died this instant, update the title, regency, office, claim and house, and schedule arbitration", "arbitrate: fire due arbitration and interregnum-resolution timers: name the successor or declare the interregnum", "exit: fire due deposition timers: depose the ruler and arbitrate in the same step", "regency: fire due regency-end timers"]
when = "only at instants where a death timer fired in Vital or an M7 timer is due in Polity"
[[schedule]]
pulse = "Month"
phase = "Polity"
steps = ["exit_hazards: for each sovereign, draw whether it is murdered or deposed during the following month"]
when = "always"
[[schedule]]
pulse = "Day"
phase = "Agenda"
steps = ["apply_commands: apply PressClaim, PetitionSeat, RenounceClaim and Resign from T1.minds"]
when = "only at instants with queued M7 commands"
[[schedule]]
pulse = "Year"
phase = "Polity"
steps = ["regrant: grant titles held in demesne and vacant offices to petitioners or eligible kin", "vocation: draw a vocation for each great-house member who reached majority_age this year without a seat, office, claim or place in a line", "dormancy: send Demote and Promote by SIM-9's criteria"]
when = "always"

# ----------------------------------------------------------------------------- RNG
[[rng]]
purpose = "exit_murder"
key = ["ruler", "month"]
use = "Whether a sovereign is murdered in the following month: p = 1 - exp(-h_m/12), in fixed point"
[[rng]]
purpose = "exit_deposition"
key = ["ruler", "month"]
use = "Whether a sovereign is deposed in the following month: p = 1 - exp(-h_d/12)"
[[rng]]
purpose = "exit_day"
key = ["ruler", "month"]
use = "The day of the following month on which a drawn murder or deposition happens (day 2 to the last; if both were drawn, the earlier day wins and the other is dropped)"
[[rng]]
purpose = "murder_culprit"
key = ["ruler", "month"]
use = "The culprit of a background murder: uniform among the living claimants of the title, or none (an unnamed court faction) when there are none"
[[rng]]
purpose = "succession_tie"
key = ["title", "tick"]
use = "Ties in arbitration and regrant scores; at an interregnum's resolution, the winner among candidates still inside contest_margin, weighted by score"
[[rng]]
purpose = "interregnum_delay"
key = ["title", "tick"]
use = "Days from an INTERREGNUM_CRISIS to its resolution, uniform on 1..interregnum_max_days"
[[rng]]
purpose = "vocation"
key = ["person"]
use = "A later child's vocation at majority: holy_orders with vocation_holy_orders, mercenary with vocation_mercenary, else household; one draw per life"

# ----------------------------------------------------------------------------- design concepts
[design]
basic_principles = "Competing ruler-exit hazards as functions of institutional state, not of date (ADR-0027; Eisner 2011, Kokkonen & Sundell 2014; R12 §1–2); natural death stays M2's Brass hazard. Succession is immediate (SAGA-13, ADR-0035) and decided by law, claims and the court, never by a director (ADR-0009). Counts are outcomes, never targets (docs/01 principle 8)"
emergence = "Reign lengths, the deposition share by law, regicide contagion, interregna, regencies, contested successions, house extinctions and the size of the named nobility emerge from the hazards, M2's demography, minds' decisions and the finite seats"
adaptation = "n/a: M7 has no agents; claimants, petitioners and feuding houses decide through T1.minds"
objectives = "n/a"
learning = "n/a"
prediction = "n/a"
sensing = "Deaths and their causes at the death instant; genealogy, sex and age at the start of the instant; named status and active vows at the previous pulse; executive constraint at the previous pulse (held at reference until M6-lite)"
interaction = "Lifecycle commands only: ScheduleDeath to M2 (background murders), Promote, Demote and OpinionModifier to T1.minds, TransferHoldings to M4 (P1b); PressClaim, PetitionSeat, RenounceClaim and Resign applied from T1.minds. S6 and S7 read title.holder (regalia, CLAIM_TITLE vows)"
stochasticity = "Keyed RNG only: monthly exit draws and their day, culprit, ties, interregnum delay, vocation. Arbitration itself is deterministic given its inputs"
collectives = "Houses (SIM-9 great houses), realms (a sovereign title with its vassal titles) and courts (the named holders of a realm's seats and offices)"
observation = "SUCCEED, INTERREGNUM_CRISIS, DEPOSED, REGENCY_*, CLAIM_*, SEAT_GRANTED and HOUSE_EXTINCT in channel A; reign records (held_since, predecessor_exit) for V-SF-06, 06b, 06c, 06d; the attribute succession_rank(actor, partner)@eN; the named-actor count in the run report"
era_state = ["succession_institutionalisation", "exec_constraint"]
scale_behaviour = "Identical at every N. A micro world may hold one title and no hazards fire visibly; the V-SF-06 bands report INSUFFICIENT below their minimum ruler-years (09 §3). Dormancy keeps the named set proportional to seats, offices, claims and vows, so it scales with the manifest's titles rather than with house growth"

[initialization]
state = "Houses, titles (tier, liege, polity, law, holder), offices and their holders from the manifest's dynasties, as the journaled world-creation event; held_since from the manifest (or world start), predecessor_exit none, no claims unless the manifest declares them; succession_institutionalisation from the manifest; the first dormancy pass at world start names the ruling houses and the great-house members who meet the criteria (SIM-9); the first exit draws at the first Month pulse"
from_manifest = ["dynasties", "cast", "polities", "institutions"]

[input_data]
drivers = []

# ----------------------------------------------------------------------------- parameters
[[params]]
name = "murder_hazard_base"
meaning = "Murder hazard per ruler-year of a sovereign at the reference institutional state (elective law, no assembly, no murdered predecessor). Coupled with T1.minds, it is the background part: recalibrated against V-SF-06 so background plus minds' foreground murders hit the band"
source = "Eisner 2011, Table 2 and Figs 1–2 (R12 §1): century rates 0.0019–0.025, pooled 0.010"
[[params]]
name = "deposition_hazard_ref"
meaning = "Non-lethal deposition hazard per ruler-year at the reference state (forced abdication, overthrow survived); K&S's deposition minus the murders M7 draws separately"
source = "Kokkonen & Sundell 2014, Table 1, p. 445 (R12 §2): 0.040 per ruler-year deposed under election, less Eisner's pooled murder rate 0.010"
[[params]]
name = "primogeniture_hr"
meaning = "Multiplier on both exit hazards under primogeniture (and, by analogy, ultimogeniture) relative to election"
source = "Kokkonen & Sundell 2014, p. 447 and p. 450 (R12 §2): HR 0.25 [0.17, 0.37], 0.34 [0.18, 0.63] stratified"
[[params]]
name = "seniority_hr"
meaning = "Multiplier on both exit hazards under agnatic seniority relative to election"
source = "Kokkonen & Sundell 2014, p. 447 (R12 §2): HR 1.98 [1.17, 3.35], 2.57 stratified"
[[params]]
name = "predecessor_killed_or"
meaning = "Multiplier on the murder hazard when the predecessor was murdered (an odds ratio applied as a hazard ratio: exact enough for monthly probabilities below 0.01)"
source = "Eisner 2011, p. 570 (R12 §1): OR 2.98"
[[params]]
name = "predecessor_deposed_hr"
meaning = "Multiplier on the deposition hazard when the predecessor was deposed or murdered"
source = "Kokkonen & Sundell 2014, p. 447 (R12 §2): predecessor deposed HR 1.56–1.80"
[[params]]
name = "exec_constraint_hr"
meaning = "Multiplier on both exit hazards at full executive constraint (an assembly); m_ec = 1 + (exec_constraint_hr - 1) x exec_constraint"
source = "Kokkonen & Sundell 2014 (R12 §2): parliament HR 0.50 between countries, not significant within them, so the range reaches 1.0. Not from Blaydes & Chaney 2013, which is the held-out V-SF-06c's source"
[[params]]
name = "majority_age"
meaning = "Age (years) below which a holder rules through a regent; also the age of vocations and of dormancy decisions"
source = "design value; no source read. Medieval royal majorities varied (roughly 12–21)"
[[params]]
name = "arb_legal_weight"
meaning = "Arbitration weight of being the legal heir under the title's law"
source = "design value (SAGA-13). Settled by V-SAGA-19's fixtures and the director's reading of G1a histories"
[[params]]
name = "arb_claim_weight"
meaning = "Arbitration weight of holding a pressed claim on the title"
source = "design value (SAGA-13)"
[[params]]
name = "arb_military_weight"
meaning = "Arbitration weight of military proximity: at F1, holding the title's marshal office (M8's armies replace the proxy in P4)"
source = "design value (SAGA-13)"
[[params]]
name = "arb_treasury_weight"
meaning = "Arbitration weight of treasury control: at F1, holding the title's steward office (M4's treasury joins in P1b)"
source = "design value (SAGA-13)"
[[params]]
name = "contest_margin"
meaning = "Lead (in score units) the best candidate needs over the runner-up for a sovereign title to pass without an interregnum"
source = "design value (SAGA-13). Settled by the share of interregna in the G1a histories; no historical band read"
[[params]]
name = "interregnum_max_days"
meaning = "Upper bound of the keyed delay to an interregnum's resolution"
source = "design value (SAGA-13)"
[[params]]
name = "dormancy_degrees"
meaning = "SIM-9's N: a great-house member farther than this many degrees of kinship from every holder of a title, claim or office of the house, and holding none, with no active vow, becomes dormant"
source = "design value (SIM-9). Settled by V-INV-12, the G1a performance budget (at most 500 named actors) and the family histories"
[[params]]
name = "vocation_holy_orders"
meaning = "Share of later children who enter holy orders at majority (celibate; leave every succession line)"
source = "design value (RT-2026-10-16 item 12); prototype 7's 0.40 is illustrative, not sourced"
[[params]]
name = "vocation_mercenary"
meaning = "Share of later children who join a mercenary company at majority (leave the court's candidate sets; keep their place in lines)"
source = "design value (RT-2026-10-16 item 12); prototype 7's 0.35 is illustrative, not sourced"

# ----------------------------------------------------------------------------- submodels
[[submodels]]
name = "exit_hazards"
summary = "On the first day of each month, for each sovereign title with a living adult or regency holder: law multiplier L = primogeniture_hr (primogeniture, ultimogeniture), seniority_hr (seniority), 1 (elective, tanistry, partition, sortition); m_ec = 1 + (exec_constraint_hr - 1) x polity.exec_constraint; h_m = murder_hazard_base x L x m_ec x (predecessor_killed_or if predecessor_exit = murdered); h_d = deposition_hazard_ref x L x m_ec x (predecessor_deposed_hr if predecessor_exit in {murdered, deposed}); draw exit_murder and exit_deposition against 1 - exp(-h/12) and the day by exit_day. A murder sends ScheduleDeath{ruler, that day, murder, culprit by murder_culprit}; a deposition schedules M7's deposition timer at (that day, Polity) and stores it in exit_timer. Outcomes lie one month ahead because M2 applies the command at its next binding, the first day of that month (day 1 is excluded); the hazard per ruler-year is unchanged"
earns_its_place_by = ["V-SF-06", "V-SF-06b", "V-SF-06d", "V-ERA-03"]
[[submodels]]
name = "on_death"
summary = "At Polity of a death instant (every death is an M2 timer in the Vital slot): for each title whose holder died: predecessor_exit := murdered, other_violent or natural from person.death_cause; holder := 0; state := awaiting; cancel exit_timer; schedule the arbitration timer at (now, Polity) of this same instant (SAGA-13). A dead regent: the next regent by rule (REGENCY_ENDED, REGENCY_BEGUN). A dead office holder: office.holder := 0. A dead claimant: claim.status := void. A house whose last living member died: HOUSE_EXTINCT. Property: TransferHoldings to M4 (P1b)"
earns_its_place_by = ["V-SAGA-19", "V-INV-03"]
[[submodels]]
name = "arbitrate"
summary = "Candidates: the legal heir by the title's law (effect-language eligibility and order over kin(n), P1.15; the deposed ruler and persons in holy orders excluded), the claimants with pressed active claims, and for a title without either, the liege's re-grant candidates (petitioners, then kin of the liege's holder within dormancy_degrees); a vassal title with no candidate at all reverts to its liege's holder in demesne (SUCCEED). Score = arb_legal_weight x [legal heir] + arb_claim_weight x [pressed claim] + arb_military_weight x [holds the title's marshal office] + arb_treasury_weight x [holds its steward office]. Best leads the runner-up by contest_margin or more (or is alone), or the title is not sovereign: SUCCEED, holder := best, held_since := now, state := held; if best is not the legal heir, the heir gains a claim (CLAIM_CREATED) and a PASSED_OVER modifier about best; a realised claim's status := realised. Otherwise (sovereign only): INTERREGNUM_CRISIS, state := interregnum, a resolution timer after interregnum_delay days; at resolution, re-arbitrate with the same rule, and if still contested pick by succession_tie weighted by score; a sovereign with no candidate at resolution goes to the realm's highest-tier vassal holder (election by the magnates). A successor under majority_age gets a regent by rule (the living adult mother, else the nearest adult kin in the law's order, else the steward): REGENCY_BEGUN and a regency-end timer at majority"
earns_its_place_by = ["V-SAGA-19", "V-SF-06b"]
[[submodels]]
name = "exit"
summary = "A deposition timer fires: if the ruler is alive and still holds the title, emit DEPOSED (actor = the leading pressed claimant, if any), give the ruler a claim (CLAIM_CREATED) and a DEPOSED_BY modifier about the deposer, predecessor_exit := deposed, state := awaiting, and run arbitrate in the same step with the deposed excluded"
earns_its_place_by = ["V-SF-06b", "V-SAGA-19"]
[[submodels]]
name = "regency"
summary = "At the holder's majority: regent := 0, REGENCY_ENDED"
earns_its_place_by = ["V-SAGA-19"]
[[submodels]]
name = "apply_commands"
summary = "PressClaim{claim}: pressed := true, CLAIM_PRESSED, CLAIM_PRESSED_BY modifier for the holder about the claimant. PetitionSeat{person, target}: a petition row (one per person and target). RenounceClaim{claim}: status := renounced, CLAIM_RENOUNCED. Resign{person, office}: office.holder := 0. A command naming a dead person or an ended claim is dropped with a diagnostic"
earns_its_place_by = ["V-SAGA-19", "V-SF-06b"]
[[submodels]]
name = "regrant"
summary = "Yearly: each title held in demesne by its liege's holder (a second title of the same holder below its own tier) and each vacant office goes to the best candidate: petitioners for it, then the holder's kin within dormancy_degrees who hold no seat or office (persons in holy orders only for chaplain), scored by the arbitration score without the legal term, ties by succession_tie; SEAT_GRANTED and a GRANTED_BY modifier; the liege keeps the seat when no candidate exists. Seats are never created (finite seats)"
earns_its_place_by = ["V-INV-12"]
[[submodels]]
name = "vocation"
summary = "Yearly: each great-house member who reached majority_age this year, is not first in any title's line, and holds no seat, office or claim draws a vocation: holy_orders (leaves every line; eligible only for chaplain; M2's fertility reads it, P1.3), mercenary (leaves the court candidate sets; keeps lines), or household. Everyone stays in the ledger and the life-course log"
earns_its_place_by = ["V-INV-12"]
[[submodels]]
name = "dormancy"
summary = "Yearly, and at world start: a named great-house member is dormant-eligible when an adult, holding no seat, office or claim, with no active vow (S7, P1b), and farther than dormancy_degrees from every holder of a title, claim or office of its house: Demote. A dormant member who comes within dormancy_degrees, gains a seat, office or claim, or is a ruling house's heir: Promote. Criteria only; never a count; nothing is deleted (ADR-0007)"
earns_its_place_by = ["V-INV-12"]

# ----------------------------------------------------------------------------- invariants
[[invariants]]
id = "INV-M7-01"
statement = "At every tick boundary every title is held by a living holder or is in a declared interregnum; awaiting never survives a tick boundary; a holder holds each title at most once"
test = "V-SAGA-19"
[[invariants]]
id = "INV-M7-02"
statement = "Every titleholder death or deposition is followed in the same instant by SUCCEED or INTERREGNUM_CRISIS for that title, with a motive edge to the death or deposition"
test = "V-SAGA-19"
[[invariants]]
id = "INV-M7-03"
statement = "Every interregnum ends within interregnum_max_days with SUCCEED"
test = "V-SAGA-19"
[[invariants]]
id = "INV-M7-04"
statement = "Realised hazards stay in their bounds: h_m in [murder_hazard_base x min(L) x exec_constraint_hr, murder_hazard_base x max(L) x predecessor_killed_or], likewise h_d"
test = "V-SF-22"
[[invariants]]
id = "INV-M7-05"
statement = "Every active claim has a living claimant who does not hold the claimed title; every regent is living and adult while regent"
test = "V-INV-01"
[[invariants]]
id = "INV-M7-06"
statement = "Ruling houses and active great-house members are named from world start; Promote and Demote follow the criteria only; no dormant person leaves the ledger or the life-course log"
test = "V-INV-12"
[[invariants]]
id = "INV-M7-07"
statement = "M7 writes only its own columns; every death it causes is a ScheduleDeath through M2's single death path"
test = "V-INV-04"

# ----------------------------------------------------------------------------- couplings
[[couplings]]
system = "M6.polity"
direction = "in"
via = "executive constraint (an assembly, landed military elite) lowers both exit hazards of the polity's sovereign; held at the manifest's reference value until M6-lite (P1.6a)"
lag = "previous pulse"
column = "polity.exec_constraint"
form = "m_ec = 1 + (exec_constraint_hr - 1) x exec_constraint, multiplying h_m and h_d"
neutral = "exec_constraint = 0, the reference institutional state (no assembly): m_ec = 1"
output_bounds = ["exec_constraint_hr (at least 0.3)", "1"]
data_range = "exec_constraint in [0, 1] (q8_8). The evidence is binary, parliament or none (K&S 2014: HR 0.50 between countries, not significant within; R12 §2); intermediate values interpolate linearly by design"
beyond_range = "Not reachable: M6 owns exec_constraint in [0, 1] (q8_8 era state)"
source = "Kokkonen & Sundell 2014, p. 447 (R12 §2); deliberately not Blaydes & Chaney 2013 (V-SF-06c's source)"
[[couplings]]
system = "M2.demography"
direction = "in"
via = "the death path: a titleholder's death in the Vital slot starts arbitration later in the same instant; death_cause sets the feud stock (a mode: it switches the predecessor multipliers on or off); genealogy, sex and age define the lines; natural death of rulers is M2's Brass hazard"
lag = "same instant for deaths; start of instant for genealogy"
[[couplings]]
system = "M2.demography"
direction = "out"
via = "ScheduleDeath for background murders (cause murder, culprit)"
lag = "applied at M2's next binding (the first day of the following month), so draws are made one month ahead"
[[couplings]]
system = "T1.minds"
direction = "in"
via = "PressClaim, PetitionSeat, RenounceClaim, Resign; minds' foreground murders of sovereigns (MURDER_ATTEMPT through M2) add to the background hazard, so coupled calibration lowers murder_hazard_base until V-SF-06 holds"
lag = "applied at the next tick boundary"
[[couplings]]
system = "T1.minds"
direction = "out"
via = "Promote, Demote, OpinionModifier; minds reads seats, offices, claims, houses and regents as identity (lagged)"
lag = "applied at the next tick boundary"
[[couplings]]
system = "S7.vows"
direction = "in"
via = "an active vow keeps its vower named (dormancy criterion; P1b)"
lag = "previous pulse"
[[couplings]]
system = "S7.vows"
direction = "out"
via = "S7 reads title.holder to fulfil CLAIM_TITLE vows"
lag = "same instant, later phase (Agenda)"
[[couplings]]
system = "S6.artifacts"
direction = "out"
via = "regalia pass with the title (S6 reads title.holder). Open question: S6's inherit reads title.holder at Vital, but the successor is named at Polity; proposed fix in S6: regalia of a title awaiting arbitration are placed at the seat and pass at S6's Agenda step"
lag = "same instant, later phase"
[[couplings]]
system = "M4.economy"
direction = "out"
via = "TransferHoldings by the house's inheritance rule (P1b)"
lag = "applied at the next tick boundary"

# ----------------------------------------------------------------------------- isolation (V-SF-22)
[isolation]
forcing = [
  { input = "polity.exec_constraint", series = "step", note = "0 (reference) for 500 years, then 1 (an assembly) for 500 years, on the same seeds; also constants 0 and 1" },
  { input = "person.death_cause", series = "historical:fixture_regicides", note = "M2 live; scripted runs of consecutive murdered predecessors to exercise the feud stock, plus the fixture deaths of V-SAGA-19 (every titleholder through each death cause)" },
]
horizon = "1,000 sim-years on the dynastic fixture world of G1a (a few great houses, 1 to 4 realms, each law in turn; M6 held at neutral; M2 live; T1.minds stubbed: no petitions, no pressed claims, no foreground murders), 32 seeds"
expect = "INV-M7-01 to 07 with 0 violations; murders per 1,000 ruler-years at the reference state equal 1000 x murder_hazard_base x L within Poisson error and inside the V-SF-06 band of the matching institutional state; deposition shares by law inside V-SF-06b (reported at G1a, gated at G1b); the predecessor-murdered OR recovers predecessor_killed_or (V-SF-06d, logistic CI); after the step to exec_constraint = 1 both rates fall by exec_constraint_hr and reigns lengthen (V-SF-06c computed but sealed: reported only once the held-out evaluation runs); the named-actor count stays bounded with no count rule and is reported against population; no house is resurrected and no title is created"

