# ----------------------------------------------------------------------------- events
[[emits]]
kind = "SUCCEED"
when = "Arbitration names a holder (immediate succession, the regrant of a title held in demesne excepted, which is SEAT_GRANTED); roles: actor = the successor, target = the predecessor; motive edge to the death or deposition"
[[emits]]
kind = "INTERREGNUM_CRISIS"
when = "Arbitration of a sovereign title finds no candidate, or no candidate leads the runner-up by contest_margin; the title is held by the declared interregnum until its resolution timer"
[[emits]]
kind = "DEPOSED"
when = "A sovereign's deposition timer fires: actor = the leading pressed claimant (or none), target = the ruler, who lives and gains a claim"
[[emits]]
kind = "REGENCY_BEGUN"
when = "A successor under majority_age succeeds: the regent is named by rule"
[[emits]]
kind = "REGENCY_ENDED"
when = "The holder reaches majority_age, or a regent dies and the next is named (a new REGENCY_BEGUN follows)"
[[emits]]
kind = "CLAIM_CREATED"
when = "A succession passes over the legal heir (the heir gains a claim) or a ruler is deposed (the deposed gains one)"
[[emits]]
kind = "CLAIM_PRESSED"
when = "A PressClaim command from T1.minds is applied"
[[emits]]
kind = "CLAIM_RENOUNCED"
when = "A RenounceClaim command is applied"
[[emits]]
kind = "SEAT_GRANTED"
when = "A title held in demesne or a vacant office is granted to a petitioner or an eligible kin (finite seats, re-grant)"
[[emits]]
kind = "HOUSE_EXTINCT"
when = "The last living member of a house dies"

# ----------------------------------------------------------------------------- lifecycle commands sent
[[commands]]
target = "M2.demography"
command = "ScheduleDeath"
payload = "{ victim, tick, cause, culprit, cause_event }"
why = "A sovereign's background murder, with M2's declared payload ScheduleDeath {victim = the ruler, tick = the drawn day's start, cause = murder, culprit = the murder_culprit draw or 0, cause_event = 0 (a hazard draw has no inciting event)}; every death goes through M2's single death path (05.1 §2 rule 2)"
[[commands]]
target = "T1.minds"
command = "Promote"
why = "A person meets the naming criteria (SIM-9): a seat, office, claim or active vow, or within dormancy_degrees of a holder"
[[commands]]
target = "T1.minds"
command = "Demote"
why = "A named great-house member meets the dormancy criteria; minds defers it while a break is pending or refractory"
[[commands]]
target = "T1.minds"
command = "OpinionModifier"
why = "PASSED_OVER (the legal heir about the successor), DEPOSED_BY (the deposed about the deposer), CLAIM_PRESSED_BY (the holder about the claimant), GRANTED_BY (the grantee about the granter); minds owns opinions"
[[commands]]
target = "M4.economy"
command = "TransferHoldings"
why = "Property inheritance through the death path by the house's [inheritance_rules] id (P1b, when M4 F0 lands)"

# ----------------------------------------------------------------------------- reads
# Round 4 (NEW-4): the reads below are declared unconditionally (round 4, NEW-4); the rh-core registration rule that SPR-014 adds drops and reports a read whose owner the world does not register, and gives the view the coupling's neutral value (M6: exec_constraint = 0, so m_ec = 1; S7: no active vow).
# Kinship (heirs, regents, dormancy distance, regrant kin) walks life_course.mother/father through kin(n) (SPR-017), read
# at same_instant (round 4c, NEW-6): everyone born up to this instant's Vital slot is in it, the dead included (round 4, NEW-1). M7 rebuilds a children-by-parent
# index over those columns at restore and on each birth: derived state, outside the plane-A hash and the keyframe. M2 is read at
# same_instant (M2 binds only Vital, earlier than every M7 binding), so births and deaths of this instant are visible.
# No read is previous_pulse (MAJ-1: Engine::new refuses it until BCK-002 A-28).
[[reads]]
column = "person.alive"
owner = "M2.demography"
lag = "same_instant"
use = "identity"
