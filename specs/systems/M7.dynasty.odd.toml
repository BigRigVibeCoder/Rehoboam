owner = "M2.demography"
lag = "same_instant"
use = "identity"
[[reads]]
column = "life_course.person_id"
owner = "M2.demography"
lag = "same_instant"
use = "identity"
[[reads]]
column = "life_course.mother"
owner = "M2.demography"
lag = "same_instant"
use = "identity"
[[reads]]
