[scales]
spatial = "houses, titles (sovereign, major, minor seats), offices and claims; a realm is a sovereign title and its vassal titles"
temporal = "Day pulse (every day start; in P1a every birth and death fires at a day start, round 3 BLK-1): births, deaths, arbitration, deposition, interregnum and regency timers, queued commands; Month pulse for the sovereigns' exit hazards (drawn on the first day over the whole month; the event placed on a keyed day among days 2 to the last); Year pulse for regrants, vocations and dormancy"
extent = "every house and title of the manifest: typically 1 to 20 houses, 5 to 200 titles; persons of great houses only for dormancy and vocations"
restart = "Owned columns plus M7's pending timers (deposition, interregnum resolution, regency end) restore the system exactly"

[[fidelity_ladder]]
level = "F0"
representation = "Heir = eldest child (05.1 §3); no hazards"
status = "available"
[[fidelity_ladder]]
level = "F1"
representation = "Succession-law enum, competing exit hazards of sovereigns at the reference institutional state, immediate arbitration, claims, regencies, finite seats and re-grants, vocations, great-house dormancy"
status = "target"

# ----------------------------------------------------------------------------- schedule
# The death instant is a day boundary (round 3, BLK-1): M2's death timers fire in the timer pass of (day start, Vital),
# and this Day/Polity binding runs later in the same instant, so on_death arbitrates there and then. The binding runs at
# every day start (rh-core runs every binding whose pulse fires; a `when` clause is documentation) and does work only
# where a birth or death happened in this instant's Vital slot or an M7 timer is due.
[[schedule]]
pulse = "Day"
phase = "Polity"
steps = ["on_birth: write the house_member row of each person born this instant, and send Promote for a newborn who meets the naming criteria", "on_death: for each titleholder, regent, office holder, claimant or house member who died this instant, update the title, regency, office, claim and house, and arbitrate each vacated title in the same step", "arbitrate: fire due interregnum-resolution timers: name the successor (or, still contested, draw one)", "exit: fire due deposition timers: depose the ruler and arbitrate in the same step", "regency: fire due regency-end timers"]
when = "every day start; work only at a birth or death of this instant or a due M7 timer"
[[schedule]]
pulse = "Month"
phase = "Polity"
steps = ["exit_hazards: for each sovereign, draw whether it is murdered or deposed this month (probability over the whole month; the event on a keyed day among days 2 to the last)"]
when = "always (the first day of each month)"
[[schedule]]
pulse = "Day"
phase = "Agenda"
steps = ["apply_commands: apply PressClaim, PetitionSeat, RenounceClaim and Resign from T1.minds"]
when = "every day start; work only with queued M7 commands"
[[schedule]]
pulse = "Year"
phase = "Polity"
steps = ["regrant: grant titles held in demesne and vacant offices to petitioners or eligible kin", "vocation: draw a vocation for each great-house member who reached majority_age this year without a seat, office, claim or place in a line", "dormancy: recompute claim.rank and send Demote and Promote by SIM-9's criteria"]
when = "always"

# ----------------------------------------------------------------------------- RNG
# Mapping onto H (05.1 §6 item 2; MIN-1): StepCtx::rng(purpose, entity, k) supplies the world seed, branch salt, system id,
# the entity's epoch and the instant t itself; each purpose below names its entity and k. Each draw is one u64 from its own
# keyed stream. Enumeration before a draw is in ascending id (MIN-2): candidates and claimants by PersonId, claims by
# ClaimId, titles by TitleId; tied scores are listed in ascending PersonId before a tie draw.
[[rng]]
purpose = "exit_murder"
key = ["ruler", "month"]
use = "entity = the ruler, k = 0, t = the month's first instant: hits iff draw < p_m (Prob32 draw_hits, SPR-011 ruling 4)"
[[rng]]
purpose = "exit_deposition"
key = ["ruler", "month"]
use = "entity = the ruler, k = 0, t = the month's first instant: hits iff draw < p_d (Prob32)"
[[rng]]
purpose = "exit_day"
key = ["ruler", "month"]
use = "entity = the ruler, t = the month's first instant; k = 0 the murder's day, k = 1 the deposition's day, each uniform on days 2 to the last of the month (draw mod n). If both hit, the earlier day wins (murder on a tie) and the other is dropped"
[[rng]]
purpose = "murder_culprit"
key = ["ruler", "month"]
use = "entity = the ruler, k = 0, t = the month's first instant: the culprit of a background murder, uniform (draw mod n) over the title's living claimants in ascending PersonId, or none (an unnamed court faction) when there are none"
[[rng]]
purpose = "arbitration_tie"
key = ["title", "tick"]
use = "entity = the title, k = 0, t = the arbitration instant: an exact score tie in on_death, exit or an interregnum resolution, and the score-weighted pick of a still-contested interregnum resolution; candidates in ascending PersonId"
[[rng]]
purpose = "regrant_tie"
key = ["title", "tick"]
use = "entity = the title or office, k = 0, t = the year's first instant: an exact score tie in the yearly regrant (separate from arbitration_tie, which an interregnum resolution can draw at the same instant)"
[[rng]]
purpose = "interregnum_delay"
key = ["title", "tick"]
use = "entity = the title, k = 0, t = the crisis instant: days to the resolution, 1 + draw mod interregnum_max_days; the timer is at that day's start, Polity"
[[rng]]
purpose = "vocation"
key = ["person"]
use = "entity = the person, k = 0, t = the year's first instant in which it reaches majority_age (so one draw per life): holy_orders if draw < vocation_holy_orders, else mercenary if draw < vocation_holy_orders + vocation_mercenary, else household (Prob32 thresholds)"

# ----------------------------------------------------------------------------- design concepts
[design]
basic_principles = "Competing ruler-exit hazards as functions of institutional state, not of date (ADR-0027; Eisner 2011, Kokkonen & Sundell 2014; R12 §1–2); natural death stays M2's Brass hazard. Succession is immediate (SAGA-13, ADR-0035) and decided by law, claims and the court, never by a director (ADR-0009). Counts are outcomes, never targets (docs/01 principle 8)"
emergence = "Reign lengths, the deposition share by law, regicide contagion, interregna, regencies, contested successions, house extinctions and the size of the named nobility emerge from the hazards, M2's demography, minds' decisions and the finite seats"
adaptation = "n/a: M7 has no agents; claimants, petitioners and feuding houses decide through T1.minds"
objectives = "n/a"
learning = "n/a"
prediction = "n/a"
sensing = "Births, deaths and their causes at the same instant (M2 binds only Vital); named status, active vows and executive constraint at the start of the instant (lagged); a read of an absent owner is dropped by SPR-014's registration rule and its neutral value applies. Kinship through the life-course columns, dead kin included"
interaction = "Lifecycle commands only: ScheduleDeath to M2 (background murders), Promote, Demote and OpinionModifier to T1.minds, TransferHoldings to M4 (P1b); PressClaim, PetitionSeat, RenounceClaim and Resign applied from T1.minds. S6 and S7 read title.holder (regalia, CLAIM_TITLE vows)"
stochasticity = "Keyed RNG only: monthly exit draws and their day, culprit, ties, interregnum delay, vocation. Arbitration itself is deterministic given its inputs"
collectives = "Houses (SIM-9 great houses), realms (a sovereign title with its vassal titles) and courts (the named holders of a realm's seats and offices)"
observation = "SUCCEED, INTERREGNUM_CRISIS, DEPOSED, REGENCY_*, CLAIM_*, SEAT_GRANTED and HOUSE_EXTINCT in channel A; reign records (held_since, predecessor_exit) for V-SF-06, 06b, 06c, 06d; the attribute succession_rank(actor, partner)@eN; the named-actor count in the run report"
era_state = ["succession_institutionalisation", "exec_constraint"]
scale_behaviour = "Identical at every N. A micro world may hold one title and no hazards fire visibly; the V-SF-06 bands report INSUFFICIENT below their minimum ruler-years (09 §3). Dormancy keeps the named set proportional to seats, offices, claims and vows, so it scales with the manifest's titles rather than with house growth"

[initialization]
state = "Houses, titles (tier, liege, polity, law, holder), offices and their holders from the manifest's dynasties, as the journaled world-creation event; held_since from the manifest (or world start), predecessor_exit none, no claims unless the manifest declares them; succession_institutionalisation from the manifest; the first dormancy pass at world start names the ruling houses and the great-house members who meet the criteria (SIM-9); the first exit draws at the first Month pulse"
from_manifest = ["dynasties", "cast", "polities", "institutions"]

[input_data]
drivers = []

# ----------------------------------------------------------------------------- parameters
[[params]]
name = "murder_hazard_base"
meaning = "Murder hazard per ruler-year of a sovereign at the reference institutional state (elective law, no assembly, no murdered predecessor). Coupled with T1.minds, it is the background part: recalibrated against V-SF-06 so background plus minds' foreground murders hit the band"
source = "Eisner 2011, Table 2 and Figs 1–2 (R12 §1): century rates 0.0019–0.025, pooled 0.010. The pooled rate is a mixture over laws and feud states, not the reference-state hazard itself; the bounds are sourced, a point value is a calibration choice"
[[params]]
name = "deposition_hazard_ref"
meaning = "Non-lethal deposition hazard per ruler-year at the reference state (forced abdication, overthrow survived); K&S's deposition minus the murders M7 draws separately"
source = "Derived design value inside the K&S bounds (MIN-4): Kokkonen & Sundell 2014, Table 1, p. 445 (R12 §2) give 0.040 deposed per ruler-year under election; subtracting Eisner's pooled, all-law murder rate 0.010 gives about 0.03. The subtraction mixes an election-only rate with a pooled one, and K&S also count death in civil war, which has no mechanism before M8; the bounds [0.01, 0.05] are sourced, the point value is not"
[[params]]
name = "primogeniture_hr"
meaning = "Multiplier on both exit hazards under primogeniture (and, by analogy, ultimogeniture) relative to election"
source = "Kokkonen & Sundell 2014, p. 447 and p. 450 (R12 §2): HR 0.25 [0.17, 0.37], 0.34 [0.18, 0.63] stratified"
[[params]]
name = "seniority_hr"
meaning = "Multiplier on both exit hazards under agnatic seniority relative to election"
source = "Kokkonen & Sundell 2014, p. 447 (R12 §2): HR 1.98 [1.17, 3.35], 2.57 stratified"
[[params]]
name = "predecessor_killed_or"
meaning = "Multiplier on the murder hazard when the predecessor was murdered (an odds ratio applied as a hazard ratio: exact enough for monthly probabilities below 0.01)"
source = "Eisner 2011, p. 570 (R12 §1): OR 2.98"
[[params]]
name = "predecessor_deposed_hr"
meaning = "Multiplier on the deposition hazard when the predecessor was deposed or murdered"
source = "Kokkonen & Sundell 2014, p. 447 (R12 §2): predecessor deposed HR 1.56–1.80"
[[params]]
name = "exec_constraint_hr"
meaning = "Multiplier on both exit hazards at full executive constraint (an assembly); m_ec = 1 + (exec_constraint_hr - 1) x exec_constraint"
source = "Kokkonen & Sundell 2014 (R12 §2): parliament HR 0.50 between countries, not significant within them, so the range reaches 1.0. Not from Blaydes & Chaney 2013, which is the held-out V-SF-06c's source"
[[params]]
name = "majority_age"
meaning = "Age (years) below which a holder rules through a regent; also the age of vocations and of dormancy decisions"
source = "design value; no source read. Medieval royal majorities varied (roughly 12–21)"
[[params]]
name = "arb_legal_weight"
meaning = "Arbitration weight of being the legal heir under the title's law"
source = "design value (SAGA-13). Settled by V-SAGA-19's fixtures and the director's reading of G1a histories"
[[params]]
name = "arb_claim_weight"
meaning = "Arbitration weight of holding a pressed claim on the title"
source = "design value (SAGA-13)"
[[params]]
name = "arb_military_weight"
meaning = "Arbitration weight of military proximity: at F1, holding the title's marshal office (M8's armies replace the proxy in P4)"
source = "design value (SAGA-13)"
[[params]]
name = "arb_treasury_weight"
meaning = "Arbitration weight of treasury control: at F1, holding the title's steward office (M4's treasury joins in P1b)"
source = "design value (SAGA-13)"
[[params]]
name = "contest_margin"
meaning = "Lead (in score units) the best candidate needs over the runner-up for a sovereign title to pass without an interregnum"
source = "design value (SAGA-13). Settled by the share of interregna in the G1a histories; no historical band read"
[[params]]
name = "interregnum_max_days"
meaning = "Upper bound of the keyed delay to an interregnum's resolution"
source = "design value (SAGA-13)"
[[params]]
name = "dormancy_degrees"
meaning = "SIM-9's N: a great-house member farther than this many degrees of kinship from every holder of a title, claim or office of the house, and holding none, with no active vow, becomes dormant"
source = "design value (SIM-9). Settled by V-INV-12, the G1a performance budget (at most 500 named actors) and the family histories"
[[params]]
name = "vocation_holy_orders"
meaning = "Share of later children who enter holy orders at majority (celibate; leave every succession line)"
source = "design value (RT-2026-10-16 item 12); prototype 7's 0.40 is illustrative, not sourced"
[[params]]
name = "vocation_mercenary"
meaning = "Share of later children who join a mercenary company at majority (leave the court's candidate sets; keep their place in lines)"
source = "design value (RT-2026-10-16 item 12); prototype 7's 0.35 is illustrative, not sourced"

# ----------------------------------------------------------------------------- submodels
[[submodels]]
name = "exit_hazards"
summary = "On the first day of each month, for each sovereign title (ascending TitleId) with a living holder: law multiplier L = primogeniture_hr (primogeniture, ultimogeniture), seniority_hr (seniority), 1 (elective, tanistry, partition, sortition); m_ec = 1 + (exec_constraint_hr - 1) x exec_constraint (1 when M6 is not registered); h_m = murder_hazard_base x L x m_ec x (predecessor_killed_or if predecessor_exit = murdered); h_d = deposition_hazard_ref x L x m_ec x (predecessor_deposed_hr if predecessor_exit in {murdered, deposed}). Widths (MAJ-3, NEW-2): every factor is a Q16_16 parameter or column; h is their product computed exactly in u128 from the Q16_16 bits; the month's probability is p = h x D_m / D over the whole month, D_m = days_in_month, D = days_per_year, rounded down once to Prob32 (32 fraction bits, SPR-011 ruling 4), so the rate per ruler-year is exact; only the placement of the event excludes the pulse instant (a keyed day among days 2 to the last). p = h x D_m / D is linear in h, not 1 - exp(-h x D_m / D): it overstates by at most x²/2 for x = h D_m / D (about h²/288 for a 30-day month), a relative excess of at most x/2, under 0.05% at the reference h = 0.01 and about 1.1% at the Registry's upper corner (h near 0.27); no transcendental is needed. At the lower corner (h = 6 x 10^-5 a year) p is about 2 x 10^4 Prob32 steps, so no hazard rounds to zero. Draws: exit_murder and exit_deposition against p_m and p_d; exit_day for the day; murder wins a tie of days. A murder sends ScheduleDeath {victim = ruler, tick = that day's start, cause = murder, culprit = murder_culprit, cause_event = 0}; M2 drains it at its next Day/Vital binding (SPR-014) and the death fires at tick, in Vital, before this binding. A deposition schedules M7's deposition timer at (that day's start, Polity) and stores it in exit_timer"
earns_its_place_by = ["V-SF-06", "V-SF-06b", "V-SF-06d", "V-ERA-03"]
[[submodels]]
name = "on_birth"
summary = "MAJ-5: for each person born this instant (birth_tick = now; births are M2 timers in this instant's Vital slot; the newborn's parents are read from person.mother and person.father at the same instant): a house_member row with the father's house, else the mother's (looked up in house_member, which keeps the dead), else no row. The newborn's kinship needs no step: it is the life-course columns, which kin(n) walks from the next instant on (round 4, NEW-1). A newborn of a ruling house who is first or second in the line of one of its titles meets the naming criteria at once: Promote. Other relations are not stored: T1.minds derives kinship from M2's life-course columns (life_course.mother and life_course.father) through kin(n), plus person.spouse for the living spouse, when it reads them"
earns_its_place_by = ["V-INV-12"]
[[submodels]]
name = "on_death"
summary = "In the death instant's Day/Polity binding (every death is an M2 timer in the timer pass of this day start's Vital slot; round 3, BLK-1). The dead are the rows with alive = 0 and death_tick = now, readable until Bookkeeping of this instant (SPR-011 ruling 5); a read of a dead row after this instant is a bug. For each title whose holder died (ascending TitleId): predecessor_exit := murdered, other_violent or natural from person.death_cause; holder := 0; state := awaiting; cancel exit_timer; then run arbitrate on it in this same step (SAGA-13), so awaiting never leaves the step. A dead regent: the next regent by rule (REGENCY_ENDED, REGENCY_BEGUN). A dead office holder: office.holder := 0. A dead claimant: claim.status := void. A house whose last living member died: HOUSE_EXTINCT. Property: TransferHoldings to M4 (P1b)"
earns_its_place_by = ["V-SAGA-19", "V-INV-03"]
[[submodels]]
name = "arbitrate"
summary = "Run in-step by on_death and exit, and by a due interregnum-resolution timer. Candidates (each list in ascending PersonId): the legal heir by the title's law (effect-language eligibility and order over kin(n), the SPR-017 relation over life_course.mother/father, so the line runs through dead parents; birth order and sex for the order and for eligibility, the dead's included (primogeniture by representation, cognatic eligibility through a dead ancestor), come from life_course.birth_tick and life_course.sex; ties in birth order are broken by ascending life_course.person_id (round 4c, NEW-7); P1.15; the deposed ruler and persons in holy orders excluded), the claimants with pressed active claims (each claim.rank is recomputed here), and for a title without either, the liege's re-grant candidates (petitioners, then kin of the liege's holder within dormancy_degrees through kin(n) over the life-course columns); a vassal title with no candidate at all reverts to its liege's holder in demesne (SUCCEED). Score (Q16_16) = arb_legal_weight x [legal heir] + arb_claim_weight x [pressed claim] + arb_military_weight x [holds the title's marshal office] + arb_treasury_weight x [holds its steward office]; an exact tie is broken by arbitration_tie. Best leads the runner-up by contest_margin or more (or is alone), or the title is not sovereign: SUCCEED, holder := best, held_since := now, state := held; if best is not the legal heir, the heir gains a claim (CLAIM_CREATED) and a PASSED_OVER modifier about best; a realised claim's status := realised. Otherwise (sovereign only): INTERREGNUM_CRISIS, state := interregnum, a resolution timer interregnum_delay days later (at that day's start, Polity); at resolution, re-arbitrate with the same rule, and if still contested pick by arbitration_tie weighted by score; a sovereign with no candidate at resolution goes to the realm's highest-tier vassal holder (election by the magnates; ties in ascending TitleId). A successor under majority_age gets a regent by rule (the living adult mother, else the nearest living adult kin in the law's order through kin(n), else the steward): REGENCY_BEGUN and a regency-end timer at the first day start at or after the holder's majority"
earns_its_place_by = ["V-SAGA-19", "V-SF-06b"]
[[submodels]]
name = "exit"
summary = "A deposition timer fires at a day start: if the ruler is alive and still holds the title, emit DEPOSED (actor = the leading pressed claimant, if any: the highest arbitration score, ties in ascending PersonId), give the ruler a claim (CLAIM_CREATED) and a DEPOSED_BY modifier about the deposer, predecessor_exit := deposed, state := awaiting, and run arbitrate in the same step with the deposed excluded"
earns_its_place_by = ["V-SF-06b", "V-SAGA-19"]
[[submodels]]
name = "regency"
summary = "At the holder's majority: regent := 0, REGENCY_ENDED"
earns_its_place_by = ["V-SAGA-19"]
[[submodels]]
name = "apply_commands"
summary = "PressClaim{claim}: pressed := true, CLAIM_PRESSED, CLAIM_PRESSED_BY modifier for the holder about the claimant. PetitionSeat{person, target}: a petition row (one per person and target). RenounceClaim{claim}: status := renounced, CLAIM_RENOUNCED. Resign{person, office}: office.holder := 0. A command naming a dead person or an ended claim is dropped with a diagnostic"
earns_its_place_by = ["V-SAGA-19", "V-SF-06b"]
[[submodels]]
name = "regrant"
summary = "Yearly: each title held in demesne by its liege's holder (a second title of the same holder below its own tier) and each vacant office goes to the best candidate: petitioners for it, then the holder's kin within dormancy_degrees (kin(n) over the life-course columns) who hold no seat or office (persons in holy orders only for chaplain), scored by the arbitration score without the legal term, ties by regrant_tie, candidates in ascending PersonId; SEAT_GRANTED and a GRANTED_BY modifier; the liege keeps the seat when no candidate exists. Seats are never created (finite seats)"
earns_its_place_by = ["V-INV-12"]
[[submodels]]
name = "vocation"
summary = "Yearly: each great-house member who reached majority_age this year, is not first in any title's line, and holds no seat, office or claim draws a vocation: holy_orders (leaves every line; eligible only for chaplain; M2's fertility reads it, P1.3), mercenary (leaves the court candidate sets; keeps lines), or household. Everyone stays in the ledger and the life-course log"
earns_its_place_by = ["V-INV-12"]
[[submodels]]
name = "dormancy"
summary = "Yearly, and at world start: a named great-house member is dormant-eligible when an adult, holding no seat, office or claim, with no active vow (S7, P1b), and farther than dormancy_degrees (kin(n) over the life-course columns, through dead kin) from every holder of a title, claim or office of its house, its house read from house_member: Demote. A dormant member who comes within dormancy_degrees, gains a seat, office or claim, or is a ruling house's heir: Promote. Criteria only; never a count; nothing is deleted (ADR-0007)"
earns_its_place_by = ["V-INV-12"]

# ----------------------------------------------------------------------------- invariants
[[invariants]]
id = "INV-M7-01"
statement = "At every tick boundary every title is held by a living holder or is in a declared interregnum; awaiting never leaves the step that set it (on_death or exit arbitrate in-step); a holder holds each title at most once"
test = "V-SAGA-19"
[[invariants]]
id = "INV-M7-02"
statement = "Every titleholder death or deposition is followed in the same instant by SUCCEED or INTERREGNUM_CRISIS for that title, with a motive edge to the death or deposition"
test = "V-SAGA-19"
[[invariants]]
id = "INV-M7-03"
statement = "Every interregnum ends within interregnum_max_days with SUCCEED"
test = "V-SAGA-19"
[[invariants]]
id = "INV-M7-04"
statement = "Realised hazards stay in their bounds: h_m in [murder_hazard_base x min(L) x exec_constraint_hr, murder_hazard_base x max(L) x predecessor_killed_or], likewise h_d; every window probability is a Prob32 greater than 0 for every h greater than 0 in the Registry bounds"
test = "V-SF-22"
[[invariants]]
id = "INV-M7-05"
statement = "Every active claim has a living claimant who does not hold the claimed title; every regent is living and adult while regent"
test = "V-INV-01"
[[invariants]]
id = "INV-M7-06"
statement = "Ruling houses and active great-house members are named from world start; Promote and Demote follow the criteria only; no dormant person leaves the ledger or the life-course log"
test = "V-INV-12"
[[invariants]]
id = "INV-M7-07"
statement = "M7 writes only its own columns; every death it causes is a ScheduleDeath through M2's single death path"
test = "V-INV-04"

# ----------------------------------------------------------------------------- couplings
[[couplings]]
system = "M6.polity"
direction = "in"
via = "executive constraint (an assembly, landed military elite) lowers both exit hazards of the polity's sovereign. Until M6-lite (P1.6a) no P1a world registers M6, so SPR-014's registration rule drops the read and the neutral value applies: exec_constraint = 0, m_ec = 1 (round 4, NEW-4)"
lag = "start of instant (lagged)"
column = "polity.exec_constraint"
form = "m_ec = 1 + (exec_constraint_hr - 1) x exec_constraint, multiplying h_m and h_d"
neutral = "exec_constraint = 0, the reference institutional state (no assembly): m_ec = 1"
output_bounds = ["exec_constraint_hr (at least 0.3)", "1"]
data_range = "exec_constraint in [0, 1] (q8_8). The evidence is binary, parliament or none (K&S 2014: HR 0.50 between countries, not significant within; R12 §2); intermediate values interpolate linearly by design"
beyond_range = "Not reachable: M6 owns exec_constraint in [0, 1] (q8_8 era state)"
source = "Kokkonen & Sundell 2014, p. 447 (R12 §2); deliberately not Blaydes & Chaney 2013 (V-SF-06c's source)"
[[couplings]]
system = "M2.demography"
direction = "in"
via = "the death path: a titleholder's death in the Vital slot starts arbitration later in the same instant; person.death_cause sets the feud stock (the dead row is readable until Bookkeeping of its death instant, SPR-011 ruling 5) (a mode: it switches the predecessor multipliers on or off); genealogy, sex and age define the lines; natural death of rulers is M2's Brass hazard"
lag = "same instant for deaths; start of instant for genealogy"
[[couplings]]
system = "M2.demography"
direction = "out"
via = "ScheduleDeath {victim, tick, cause, culprit, cause_event} for background murders, the payload M2 declares it applies (round 3, MAJ-4)"
lag = "drained at M2's next Day/Vital binding (SPR-014); the death fires at its tick, a day start in the same month"
[[couplings]]
system = "T1.minds"
direction = "in"
via = "PressClaim, PetitionSeat, RenounceClaim, Resign; minds' foreground murders of sovereigns (MURDER_ATTEMPT through M2) add to the background hazard, so coupled calibration lowers murder_hazard_base until V-SF-06 holds"
lag = "applied at the next tick boundary"
[[couplings]]
system = "T1.minds"
direction = "out"
via = "Promote, Demote, OpinionModifier; minds reads seats, offices, claims, houses and regents as identity (lagged)"
lag = "applied at the next tick boundary"
[[couplings]]
system = "S7.vows"
direction = "in"
via = "an active vow keeps its vower named (dormancy criterion; P1b). In a world that does not register S7, SPR-014's registration rule drops the read and the neutral applies: no active vow"
lag = "start of instant (lagged)"
[[couplings]]
system = "S7.vows"
direction = "out"
via = "S7 reads title.holder to fulfil CLAIM_TITLE vows"
lag = "same instant, later phase (Agenda)"
[[couplings]]
system = "S6.artifacts"
direction = "out"
via = "regalia pass with the title (S6 reads title.holder). Open question: S6's inherit reads title.holder at Vital, but the successor is named at Polity; proposed fix in S6: regalia of a title awaiting arbitration are placed at the seat and pass at S6's Agenda step"
lag = "same instant, later phase"
[[couplings]]
system = "M4.economy"
direction = "out"
via = "TransferHoldings by the house's inheritance rule (P1b)"
lag = "applied at the next tick boundary"

# ----------------------------------------------------------------------------- isolation (V-SF-22)
[isolation]
forcing = [
  { input = "polity.exec_constraint", series = "step", note = "0 (reference) for 500 years, then 1 (an assembly) for 500 years, on the same seeds; also constants 0 and 1" },
  { input = "person.death_cause", series = "historical:fixture_regicides", note = "M2 live; scripted runs of consecutive murdered predecessors to exercise the feud stock, plus the fixture deaths of V-SAGA-19 (every titleholder through each death cause)" },
]
horizon = "1,000 sim-years on the dynastic fixture world of G1a (a few great houses, 1 to 4 realms, each law in turn; M6 held at neutral; M2 live; T1.minds stubbed: no petitions, no pressed claims, no foreground murders), 32 seeds"
expect = "INV-M7-01 to 07 with 0 violations; murders per 1,000 ruler-years at the reference state equal 1000 x murder_hazard_base x L within Poisson error (the monthly probability covers the whole month, so the yearly rate is exact up to the linear-vs-exp excess of at most h/24, NEW-2) and inside the V-SF-06 band of the matching institutional state; deposition shares by law inside V-SF-06b (reported at G1a, gated at G1b); the predecessor-murdered OR recovers predecessor_killed_or (V-SF-06d, logistic CI); after the step to exec_constraint = 1 both rates fall by exec_constraint_hr and reigns lengthen (V-SF-06c computed but sealed: reported only once the held-out evaluation runs); the named-actor count stays bounded with no count rule and is reported against population; no house is resurrected and no title is created"

[verification]
tests = ["V-SAGA-19", "V-SF-06", "V-SF-06b", "V-SF-06c", "V-SF-06d", "V-ERA-03", "V-INV-03", "V-INV-04", "V-INV-12", "V-INV-01", "V-SF-22", "V-SF-23", "V-COUP-01", "V-DET-12"]
prototype = ""
