# ODD-R v2 system spec (ADR-0033). S3.migration F0, spec 0.1.0 DRAFT (SPR-018; PRJ-002 ruling M-6): residence.
# Every person lives in exactly one settlement of M1.regions, from genesis (founders are placed by rh-worldgen) or from
# birth (a newborn takes its mother's settlement), and nobody moves: the residence-interval table V-DATA-04's P1a variant
# needs at G1a (D34) has exactly one interval per person at F0. F1 (P1b) adds moves as timers and the fugitives of P1.23
# (SAGA-14; BCK-001 §3); F2 (P4) individual migration choice and the radiation flows of 05.1 §3. Each is a seam below,
# not a mechanism. S3 owns no RNG purpose at F0: the one genesis draw (founder_residence) is rh-worldgen's.
# lint_odd.py checks this file; specs/worldgen/selftest_worldgen_lite.py is the exact reference of [algorithm.residence_f0]
# R1-R3 (its residence lines) and of the interval tiling of R4-R5 (its birth sequence check).
# Registration (REV-SPR-018 R3): this spec PR adds [systems."S3.migration"] to the Registry with no version bump and names
# S3 in no template. SPR-018's sprint PR, which builds S3, adds it to every template's default_systems and bumps
# registry_version; until then a manifest naming S3 falls under SPR-011 ruling 3 (a named system the build lacks).
odd_r = 2
# Empty sections first (TOML: a bare key after a table header would join that table). S3 F0 draws nothing in a step and
# has no Registry parameter: the reasons are given at each section's place below.
rng = []
params = []

[system]
id = "S3.migration"
name = "Migration and residence"
spec_version = "0.1.0"
fidelity = "F0"
status = "draft"
crate = "rh-sys-migration"
adrs = ["ADR-0004", "ADR-0006", "ADR-0024", "ADR-0025", "ADR-0026", "ADR-0031", "ADR-0033"]
requirements = ["DATA-8", "SIM-2", "DET-13"]

[purpose]
statement = "Say where every person lives: one settlement per person from entry to exit, recorded as residence intervals in the life-course log, so that daily life, marriage pools and later moves have a place to start from."
role = "substrate"
patterns = [
  { test = "V-DATA-04", pattern = "Residence intervals tile every recorded lifetime with no gap and no overlap, and per-settlement counts reconcile with entries and exits", kind = "identity", role = "sole" },
]
not_yet = [
  "Moves: a change of residence as a scheduled outcome (a timer, DET-13), with a MOVE verb and its tellability; marriage co-residence (a wife joining her husband's settlement), which M2 F1's households_f1 H3 leaves to S3 (its households have no place). F1, P1b",
  "Fugitives (P1.23, SAGA-14, V-SAGA-20): person.fugitive set by a lifecycle command from T1.minds after a crime or a mental break; flight as scheduled moves along M1's route graph (route.a, route.b, length_cells, then F1 costs) toward a border, a sanctuary or an ally, with an interception hazard per segment; tile paths only in focus regions and micro worlds. F1, P1b",
  "Emigration off the map (life_course.exit_kind = emigration) and immigration (H64(seed, immigrant, origin, t, k) ids, LIFE_ENTRY origin immigrant): P4 with the off-map compartments and the materialisation adapter (05.1 §3)",
  "urban_share, the era-state variable the Registry gives S3 ([era_state]; ADR-0027): a region's share of people living in settlements above a size threshold; owned and written by S3 from F1 (settlements grow) on, read by M2 fertility and M5 then. Nothing reads it in P1a",
  "A residence record in channel A of the World Stream: v0 writes LIFE_ENTRY and LIFE_EXIT only; kind 7 RESIDENCE_INTERVAL is reserved (specs/stream/channel_a_v0.sql, REV-SPR-018 R11) as a non-event record of this table's rows, and SPR-018's sprint defines its fields: one record per residence_interval row at genesis and at each birth",
  "Residence at the raster cell or plot (PlotId; 05.2 §2): F2 with settlement plans",
]

# ----------------------------------------------------------------------------- the ledger column (person.residence)
# The person.* column of 05.1 §5's ledger ("settlement u32"), named person.residence because S5.daily_life already reads it
# by that name from S3. rh-core keeps it aligned and sorted with the ledger (SPR-011 ruling 5), whoever owns it.
[[owns]]
column = "person.residence"
entity = "person"
type = "u32"
plane = "A"
meaning = "SettlementId (M1 settlement.id) the person lives in. Written at genesis by rh-worldgen (R1-R3) and at birth by residence_at_birth (R4), then never again at F0. 0 ('none') only on a row inserted this instant before S3's Vital step has run: the zero of the type SPR-014's row insert gives every other owner's column, and the mark by which R4 finds the newborns (REV-SPR-018 R4); INV-S3-02 says it is never 0 after Vital. A dead row keeps its value until compaction"
fixed_point = false

# ----------------------------------------------------------------------------- residence intervals (residence_interval.*)
# The residence interval table of the life-course log (DATA-8; ADR-0026 item 3: "interval tables for residence, occupation,
# faction and marriage"; the chronicle's life_interval kind 0, schema.sql). Append-only (ADR-0007): a row is appended when a
# person enters a settlement and never changed. Its end is implicit: the start of the person's next interval, or the
# person's exit (life_course.exit_tick, M2) when there is none. So S3 never reacts to a death, the table never needs a
# second write, and at F0 every person has exactly one row. Row order is append order: at genesis ascending PersonId;
# later, by instant, ascending PersonId within an instant.
[[owns]]
column = "residence_interval.person_id"
entity = "residence_interval"
type = "u64"
plane = "A"
meaning = "PersonId of the resident (a life_course.person_id; the person may be dead and compacted from the ledger, the log keeps them)"
fixed_point = false
[[owns]]
column = "residence_interval.settlement"
entity = "residence_interval"
type = "u32"
plane = "A"
meaning = "SettlementId lived in over the interval; never 0"
fixed_point = false
[[owns]]
column = "residence_interval.from_tick"
entity = "residence_interval"
type = "i64"
plane = "A"
meaning = "The instant the interval opens: 0 for a founder (= life_course.entry_tick: a founder's pre-epoch years are not history, 05.2 §1), the birth instant for a birth (R4). The interval ends at the person's next interval's from_tick, else at life_course.exit_tick (i64::MAX while open); the end is never stored (R5)"
fixed_point = false

# S3 F0 emits no event (no Registry verb is S3's; a MOVE verb arrives with F1) and sends and applies no lifecycle command.
# Considered and not accepted at F0: SetHousehold (M2 F1 keeps membership itself, SPR-015), SetResidence from any sender
# (nobody moves anybody in P1a; a catalyst that does is a journaled material input), BeginFlight from T1.minds (P1.23, F1).

# Reads (same_instant from M2: S3's Day/Vital binding is scheduled after M2's by the edge this read creates, 05.1 §2
# rule 4, so it sees the rows M2's birth timers inserted in this instant's Vital slot; the newborns themselves are found
# by S3's own column, person.residence = 0, R4). M1 F0 never writes after genesis, so its reads are lagged (no edge) and exact.
[[reads]]
column = "person.mother"
owner = "M2.demography"
lag = "same_instant"
use = "identity"
[[reads]]
column = "settlement.id"
owner = "M1.regions"
lag = "lagged"
use = "identity"
[[reads]]
column = "settlement.region"
owner = "M1.regions"
lag = "lagged"
use = "identity"
[[reads]]
column = "region.land_cells"
owner = "M1.regions"
lag = "lagged"
use = "rate"                               # it weighs the founders' placement draw (R1): a probability, so a rate read

[scales]
spatial = "settlement (M1 settlement.id); the region is derived through settlement.region, never stored twice"
temporal = "genesis (founders) and the Day/Vital binding (newborns of the instant); no timer at F0"
extent = "every person who ever entered the world (the interval table) and every living person (person.residence)"
restart = "The owned columns restore the system exactly: S3 holds no timer, no cache and no other state at F0"

[[fidelity_ladder]]
level = "F0"
representation = "Residence at genesis (a keyed, land-weighted settlement per manifest household or loose founder, drawn by rh-worldgen) and at birth (the mother's settlement); one open-ended interval per person; no moves ([algorithm.residence_f0])"
status = "target"
[[fidelity_ladder]]
level = "F1"
representation = "Moves as timers with a MOVE verb; marriage co-residence; fugitives along M1's route graph with per-segment interception hazards (P1.23); urban_share written per region. P1b"
status = "n/a"
[[fidelity_ladder]]
level = "F2"
representation = "Individual migration choice and radiation flows driven by utility differentials (05.1 §3); emigration and immigration through the off-map adapter. P4"
status = "n/a"

[[schedule]]
pulse = "Day"
phase = "Vital"
steps = [
  "residence_at_birth: for each ledger row with person.residence = 0 (a row inserted this instant with the type's zero: a birth, since births are M2 timers at day starts in this Vital slot, SPR-015 [algorithm.fertility_f1] F9), in ascending PersonId, write person.residence := the mother's person.residence and append a residence_interval row opening now ([algorithm.residence_f0] R4)",
]
when = "every day start; work only when a row entered the ledger this instant (nothing before SPR-015 merges: P1.0's worlds have no births)"

# S3 F0 draws nothing in a step. Its one genesis draw, founder_residence (R1-R3), is rh-worldgen's, under the reserved
# system id rh-worldgen (SPR-011 ruling 10), declared in rh-worldgen's rng_purposes.rs with heightmap_blob and region_seed.

[design]
basic_principles = "Residence is a slowly changing fact of the life course (SCD2 intervals, 05.2 §4; DATA-8), owned by one system and read by everyone who needs a place. F0 fixes it at entry: founders by a keyed, land-weighted draw per manifest household (a household lives together; a bigger region holds more people), newborns by descent (a child is born where its mother lives). Nobody moves, so the table is append-only with an implicit end and S3 never has to hear of a death"
emergence = "n/a at F0: the settlement populations follow the placement draw and births and deaths; nothing in S3 responds to anything. Urbanisation and migration flows are F1 and F2"
adaptation = "n/a: no agent in S3 at F0"
objectives = "n/a: no agent in S3 at F0"
learning = "n/a: no agent in S3 at F0"
prediction = "n/a: no agent in S3 at F0"
sensing = "The newborn's mother (person.mother, M2), found by S3's own person.residence = 0 mark; the settlements and region sizes of M1 at genesis; no era state"
interaction = "None at F0 beyond reading M2's new rows in the same instant. Out: S5.daily_life reads person.residence at start of day as the home place; S6.artifacts reads it as the bearer's place; M2 F1's partnering reads it as a mode read (REV-SPR-018 R8: the husband draw's candidates are the eligible men of the bride's settlement, so no P1a marriage joins two settlements; neutral 0 = no restriction, so M2 registers without S3); P1.23 fugitives and F1 moves read M1's routes through S3"
stochasticity = "Keyed counter-based RNG only (ADR-0006), one draw per manifest household and per loose founder at genesis (purpose founder_residence, entity = the head's or the founder's PersonId, k = 0), drawn by rh-worldgen; no draw after genesis at F0. The draw count is fixed by the manifest, so a template or seed change moves no founder's draw index (CRN)"
collectives = "Manifest households live together (R2); M2 F1's household.* rows (SPR-015) are membership, S3's residence is place: the two agree at genesis because both follow the manifest's households, and in P1a after every marriage because M2 F1 marries within a settlement (R8 read contract below); F1's co-residence rule takes over when moves exist"
observation = "person.residence and the interval table; the V-DATA-04 audit joins them with M2's life-course log. No stream record at F0 (see not_yet); S5's telemetry.where answers from residence in P1b"
era_state = []                             # S3 F0 reads no era-state variable; it will OWN urban_share from F1 ([era_state], ADR-0027)
scale_behaviour = "Identical at every N: each founder's and newborn's settlement depends only on its own draw or its mother, never on visiting order or thread count. Cost: the residence_at_birth step scans the ledger once per day start for rows with person.residence = 0 (O(N) compares a day: 3.6 x 10^6 a year at 10k persons, trivial; at 1M persons about 3.6 x 10^8 a year, still small against M2's monthly pass); rh-core's row-insert plumbing (SPR-014) may hand S3 the rows inserted this instant instead, a hash-neutral optimisation left to the sprint"

[algorithm.residence_f0]
# SPR-018. Every quantity is an exact integer; no float. The exact reference (specs/worldgen/selftest_worldgen_lite.py)
# reproduces R1-R3 for the golden cases (its residence lines) and checks the tiling of R4-R5 on a scripted birth sequence.
version = "s3-residence-f0-v1"
steps = [
  "R0 Keys. As [algorithm.worldgen_lite] W0: u = H(world_seed, the canonical salt, system_id(\"rh-worldgen\"), epoch 0, purpose founder_residence, entity, t = 0, k = 0); pick(u, n) = floor(u n / 2^64). Founders are the persons rh-worldgen creates at genesis (SPR-011 ruling 10 order: the cast in manifest order, then each manifest household's children and servants in household order, then the rest of peoples.population), with PersonId founder(seed, k) and the deterministic rehash.",
  "R1 Weights. Over M1's settlements in ascending settlement.id (1..K at F0), w_s = region.land_cells of settlement.region; C_s = w_1 + ... + w_s (u64); W = C_K >= K >= 1. The settlement of a draw u is the least s with C_s > pick(u, W): settlement s is chosen with probability w_s / W exactly (the in-coupling on region.land_cells).",
  "R2 Households. For each manifest household h in manifest order: one draw with entity = the PersonId of its head (a cast member); every member of h takes the drawn settlement: the head (whatever its own `household` field says: absent, or h), every cast member whose `household` names h, and h's children and servants. A household lives together. Edge cases (REV-SPR-018 R9): the manifest validator refuses, naming the person, a cast member who heads two households and a head whose `household` field names a household other than the one it heads; SPR-018 adds both rules to manifest_v0.py and the Rust loader (V-WC-04 parity).",
  "R3 Loose founders. Every founder in no manifest household (a cast member without `household` who heads none, and every anonymous founder of peoples.population) takes its own draw, entity = its own PersonId. Exactly one draw per manifest household and per loose founder; nothing else is drawn. Founder order (ruling 10): the cast in manifest order (k = 0..C-1), then each household's children and servants in household order, then the rest; in hamlet the four friends are k = 2..5 and draw for themselves, Job's 40 children and servants are k = 6..45 and take Job's settlement.",
  "R4 Writes at genesis and at birth. Genesis (rh-worldgen, after M2's founder rows and M1's tables): person.residence := s for every founder, and one residence_interval row {person_id, settlement = s, from_tick = 0} per founder, in ascending PersonId. Birth (residence_at_birth, Day/Vital, scheduled after M2 by the same_instant read of person.mother): for each ledger row with person.residence = 0 (the type's zero SPR-014's row insert writes for every other owner's column, so exactly the rows inserted in this instant; never a founder, whose residence genesis wrote, even one with birth_tick = 0: REV-SPR-018 R4), in ascending PersonId: m = person.mother (never 0 for a birth, SPR-015 F9; the mother's row is readable in this instant even if she dies in the same slot: a dead row stays until Bookkeeping, SPR-011 ruling 5), s = m's person.residence (>= 1 by INV-S3-02: the mother entered the world in an earlier instant, since a mother is at least 15 years old, SPR-015 F0, so her residence was written before this step); person.residence := s; append {person_id = the newborn, settlement = s, from_tick = now}.",
  "R5 Interval end (never stored). The interval of person p opened at f ends at the from_tick of p's next residence_interval row (none at F0), else at life_course.exit_tick (i64::MAX while p is in the ledger). V-DATA-04's P1a variant audits, for every person who entered the world at or after the epoch (founders and the born; the pre-epoch ancestors SPR-019 back-fills have life-course rows and no residence row, and are exempt: REV-SPR-018 R7), that the intervals of p tile [life_course.entry_tick, exit_tick) exactly: one row at F0, from_tick = entry_tick (0 for a founder, the birth tick for a birth; a founder's pre-epoch years before 0 are not history, 05.2 §1), and that per settlement, living residents at a month end = genesis placements + births - deaths there since genesis.",
  "R6 Restart. The owned columns restore everything; S3 holds no timer and no cache at F0. A keyframe cut between a row insert and S3's step cannot exist: both happen inside one instant's Vital phase and keyframes are cut after Bookkeeping.",
]

[initialization]
state = "rh-worldgen writes person.residence and the genesis residence_interval rows per [algorithm.residence_f0] R1-R4, after M1's tables (it needs settlement.id and region.land_cells) and after M2's founder rows (it needs the founders' PersonIds): one row per founder, from_tick 0, in ascending PersonId. The draw is founder_residence under rh-worldgen's reserved system id. S3 runs in a world only when the manifest or its template names it: SPR-018's sprint PR adds S3 to every template's default_systems with the registry_version bump (REV-SPR-018 R3). SPR-019's population synthesis keeps R1-R3 for the founders it generates (a synthesised household is a manifest-shaped household), writes no residence row for the pre-epoch ancestors it back-fills (R7), and amends this section if it needs more"
from_manifest = ["cast", "households", "peoples"]

[input_data]
drivers = []

# ODD 7.0: the Registry declares no parameter for S3.migration at F0 (nothing is tunable: placement weights are land cells,
# and a newborn's residence is its mother's). F1's move hazards and the fugitives' interception hazard bring the first ones.

[[submodels]]
name = "residence_at_birth"
summary = "[algorithm.residence_f0] R4 at a birth: the newborn's person.residence := the mother's, and one residence_interval row opening at the birth instant; in ascending PersonId over the rows with person.residence = 0 (the rows inserted this instant), scheduled after M2 in the same Vital slot"
earns_its_place_by = ["V-DATA-04", "V-INV-01"]

[[invariants]]
id = "INV-S3-01"
statement = "Tiling: for every life_course row whose person entered the world at or after the epoch (origin founder or born; the pre-epoch ancestors SPR-019 back-fills have no residence row and are exempt), the person's residence_interval rows, ordered by from_tick, start at entry_tick, each ends where the next begins, and the last ends at exit_tick (open while in the ledger); no gap, no overlap. At F0 exactly one row per such person"
test = "V-DATA-04"
[[invariants]]
id = "INV-S3-02"
statement = "A place for everyone: after the Vital phase of any instant, every ledger row has person.residence >= 1 naming an existing settlement.id, and it equals the settlement of the person's latest residence_interval row"
test = "V-INV-01"
[[invariants]]
id = "INV-S3-03"
statement = "No moves at F0: a person's residence_interval count is 1 and person.residence never changes after it is first written"
test = "V-INV-01"
[[invariants]]
id = "INV-S3-04"
statement = "Descent: a person with life_course.origin = born has the residence its mother had at the birth instant (the mother's interval open at that instant names the same settlement)"
test = "V-DATA-04"
[[invariants]]
id = "INV-S3-05"
statement = "Reconciliation: per settlement at every month end, the number of living residents equals the genesis placements plus the births minus the deaths of residents since genesis (the counts V-DATA-04 reconciles per region and month, summed over a region's settlements)"
test = "V-DATA-04"

[[couplings]]
system = "M1.regions"
direction = "in"
via = "settlement.id and settlement.region at genesis (the places to live in); region.land_cells as the placement weight"
lag = "genesis; lagged (M1 F0 never writes again)"
column = "region.land_cells"
form = "P(settlement s) = w_s / sum of w over settlements, w_s = region.land_cells of s's region ([algorithm.residence_f0] R1); exact in integers through pick(u, W)"
neutral = "equal land cells in every region: every settlement is equally likely"
output_bounds = ["0", "1"]
data_range = "design value: w_s >= 1 for every settlement (a region holds at least its seed cell), any K in 1..5000"
beyond_range = "n/a: the weights are counts and cannot leave their range; a world with K > land cells is refused at load by M1's W5, before S3 runs"
source = "design value (SPR-018): people live where there is land; replaced by population synthesis marginals in SPR-019 if the manifest gives per-region populations"
[[couplings]]
system = "M2.demography"
direction = "in"
via = "the rows M2's birth timers insert in this instant's Vital slot (found by person.residence = 0; their person.mother read same_instant), so S3's binding is scheduled after M2's"
lag = "same instant (05.1 §2 rule 4 edge)"
[[couplings]]
system = "S5.daily_life"
direction = "out"
via = "S5 reads person.residence at start of day as the home place of activity(person, day) (P1b, SPR-031)"
lag = "start of day"
[[couplings]]
system = "M2.demography"
direction = "out"
via = "The read contract REV-SPR-018 R8 sets for M2 F1's partnering ([algorithm.partnering_f1] N4, applied on the births branch): M2 reads person.residence as a mode read, lagged; the husband draw's candidates are the eligible men whose residence equals the bride's, so no P1a marriage joins two settlements (P1a has no residence moves, PRJ-002 ruling M-6); neutral 0 means no restriction (the whole ledger), so M2 registers and runs without S3 (REV-EVO-001 R4). A reader of residence = 0 at a Month pulse cannot see a newborn's unset value: residence is written in the Vital slot of the birth instant"
lag = "lagged (start of the Month pulse instant)"
[[couplings]]
system = "S6.artifacts"
direction = "out"
via = "S6 reads person.residence as the bearer's place (its [[reads]]); P1b"
lag = "lagged"

[isolation]                                # docs/09 V-SF-22: S3 F0 alone, with M1's tables and a scripted ledger as inputs
forcing = [
  { input = "region.land_cells", series = "constant", note = "the neutral: equal land cells in every region, so every settlement is equally likely; then the hamlet case (desert_fringe, seed 42: 4 unequal regions) and a one-region world (every founder in settlement 1)" },
]
horizon = "1,000 sim-years on a scripted ledger: 60 founders, then one birth a month to a living mother and one death a month, no moves"
expect = "Every founder and every newborn has a residence after Vital; one interval per person; the intervals tile [entry, exit); per-settlement counts reconcile every month; under the neutral forcing the founders' settlement counts are consistent with a uniform multinomial (a chi-square below the 99.9% quantile over 64 seeds); under the hamlet forcing with the land-cell weights"

[verification]
tests = ["V-DATA-04", "V-INV-01", "V-DET-01", "V-DET-02", "V-SCALE-01"]
prototype = "specs/worldgen/selftest_worldgen_lite.py"
