# ----------------------------------------------------------------------------- couplings (ODD-R 8)
[[couplings]]
system = "S7.vows"
direction = "in"
via = "vow.conflict, read at the start of the instant, raises stress monthly (in a world without S7, SPR-014's registration rule drops the read and the neutral applies: s_vow = 0) (P1b; RT-2026-10-16 items 5 and 8: the collision rule lives in S7, minds reads its signal)"
lag = "start of instant (lagged)"
column = "vow.conflict"
form = "s_vow = vow_conflict_gain x min(1, sum over the actor's active vows of vow.conflict), points per month"
neutral = "vow.conflict = 0 for every vow (no vow stress)"
output_bounds = ["0", "vow_conflict_gain points per month (at most 20 by the Registry bound)"]
data_range = "conflict in [0, 1] by S7's definition. No empirical data on oath dissonance: a design choice, not a fit"
beyond_range = "Not reachable: S7 bounds each conflict to [0, 1]; min(1, sum) saturates when several vows conflict at once, so max_active_vows cannot multiply it"
source = "design value (ADR-0035; 05.3 §2.1; the design is inspired by Crusader Kings 3's stress, no code taken)"
[[couplings]]
system = "S6.artifacts"
direction = "in"
via = "artifact.rumour_reach, read at the start of the instant (in a world without S6, SPR-014's registration rule drops the read and the neutral applies: the seek consideration as at R = 0), enters the seek consideration of pursue_goal and of an ambitious actor's seek candidates (P1b; V-SAGA-13 b)"
lag = "start of instant (lagged)"
column = "artifact.rumour_reach"
form = "seek consideration = 1 - h/(R + 1) when the actor's route-graph distance h to the artifact's place or bearer is at most R = rumour_reach, else 0; it multiplies the seek score"
neutral = "rumour_reach = 0: only an actor at the artifact's own place (h = 0) knows of it"
output_bounds = ["0", "1"]
data_range = "R in [0, rumour_max_hops] (S6). No empirical data: fiction, so the form is a design choice"
beyond_range = "Not reachable: S6 bounds R to [0, rumour_max_hops]"
source = "design value (ADR-0035)"
[[couplings]]
system = "S6.artifacts"
direction = "in"
via = "ApplyInfluence commands become bounded thoughts that shift the traits IAUS reads (RT-2026-10-16 item 8); the trait columns never change"
lag = "applied at the next tick boundary"
[[couplings]]
system = "S7.vows"
direction = "in"
via = "AgendaGoal, ClearGoal, OpinionModifier and ApplyThought commands (P1b)"
lag = "applied at the next tick boundary"
[[couplings]]
