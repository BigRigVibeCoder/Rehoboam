[scales]
spatial = "named actor; candidate targets come from the actor's situation sets (relations, court, own claims, agenda goals), never from a scan of the world (GOV-003 §6 row 5)"
temporal = "Day pulse for deaths (grief), decisions, breaks and commands at the instants they occur; Month pulse for stress accrual, decay and expiry. Decision polls every poll_months of the type (1 to 12), interrupts at t + 1 day or later"
extent = "named actors only: 1 to 5,000 (05.3 §1); a kingdom world 200 to 2,000; the G1a performance world at most 500. The count is an outcome of M7's dormancy criteria, never a target (docs/01 principle 8)"
restart = "Owned columns plus minds' pending agenda timers (polls, interrupts, break and refractory timers; the agenda's keyframe dump) restore the system exactly. Traits are restored from the keyframe, never recomputed: their draw was keyed by the instant of the first promotion (round 3, MAJ-9)"

[[fidelity_ladder]]
level = "F1"
representation = "Minds v0: HEXACO traits and ambition (static), relation edges, CK3-style opinion modifiers, bounded thoughts from artifacts and curses, event-driven IAUS over six decision types with fixed-point curves, stress in q8_8 with Registry sources and a break table; knowledge rows (P1b)"
status = "target"
[[fidelity_ladder]]
level = "F2"
representation = "The full psychological core of 05.3 §2 (values, PAD mood, OCC emotions, needs, memory with ACT-R activation), bounded HTN, beliefs with distortion, channels (P3.2b, P3.3)"
status = "n/a"

# ----------------------------------------------------------------------------- schedule (05.1 §4.2)
[[schedule]]
pulse = "Day"
phase = "Vital"
steps = ["grief: for each death this instant, add grief stress to every named actor kin to the dead (derived kinship) or holding a liege or vassal row to them, saturating per instant; end the dead's rows and feuds; drop a dead actor's mind timers", "threshold: schedule a break for every actor whose stress crossed stress_threshold in this binding"]
when = "every day start (rh-core runs every binding whose pulse fires); work only where M2's death timers fired in this instant's Vital timer pass, which precedes every binding (round 3, BLK-1)"
[[schedule]]
pulse = "Day"
phase = "Agenda"
steps = ["apply_commands: apply AgendaGoal, ClearGoal, OpinionModifier, ApplyThought and ApplyInfluence from S6 and S7", "promote: apply Promote and Demote from M7 (create or retire a mind)", "break_act: fire due break timers: choose the act from the Registry break table, apply it, relieve stress, start the refractory period", "refractory_end: fire due refractory-end timers", "decide: score and apply the decisions due at this instant (polls and interrupts), same-instant semantics of 05.1 §4.3", "threshold: schedule a break for every actor whose stress crossed stress_threshold in this binding"]
when = "every day start; work only with queued commands for minds or a minds timer due in this phase (break, refractory end, poll, interrupt: all at day starts)"
[[schedule]]
pulse = "Month"
phase = "Agenda"
steps = ["stress_month: add this month's conflict stress (vow, kin loyalty) and subtract decay", "expire: drop expired opinion modifiers from the sums, decay thoughts", "threshold: schedule a break for every actor whose stress crossed stress_threshold in this binding"]
when = "always"

# ----------------------------------------------------------------------------- RNG (ADR-0006)
# Mapping onto H (05.1 §6 item 2; MIN-1): StepCtx::rng(purpose, entity, k) supplies the world seed, branch salt, system id,
# the entity's epoch and the instant t itself; each purpose below names its entity and k. Every rh-sample call draws from
# its own keyed stream (05.1 §6 item 3), so k indexes sampler calls, never stream positions. Decision-type indices are
# the [decision_types] keys in byte-wise ascending order. Enumeration before any draw is in ascending PersonId (MIN-2).
[[rng]]
purpose = "trait_draw"
key = ["person", "k"]
use = "entity = the person, k = 0..5 the HEXACO traits in the column order of [[owns]], 6 ambition; t = the instant of the first promotion (or world creation). One rh-sample normal call per k, sd trait_sd, clamped to the scale, for actors the manifest does not seed. Drawn once: a re-promotion reuses the kept rows (round 3, MAJ-9)"
[[rng]]
purpose = "poll_jitter"
key = ["person", "decision_type"]
use = "entity = the person, k = the decision type's index, t = the promotion instant: the first poll's offset, draw mod (poll_months in days), at a day start"
[[rng]]
purpose = "iaus_select"
key = ["person", "decision_type", "tick"]
use = "entity = the person, k = the decision type's index, t = the decision instant: the weighted choice among the iaus_top_k best-scoring candidates (05.3 §3), candidates ordered by score, ties in ascending target id"
[[rng]]
purpose = "action_order"
key = ["tick", "person"]
use = "entity = the person, k = 0, t = the instant: the keyed permutation H(seed, salt, t, entity) in which same-instant actions apply (05.1 §4.3 item 4), ascending draw, ties in ascending PersonId. Kept in T1 for v0; it moves to rh-core when a second system needs it (Architect round 1, Q9)"
[[rng]]
purpose = "break_delay"
key = ["person", "tick"]
use = "entity = the person, k = 0, t = the crossing instant: d = 1 + draw mod break_delay_max_days days; the break timer is at that day's start, Agenda"
[[rng]]
purpose = "break_act"
key = ["person", "tick"]
use = "entity = the person, k = 0, t = the break instant: the weighted choice among the available acts, in [mental_breaks] key order"
[[rng]]
purpose = "break_outcome"
key = ["actor", "target", "tick"]
use = "entity = the actor, k = the target's PersonId, t = the break instant: whether a break's MURDER_ATTEMPT succeeds, hits iff draw < attempt_success (Prob32). Separate from attack_outcome, so a break and a feud attack at one Day/Agenda never share a draw (MIN-3)"
[[rng]]
purpose = "attack_outcome"
key = ["actor", "target", "tick"]
use = "entity = the actor, k = the target's PersonId, t = the decision instant: whether a feud attack's MURDER_ATTEMPT succeeds, hits iff draw < attempt_success (Prob32)"

# ----------------------------------------------------------------------------- design concepts (ODD 4)
[design]
basic_principles = "Named actors are utility agents (IAUS; Dill, Mark; 05.3 §3) with a CK3-style social layer (opinion modifiers) and a stress-and-break mechanism inspired by Crusader Kings 3's design (no code; ADR-0035). The simulation decides: no language model, no director (ADR-0034, ADR-0009). Stress is conserved and every change has a declared source"
emergence = "Marriages, petitions, pressed claims, feuds, revenge, despair and the breaks that end in murder or flight emerge from traits, relations, opinions and the situations M2, M7, S6 and S7 create; family histories (G1a) are their record"
adaptation = "IAUS: score = product of fixed-point response curves over the considerations of [decision_types], times the IAUS compensation factor; candidates come from the actor's situation; choice by keyed top-k weighted draw. No learning: traits are static, opinions expire"
objectives = "Implicit in the curves: ambition rewards seats, offices and claims; agreeableness and honesty-humility penalise harm and betrayal; vows add a bounded goal weight (S7). There is no survival decision in v0 (see not_yet)"
learning = "n/a: minds v0 does not learn; memory and consolidation are P3.2b (RT-2026-10-16 item 6)"
prediction = "n/a: actors do not forecast; a consideration reads the present snapshot"
sensing = "Kin through the life-course columns and the living spouse at the same instant (derived from M2), house, seats, offices and claims at the start of the instant (lagged reads), deaths in the same instant, S7's vow conflict and S6's rumour reach at the start of the instant; a read of an absent owner is dropped by SPR-014's registration rule and its neutral value applies. From P1b an actor reacts only to events it holds a knowledge row for (SAGA-4, V-SAGA-18); in P1a it senses only its relations' deaths, which every kin knows by the death path"
interaction = "Lifecycle commands only (05.1 §2 rule 2): Marry and ScheduleDeath to M2; PetitionSeat, PressClaim, RenounceClaim and Resign to M7; SwearVow to S7 and Transfer, Search and Destroy to S6 (P1b). Applied from others: Promote and Demote (M7); AgendaGoal, ClearGoal, OpinionModifier, ApplyThought (S7); ApplyInfluence (S6). Social practices (RT-2026-10-16 item 10a) were evaluated and not adopted in v0: the six decision types already bound their candidate sets by the actor's situation (the row-5 guard), so a practice layer would add a mechanism with no band to earn its place (ADR-0033 §5); its natural first use is the inquest, an institution that waits for M6-lite"
stochasticity = "Keyed RNG only: trait draws, poll jitter, top-k selection, action order, break delay, break act, attempt outcome. Threshold crossings are deterministic"
collectives = "Houses and courts (M7) define the situation sets: the court of an actor is the named actors whose seats or offices share its top liege. Feuds are person-level at F1 (house feuds are F2)"
observation = "MENTAL_BREAK, MURDER_ATTEMPT, FLED, DESPAIR_PACT, FEUD_* events in channel A with motive edges (GRIEF_FOR, RETALIATION_FOR, AMBITION_FOR, JEALOUSY_OF, VOW_OF); stress as the anchored attribute stress(actor)@eN; motivated_by edges for every utility decision (V-COG-10); the stress accounting columns for V-SAGA-16"
era_state = []
scale_behaviour = "Identical at every N; cost scales with named actors and their bounded candidate sets (05.3 §3: about 2 ms per 5,000-actor decision wave). At micro scale (uz_job) one or two named minds carry the story; the break band reports INSUFFICIENT below 1,000 named-actor-years"

[initialization]
state = "World creation (journaled) names the cast and the members of great houses who meet M7's criteria (SIM-9). A named actor's traits and ambition come from the manifest's cast entry where given, else from trait_draw; stress 0, calm; liege and vassal rows from M7's titles (kinship is derived from M2 when read, so nothing is built for it); no opinion modifiers; first polls at poll_jitter offsets"
from_manifest = ["cast", "dynasties", "peoples"]

[input_data]
drivers = []

# ----------------------------------------------------------------------------- parameters (exactly the Registry's set)
[[params]]
name = "stress_threshold"
meaning = "Stress (0-100) at which a calm adult actor crosses into a pending break"
source = "design value (ADR-0035; 05.3 §2.1). Settled by the break band V-SAGA-16 on the kingdom ensemble and the director's reading of G1a histories"
[[params]]
name = "stress_decay"
meaning = "Stress removed per month (points), floored at 0"
source = "design value (ADR-0035). Settled with stress_threshold by V-SAGA-16"
[[params]]
name = "vow_conflict_gain"
meaning = "Stress per month at full vow conflict: vow_conflict_gain x min(1, sum of the actor's active vows' conflict) (P1b)"
source = "design value (ADR-0035; 05.3 §2.1). Settled by V-SAGA-16 and the G1b saga digests"
[[params]]
name = "break_delay_max_days"
meaning = "Upper bound of the keyed delay from a threshold crossing to the break (the delay is 1..this many days)"
source = "design value (ADR-0035). No band: it shapes pacing, not rates"
[[params]]
name = "grief_gain"
meaning = "Stress from the death of a relation of closeness 1 (parent, child, spouse); a relation of closeness c gives c x grief_gain"
source = "design value (RT-2026-10-16 item 1). Settled by the cascade scenario test and V-SAGA-16"
[[params]]
name = "grief_instant_cap"
meaning = "The most grief stress one actor takes in one instant, whatever the number of deaths (saturation per instant, RT-2026-10-16 item 1)"
source = "design value (RT-2026-10-16 item 1). The Registry bounds keep it below stress_threshold ([5, 45] against [50, 95]; MIN-5), so one massacre alone cannot push a calm actor at stress 0 over it"
[[params]]
name = "loyalty_conflict_gain"
meaning = "Stress per month while the actor serves (office under, or vassal of) a person it knows harmed its kin, with no active vow against that person (the vow's conflict covers that case, so the two never add) (P1b)"
source = "design value (ADR-0035 'being made to serve a father's murderer'). Settled by V-SAGA-16 and G1b readings"
[[params]]
name = "dissonance_gain"
meaning = "Stress from committing an act whose class [act_dissonance] ties to a trait: dissonance_gain x max(0, trait)/100 (value conflict); break acts never add dissonance"
source = "design value (ADR-0035 'a value conflicts with the situation'). Settled by V-SAGA-16"
[[params]]
name = "break_refractory_days"
meaning = "Days after a break during which stress still accrues but no new break is scheduled (per-actor refractory period, RT-2026-10-16 item 1)"
source = "design value (RT-2026-10-16 item 1). Settled by the cascade scenario test: an actor never breaks twice inside it"
[[params]]
name = "attempt_success"
meaning = "Chance that one MURDER_ATTEMPT kills its target"
source = "design value; no source on medieval assassination success read. Interacts with M7's background murder hazard (see couplings): settled by recalibrating murder_hazard_base so V-SF-06 holds coupled"
[[params]]
name = "trait_sd"
meaning = "Standard deviation of drawn traits and ambition, in points on their scales"
source = "design value; HEXACO scales have no natural unit on -100..100, so this is a mapping choice"
[[params]]
name = "iaus_top_k"
meaning = "How many best-scoring candidates the keyed weighted choice draws among (1 = argmax)"
source = "design value (05.3 §3; Dill's IAUS practice of weighted random among the top scores)"
[[params]]
name = "interrupt_daily_cap"
meaning = "Interrupt re-evaluations per actor per day (05.1 §4.3)"
source = "design value (05.1 §4.3; V-COG-03)"
[[params]]
name = "thought_cap"
meaning = "Upper bound on a thought's magnitude in trait points: an artifact or curse can shift what IAUS reads by at most this much per overlay"
source = "design value (RT-2026-10-16 item 8). Settled by V-SAGA-13 (b) and the corrupted-bearer readings at G1b"
[[params]]
name = "thought_decay"
meaning = "Trait points a thought loses per month without a refreshing command (a relic taken away loosens its hold)"
source = "design value (RT-2026-10-16 item 8)"
[[params]]
name = "marriage_min_age"
meaning = "Youngest age (years) at which an actor is a marry candidate or chooser"
source = "design value; canonical minimums of 12 and 14 are the lower end (not yet read from a source)"

# ----------------------------------------------------------------------------- submodels (ODD 7)
[[submodels]]
name = "grief"
summary = "In the Day/Vital binding of a death instant (a day start; round 3, BLK-1). The dead are the persons with alive = 0 and death_tick = now, readable until Bookkeeping of this instant (SPR-011 ruling 5; a read of a dead row after it is a bug), in ascending PersonId. For each dead d, the grievers are the named actors kin to d, derived through kin(d, 2), the effect-language relation (SPR-017, PR #41 §5.3) over M2's life_course.mother and life_course.father (so a grandparent is reached through a dead parent; round 4, NEW-1), plus the living spouse from person.spouse, (parents, children, spouse, siblings, grandparents, grandchildren; kin_other: uncles, aunts, nephews, nieces, first cousins), plus the holders of unended liege or vassal rows with b = d; a pair related in several ways counts its closest kind once. For each griever a: g_a = min(grief_instant_cap, sum over this instant's dead of grief_gain x closeness(kind)); stress_a := min(100, stress_a + g_a); stress_in += the applied amount; rows with b = d get ended_at := now. A child born after its parent's promotion is grieved like any other: kinship is read, not stored (MAJ-5); A dead named actor: cancel its polls, interrupts and break or refractory timer, end its feuds (FEUD_ENDED), keep its rows (no compaction). The deaths are M2's death timers in this Vital slot: every death, however caused, takes effect there (BCK-002 A-30)"
earns_its_place_by = ["V-SAGA-16", "V-SAGA-16b"]
[[submodels]]
name = "threshold"
summary = "For each actor changed in this binding: if adult (age >= marriage_min_age), break_state = calm and stress >= stress_threshold, then break_state := pending and a break timer is scheduled at (now + d days, Agenda) with d = 1 + break_delay draw mod break_delay_max_days; break_timer := its TimerId. A crossing is the false-to-true transition of (adult and calm and stress >= threshold); a minor's stress accrues and is evaluated at majority. Deterministic: no draw decides whether"
earns_its_place_by = ["V-SAGA-16"]
[[submodels]]
name = "apply_commands"
summary = "AgendaGoal{vow, holder, kind, target, priority}: upsert the goal row; ClearGoal{vow, holder}: delete the goal row (goals are agenda entries, not history; the vow keeps the history). OpinionModifier{holder, about, kind, magnitude?, source_event}: add a row expiring after the kind's months. ApplyInfluence{bearer, overlay, delta} and ApplyThought{holder, overlay, delta, source_event}: thought.magnitude := min(thought_cap, magnitude + delta x 100) (delta in overlay points, 0..1). An interrupt (re-evaluation at t + 1 day, within interrupt_daily_cap) follows a new goal or a new KIN_HARMED_BY or PASSED_OVER modifier"
earns_its_place_by = ["V-SAGA-13", "V-SAGA-03"]
[[submodels]]
name = "promote"
summary = "First Promote{person}: person.named := true; traits and ambition from the manifest or trait_draw (keyed by this instant, drawn once); stress 0 and the three accounting columns 0, calm; liege and vassal rows from M7's titles; first polls at poll_jitter offsets. Demote{person}: deferred while break_state is pending or refractory; else cancel the actor's timers, person.named := false, clear goals and thoughts; every mind row is kept (no history is compacted, ADR-0007). Re-promotion (round 3, MAJ-9): person.named := true and the kept rows are reused as they are, never redrawn: traits, ambition, stress and stress_in, stress_decayed, stress_relieved resume their kept values (no accrual, decay or relief applies while dormant, so INV-T1-01's identity holds across any number of promotions); expired opinions stay expired; liege rows are rebuilt; new polls at poll_jitter offsets keyed by the re-promotion instant"
earns_its_place_by = ["V-INV-12", "V-SAGA-16"]
[[submodels]]
name = "break_act"
summary = "When a break timer fires for actor a: the available acts are the [mental_breaks] entries whose needs a meets (stressor: the target of a's highest-conflict vow (P1b), else the culprit of a's most recent known kin harm (P1b), else a's active feud enemy with the lowest opinion; seat: a holds a title; kin: a living named relation; holdings: M4 registered). FLIGHT needs nothing, so the set is never empty. Weight of act k = clamp(1 + sum over traits of w_k,t x trait_t/100, 0.1, 2.0); the break_act draw picks one. Emit MENTAL_BREAK (motive edge to the crossing's cause) and the act's verb; apply its effects: MURDER_ATTEMPT on the stressor, break_outcome against attempt_success, success sends ScheduleDeath {victim = stressor, tick = the next day start, cause = murder, culprit = a, cause_event = the MURDER_ATTEMPT}; FLED sends Resign for each office of a (P1b: fugitive status via S3); HOLDINGS_BURNED destroys a's household stocks (M4, P1b); DESPAIR_PACT adds DESPAIR_PACT_WITH modifiers both ways with the stressed relation (an OpinionModifier self-send, applied at the next tick boundary) and sends RenounceClaim for a's claims. Then stress := max(0, stress - relief); stress_relieved += the applied amount; break_state := refractory; refractory_until := now + break_refractory_days; a refractory-end timer is scheduled"
earns_its_place_by = ["V-SAGA-16"]
[[submodels]]
name = "refractory_end"
summary = "At refractory_until: break_state := calm, break_timer := 0; if the actor is adult and stress >= stress_threshold, this is a crossing (threshold schedules the next break). Stress accrued during the refractory period is kept, so a still-overwhelmed actor breaks again, at most once per refractory period"
earns_its_place_by = ["V-SAGA-16"]
[[submodels]]
name = "decide"
summary = "Due decisions are polls (every poll_months of the type) and interrupts. Candidates come from the actor's situation only (GOV-003 §6 row 5): marry: unmarried named adults of the other sex, age >= marriage_min_age, in the actor's court or relation set, not parent, child or sibling; seek_office: vacant offices and seats held in demesne in the actor's court; press_claim: the actor's own active unpressed claims; feud: declare against persons the actor holds a negative opinion of in its court or relation set, attack an active feud's enemy, or reconcile; swear_vow (P1b): harms to the actor or its kin by a culprit it knows; pursue_goal (P1b): the next step toward each agenda goal. Every type also scores 'do nothing'. Score (round 3, MAJ-6) = the product, over the type's considerations in [decision_types], of response_curve(input), where each input is defined in the Registry's [considerations] (what it reads, its domain, its type) and each curve in [response_curves] (piecewise-linear, Q16_16 knots, clamped at the ends, output in [0, 1]); then the IAUS compensation for n considerations: score + (1 - score) x (1 - 1/n) x score, in Q16_16, rounded down. Traits are read through thoughts: effective trait = clamp(trait + clamped sum of thought deltas, -100, 100). 'Do nothing' scores the type's idle_score. Candidates are listed in ascending target id; the iaus_select draw chooses among the iaus_top_k best (ties in ascending target id). A feud attack's success is drawn with attack_outcome and kills through ScheduleDeath at the next day start. Scoring reads the start-of-Agenda snapshot; actions apply in action_order; an action whose read set an earlier write intersects and whose precondition now fails re-scores once, then defers to the next poll (05.1 §4.3). Each applied decision records its top contributors and margin as motivated_by edges; a chosen act whose class is in [act_dissonance] adds dissonance stress. Vow weight (goal.priority) is a consideration of pursue_goal only"
earns_its_place_by = ["V-COG-03", "V-COG-04", "V-COG-10", "V-SAGA-13", "V-SAGA-09"]
[[submodels]]
name = "stress_month"
summary = "For each named actor: s_vow = vow_conflict_gain x min(1, sum of vow.conflict over its active vows) (P1b); s_loy = loyalty_conflict_gain if it serves a known harmer of its kin with no active vow against them (P1b); stress := min(100, stress + s_vow + s_loy), then stress := max(0, stress - stress_decay); stress_in and stress_decayed take the applied amounts. All arithmetic in q8_8, saturating"
earns_its_place_by = ["V-SAGA-16"]
[[submodels]]
name = "expire"
summary = "Opinion modifiers whose expires <= now leave the sums (rows kept); each thought without a command this month loses thought_decay points, floored at 0"
earns_its_place_by = ["V-COG-01"]

# ----------------------------------------------------------------------------- invariants
[[invariants]]
id = "INV-T1-01"
statement = "For every mind at every tick boundary: stress = stress_at_creation + (stress_in - stress_decayed - stress_relieved)/256 exactly, and 0 <= stress <= 100"
test = "V-SAGA-16"
[[invariants]]
id = "INV-T1-02"
statement = "Each threshold crossing schedules exactly one break timer; a break timer fires at its own tick unless its actor died or went dormant first (then it is cancelled and counted as cancelled); break_state is pending exactly while that timer is live; every fired break's act is a [mental_breaks] entry"
test = "V-SAGA-16"
[[invariants]]
id = "INV-T1-03"
statement = "No break is scheduled while the actor is refractory; two breaks of one actor are at least break_refractory_days apart"
test = "V-SAGA-16"
[[invariants]]
id = "INV-T1-04"
statement = "The grief stress one actor takes in one instant is at most grief_instant_cap"
test = "V-SAGA-16"
[[invariants]]
id = "INV-T1-05"
statement = "Trait and ambition columns never change after a mind is created; each thought's magnitude stays in [0, thought_cap]"
test = "V-COG-01"
[[invariants]]
id = "INV-T1-06"
statement = "Opinion = clamp(sum of unexpired modifiers, -100, 100); an expired modifier never counts"
test = "V-COG-01"
[[invariants]]
id = "INV-T1-07"
statement = "Decisions happen only at polls and interrupts; an interrupt fires at t + 1 day or later; at most interrupt_daily_cap interrupts per actor per day and one re-score per actor per instant"
test = "V-COG-03"
