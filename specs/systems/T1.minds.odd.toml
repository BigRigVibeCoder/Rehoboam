direction = "in"
via = "the death path: deaths in the Vital slot of a day-start instant start grief in the same instant; the life-course mother and father give derived kinship (through the dead) and person.spouse marry eligibility. The dead row stays readable until rh-core compacts it at the start of Bookkeeping of the death instant (SPR-011 ruling 5); a read of a dead row after that instant is a bug"
