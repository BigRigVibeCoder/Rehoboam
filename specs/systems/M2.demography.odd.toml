# ODD-R v2 system spec (ADR-0033). Partial: the slice rung 0 (`solo`) needs. Births arrive with rung 1.
odd_r = 2

[system]
id = "M2.demography"
name = "Demography"
spec_version = "0.1.0"
fidelity = "F1"
status = "draft"
crate = "rh-sys-demography"
adrs = ["ADR-0003", "ADR-0025", "ADR-0026"]
requirements = ["DATA-8"]

[purpose]
statement = "Age every person, schedule deaths (and later births and marriages) as timers, and keep the life-course log."
role = "substrate"
patterns = [
  { test = "V-SF-02", pattern = "Child mortality to age 15 in the agrarian band", kind = "identity", role = "sole" },
  { test = "V-SF-02b", pattern = "Adult mortality shape on the Brass General Standard", kind = "identity", role = "sole" },
]
not_yet = ["Births, marriage and fertility (rung 1)", "Famine mortality coupling (M4 entitlement; V-SF-20b)"]

[[owns]]
column = "person.birth_tick"
entity = "person"
type = "i64"
plane = "A"
meaning = "Signed sim-time of birth (ADR-0026)"
fixed_point = false
[[owns]]
column = "person.sex"
entity = "person"
type = "enum"
plane = "A"
meaning = "male | female"
fixed_point = false
[[owns]]
column = "person.alive"
entity = "person"
type = "bool"
plane = "A"
meaning = "Living flag; the dead leave the live ledger through the lifecycle queue"
fixed_point = false
[[owns]]
column = "person.death_tick"
entity = "person"
type = "i64"
plane = "A"
meaning = "Scheduled death time (a timer until it fires)"
fixed_point = false
# Proposed with the T1.minds and M7.dynasty specs (PR #32; Architect round 1, Q4 and Q5). Genealogy and marriage
# belong to the rung-1/2 slice (P1.3: partnering, marriage, kinship); the ledger of 05.1 §5 lists mother and father.
# Marriage is decided by T1.minds and written by M2 when it applies T1's Marry command.
[[owns]]
column = "person.mother"
entity = "person"
type = "u64"
plane = "A"
meaning = "PersonId of the mother, or 0 for a founder or immigrant without one (ADR-0026); set at birth, never changed (P1.3)"
fixed_point = false
[[owns]]
column = "person.father"
entity = "person"
type = "u64"
plane = "A"
meaning = "PersonId of the father, or 0 when unknown or for a founder or immigrant without one; set at birth, never changed (P1.3)"
fixed_point = false
[[owns]]
column = "person.spouse"
entity = "person"
type = "u64"
plane = "A"
meaning = "PersonId of the living spouse, or 0; set when M2 applies a Marry command from T1.minds (P1.3), cleared on the spouse's death"
fixed_point = false
# Deaths of the current instant (Architect round 1, Q4). The dead leave the live ledger at once (P1.3), and SPR-006's
# AccessSpec has no event reads, so later-phase systems (M7, T1.minds) read the instant's deaths from this M2-owned
# accessor table rather than from the DEATH event or a column on a row that is gone. Rows are appended by the death
# path and dropped by M2 when it first writes at a later instant; readers read only rows whose tick is now. Plane A,
# never history: the life-course log keeps every death and its cause.
[[owns]]
column = "instant_death.person"
entity = "instant_death"
type = "u64"
plane = "A"
meaning = "PersonId of a person who died at instant_death.tick"
fixed_point = false
[[owns]]
column = "instant_death.cause"
entity = "instant_death"
type = "enum"
plane = "A"
meaning = "natural | murder | battle | execution | accident: natural for an M2 hazard death, otherwise the cause the ScheduleDeath command carried (M7, T1.minds; M8 later); also carried by the DEATH event"
fixed_point = false
[[owns]]
column = "instant_death.tick"
entity = "instant_death"
type = "i64"
plane = "A"
meaning = "The instant of the death; rows with a tick earlier than now are stale and never read"
fixed_point = false

[[emits]]
kind = "DEATH"
when = "The death timer fires; the event carries the cause (natural, or the ScheduleDeath command's cause and culprit)"

[scales]
spatial = "person"
temporal = "Month pulse; intra-month death times as timers"
extent = "every living person on the map"
restart = "Owned columns plus pending death timers restore the system exactly"

[[fidelity_ladder]]
level = "F1"
representation = "Per-person Brass relational-logit hazards (specs/demography)"
status = "target"

[[schedule]]
pulse = "Month"
phase = "Vital"
steps = ["ageing: nothing stored; age is derived from birth_tick", "mortality: sample this month's death times as timers", "fire due death timers"]
when = "always"

[[rng]]
purpose = "death_time"
key = ["person", "month"]
use = "Intra-month death time from the Brass hazard"

[design]
basic_principles = "Brass relational logit on the General Standard (Brass 1971; R12 §9)"
emergence = "Age structure and life expectancy emerge from per-person hazards"
adaptation = "n/a"
objectives = "n/a"
learning = "n/a"
prediction = "n/a"
sensing = "Era-state medical level (later); none at rung 0"
interaction = "None at rung 0"
stochasticity = "Keyed RNG only"
collectives = "Households (rung 1)"
observation = "Life-course log; DEATH events in channel A"
era_state = ["medical_level"]
scale_behaviour = "Identical at every N; statistical bands report INSUFFICIENT below their sample minimums"

[initialization]
state = "Cast and generated persons from the manifest with birth_tick from age_years"
from_manifest = ["peoples", "cast", "households"]

[input_data]
drivers = []

[[params]]
name = "e0"
meaning = "Life expectancy at birth, a convenience converted to brass_alpha at beta = 1"
source = "R12 §9"
[[params]]
name = "brass_alpha"
meaning = "Level of mortality on the logit scale"
source = "Brass 1971; observed -1.36 to 0.55"
[[params]]
name = "brass_beta"
meaning = "Slope (shape) of mortality on the logit scale"
source = "Brass 1971; observed 0.64 to 1.64"
[[params]]
name = "tfr"
meaning = "Total fertility rate (rung 1)"
source = "design range"
[[params]]
name = "eps_f"
meaning = "Fertility response to food entitlement (rung 1)"
source = "R09"
[[params]]
name = "eps_m"
meaning = "Mortality response to food entitlement"
source = "R09"
[[params]]
name = "elite_fertility_mult"
meaning = "Elite fertility multiplier (M6 coupling)"
source = "Turchin & Nefedov 2009; R12 §12"

[[submodels]]
name = "mortality"
summary = "Monthly hazard from the Brass life table at the person's age; the death time inside the month is a keyed draw"
earns_its_place_by = ["V-SF-02", "V-SF-02b"]

[[invariants]]
id = "INV-M2-01"
statement = "People are conserved: births - deaths = change in the living population, every month"
test = "V-DET-01"

[[couplings]]
system = "S5.daily_life"
direction = "out"
via = "S5 reads birth_tick, sex and alive at the start of each day"
lag = "start of day"

[isolation]                                # docs/09 V-SF-22
forcing = []                               # the rung-0 slice reads no other system
horizon = "1,000 sim-years"
expect = "n/a until the entitlement hook (P1.5): then a constant, a sine and a step food-entitlement series, with survival over 1,000 years and mortality inside the V-SF-03 bands"

[verification]
tests = ["V-SF-02", "V-SF-02b", "V-DET-01"]
prototype = "specs/demography/selftest_brass.py"
