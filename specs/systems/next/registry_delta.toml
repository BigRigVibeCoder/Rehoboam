# Registry delta for the next-version M2 spec (specs/systems/next/M2.demography.odd.toml, 0.3.0 draft; SPR-015) and the next M7
# (specs/systems/next/M7.dynasty.odd.toml, 0.6.0 draft; T-00a): M7 adds no verb and gains its sixteen parameter defaults (below).
# Linted with: python -I specs/systems/lint_odd.py --next specs/systems/next --overlay specs/systems/next/registry_delta.toml
# In --next mode (specs/systems/next/README.md) an overlay may REPLACE the Registry's [systems] entry of a system that
# has a next-version spec, keeping its fidelity_levels and every existing parameter's bounds and default (the lint
# checks that), and may add [verbs]. When 0.3.0 is frozen the Architect merges this file into
# specs/manifest/registry_v0.toml and deletes it. Nothing here is read by the engine, the manifest validator or the
# frozen 0.2.0 lint until then.

[systems."M2.demography"]
fidelity_levels = ["F0", "F1", "F2"]
# Unchanged bounds (specs/manifest/registry_v0.toml) plus F1 mortality's two parameters (SPR-016). F1 reads tfr and
# elite_fertility_mult (SPR-015), brass_beta at any value, density_capacity and density_mortality_slope (SPR-016);
# brass_alpha stays refused, eps_f and eps_m stay unread (P1.5a).
params = { e0 = [20.0, 85.0], brass_alpha = [-2.1, 0.75], brass_beta = [0.6, 1.65], tfr = [1.2, 7.5], eps_f = [0.1, 1.0], eps_m = [0.5, 3.0], elite_fertility_mult = [1.0, 1.6], density_capacity = [1, 10000000], density_mortality_slope = [0.0, 3.0] }
# F1 mortality (SPR-016; [algorithm.mortality_f1] MR11): density_capacity is a count (integer bounds), density_mortality_slope a
# q16_16; both defaults are design values that leave every P1a world untouched (the capacity is the manifest's maximum population).
# F1 defaults (SPR-011 ruling 8: a default arrives with the sprint that first reads the parameter). tfr = 4.9 and
# elite_fertility_mult = 1.0 are design values; the spec's [[params]] states why ([algorithm.fertility_f1] F2, F3).
defaults = { e0 = 30.0, brass_beta = 1.0, tfr = 4.9, elite_fertility_mult = 1.0, density_capacity = 10000000, density_mortality_slope = 1.0 }

[systems."M7.dynasty"]
# The next M7 (0.6.0; K3 of REV-WAVE7 with the Architect's re-check ruling R3, 2026-10-18): the Registry entry kept as it is (levels,
# hazards, every bound), plus a default for each of the sixteen parameters other than majority_age, at twin_vales.yaml's values, mirrored
# as `default` in the spec's [[params]] (the lint checks both ways). majority_age stays required (REV-SPR-019 R15). The two counts have
# integer bounds and defaults (F-6). SPR-021a T-01 moves these lines into registry_v0.toml with no registry_version bump (X6).
fidelity_levels = ["F0", "F1"]
hazards = ["regicide", "deposition", "successor_purge", "succession_crisis", "extinction"]
params = { murder_hazard_base = [0.001, 0.03], deposition_hazard_ref = [0.01, 0.05], primogeniture_hr = [0.2, 0.55], seniority_hr = [1.3, 2.6], predecessor_killed_or = [1.5, 3.5], predecessor_deposed_hr = [1.3, 2.0], exec_constraint_hr = [0.3, 1.0], majority_age = [12.0, 21.0], arb_legal_weight = [0.0, 1.0], arb_claim_weight = [0.0, 1.0], arb_military_weight = [0.0, 1.0], arb_treasury_weight = [0.0, 1.0], contest_margin = [0.0, 1.0], interregnum_max_days = [7, 730], dormancy_degrees = [1, 6], vocation_holy_orders = [0.0, 0.6], vocation_mercenary = [0.0, 0.6] }
defaults = { murder_hazard_base = 0.01, deposition_hazard_ref = 0.03, primogeniture_hr = 0.3, seniority_hr = 2.0, predecessor_killed_or = 2.8, predecessor_deposed_hr = 1.7, exec_constraint_hr = 0.5, arb_legal_weight = 1.0, arb_claim_weight = 0.6, arb_military_weight = 0.3, arb_treasury_weight = 0.3, contest_margin = 0.5, interregnum_max_days = 180, dormancy_degrees = 2, vocation_holy_orders = 0.2, vocation_mercenary = 0.15 }

[verbs]
# 05.2 §4.0: "P1.3 adds births and marriages (birth, marry)". Tellability priors are design values (DEATH is 128).
BIRTH    = { act_classes = ["birth"], emitted_by = "M2.demography", tellability = 96 }     # actor: the mother; target: the child; payload [sex, birth order]
MARRIAGE = { act_classes = ["marry"], emitted_by = "M2.demography", tellability = 112 }    # actor: the husband; target: the wife; payload []
