# Registry delta for the next M7 (specs/systems/next/M7.dynasty.odd.toml, 0.6.0 draft; T-00a, then T-00b):
# M7 adds no verb and no enum and gains its sixteen parameter defaults (below).
# Linted with: python -I specs/systems/lint_odd.py --next specs/systems/next --overlay specs/systems/next/registry_delta.toml
# In --next mode (specs/systems/next/README.md) an overlay may REPLACE the Registry's [systems] entry of a system that
# has a next-version spec, keeping its fidelity_levels and every existing parameter's bounds and default (the lint
# checks every parameter's bound against the spec's [[params]]; RUN-001 §2).
# An overlay may also add a verb or a noun (the spec's [[emits]] and [[nouns]]) to the next Registry.
# The delta is applied in memory by tools that take --overlay; it is never written to specs/manifest/registry_v0.toml, and
# is deleted when its last section has moved. Nothing here is read by the engine, the manifest validator or the frozen lint
# until its section is merged.

