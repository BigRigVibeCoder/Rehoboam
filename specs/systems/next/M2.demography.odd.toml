to = "S12 apply_death(person, cause, culprit, cause_event), in fire at the timer's instant (Vital) or in the Day/Vital drain for a ScheduleDeath (F1; EVO-001). If the person's ledger row is absent (compacted after an earlier death) or has alive = 0 (died earlier in this slot, by another timer or a command), the death is dropped and counted per (source, reason), never applied: the single death path never kills twice and never writes a closed life-course row (REV-SPR-015 R13). Otherwise: person.alive := 0; person.death_tick := now; person.death_cause := cause (natural for an M2 timer, the command's cause for a ScheduleDeath); on the person's open life_course row: exit_kind := death, exit_tick := now, death_cause := cause (each written once; rh-core refuses a second write, ruling 5); for a commanded death, cancel the person's own pending DEATH_TIMER, if any, through StepCtx::own_timers and cancel (a cancellation takes effect from the next slot; one already in this slot meets alive = 0 above); emit DEATH (target = person; actor = culprit for a commanded death with culprit != 0, else none; payload [cause code]; one triggered edge from cause_event when it is not 0, none otherwise); then, if no ledger row has alive = 1, no row was inserted earlier in this step, and no BIRTH_TIMER due in this slot has a mother whose row is present (F9 will bear that child), emit EXTINCTION with the DEATH as its cause. The dead row stays readable until rh-core's compaction at the start of Bookkeeping of this instant."
reason = "R13: a death timer or ScheduleDeath for an absent or already dead row is dropped and counted (no double death, no SimError); a commanded death carries its culprit as actor and its cause_event as cause, and cancels the victim's own later death timer; the EXTINCTION test counts the slot's newborns, born or due (MIN-3, R17.1). The table's version moves to m2-rung0-v1.1; S0-S11 and every check value are unchanged (R17.4)"
