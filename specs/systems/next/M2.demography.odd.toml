# M4.economy's in-coupling (the household entitlement ratio of [algorithm.mortality_f1] MR11 and of fertility's hook: a
# survival factor 1 - q'' = (1 - q') (y / y*)^eps_m, clamped to 1 at y / y* >= 1, data range y / y* in [0.3, 3], R12
# §17-18) comes with M4's first spec (P1.5a; REV-SPR-016-FOLD R2), with its isolation forcing (constant 1.0, then
# sine:[0.6, 1.4]/7y and step:1.0->0.4@year50/2y for V-SF-20b).

[isolation]                                # docs/09 V-SF-22
forcing = [
  { input = "person.named", series = "constant:0", note = "no T1: M2 marries everyone" },
  { input = "person.vocation", series = "constant:none", note = "no M7: nobody in holy orders" },
  { input = "house_member.person", series = "constant:0", note = "no M7: no house members (0 = no row, the typed neutral); and a step series that marks 10% of women members with elite_fertility_mult = 1.3, for the multiplier's arithmetic" },
  { input = "person.residence", series = "constant:0", note = "no S3: one pool; and a step series that splits the founders into two settlements and gives every newborn its mother's value at its birth (emulating S3 F0's residence at birth, so the forcing holds for every generation: REV-SPR-015 R17.6), under which no M2-drawn marriage row pairs two settlements" },
]
horizon = "1,000 sim-years"
expect = "F1 in isolation is the whole P1a demography. (1) A 1,000-founder population (ages uniform in [0, 60), e0 = 30, tfr = 4.9, 32 seeds) neither dies out nor exceeds 5 x its start over 1,000 years, with the seed-mean r inside V-SF-01's band (the reference's widowhood chain puts it near +0.11% a year); (2) REPORTED, not gated, until the director's Q6 (REV-SPR-015 R17.3): conceptions per susceptible woman-month, by band at conception, measured by a plane-A observer of the fertility step (the declared aggregates: conceptions and susceptible woman-months per band, split by the level table used, since a woman under the elite forcing draws at c_i^e), sit inside the binomial 99.9% interval of c_i; and births per married woman-year, banded by the mother's age at the birth instant (married woman-days by her age each day), over M n(a), lie within 5% (15% at 45-49) of the chain's per-band values with mortality and widowhood (the spec's report_ratios; REV-SPR-015 MIN-2, round 3 MIN-2) (V-SF-24; INSUFFICIENT below 400 conceptions); (3) GATED in every run by INV-M2-13 (round 3 MIN-3): under the two-settlement forcing no marriage row with source = partnering pairs two non-zero settlements, in any generation, so a broken filter fails G1a; and REPORTED, not gated, until Q6: women's mean age at first marriage in [18, 22], at least 90% ever married by 50, every born row has a father (V-SF-25); (4) q(15) of the birth cohorts stays in V-SF-02's band (the rung-0 schedule, unchanged); (5) the three rung worlds: solo dies out (one woman, no husband); household dies out in every replica over the horizon (the reviewer's 5,000-replica model at e0 = 30, tfr 4.9: alive at 50 years 96%, at 100 years 39%, at 200 years 3%, at 1,000 years none, median extinction year 88, a non-genesis marriage in 81%: REV-SPR-015 MIN-5), so rung 1's expectation is extinction and the test is the distribution of extinction times, not persistence (R17.5); hamlet persists or dies out by chance (V-SCALE-04 still holds when they do)"

[verification]
tests = ["V-SF-01", "V-SF-02", "V-SF-02b", "V-SF-24", "V-SF-25", "V-INV-01", "V-INV-03", "V-INV-08", "V-INV-12", "V-DET-12", "V-DET-14", "V-DET-17", "V-DATA-04", "V-DATA-05", "V-SCALE-04"]
