# ODD-R v2 system spec (ADR-0033). M2 F1, spec 0.3.0 DRAFT, round 3 (SPR-015; PRJ-002 §6 "M2 F1: fertility, partnering,
# households, kinship"; REV-SPR-015 rulings R1-R18 applied; shape (b) of REV-EVO-001 R9 for commanded outcomes): births by age-specific fertility, partnering
# (fathers), households and the kinship the effect language walks, added on top of the frozen rung-0 slice.
#
# HOW THIS FILE RELATES TO THE FROZEN ONE (lint_odd.py --next; specs/systems/next/README.md). specs/systems/M2.demography.odd.toml
# is 0.2.1 (0.2.0 frozen 2026-10-16, D30/D36; 0.2.1 by EVO-001, PR #49: typed payloads, codes, no date on a command); SPR-012 and SPR-013 built against it and its skeleton is committed. This file
# is its next version. It is linted with `python -I specs/systems/lint_odd.py --next specs/systems/next --overlay
# specs/systems/next/registry_delta.toml`, which supersedes 0.2.0 by this file for that run (so M7 and T1's reads and
# commands are checked against it) and then checks that the frozen slice is preserved: every 0.2.0 [[owns]] column with
# the same entity, type, plane and fixed_point; every 0.2.0 [algorithm.*] table byte for byte (mortality_rung0 below is
# the frozen text except its amended S2 and S12); the 0.2.0 [[rng]] purposes as a prefix, in order, with the same key, resample_on_fork
# and draws (so RngPurpose discriminants of the generated skeleton do not move); every 0.2.0 [[invariants]] id with the
# same statement and test; every 0.2.0 [[applies]] command with the same payload and at least the same senders; every
# 0.2.0 schedule binding with its steps, [[emits]] kind with its `when` text, the [initialization] text; every 0.2.0
# parameter with its default. Where F1 must change a frozen sentence it does so through a [[amends]] record (REV-SPR-015
# R1): the frozen text byte for byte, the new text and a reason, all checked by the lint, which prints each amendment.
# This draft amends: INV-M2-03 (birth timers cross Month pulses), S2 (F1 compiles tfr and elite_fertility_mult; at F1
# mortality brass_beta takes any value in the bounds and the two density parameters are compiled, SPR-016), S12
# (dead-row drops, a commanded death's actor and cause, the newborn-aware EXTINCTION test; the table's version moves to
# m2-rung0-v1.1, its arithmetic S0-S11 untouched), EXTINCTION's `when`, the [initialization] text, the meanings of
# seven frozen columns and the meanings of seven frozen parameters (e0's by the mortality fold). Everything else of
# rung 0 is byte for byte the frozen text. 0.3.0 IS PROMOTED IN SPR-016's PR, which merges after SPR-015's
# (REV-SPR-016-FOLD R3): there the Architect moves this file over the frozen one (a C2 change inside SPR-016's C3 PR),
# merges registry_delta.toml into registry_v0.toml, regenerates the skeleton (bin/gen_skeletons.py) and freezes 0.3.0;
# `next/` is then empty again. SPR-015 builds against this draft under the interim rule of [algorithm.parameters_f1]
# P1: until SPR-016's code lands, F1 runs mortality_rung0 for everyone and rh-manifest refuses brass_beta != 1.
#
# F1 MORTALITY (SPR-016; PR #51 merged at 513e281, folded here after PR #50). [algorithm.mortality_f1] (steps MR0-MR13)
# is a new table beside the frozen mortality_rung0: Brass at any (alpha, beta) through the fixed-point exp and ln of
# 05.1 §6 item 4 (v1.10), the infant sub-schedule below 1, the logistic old-age tail above 90, the density modifier and
# the entitlement hook, whose read of M4's household entitlement ratio is deferred to M4's first spec (P1.5a;
# REV-SPR-016-FOLD R2: its neutral cannot be typed before M4 declares the column). At F1 the crate computes the month's probability by that table; rung 0's table stays
# the frozen statement SPR-012 built against, and is the beta = 1, under-capacity, ages 1 to 90 case of the new one,
# which the mortality reference proves bit for bit. The fold amends nothing frozen but S2's last sentences (brass_beta
# at F1) and the meanings of e0, brass_alpha, brass_beta, eps_f and eps_m, each through its [[amends]] record below; death_time
# keeps position 0 of [[rng]] with its frozen key and draws; apply_death stays the single death path (S12 then H4).
# The narrative (the seam with births, the join at 90, the design values DV-SPR016-1 to 4 and their confidences) is
# docs/05_architecture/systems/M2.demography_F1.md §8.
#
# EVERY NUMBER IN THIS FILE IS EITHER CITED OR A DESIGN VALUE, AND SAYS WHICH. The exact references
# specs/demography/selftest_m2_f1.py (births, partnering) and specs/demography/selftest_m2_f1_mortality.py (mortality)
# reproduce every F1 integer below and assert the check values.
odd_r = 2

[system]
id = "M2.demography"
name = "Demography"
spec_version = "0.3.0"
fidelity = "F1"
status = "draft"                           # next version of the frozen 0.2.0 (specs/systems/next/README.md)
crate = "rh-sys-demography"
adrs = ["ADR-0003", "ADR-0006", "ADR-0007", "ADR-0024", "ADR-0025", "ADR-0026"]
requirements = ["DATA-8", "SIM-5", "SIM-6", "SIM-8", "SIM-9", "DET-13"]

[purpose]
statement = "Age every person, schedule deaths, births and marriages as timers, keep households, and keep the life-course log and the marriage log of everyone who ever lived: the genealogy every kinship relation walks."
role = "substrate"
patterns = [
  { test = "V-SF-02", pattern = "Child mortality to age 15 in the agrarian band", kind = "identity", role = "sole" },
  { test = "V-SF-02b", pattern = "Adult mortality shape on the Brass General Standard", kind = "identity", role = "sole" },
  { test = "V-SF-24", pattern = "Conceptions per susceptible married woman-month equal the band's c_i; the Coale-Trussell shape of births by age is reported against the chain's exact values", kind = "identity", role = "sole" },
  { test = "V-SF-25", pattern = "Early, near-universal female marriage (the F1 nuptiality standard) and fathers for every birth", kind = "identity", role = "sole" },
  { test = "V-SF-01", pattern = "Long-run growth of a closed population inside the pre-modern band, from births and deaths alone", kind = "emergent", role = "sole" },
  { test = "V-SF-18", pattern = "Household size and the share of complex households (soft; Laslett and Hajnal unread)", kind = "emergent", role = "contributing" },
]
not_yet = [
  "Density and entitlement modifiers of fertility and mortality (R09 §2; V-SF-20b). Mortality's density term is live in [algorithm.mortality_f1] MR11, on the world's density_capacity until M1 F0 / M3 give a settlement capacity (SPR-018, P1b); fertility's density term, R09 §2's b (1 - x), has no step at F1. The entitlement term of both is stated in form (MR11 for mortality; one Q16_16 factor on [algorithm.fertility_f1]'s level M for fertility, its step in P1.5a), but the read of M4's household entitlement ratio that feeds them is deferred to M4's first spec (P1.5a): its neutral cannot be typed before M4 declares the column (REV-SPR-016-FOLD R2), so both factors are exactly 1 in P1a; eps_f and eps_m get their defaults then",
  "Mortality in the month of birth, interim: until SPR-016's code lands, F1 runs [algorithm.mortality_rung0] for everyone, newborns included ([algorithm.parameters_f1] P1), so a newborn is first drawn at its first Month pulse and the days from its birth to that pulse are not exposed (at rung 0 and e0 = 30 about 1.2 points of q0 = 0.283; REV-SPR-015 MIN-7). [algorithm.mortality_f1] MR10 and MR12 close the gap when SPR-016 merges",
  "Era-state level shifts (05.1 §3.1; ADR-0027): medical_level and sanitation_level (S2.technology, P1b) move alpha; F1 applies them as K_eff = K exp(2 delta_alpha) through 05.1 §6 item 4's exp, recomputing [algorithm.mortality_f1] MR6-MR8 when the era state changes. Not read in P1a: S2 has no owner",
  "Maternal mortality, stillbirth and twins: not modelled (a birth is always one live child; the mother's death is the ordinary schedule). When maternal mortality comes (F2) it is mortality's: a new purpose keyed by (the mother, the birth instant), applied through apply_death after the birth timer (F10's order), so the child is born first; death_time's CRN rule is untouched",
  "Sex-specific mortality schedules: Brass's Table 8 differentials (p. 86) are not applied; both sexes run the same (alpha, beta). A P1b item if V-SF-02b or the harness (SPR-028) needs it",
  "Minute-level death times (BCK-002 A-35): [algorithm.mortality_f1] MR12 keeps rung 0's day starts",
  "The sawtooth of linear-l interpolation between grid points (rung 0's S7, kept by F1 on ages 1 to 90): monthly q steps at every grid boundary (at e0 30, beta 1: under 7 percent from 50 to 72.5, -11.5 at 75, -22 at 77.5, -20 at 80, -27 to -36 from 82.5 to 87.5, -31 at the tail's join at 90; in childhood -57 at age 2 and -43 at 3; at e0 85 the teeth run the other way, +17 to +56 from 50 to 87.5; the mortality reference prints the old-age ones; BCK-002 A-48's figures). BCK-002 A-48, a smooth C1 logit interpolant into monthly knots from age 1, is a decision at SPR-016's planning: it trades the beta = 1 equality with rung 0 for a schedule without teeth",
  "Parity-specific fertility control (Coale-Trussell m > 0), the Hajnal marriage market (age-at-marriage as a manifest culture setting), divorce, polygyny, adoption and legitimacy: F2 (05.1 §3)",
  "Remarriage at its own rate: F1 draws a widow at the first-marriage rate of her age (design simplification, decision F1-D7)",
  "Immigration and off-map materialisation (H64(seed, immigrant, origin, t, k)): P4 with S3 F1",
]

# ----------------------------------------------------------------------------- the live ledger (person.*)
# SPR-011 ruling 5: the ledger exists when person.id is registered. rh-core keeps every person.* column aligned and sorted
# by person.id, whoever owns it. A dead row leaves at once: rh-core's compaction pass at the start of Bookkeeping of the
# death instant removes every row with person.alive = 0 from every person.* column, before invariants and hashes. Until
# then the dead row is readable by every system (M7 and T1.minds read it at Polity and Agenda of the same instant).
# F1 (SPR-015): a row ENTERS through SPR-014's row insert (05.1 §2 rule 2; [algorithm.fertility_f1] F9): apply_birth hands
# rh-core one complete row of M2's columns; rh-core inserts it into every person.* column, M2's with the given values and
# every other owner's with the zero of its type (0, false, enum code 0), keeping the sort, at the merge of M2's level in
# Vital, so every later phase of the birth instant reads the newborn (M7 on_birth at Polity, T1 at Agenda).
[[owns]]
column = "person.id"
entity = "person"
type = "u64"
plane = "A"
meaning = "PersonId (ADR-0026): the ledger key. Founders get founder(seed, k) with the deterministic rehash (ruling 10); births H64(mother, parity) with the same rehash ([algorithm.fertility_f1] F9; rh-ids person/child/v1). Rows are sorted ascending by it; it is never reused"
fixed_point = false
[[owns]]
column = "person.birth_tick"
entity = "person"
type = "i64"
plane = "A"
meaning = "Signed sim-time of birth in minutes (ADR-0026); negative for founders born before the epoch; the birth instant (a day start) for a birth. Never changes"
fixed_point = false
[[owns]]
column = "person.sex"
entity = "person"
type = "enum"
values = ["male", "female"]
plane = "A"
meaning = "male | female (codes 0, 1). Drawn at birth (F9, purpose birth_sex). Never changes"
fixed_point = false
[[owns]]
column = "person.alive"
entity = "person"
type = "bool"
plane = "A"
meaning = "1 on every ledger row except the dead of the current instant: apply_death writes 0, and rh-core's compaction at the start of Bookkeeping of that instant removes the row (SPR-011 ruling 5). A row with alive = 0 never survives an instant"
fixed_point = false
[[owns]]
column = "person.death_tick"
entity = "person"
type = "i64"
plane = "A"
meaning = "i64::MAX while alive; the death instant (minutes), written once by apply_death together with alive = 0. The pending death time is a timer in the agenda, never this column"
fixed_point = false
[[owns]]
column = "person.mother"
entity = "person"
type = "u64"
plane = "A"
meaning = "PersonId of the mother, or 0 for a founder or immigrant without one (ADR-0026); set at birth (F9) or at genesis for a manifest household's children ([initialization]), never changed"
fixed_point = false
[[owns]]
column = "person.father"
entity = "person"
type = "u64"
plane = "A"
meaning = "PersonId of the father: the mother's husband at conception (F7 records him in the timer, so a posthumous child keeps its father); 0 when unknown or for a founder or immigrant without one; set at birth or at genesis, never changed"
fixed_point = false
[[owns]]
column = "person.spouse"
entity = "person"
type = "u64"
plane = "A"
meaning = "PersonId of the living spouse, or 0. Written by apply_marry ([algorithm.partnering_f1] N7), whether the marriage came from M2's own partnering timer or from T1.minds' Marry command; cleared by apply_death on the spouse's death ([algorithm.households_f1] H4). Symmetric: a.spouse = b iff b.spouse = a (INV-M2-08). Genesis marries a manifest household's head to its one adult cast member of the other sex ([initialization])"
fixed_point = false
[[owns]]
column = "person.death_cause"
entity = "person"
type = "enum"
values = ["none", "natural", "murder", "battle", "execution", "accident"]
plane = "A"
meaning = "none | natural | murder | battle | execution | accident (codes 0-5); none while alive. Written by apply_death with alive = 0 and the death tick: natural for an M2 hazard death, otherwise the cause the ScheduleDeath command carried (M7, T1.minds; M8 later; P1.13). Readable, like every column of the dead row, until rh-core's compaction at the start of Bookkeeping of the death instant (SPR-011 ruling 5); the life-course log keeps it after that"
fixed_point = false
# F1 columns (SPR-015).
[[owns]]
column = "person.household"
entity = "person"
type = "u64"
plane = "A"
meaning = "HouseholdId of the household the person belongs to (never 0 for a living person: INV-M2-09). The mother's at birth (F9), the manifest's or a one-person household at genesis, moved by apply_marry (N7) and by the dissolution rule (H4). 05.1 §5's ledger column `household u64`"
fixed_point = false
[[owns]]
column = "person.parity"
entity = "person"
type = "u16"
plane = "A"
meaning = "Live births this person has given: the next child's parity for H64(mother, parity) (rh-ids: 0 for her first). Incremented by apply_birth (F9); at genesis the count of her genesis children (a manifest household's whose mother she is, H2; SPR-019's synthesised or back-filled, P10 and B11), else 0. Always 0 for a male"
fixed_point = false
[[owns]]
column = "person.last_birth_tick"
entity = "person"
type = "i64"
plane = "A"
meaning = "Instant of this person's last live birth as a mother; i64::MIN when none. At genesis, the latest birth tick of her genesis children (SPR-019 P10 and B11, decision D-11: a mother of an infant is not susceptible at the first pulse; a founder with no genesis child is susceptible from the epoch). Written by apply_birth (F9); read by the fertility step for the postpartum closed period (F5)"
fixed_point = false
[[owns]]
column = "person.conceived_tick"
entity = "person"
type = "i64"
plane = "A"
meaning = "The Month pulse instant t_m at which this woman's pending pregnancy was conceived; i64::MIN when she is not pregnant. Written by the fertility step with the birth timer (F7), never touched by a re-sample (a re-sample moves the timer, not the pregnancy: REV-SPR-015 R2), cleared by apply_birth (F9). The fertility step reads it for 'pregnant' (F5); INV-M2-10 ties it to the one pending BIRTH_TIMER"
fixed_point = false
[[owns]]
column = "person.unborn_father"
entity = "person"
type = "u64"
plane = "A"
meaning = "PersonId of the father of this woman's pending pregnancy: her spouse at the conception pulse (F7); 0 when she is not pregnant. apply_birth reads it (F9), so a child born after its father's death keeps him; a re-sample never changes it. Never 0 while conceived_tick != i64::MIN (a conception needs a husband)"
fixed_point = false

# ----------------------------------------------------------------------------- households (household.*; F1)
# Minimal households (ADR-0026 item 4; 05.1 §3 "households (minimal)"): a row per household ever formed, kept sorted
# ascending by household.id like the ledger, never removed (a dissolved household keeps its row with dissolved_tick set,
# so a reader of a dead parent's household still finds it; the table grows by about one row per marriage).
# Membership is person.household. [algorithm.households_f1] states formation, headship and dissolution.
[[owns]]
column = "household.id"
entity = "household"
type = "u64"
plane = "A"
meaning = "HouseholdId = H64 over the rh-ids domain tag rehoboam/rh-ids/household/v1 of [founding head PersonId, formation tick as u64] (05.2 §1: H(founding member id, formation tick)); genesis households use formation tick 0. rh-ids adds the layout with golden vectors in SPR-015 (bin/gen_rng_golden.py). Never reused; a collision is a load error (the pair is unique by construction)"
fixed_point = false
[[owns]]
column = "household.head"
entity = "household"
type = "u64"
plane = "A"
meaning = "PersonId of the head: the husband at formation (N7), the manifest's head at genesis; on the head's death the surviving spouse if a member, else the oldest living member (H4). 0 once dissolved"
fixed_point = false
[[owns]]
column = "household.formed_tick"
entity = "household"
type = "i64"
plane = "A"
meaning = "The marriage instant that formed it; 0 for a genesis household of H2 or of SPR-019's P8 and P11; the pre-epoch marriage tick for a back-filled one (SPR-019 B5). Never changes"
fixed_point = false
[[owns]]
column = "household.dissolved_tick"
entity = "household"
type = "i64"
plane = "A"
meaning = "i64::MAX while a living person belongs to it; written once, with the instant, when the last member dies (H4) or when its head marries into another household and takes the members along (N7)"
fixed_point = false

# ----------------------------------------------------------------------------- the marriage log (marriage.*; F1)
# ADR-0026 item 3: the life-course log has interval tables for residence, occupation, faction and marriage. The marriage
# log is the marriage interval table in plane A: one row per marriage, append-only in apply order (N7), end_tick written
# once (H4). The chronicle's life_interval rows of kind 3 (schema.sql) are derived from it, two per row. In P1a every
# marriage is also a MARRIAGE event row (05.2 §4.0: every P1a world is under the tellability ceiling); a channel-A
# record kind for marriage spells at scale is deferred to P1.11 (REV-SPR-015 R11, Q4; channel A v0 reserves kind 7 for
# residence intervals, SPR-013).
[[owns]]
column = "marriage.husband"
entity = "marriage"
type = "u64"
plane = "A"
meaning = "PersonId of the husband (the male party; apply_marry normalises the order)"
fixed_point = false
[[owns]]
column = "marriage.wife"
entity = "marriage"
type = "u64"
plane = "A"
meaning = "PersonId of the wife"
fixed_point = false
[[owns]]
column = "marriage.start_tick"
entity = "marriage"
type = "i64"
plane = "A"
meaning = "The instant apply_marry applied it (a day start); 0 for a manifest household's genesis marriage (H2) or a synthesised couple's (SPR-019 [algorithm.population_synthesis] P8: the pre-epoch date is not known); the pre-epoch marriage tick for a back-filled couple (SPR-019 [algorithm.dynastic_backfill] B5)"
fixed_point = false
[[owns]]
column = "marriage.end_tick"
entity = "marriage"
type = "i64"
plane = "A"
meaning = "i64::MAX while both live; the death instant of the first spouse to die, written once by apply_death (H4). F1 has no other ending (no divorce)"
fixed_point = false
[[owns]]
column = "marriage.source"
entity = "marriage"
plane = "A"
type = "enum"
values = ["genesis", "partnering", "command"]
meaning = "genesis | partnering | command (codes 0-2): who made the marriage. genesis: the manifest couple (H2); partnering: M2's own timer (N3-N6, apply_marry with source = M2); command: a sender's Marry applied by the drain (N7). INV-M2-13 binds partnering rows only (REV-SPR-015 round 3 MIN-3)"
fixed_point = false

# ----------------------------------------------------------------------------- the life-course log (life_course.*)
# Everyone ever born, founded or immigrated (05.1 §7; ADR-0026; DATA-8). SPR-011 ruling 5: append-only. A row is appended
# once, when the person enters the world (genesis for founders, birth, immigration), and its exit fields (exit_kind,
# exit_tick, death_cause) are written once, when the person leaves; rh-core refuses any other write. Row order is entry
# order: at genesis the founders in ascending PersonId; later, the order of the entering events. The log is never
# compacted (ADR-0007): it is the plane-A record of who lived. Channel A carries it as LIFE_ENTRY and LIFE_EXIT records
# (specs/stream/channel_a_v0.sql); the chronicle's life_course table is their join.
# The genealogy of everyone (ADR-0026 item 3; round 4 of PR #32, NEW-1): the live ledger holds only the living and is
# compacted at Bookkeeping of a death instant (SPR-011 ruling 5), so kinship through the dead (T1.minds, M7.dynasty) walks
# life_course.person_id, mother, father and sex, never person.*. mother, father and sex are set once, at entry (sex as person.sex): 0 for
# founders (pre-epoch rows appended at genesis), the parents for births (F9).
# F1 confirms what the effect language's genealogy prelude (specs/registry/effect_language_v0.md §5.3; SPR-017) needs
# from this log, and nothing more: person_id, mother, father (the walks), birth_tick (sibling order; ties by person_id,
# which F1 never produces for one mother: one birth per mother per instant) and sex (cognatic eligibility), plus the
# ledger's person.alive for lineage pruning. Every birth writes all five at entry (REV-P1a NEW-7). The genealogy is
# acyclic by construction: a parent's birth_tick is at least 15 years below a child's (INV-M2-06).
[[owns]]
column = "life_course.person_id"
entity = "life_course"
type = "u64"
plane = "A"
meaning = "PersonId of the person the row records; unique in the log"
fixed_point = false
[[owns]]
column = "life_course.origin"
entity = "life_course"
type = "enum"
values = ["born", "founder", "immigrant"]
plane = "A"
meaning = "born | founder | immigrant (codes 0, 1, 2; schema.sql life_course.origin). born for every F1 birth"
fixed_point = false
[[owns]]
column = "life_course.mother"
entity = "life_course"
type = "u64"
plane = "A"
meaning = "As person.mother at entry; 0 for founders and immigrants without one"
fixed_point = false
[[owns]]
column = "life_course.father"
entity = "life_course"
type = "u64"
plane = "A"
meaning = "As person.father at entry; 0 when unknown, for founders and immigrants without one"
fixed_point = false
[[owns]]
column = "life_course.sex"
entity = "life_course"
type = "enum"
values = ["male", "female"]
plane = "A"
meaning = "As person.sex at entry: male | female (codes 0, 1); written once at entry, like mother and father. Founders take their person.sex at genesis. Succession through a dead ancestor needs it (REV-P1a section 8, NEW-7)"
fixed_point = false
[[owns]]
column = "life_course.birth_tick"
entity = "life_course"
type = "i64"
plane = "A"
meaning = "As person.birth_tick; negative for founders born before the epoch"
fixed_point = false
[[owns]]
column = "life_course.entry_tick"
entity = "life_course"
type = "i64"
plane = "A"
meaning = "The instant the row was appended: 0 for founders (genesis), the birth tick for a birth, the arrival tick for an immigrant"
fixed_point = false
[[owns]]
column = "life_course.exit_kind"
entity = "life_course"
type = "enum"
values = ["open", "death", "emigration"]
plane = "A"
meaning = "open | death | emigration (codes 0, 1, 2). open while the person is in the ledger; written once when the person leaves (schema.sql exit_kind: NULL = open, 0 death, 1 emigration in the chronicle view)"
fixed_point = false
[[owns]]
column = "life_course.exit_tick"
entity = "life_course"
type = "i64"
plane = "A"
meaning = "i64::MAX while open; the instant of the exit, written once with exit_kind"
fixed_point = false
[[owns]]
column = "life_course.death_cause"
entity = "life_course"
type = "enum"
values = ["none", "natural", "murder", "battle", "execution", "accident"]
plane = "A"
meaning = "As person.death_cause (none | natural | murder | battle | execution | accident); none unless exit_kind = death; written once with exit_kind"
fixed_point = false

# ----------------------------------------------------------------------------- reads (F1)
# Round 4 (NEW-4): declared unconditionally; SPR-014's registration rule drops a read whose owner the world does not
# register (solo, household and hamlet register neither T1.minds nor M7.dynasty) and gives the step view the coupling's
# neutral value, stated on each in-coupling below. All four are read at the start of the instant (lagged); three are
# flags that enter no rate, and house_member.person selects the elite conception table c_i^e, so it enters the
# conception rate whenever elite_fertility_mult is not 1.0 (F4; its in-coupling carries bounds for that).
[[reads]]
column = "person.named"
owner = "T1.minds"
lag = "lagged"
use = "mode"
neutral = false
why = "Named actors marry by decision (T1's Marry command), everyone else by M2's partnering step: a named woman is skipped by N3 and a named man is no candidate in N4, so T1 and M2 never both marry the same person. Neutral: 0 (nobody named)"
[[reads]]
column = "person.vocation"
owner = "M7.dynasty"
lag = "lagged"
use = "mode"
neutral = "none"
why = "holy_orders leaves the marriage pool and the conception draw (M7's vocation submodel: 'M2's fertility reads it'; REV-SPR-015 MIN-5); the other vocations change nothing. Neutral: none"
[[reads]]
column = "house_member.person"
owner = "M7.dynasty"
lag = "lagged"
use = "mode"
neutral = 0
why = "A woman with a house_member row (born into or founding a great house) conceives at M x elite_fertility_mult (F4); the default multiplier 1.0 makes the read inert. Neutral: no row (nobody is a house member)"

[[reads]]
column = "person.residence"
owner = "S3.migration"
lag = "lagged"
use = "mode"
neutral = 0
why = "REV-SPR-018 R8: P1a has no residence moves (PRJ-002 ruling M-6), so a marriage must not make a household that spans two settlements: the husband draw (N4) takes candidates from the bride's settlement only. Neutral 0 = no restriction: while S3 is not registered (every P1a world before SPR-018) the pool is the whole ledger and M2 still registers on its own (REV-EVO-001 R4). S3 F0 gives the newborn the mother's residence (SPR-018)"
# The entitlement hook of F1 mortality ([algorithm.mortality_f1] MR11) and of fertility (eps_f) reads M4's household
# entitlement ratio. That read, its in-coupling and its isolation forcing come with M4's first spec (P1.5a): a rate read
# needs a neutral typed by the owner's column, M4 has none yet, and the frozen-mode lint refuses the spec otherwise
# (REV-SPR-016-FOLD R2; next/README.md records the follow-up). Until then the entitlement factor is exactly 1.

# Lifecycle commands M2 applies: the frozen 0.2.1 entries byte for byte (EVO-001: typed payloads, drained_by, the
# living-key rule, key_field, outcome = true; a command carries no date, 05.1 §2 rule 2). F1 applies them in
# [algorithm.lifecycle_f1] (ScheduleDeath through S12 as amended, Marry through [algorithm.partnering_f1] N7 under the
# command preconditions: the sender's age rule, not M2's, REV-SPR-015 MIN-5; a command that fails one is dropped and
# reported, INV-M2-05's rule). The Day/Vital binding below is the drain drained_by names (SPR-014 builds it).
[[applies]]
command = "ScheduleDeath"
payload = "{ victim: PersonId, cause: enum(person.death_cause), culprit: PersonId, cause_event: EventRef }"
from = ["M7.dynasty", "T1.minds"]
drained_by = "Day/Vital"
key = "living"
key_field = "victim"
outcome = true
sprint = "SPR-014"
[[applies]]
command = "Marry"
payload = "{ a: PersonId, b: PersonId }"
from = ["T1.minds"]
drained_by = "Day/Vital"
key = "living"
key_field = "a"
outcome = true
sprint = "SPR-014"

[[emits]]
kind = "DEATH"
when = "apply_death, when a death timer fires or the Day/Vital drain applies a ScheduleDeath (SPR-014; EVO-001): alive = 0, death tick, death cause, life-course exit. Roles: the deceased is target; there is no actor for a natural death (a ScheduleDeath's culprit is actor, P1.13). Payload: [death_cause code]. Causes: none for a natural death. Admitted under DATA-5 as the tellable act class death at rungs 0-2 (SPR-011 ruling 11)"
[[emits]]
kind = "EXTINCTION"
when = "apply_death leaves no ledger row with alive = 1, no row inserted earlier in the same step and no BIRTH_TIMER due in this slot whose mother's row is present (S12 as amended: the newborns of this slot, born or about to be, count as living; REV-SPR-015 MIN-3, R17.1): emitted once, right after that DEATH, in the same fire, with the DEATH as its one cause (a draft-local cause, written as a triggered edge; SPR-011 rulings 11, 17). No roles; payload: [] . With births it still happens at most once per run (an empty world bears no children, and a birth whose mother was compacted before the instant is dropped); the run continues to its requested end (V-SCALE-04)"
[[emits]]
kind = "BIRTH"
when = "apply_birth (F9), when a birth timer fires at a day start: after the row insert and the life-course append. Roles: the mother is actor, the child is target (the father is in the child's life-course row; P1.9's typed [event_roles] may add a parent role, BCK-002 A-24). Payload: [sex code, birth order (parity after the birth)]. Causes: none (the marriage is state, not a cause). Registry verb BIRTH, act class birth, tellability 96 (design value: below DEATH's 128), admitted at every P1a world under the ceiling (05.2 §4.0)"
[[emits]]
kind = "MARRIAGE"
when = "apply_marry (N7), whether from M2's partnering timer or from T1's Marry command. Roles: the husband is actor, the wife is target. Payload: []. Causes: none from a timer; a Marry command carries no cause_event (its frozen payload), so none from it either. Registry verb MARRIAGE, act class marry, tellability 112 (design value)"

[scales]
spatial = "person; households as collectives (membership only, no place: residence is S3.migration's from SPR-018)"
temporal = "Month pulse for every draw (mortality, fertility, partnering); each death, birth and marriage a timer at a day start (a Day-pulse instant): deaths and marriages inside their month, births in the ninth month after conception (or the day after it, after a late re-sample), never a Month-pulse instant (amended ruling 7; INV-M2-03 as amended, INV-M2-10, INV-M2-11); commanded outcomes are their senders' timers and reach M2's Day/Vital drain in their own instant (EVO-001, shape (b))"
extent = "every living person in the ledger; the marriage pool is the bride's settlement once S3.migration is registered (SPR-018; REV-SPR-018 R8), the whole ledger before"
restart = "Owned columns (ledger, households, marriage log, life-course log) plus the pending death, birth and marriage timers in the agenda restore the system exactly. K, the fertility tables (F3, F4) and the nuptiality bits (N1) are pure functions of the compiled e0, tfr and elite_fertility_mult and are recomputed at construction, never stored. M2 keeps no index: the children-by-parent and spouse lookups it needs are rebuilt from the log at construction (a cache with a rebuild rule); person.unborn_father is likewise a stated cache of the marriage row open at conceived_tick (NIT-3)"

[[fidelity_ladder]]
level = "F1"
representation = "Per-person Brass relational-logit hazards on the General Standard at any (alpha, beta) in fixed point (specs/demography; 05.1 §6 item 4 exp and ln), with an infant sub-schedule below 1, a logistic old-age tail above 90, a density modifier and a stubbed entitlement hook, monthly Bernoulli draws ([algorithm.mortality_f1]; rung 0, [algorithm.mortality_rung0], is its beta = 1 case in odds form). F1 births: Coale-Trussell natural fertility at level M from tfr, a 9 + 11 month closed period, conceptions drawn monthly for married women and born as timers ([algorithm.fertility_f1]); partnering by a monthly nuptiality hazard and a keyed choice of husband ([algorithm.partnering_f1]); minimal households ([algorithm.households_f1])"
status = "target"

[[schedule]]
pulse = "Month"
phase = "Vital"
steps = [
  "ageing: nothing stored; age is derived from birth_tick",
  "apply_death: due death timers fire in the phase's timer pass, before the pulse steps (05.1 §2 rule 4); none is due at a Month pulse instant (INV-M2-03)",
  "mortality: one Bernoulli per living person on this month's probability; a hit becomes a death timer at the start of a keyed day inside the month, never the Month-pulse instant",
  "fertility: one Bernoulli per susceptible married woman on her band's conception probability ([algorithm.fertility_f1] F5, F6); a hit becomes a birth timer at the start of a keyed day of the ninth month after this one, with the husband as father (F7)",
  "partnering: one Bernoulli per eligible unmarried woman on her band's nuptiality probability ([algorithm.partnering_f1] N3, N4); a hit picks a husband by a keyed draw among the eligible men and becomes a marriage timer at the start of a keyed day inside the month (N5)",
]
when = "always"
[[schedule]]
pulse = "Day"
phase = "Vital"
steps = [
  "apply_death: M2's own due death timers fire in the timer pass of this day start (05.1 §2 rule 4); a ScheduleDeath of the slot arrives through the lifecycle step below, never as an M2 timer (shape (b)); the single death path, S12 as amended, then [algorithm.households_f1] H4",
  "apply_birth: due birth timers fire in the same timer pass, in agenda key order with the deaths ([algorithm.fertility_f1] F9, F10); a mother who died in this slot still bears the child (her row is present with death_tick = now), whatever the order",
  "apply_marry: due marriage timers fire in the same timer pass ([algorithm.partnering_f1] N7)",
  "households: the H4 bookkeeping of each death of this instant runs inside apply_death; nothing else runs here ([algorithm.households_f1])",
  "lifecycle: the drain of M2's command queue ([algorithm.lifecycle_f1]; EVO-001, REV-EVO-001 R9 shape (b); drained_by Day/Vital): every ScheduleDeath and Marry in the inbox is applied now, through apply_death or apply_marry, after the timers of the slot (the sender's own timer submitted it in this instant's timer pass); a command for a dead key person is dropped and counted (BCK-002 A-30); the queue-age allowance is one day (A-31: the drain binds Day)",
]
when = "always (the binding runs at every day start; a when clause is documentation, round 3 BLK-1)"

[[rng]]
purpose = "death_time"
key = ["person", "month"]
use = "Whether a person dies this month, and on which day: the death fires at the start of that day, the Day-pulse instant, so systems reacting to a death in the same instant (M7 succession, T1 grief) run their Day bindings at it (amended SPR-011 ruling 7; minute-level death times wait for BCK-002 A-35). [algorithm.mortality_rung0] S9"
# SPR-011 ruling 7 and the RNG-purpose rule of 05.1 §6 item 9: a vital timer is re-drawn after a fork or a scoped input.
resample_on_fork = true
draws = [
  "k = 0: the monthly Bernoulli on the month's Prob32 probability; exactly one draw per living person per month, whatever the probability (CRN)",
  "k = 1: only on a hit, the day of death: one of the month's day starts after the Month-pulse instant (S9); in a re-sample, one of the day starts after the input's instant (S11)",
]
# Stream key: (world_seed, branch_salt(t), system_id(M2.demography), epoch of the person (BCK-002 A-29), purpose death_time,
# entity person.id, t = the Month pulse instant, k). A re-sample draws through rh-core's ResampleCtx instead: the same purpose,
# entity resample_entity_id(Person), t = the input's instant, the epoch after the input, the same k = 0 and k = 1.
[[rng]]
purpose = "conception"
key = ["person", "month"]
use = "Whether a susceptible married woman conceives this month, and on which day of the ninth month after it the child is born ([algorithm.fertility_f1] F6, F7). Keyed as death_time: (world_seed, branch_salt(t), system_id, the woman's epoch, purpose conception, entity = the woman's person.id, t = the Month pulse instant, k). The father is state (person.unborn_father, her spouse at t), not a draw; the conception pulse is the timer's payload and person.conceived_tick"
resample_on_fork = true
draws = [
  "k = 0: the monthly Bernoulli on her band's conception probability c_i (F4); exactly one draw per susceptible married woman per month (CRN)",
  "k = 1: only on a hit, the birth day: one of the due month's day starts other than its pulse instant (F6); in a re-sample (F8, through ResampleCtx at t = the input's instant, k = 0 of the re-sample; the due month comes from the timer's payload, never from state), one of the due month's day starts after the input, else the first non-pulse day start after the due month that is not before the input",
]
[[rng]]
purpose = "marriage_time"
key = ["person", "month"]
use = "Whether an eligible unmarried woman marries this month and on which day ([algorithm.partnering_f1] N4, N5). Keyed as death_time, entity = the woman's person.id, t = the Month pulse instant. The husband is ranked by the purpose husband_pick below"
resample_on_fork = true
draws = [
  "k = 0: the monthly Bernoulli on her band's nuptiality probability (N1); exactly one draw per eligible unmarried woman per month (CRN)",
  "k = 1: only on a hit with at least one candidate, the day: one of this month's day starts other than the pulse instant (N4); in a re-sample (N6, k = 0 of the re-sample), one of the remaining day starts after the input, else the timer is dropped",
]
[[rng]]
purpose = "birth_sex"
key = ["person"]
use = "The newborn's sex, drawn at the birth ([algorithm.fertility_f1] F9): the ordinary StepCtx draw (world_seed, the current branch salt, system_id, the child's epoch 0, purpose birth_sex, entity = the child's own PersonId, known before the draw: H64(mother, parity) with the rehash, t = 0, k = 0). Not a timer, so not re-sampled, and keyed by the person alone, so the same child is the same sex in every branch whatever day it is born (CRN, ADR-0026; REV-SPR-015 NIT-5)"
resample_on_fork = false
draws = [
  "k = 0: male iff the draw hits SEX_M = rhe(2^32 x 105 / 205) (F2); exactly one draw per birth",
]
[[rng]]
purpose = "husband_pick"
key = ["person", "month"]
use = "The ranking of the candidate husbands of an eligible woman who marries this month ([algorithm.partnering_f1] N4; REV-SPR-015 R16): the keyed stream of (world_seed, the current branch salt, system_id, the woman's epoch, purpose husband_pick, entity = the woman's person.id, t = the Month pulse instant); candidate h's rank is the stream's draw at k = h (a u64 index: StreamKey::draw(t, k) in rh-ids, reached through StepCtx::rng(husband_pick, w) in the step); the husband is the candidate with the least draw (ties, a 64-bit coincidence, to the lower h). Uniform over the candidates and CRN-stable (one man more or less changes the match only when he is the least), and inside the RNG rule: the branch salt is in the key, so a fork re-ranks; the epoch is in the key once BCK-002 A-29 lands (StepCtx keys every pulse draw at epoch 0 until then), and from then a scoped input re-ranks too"
resample_on_fork = false
draws = [
  "k = h for each candidate h, only on a marriage_time hit with at least one candidate: a keyed draw per candidate, read once; the pick is consumed into the marriage timer's payload at the pulse, so there is no timer of this purpose to re-sample (what a fork or input re-draws is the marriage timer under marriage_time, N6, whose payload keeps the husband; the next pulse's pick carries the new epoch)",
]

[design]
basic_principles = "Mortality: Brass relational logit on the General Standard (Brass 1971; R12 §9), l(x) = 1 / (1 + K O(x)^beta) with O(x)^beta by the fixed-point exp and ln of 05.1 §6 item 4 and K solved from e0 by bisection (at beta = 1 the exact rational odds, rung 0's form, without exp or ln); below 1 Bourgeois-Pichat's biometric law spreads the year's deaths, above 90 Beard's Perks logistic (R12 §9 p. 59) replaces Brass's weak tail; above a carrying capacity R09 §2's density term raises q ([algorithm.mortality_f1]). Fertility: Coale and Trussell (1974) natural fertility, f(a) = M n(a) with the control parameter m = 0 (no parity-specific stopping; R12 §9 notes the volume has no Brass fertility model, Barrett's Monte Carlo gives the micro mechanics the closed period copies), realised as a monthly conception hazard whose long-run birth rate is M n(a) exactly (F4). Partnering: a monthly first-marriage hazard by age band (the early, near-universal pattern Hajnal 1965 contrasts with the European one; R09 §2 B), husband chosen among the eligible by a keyed draw: minimal partnering so that fathers exist (ADR-0026 item 4). Households: membership only, formed by marriage, inherited by the survivor"
emergence = "Age structure, life expectancy, the growth rate (V-SF-01), the realised TFR (below tfr by widowhood and death before 50), birth intervals, the age shape of births (reported in V-SF-24: it differs from M n(a) by the nine-month lag after marriage and by banding at birth rather than at conception), orphanhood, household size and the time to extinction of a small population emerge from the per-person draws. Imposed: the schedules themselves (the identity tests V-SF-02, V-SF-24's conception rate, V-SF-25)"
adaptation = "n/a: demography has no agents that choose. T1.minds' marry decision for named actors is T1's adaptation, applied here"
objectives = "n/a: no agents that choose"
learning = "n/a: no agents that choose"
prediction = "n/a: no agents that choose"
sensing = "Four lagged reads at the start of the instant: person.named (T1), person.vocation and house_member.person (M7), person.residence (S3; the bride's settlement bounds the husband draw), each with a neutral value when its owner is absent. The entitlement hook of mortality (MR11) and, from P1.5a, of fertility reads M4's household entitlement ratio once M4's first spec declares the column (P1.5a; REV-SPR-016-FOLD R2); until then the factor is exactly 1. Era-state medical level shifts alpha in P1b (05.1 §3.1; not_yet)"
interaction = "Lifecycle commands only (05.1 §2 rule 2): ScheduleDeath and Marry, submitted by their senders' timers in the outcome's instant and applied in M2's Day/Vital drain of that instant through apply_death and apply_marry (shape (b)); births enter the ledger through SPR-014's row insert; M7 on_birth and T1 read the newborn and the spouse column at the same instant. Within M2, a marriage this month, a conception this month and a death this month are drawn independently from the state at the Month pulse and reconciled when their timers fire (a dead party drops a marriage or a birth; a dead mother's unborn child is lost). Deaths are independent across persons given the month's density term (MR11, one Q16_16 per Month pulse from the living count) and, from P1.5a, the household's entitlement term"
stochasticity = "Keyed counter-based RNG only (ADR-0006): per person-month one Bernoulli for death (k = 0) and, for a married susceptible woman, one for conception, for an eligible unmarried woman one for marriage; on a hit one day draw and, for a marriage, one keyed draw per candidate husband (husband_pick, k = the candidate's id); one sex draw per birth keyed by the child. No Poisson or batched draws (V-INV-08). Exactly one k = 0 draw per eligible person per purpose per month whatever the probability (CRN, V-DET-17). Commanded outcomes are drawn by their senders, never by M2"
collectives = "Households: imposed (formed by a marriage or at genesis, dissolved when empty), owned here (household.*, person.household). Great houses are M7's; M2 reads membership for the fertility multiplier only"
observation = "The life-course log (LIFE_ENTRY, LIFE_EXIT), the marriage log, and DEATH, EXTINCTION, BIRTH and MARRIAGE events in channel A; monthly living count, births and deaths in STEP_DIGEST (its births field, 0 in P1.0, is live from SPR-015). Declared aggregates (SPR-028): crude birth and death rates, age-specific marital fertility by band, age at first marriage, mean household size; INSUFFICIENT below 400 births (fertility bands) and 100 households"
era_state = []    # F1 reads no era state; medical_level (S2.technology) moves alpha in P1b, when S2 has an owner (not_yet)
scale_behaviour = "Identical at every N while the living count is at or under density_capacity (every P1a world): every per-person draw depends only on that person's state and the Month pulse, not on N or on visiting order. Above the capacity the month's probability carries the world's density term m_d (MR11), one Q16_16 per Month pulse computed before any draw, so the result still depends on neither visiting order nor thread count. The husband draw depends on the candidate list, which is the same list in the same order whatever the thread count (N4). Cost: the partnering step scans the eligible men once per hit; at 10k persons (SPR-030) that is about 100 hits x 2,000 men a month, trivial; from SPR-018 the pool is the bride's settlement (REV-SPR-018 R8), which bounds it at every scale. Statistical bands report INSUFFICIENT below their sample minimums"

[algorithm.mortality_rung0]
# SPR-011 ruling 7: no transcendental in plane A. Every quantity is an exact integer; every width is the smallest standard
# width that holds every intermediate; every division is rounded exactly once, as stated. The exact reference
# (specs/demography/selftest_m2_rung0.py, Python fractions) reproduces it bit for bit; T-05's bin/gen_m2_reference.py
# ports that reference and generates the golden vectors.
version = "m2-rung0-v1.1"      # F1 amends S2 and S12 (REV-SPR-015 R13, R17.4); the arithmetic S0-S11 and every check value are unchanged
steps = [
  "S0 Rounding. rhe(n / d) for integers n (signed) and d > 0 is the integer nearest n / d, ties to the even integer: q = floor(n / d), r = n - q d; add 1 iff 2r > d, or 2r = d and q is odd. Every division below is rhe of exact integers unless it says floor. No float, no truncating cast, no other rounding.",
  "S1 Standard (compiled-in constants). The 71 grid ages a_0..a_70 and four-digit survivors ls_0..ls_70 of specs/demography/brass_general_standard.toml [standard] (Brass 1971 Table 4). Held as h_i = 2 a_i (u8, half-years: 0, 2, 4, ..., 100, 105, ..., 200) and s_i = 10^4 ls_i (u16: s_0 = 10000, s_70 = 0, non-increasing). Both conversions are exact.",
  "S2 Parameters. e0 is the Q16_16 compiled from the manifest literal (ruling 9: exact decimal, round half to even): E = e0 bits, i32, E in [1310720, 5570560] by the Registry bounds [20, 85]. rh_manifest::compile fills each parameter M2 reads from the manifest, else from the Registry default (e0 = 30, beta = 1); a parameter M2 reads with neither is a load error naming it, so the compiled WorldSpec holds no optional parameter (Architect ruling on PR #37). Rung 0 reads exactly e0 and brass_beta. At rung 0 brass_beta must compile to exactly 65536 (1.0); F1 mortality (SPR-016; [algorithm.mortality_f1] MR2) accepts any brass_beta in the Registry bounds and also compiles density_capacity and density_mortality_slope, from the manifest else from their Registry defaults. A manifest that sets brass_alpha is refused at load by name at rung 0 and at F1 alike, since K comes from e0 (DV-SPR016-2). F1 (SPR-015; [algorithm.parameters_f1]) reads tfr and elite_fertility_mult too, so rh_manifest::compile fills them from the manifest, else from the Registry defaults (tfr = 4.9, elite_fertility_mult = 1.0); eps_f and eps_m are still not read, so they are not compiled and need no default.",
  "S3 Survivors at a grid age for a level k (K = k / 2^32; k is a u64 in [0, 2^40]). L_i(k) = 0 if s_i = 0; otherwise L_i(k) = rhe(s_i 2^64 / (s_i 2^32 + k (10^4 - s_i))). Numerator u128 (< 2^78), denominator u64 (< 2^54). L_i(k) is in [0, 2^32] (32 fraction bits); L_0(k) = 2^32 for every k, and L_i(2^32) = rhe(s_i 2^32 / 10^4) is the standard itself. This is l = 1 / (1 + K (1 - ls) / ls) multiplied through by s_i 2^32.",
  "S4 Trapezoid sum. T(k) = sum over i = 0..69 of (h_(i+1) - h_i) (L_i(k) + L_(i+1)(k)), a u64 (< 2^42). e0(k) = T(k) / 2^34 years exactly (h counts half-years and the trapezoid halves; L has 32 fraction bits). No rounding.",
  "S5 Bisection for K. lo = 0, hi = 2^40. Repeat exactly 40 times: mid = (lo + hi) >> 1; if T(mid) >= E 2^18 then lo = mid, else hi = mid. Then K = lo (k bits). The comparison is exact (E 2^18 is e0 in units of 2^-34 years). mid is never 0, and T(2^40) / 2^34 < 1 year < 20 while T(k) / 2^34 tends to 98.75 years as k falls to 1, so every Registry e0 is bracketed. T is non-increasing in k (each L_i is, and rhe is monotone), so K is the largest k with e0(k) >= e0. Computed once, at construction.",
  "S6 Schedule. L_i = L_i(K) for i = 0..70: 71 u64 values, the whole rung-0 schedule.",
  "S7 Survivors at an age in minutes. Y = minutes per year of the world calendar: 518400 (360 days) or 525600 (365 days). Grid ages in minutes A_i = h_i Y / 2 (exact, Y is even; A_70 = 100 Y). For an age x (i64 minutes, x >= 0; a negative age is an error): if x >= A_70 then l(x) = 0; otherwise, for the unique i with A_i <= x < A_(i+1), l(x) = L_i + rhe((L_(i+1) - L_i) (x - A_i) / (A_(i+1) - A_i)), all i64 (|L_(i+1) - L_i| <= 2^32 and x - A_i < 2^21, so the product is < 2^53). l(x) is in [0, 2^32] and non-increasing in x.",
  "S8 Monthly probability. At the Month pulse instant t_m, with D = t_(m+1) - t_m the month's length in minutes from the calendar (43200 for 360 days; 40320 to 44640 for 365), a living person with birth tick b has x = t_m - b. q = 2^32 if l(x) = 0, else q = rhe(2^32 (l(x) - l(x + D)) / l(x)) (numerator u128). q is a Prob32 (05.1 §6 item 4) with bits in [0, 2^32]. q = 2^32 (certain death) iff l(x + D) = 0, that is iff x + D >= 100 Y: the old-age tail is P1.3.",
  "S9 Draws (amended SPR-011 ruling 7: deaths fire at day starts). Stream key as [[rng]] death_time with t = t_m. k = 0: draw d0 (u64); the person dies this month iff d0 hits q (Prob32 mapping: q = 2^32, or d0 < q 2^32). Exactly one k = 0 draw per living person per month, whatever q. k = 1, only on a hit: n = D / 1440, the month's length in days (30; 28 to 31 for 365 days), so the candidate instants are the n - 1 day starts t_m + 1440 j for j = 1..n-1 (the Month-pulse instant t_m itself is excluded: a timer must be strictly after the current instant and phase); draw d1; j = 1 + floor(d1 (n - 1) / 2^64) (u128 product, floor); the death instant is tau = t_m + 1440 j: uniform over the month's day starts other than the pulse instant. The probability q still covers the whole month [t_m, t_m + D): a death that would fall on the first day moves to a later day start (design simplification: the hazard is flat within a month, below the schedule's resolution; BCK-002 A-35 brings minute-level times).",
  "S10 Timer. On a hit M2 inserts one agenda timer at (tau, Vital), a Day-pulse instant: owner M2, purpose death_time, kind 1 (DEATH_TIMER), payload b (the birth tick, which S11 needs), about the person. Persons are visited in ascending person.id, so the agenda's insertion order is PersonId order.",
  "S11 Re-sample (resample_on_fork; ADR-0025 item 3). A material input at instant t_in that scopes the person, while the timer is pending (t_in <= tau: a timer due at t_in itself is still pending in the Inputs phase, ADR-0025 item 4), cancels it, and resample_timer re-draws through ResampleCtx (purpose death_time, the epoch after the input, t = t_in): t_end = the first month start after t_in (the pending month's end); x0 = t_in - b, x1 = t_end - b; q' = 2^32 if l(x0) = 0, else rhe(2^32 (l(x0) - l(x1)) / l(x0)). k = 0: d0 hits q'? The candidate instants are the day starts strictly after t_in and before t_end: s_1 < ... < s_c. On a miss, or when c = 0 (the input fell on the month's last day, so every candidate day has passed), the timer is dropped (None): the person lives to the next Month pulse, where the monthly draw applies again. On a hit with c >= 1, k = 1: j = floor(d1 c / 2^64) (u128 product, floor) and tau' = s_(j+1). Intended behaviour, a one-month horizon (ADR-0025 item 3; Architect ruling on PR #37): an input re-samples only the pending timers in its scope, so a person with no pending death this month is not re-drawn until the next Month pulse, which draws afresh at the new epoch. At rung 0 no input changes a hazard, so nothing is lost; reconsider when inputs change conditions (P1.3).",
  "S12 apply_death(person, cause, culprit, cause_event), in fire at the timer's instant (Vital) or in the Day/Vital drain for a ScheduleDeath (F1; EVO-001). If the person's ledger row is absent (compacted after an earlier death) or has alive = 0 (died earlier in this slot, by another timer or a command), the death is dropped and counted per (source, reason), never applied: the single death path never kills twice and never writes a closed life-course row (REV-SPR-015 R13). Otherwise: person.alive := 0; person.death_tick := now; person.death_cause := cause (natural for an M2 timer, the command's cause for a ScheduleDeath); on the person's open life_course row: exit_kind := death, exit_tick := now, death_cause := cause (each written once; rh-core refuses a second write, ruling 5); for a commanded death, cancel the person's own pending DEATH_TIMER, if any, through StepCtx::own_timers and cancel (a cancellation takes effect from the next slot; one already in this slot meets alive = 0 above); emit DEATH (target = person; actor = culprit for a commanded death with culprit != 0, else none; payload [cause code]; one triggered edge from cause_event when it is not 0, none otherwise); then, if no ledger row has alive = 1, no row was inserted earlier in this step, and no BIRTH_TIMER due in this slot has a mother whose row is present (F9 will bear that child), emit EXTINCTION with the DEATH as its cause. The dead row stays readable until rh-core's compaction at the start of Bookkeeping of this instant.",
]
# Check values of this algorithm (from the exact reference; selftest_m2_rung0.py asserts them). K is in units of 2^-32.
check_values = [
  { e0 = "20",    K = 18743037470 },
  { e0 = "23.4",  K = 14691140731 },
  { e0 = "30",    K = 9582773732 },
  { e0 = "36.6",  K = 6442600637 },
  { e0 = "43.44", K = 4299869756 },
  { e0 = "60",    K = 1466952214 },
  { e0 = "85",    K = 73327863 },
]
# Facts of the fixed-point schedule that the plan's acceptance criteria must use (selftest_m2_rung0.py proves them):
#   * The four-digit standard's own trapezoid e0 is 43.45915 years exactly (T(2^32) / 2^34 is within 2^-30 years of it,
#     S3 rounding each L_i), not 43.44 (Brass's rounded value): K = 1 is reached at e0 = 43.45915 (|K - 2^32| = 569
#     units, from the Q16_16 rounding of e0), not at 43.44 (K = 1.00114 there).
#   * V-SF-02's q(15) in [0.35, 0.55] holds exactly for e0 in [23.441086, 36.569855] (Q16_16 bits 1536235 to 2396642;
#     about [23.4, 36.6]). SPR-011 T-05 and ruling 8 use these exact values (Architect, PR #37).

[algorithm.fertility_f1]
# F1 births (SPR-015). No transcendental in plane A; every quantity an exact integer; every division rhe (S0) unless it
# says floor. The exact reference specs/demography/selftest_m2_f1.py reproduces every integer and asserts check_values.
version = "m2-f1-fertility-v1"
constants = { natural = [411, 460, 431, 395, 322, 167, 24], gestation_months = 9, postpartum_months = 11, sex_ratio = [105, 205] }
steps = [
  "F0 Rounding, calendar, bands. rhe as S0. Y, D and the month starts t_m as S7 and S8; n_m = D_m / 1440 is month m's length in days; month(t) is the index of the calendar month containing t. Ages in minutes: x = t - birth_tick. A woman's band at t is i = floor((floor(x / Y) - 15) / 5) for 15 Y <= x < 50 Y (i in 0..6: the five-year bands 15-19, 20-24, ..., 45-49; REV-SPR-015 R3), else none.",
  "F1 Natural-fertility standard (compiled-in constants: `constants.natural`). Coale and Trussell (1974, Population Index 40(2), Table 1) n(a), births per married woman-year by five-year band 15-19 .. 45-49: 0.411, 0.460, 0.431, 0.395, 0.322, 0.167, 0.024; held as thousandths N_i (u16). Cited values, cited-pending (R11 Q1): the transcription is checked against secondary sources only, and one secondary source reads 0.396 and 0.321 at 30-34 and 35-39; a research batch confirms Table 1 before 0.3.0 freezes, and a corrected value moves every check value below. Zero outside the bands.",
  "F2 Parameters and constants ([algorithm.parameters_f1]). tfr: the Q16_16 compiled from the manifest literal or the Registry default 4.9 (design value; F3 and the facts below), T = its bits, in [78643, 491520] by the Registry bounds [1.2, 7.5]. elite_fertility_mult: Q16_16, default 1.0, bits E in [65536, 104858] by the bounds [1.0, 1.6]. Constants (`constants`; design values unless marked): gestation G = 9 calendar months; postpartum non-susceptible period P = 11 calendar months (Barrett's mean, R12 §9, taken as fixed; cited in kind); the closed period after a conception is therefore G + P = 20 pulses; SEX_M = rhe(2^32 x 105 / 205) = 2199861298, the Prob32 that a birth is male (the sex ratio at birth of about 105 boys per 100 girls, a standard demographic constant held fixed: cited in kind, no paper in research/ yet, Q1). brass_alpha, eps_f and eps_m are still not read.",
  "F3 Level. The reference TFR of the F1 nuptiality schedule at M = 1, TFR1, is defined by the exact chain: a woman unmarried at exact age 15; at the start of each month a (a = 0 at 15 years 0 months, ..., 419 at 49 years 11 months) her probability of being ever married is S(a), with S(0) = 0 and S(a + 1) = 1 - (1 - S(a)) (1 - mu_i(a) / 2^32), mu from N1, i(a) = floor(a / 60) (no mortality, no widowhood); pi_i = the mean of S(a) over the 60 months of band i; TFR1 = sum over i of 5 N_i / 1000 x pi_i, an exact rational = 9.393524 (REV-SPR-015 NIT-3: with S taken after the month's draw instead, the constant would be 9.4289, a different convention). Held as the Q16_16 constant TFR1_BITS = round half to even (TFR1 x 65536) = 615614. The level is M = tfr / TFR1 in Q16_16: m = rhe(T x 65536 / TFR1_BITS); at the default, m = 34186 (0.52164). So tfr is the TFR a cohort would reach under the F1 marriage pattern with the long-run birth rate of F4 and no mortality; the realised TFR is lower by widowhood and death before 50 (the facts below; V-SF-01 is the acceptance test of the default). For a woman with a house_member row (M7; neutral: none), m_e = rhe(m x E / 65536) replaces m.",
  "F4 Conception probability per band (computed once at construction, 7 values for m and 7 for m_e). b_i = m x N_i (births per woman-year in units of 2^-16 / 1000; u64); den_i = 12 x 65536 x 1000 - 20 x b_i (i64; positive throughout the Registry range of tfr alone: 20 x 0.80 x 65536 x 460 = 4.8 x 10^8 < 7.86 x 10^8); c_i = 2^32 if den_i <= 0, else min(2^32, rhe(2^32 x b_i / den_i)). Numerator < 2^60 (m_e <= 1.6 x 0.80 x 65536, N_i <= 460), both operands u64. c_i is a Prob32 in [0, 2^32] and non-decreasing in tfr and in E. Why this form: a woman drawn monthly at c with a closed period of 20 pulses after each conception bears 12 c / (1 + 20 c) children a year in the long run; solving for c gives b / (12 - 20 b), so the long-run birth rate equals M n_i exactly (check 3 of the reference). The clamp is reached only with the multiplier near its upper bound at tfr 7.5 (the 20-24 band at c = 2^32: certain conception every susceptible month).",
  "F5 Susceptible women at the Month pulse t_m, visited in ascending person.id: alive, female, spouse != 0 (married; the husband's row is alive by INV-M2-08), band i not none, conceived_tick = i64::MIN (not pregnant), vocation != holy_orders (M7; neutral none; REV-SPR-015 MIN-5), and the postpartum period over: no live birth in the last P months, that is last_birth_tick < t_(m-P) (the start of the P-th month before this one; a founder's i64::MIN always passes). The spouse's age and vocation do not matter. A named woman is not skipped: T1 decides marriages, not births.",
  "F6 Draws. Stream key as [[rng]] conception with t = t_m, entity = the woman. k = 0: draw d0; she conceives iff d0 hits c_i (m_e's table if she has a house_member row, else m's). Exactly one k = 0 draw per susceptible woman per month, whatever c_i. k = 1, only on a hit: the due month is m + G; n = n_(m+G) its length in days; j = 1 + floor(d1 (n - 1) / 2^64) (u128 product, floor); tau = t_(m+G) + 1440 j, a day start of the due month other than its pulse instant (uniform over them; the pulse instant is excluded as S9 excludes it, so no M2 timer ever fires at a Month pulse: INV-M2-03 as amended, INV-M2-10).",
  "F7 Timer and state. On a hit M2 inserts one agenda timer at (tau, Vital): owner M2, purpose conception, kind 2 (BIRTH_TIMER), about the woman, payload = t_m (the conception pulse, an i64 SimTime: the one fact a re-sample needs, F8), and writes person.conceived_tick := t_m and person.unborn_father := her spouse's PersonId at t_m (the father, recorded at conception so a child born after its father's death keeps him; REV-SPR-015 R2). Women are visited in ascending person.id, so the insertion order is PersonId order.",
  "F8 Re-sample (resample_on_fork; ADR-0025 item 3; the frozen trait: resample_timer(timer, ctx) -> Option<SimTime> sees no world and writes nothing). A material input at t_in that scopes the woman while the timer is pending cancels it, and resample_timer re-draws through ResampleCtx (purpose conception, the epoch after the input, t = t_in), k = 0 of the re-sample: the pregnancy stands (no new Bernoulli). With m = month(payload) the conception month, the due month is m + G; the candidates are the due month's day starts strictly after max(t_in, t_(m+G)) and before t_(m+G+1): s_1 < ... < s_c; if c >= 1, tau' = s_(1 + floor(d c / 2^64)); if c = 0 (the input fell on or after the due month's last day start), tau' = max(t_(m+G+1) + 1440, the first day start at or after t_in that is not a Month pulse instant). A birth is never dropped by a re-sample, and tau' is never earlier than (t_in, Vital): the engine's no-back-dating check holds. The timer keeps its payload, so a second re-sample finds the same m; conceived_tick and unborn_father are not touched. An input that scopes the father re-samples nothing here (the timer is about the mother).",
  "F9 apply_birth(mother), in fire at the timer's instant (Vital, a day start), in agenda key order with the other timers of the slot. If the mother's ledger row is absent (she died before this instant and was compacted), the timer is dropped and reported (the unborn child died with her: no row, no event, parity unchanged). If her row is present, alive or dead in this very slot (alive = 0 with death_tick = now: a death in childbirth, whatever the order of the two timers in the slot; REV-SPR-015 MIN-3), the child is born: p = mother.parity (u16); id = the rh-ids child id of (mother, p): H64 over rehoboam/rh-ids/person/child/v1 of [mother, p], rehashed with c = 1, 2, ... (person/rehash/v1) while the id is in the table of every id ever issued (V-DATA-05; the table is a pure function of the history; exhausting the 64 rehashes is a SimError, the run stops: it means the table or the hash is broken); PersonId 0 is never issued (it is the none sentinel: the table holds it from construction); father = mother.unborn_father; sex: stream key as [[rng]] birth_sex with entity = id and t = 0, k = 0: male iff the draw hits SEX_M. Row insert through SPR-014's plumbing with M2's columns {id, birth_tick = now, sex, alive = 1, death_tick = i64::MAX, mother, father, spouse = 0, death_cause = none, household = mother.household, parity = 0, last_birth_tick = i64::MIN, conceived_tick = i64::MIN, unborn_father = 0}; every other owner's person.* column takes the zero of its type. If the mother's household was dissolved earlier in this slot (she died, its last member), it is re-opened for the child: dissolved_tick := i64::MAX, head := id (INV-M2-09 allows this same-instant re-open and holds at Bookkeeping). Append the life_course row {person_id = id, origin = born, mother, father, sex, birth_tick = now, entry_tick = now, exit_kind = open, exit_tick = i64::MAX, death_cause = none}. Then mother.parity := p + 1; mother.last_birth_tick := now; mother.conceived_tick := i64::MIN; mother.unborn_father := 0 (written even on a dead row of this slot: its life-course row is closed, its person.* row leaves at Bookkeeping). Emit BIRTH (actor = mother, target = child; payload [sex code, p + 1]). The father is not read: he may be dead (his row compacted); the life-course log keeps him.",
  "F10 Order within a slot and M2's own visibility. Timers due at one (t, Vital) fire in agenda key order (t, phase, entity, seq) (05.1 §4.3). A mother's birth timer drawn at least G months before a death timer about her has the lower seq and fires first; after a re-sample either timer takes a new seq, so the order is not guaranteed, and F9 does not depend on it (a mother dead in the slot still bears). Within one M2 timer pass (one step), the rows M2 inserted earlier in the step count as living for every scan of the same step, and S12's EXTINCTION test (amended) also counts the BIRTH_TIMERs still due in this slot whose mother's row is present, so a world whose last living person dies giving birth is not extinct whichever timer fires first (REV-SPR-015 MIN-3, R17.1); H4's member scan includes the newborns of the slot. Two births never share a mother at one instant (one pending birth per woman, INV-M2-10), so the children of one mother are totally ordered by birth_tick, as the effect language's sibling order requires (§5.3). How S12 sees a birth still due in this slot (REV-SPR-015 round 3 NIT-3): rh-core pops the slot's due timers before the timer pass, so they are not in own_timers; a woman whose conceived_tick != i64::MIN has no pending own BIRTH_TIMER exactly when her birth is due in this slot, and that is the test S12 runs (no accessor on the agenda is needed).",
]
# Check values (specs/demography/selftest_m2_f1.py asserts them; every integer exact).
# V-SF-24 report values (MAJ-3; MIN-2; round 3 MIN-2): births per married woman-year over M n(a), per band, from the
# chain WITH mortality and widowhood at e0 = 30 (the population the isolation run measures) at the default. Banding,
# exactly: a birth counts in the band of the mother's age at the BIRTH INSTANT (band_of(birth_tick - mother.birth_tick)),
# and a married woman-day in the band of her age that day; the rate itself is set by her band at the conception pulse.
# Mothers are born at any instant of a month, so in the chain (whose months sit on the pulse grid) the last month of
# each band index falls half in the next band, births and married time alike. The reference's check 7 pins the values
# to three digits; the measured values are compared within 5%, 15% at 45-49.
report_ratios = ["0.848", "0.968", "1.009", "1.016", "1.035", "1.146", "2.030"]
check_values = { tfr_default = "4.9", tfr1_bits = 615614, m_bits_at_default = 34186, conception_bits_at_default = [119397409, 143118858, 128689234, 112318286, 83490541, 36474834, 4576314], sex_male_bits = 2199861298 }
# Facts the plan's acceptance criteria use (the reference proves them, checks 5 and 7; REV-SPR-015 MIN-1, MAJ-3):
#   * With the rung-0 schedule at e0 = 30 and WIDOWHOOD (the husband 3 years older on the same schedule, a widow
#     re-entering at her band's N1 probability: the 42-state chain of the reference), NRR = 1 at tfr = 4.74 and the
#     default 4.9 gives NRR = 1.034, r = +0.11% a year, near the middle of V-SF-01's band [-0.1%, +0.3%]; without
#     widowhood (the husband never dies: the round-1 approximation) 4.9 gives +0.30% and 4.7 gives +0.16%, and the
#     chain's r at 4.7 is -0.03%. SPR-015 confirms the default on the hamlet and the 10,000-founder fixture; a change
#     of default is C3 (it moves every rung's golden).
#   * The default's conception probabilities per susceptible month are 0.028, 0.033, 0.030, 0.026, 0.019, 0.008, 0.001
#     for the seven bands: a 20-24-year-old married woman conceives after 30 months on average and bears about one child
#     every 50 months at M = 0.52 (the long-run rate 0.24 a year). This is the MIN-10 trade-off the director sees in Q5:
#     early universal marriage plus e0 = 30 forces marital fertility to half of natural fertility and spaces siblings
#     about 50 months apart, where natural-fertility populations show about 30; the Hajnal pattern (F2) trades the
#     marriage age for the interval.
#   * Births per married woman-year by the mother's age at birth are NOT M n(a): the chain with mortality and widowhood
#     gives the report_ratios above for the seven bands at the default (0.85 at 15-19: the nine-month lag after
#     marriage; 2.03 at 45-49: banding at birth while the rate is set at conception, a band whose rate is seven times
#     the next one's, and the reviewer's independent chain gives the same 2.03). Without mortality the figures are
#     0.85 .. 1.92, and at tfr 4.7 they are the same to two digits (the shape hardly depends on the level while c_i is
#     small). V-SF-24's identity is therefore conceptions per susceptible woman-month = c_i, by band at conception;
#     the age shape is a report against these per-band values within 5% (15% at 45-49; check 7).

[algorithm.parameters_f1]
# What F1 compiles from the manifest (REV-SPR-015 R1: the normative home of the S2 sentence this draft amends).
version = "m2-f1-parameters-v1"
steps = [
  "P1 Read set. F1 reads six parameters, each filled by rh_manifest::compile from the manifest literal (ruling 9: exact decimal, round half to even), else from the Registry default (registry_delta.toml): e0 (Q16_16 years; default 30; [algorithm.mortality_f1] MR2), brass_beta (Q16_16; any value in the Registry bounds [0.6, 1.65] at F1, MR2 and MR3; default 1), density_capacity (a count, u64, type = \"count\" in [[params]]: a non-integer literal is a load error naming it; default 10,000,000; MR2, MR11), density_mortality_slope (Q16_16; default 1.0; MR11), tfr (Q16_16; default 4.9; F2, F3) and elite_fertility_mult (Q16_16; default 1.0; F3, F4). A parameter F1 reads with neither is a load error naming it, so the compiled WorldSpec holds no optional parameter (Architect ruling on PR #37). brass_alpha stays refused at load by name at F1 as at rung 0 (DV-SPR016-2: e0 is the level and K = exp(2 alpha) its image). eps_f and eps_m are not read and not compiled until M4's first spec (P1.5a). Interim rule (REV-SPR-016-FOLD R3): until SPR-016's code lands, F1 runs [algorithm.mortality_rung0] for everyone, newborns included, rh_manifest::compile refuses brass_beta != 1 as SPR-011 T-04 built it, and density_capacity and density_mortality_slope are not yet compiled; INV-M2-20 and INV-M2-21 apply from SPR-016. 0.3.0 is frozen in SPR-016's PR, after SPR-015's.",
  "P2 Exactness. Each value is the exact decimal of its literal rounded half to even to Q16_16 (SPR-011 ruling 9), checked against the Registry bounds at load; a value outside them is a load error.",
]

[algorithm.partnering_f1]
# F1 partnering (SPR-015; ADR-0026 item 4 "minimal partnering in M2 F1, so that fathers exist"). Same rules as above.
version = "m2-f1-partnering-v1"
constants = { nuptiality_thousandths = [18, 35, 24, 11, 5, 2, 2], min_age_f_years = 15, min_age_m_years = 18, gap_years = [-5, 15] }
steps = [
  "N1 Nuptiality standard (compiled-in constants `constants.nuptiality_thousandths`; design values). Monthly probability that an unmarried woman marries, by the F0 bands 15-19 .. 45-49, in thousandths: 18, 35, 24, 11, 5, 2, 2; held as Prob32 bits mu_i = rhe(2^32 x thousandths / 1000) (check_values). Zero outside the bands (no marriage under 15 or at 50 and over). The pattern is the early, near-universal one: the pattern Hajnal (1965) sets against the European one that R09 §2 B summarises (late female marriage, 10-20% never marrying); the numbers are unsourced (cited in kind; Q1). Shape (the reference's check 4): mean age at first marriage 18.8 years, 66% married by 20, 96% by 25, 99.7% ever married by 50; V-SF-25's band is [18, 22] and >= 90%. A culture-declared pattern (Hajnal's late one) is F2's marriage market.",
  "N2 Ages for M2's own draws (`constants`): a woman draws from MIN_AGE_F = 15 years, a man is a candidate from MIN_AGE_M = 18 years (design values). They bind M2's partnering only: a Marry command follows its sender's rule (T1's marriage_min_age, Registry bounds [12, 20]) and N7 does not re-check ages on it (REV-SPR-015 MIN-5). Preferred age gap: husband older by between -5 and +15 years (design values).",
  "N3 Eligible women at the Month pulse t_m, visited in ascending person.id: alive, female, spouse = 0, band not none (15 <= age < 50), person.named = 0 (T1 marries named actors by its Marry command; neutral 0 when T1 is absent), person.vocation != holy_orders (M7; neutral none). A widow is eligible at once (no waiting period; her remarriage interval emerges from the hazard) at the first-marriage probability of her band (decision F1-D7, not_yet).",
  "N4 Draws and the husband. Stream key as [[rng]] marriage_time with t = t_m, entity = the woman w. k = 0: draw d0; she seeks a husband this month iff d0 hits mu_i. Exactly one k = 0 draw per eligible woman per month. On a hit, the candidates: every man alive with spouse = 0, age >= MIN_AGE_M, person.named = 0, vocation != holy_orders, not matched earlier in this step (a per-step set), not kin of the woman within two degrees over the life-course log (her father, son, brother or half-brother, grandfather, grandson: the set kin(w, 2) of the effect language, which M2 computes over its own mother and father columns, the dead included), of the bride's settlement (person.residence(h) = person.residence(w) when both are not 0; a residence of 0, the neutral of an unregistered S3, restricts nothing: REV-SPR-018 R8, no residence moves in P1a), and with birth_tick in [w.birth_tick - 15 Y, w.birth_tick + 5 Y] (the preferred gap); if that list is empty, the same list without the gap condition (the settlement condition stays); if still empty, no marriage this month (the k = 0 hit is spent; she draws again next month). The husband is the candidate h with the least draw of the keyed stream [[rng]] husband_pick (entity = w, t = t_m, k = h; ties, a 64-bit coincidence, to the lower h): uniform over the candidates and CRN-stable, since one man more or less in the pool changes w's match only when he is the least (REV-SPR-015 MIN-8, R16; ADR-0026; V-DET-17); the key carries the branch salt, so a fork re-ranks at the next pulse, and w's epoch once BCK-002 A-29 puts the epoch into StepCtx's pulse draws (epoch 0 until then), so a scoped input re-ranks from then on. k = 1: n = n_m; j = 1 + floor(d1 (n - 1) / 2^64); tau = t_m + 1440 j, a day start of this month other than the pulse instant (as S9).",
  "N5 Timer. M2 inserts one agenda timer at (tau, Vital): owner M2, purpose marriage_time, kind 3 (MARRIAGE_TIMER), about the woman, payload = h as i64. h joins the step's matched set. Nothing is written to the ledger at the pulse: both stay unmarried until the timer fires, and a death of either before tau drops it (N7). No cross-month state is needed: the timer lies inside the month, so at the next Month pulse it has fired or been dropped.",
  "N6 Re-sample (resample_on_fork; ADR-0025 item 3). A material input at t_in that scopes the woman while the timer is pending cancels it, and resample_timer re-draws through ResampleCtx (purpose marriage_time, the epoch after the input, t = t_in), k = 0 of the re-sample: the candidates are the month's day starts strictly after t_in and before t_(m+1); with c >= 1, tau' = s_(1 + floor(d c / 2^64)), the husband kept (the payload); with c = 0 the timer is dropped (both draw again next month: a marriage, unlike a birth, is not owed). An input that scopes the man re-samples nothing here.",
  "N7 apply_marry(a, b, now, source), in fire at an M2 marriage timer's instant (source = M2: a = the payload's husband, b = the woman the timer is about), or in the Day/Vital drain for a Marry command (source = the sender, whose timer submitted it in this instant; a, b as given, normalised so that a is the male: a same-sex pair fails the first precondition). Preconditions, all checked against the ledger at this point of the slot (the newborns and the dead of the slot as F10): both rows present with alive = 1; a male and b female; a.spouse = 0 and b.spouse = 0; neither has vocation holy_orders; b is not in kin(a, 2) over the life-course log; and, for source = M2 only, a's age >= MIN_AGE_M and b's >= MIN_AGE_F (a command follows its sender's age rule, N2). A failed precondition drops the marriage with a report naming the source, a, b and the instant (INV-M2-05's rule): a timer whose party died, a command for a married or dead person, a command racing M2's own timer for the same man (the timer fired first in this slot and wins). No settlement precondition applies to a command: a Marry from T1 may pair two settlements, and the household then spans both for as long as P1a has no residence moves, a P1a limitation that S3 F1's moves (P1b) lift (REV-SPR-015 R17.7). Effects: a.spouse := b; b.spouse := a; append the marriage row {husband = a, wife = b, start_tick = now, end_tick = i64::MAX, source = partnering for M2's timer, command for a Marry command}; households ([algorithm.households_f1] H3): if household(a).head = a then b and every member of the household b headed, if she headed one, move to a's household and hers is dissolved; else if household(b).head = b then a and the members of the household a headed, if any, move to b's and his is dissolved; else a new household {id = H64(household/v1, [a, now]), head = a, formed_tick = now, dissolved_tick = i64::MAX} and a.household := b.household := it (a household left empty by either move is dissolved: dissolved_tick := now, head := 0). Emit MARRIAGE (actor = a, target = b; payload []).",
]
check_values = { nuptiality_bits = [77309411, 150323855, 103079215, 47244640, 21474836, 8589935, 8589935] }

[algorithm.households_f1]
# Minimal households (SPR-015). Membership only; no place, no stocks (M4 F0 holdings in P1b read person.household).
version = "m2-f1-households-v1"
steps = [
  "H1 Identity. HouseholdId = H64 over the rh-ids domain tag rehoboam/rh-ids/household/v1 of [founding head PersonId, formation tick as u64] (05.2 §1; accepted as an additive rh-ids layout, R11 Q3). A collision with an id already in the table rehashes with c = 1, 2, ... as PersonIds do (rh-ids household/rehash/v1), so a runtime marriage never fails on it; 0 is never a HouseholdId. Rows sorted ascending by household.id; never removed.",
  "H2 Genesis (rh-worldgen, [initialization]). For each manifest household, in manifest order: a row {id = H64(household/v1, [head, 0]), head, formed_tick = 0, dissolved_tick = i64::MAX}; the head, every cast member whose `household` names it, and its children and servants get person.household = it. Every other founder gets a one-person household {id = H64(household/v1, [founder, 0]), head = the founder}. If the household's head and exactly one other adult (age >= MIN_AGE_M or MIN_AGE_F by sex) cast member of the other sex belong to it, they are married at genesis: spouse columns set, a marriage row {start_tick = 0, source = genesis} (the pre-epoch start is not known; spin-up history is discarded, 05.2 §1), and the household's `children` get mother := the wife and father := the husband in person.* and life_course.* (so that siblings never marry: N4's kin rule reads these), and the wife's parity := their count. Otherwise the children get mother = father = 0 as at rung 0. Servants get no parents and are members of the household (ruling 10; REV-SPR-015 MIN-6). SPR-019: the anonymous rest of a people and the dynasties get their households from [algorithm.population_synthesis] P8 and P11 (a couple's or a single's household in this genesis form, formed_tick = 0) and [algorithm.dynastic_backfill] B5 (a back-filled couple's household carries its pre-epoch marriage tick), not from this step. (household.yaml: Oswin and Maren married, their three children's parents, and the unrelated founder Wulf in his own household (R8: a rung that cannot persist teaches nothing); hamlet.yaml: Job and his wife, ten children and 30 servants in job_house, and the 14 others each their own household; solo.yaml: Ada alone.)",
  "H3 Marriage. N7's household rule: the couple lives in the household the husband heads, else the one the wife heads, else a new one headed by the husband; a head who marries into another household takes every member of the household it headed along, and that household is dissolved.",
  "H4 Death (after S12, in the same apply_death fire, for each dead d in turn). (a) Spouse: if d.spouse = s != 0 then s.spouse := 0 and the open marriage row of (d, s) gets end_tick := now (written once; if s dies in the same slot, its own apply_death finds d.spouse already 0 and the row closed). (b) Headship: h = d.household; if household(h).head = d: head := s if s is alive (alive = 1 at this point) and s.household = h; else the member of h with alive = 1 and the least (birth_tick, person_id) (the oldest; ties by id; the newborns of this slot count, F10); else there is no living member: head := 0 and dissolved_tick := now (F9 re-opens it if a child of d is born later in the slot). Children stay in their household whoever heads it (an orphan child may head a household of children: V-SF-18 counts it). (c) Timers: a pending BIRTH_TIMER about d is not cancelled; F9 drops it when it fires. A pending MARRIAGE_TIMER about d or naming d as husband is not cancelled; N7 drops it. (d) EXTINCTION as S12.",
  "H5 Birth. F9: the child joins the mother's household.",
  "H6 Restart. The household table, the marriage log, the ledger columns and the pending timers restore everything; M2's spouse and children-by-parent lookups are caches rebuilt from the log at construction.",
]

[algorithm.lifecycle_f1]
# The drain of M2's command queue (EVO-001; REV-EVO-001 R9: shape (b), REV-SPR-015 R12). A command that carries an
# outcome sampled for a later instant is never submitted ahead of that instant: the sender holds the outcome as its own
# plane-A timer under its own purpose (M7's murder_due at (the drawn day, Vital); T1's one-day timer from its Day/Vital
# binding) and the timer submits the command when it fires, in the timer pass of that instant, before M2's drain in
# the same Vital. Re-sampling is the sender's resample_timer under the sender's purpose; the cause fields travel in the
# command. DET-13 and ADR-0025 stand as written. M2 holds nothing and draws nothing for a commanded outcome.
version = "m2-f1-lifecycle-v2"
steps = [
  "L1 Drain. M2's Day/Vital binding (drained_by) takes its whole inbox in key order (tick, phase, PersonId, seq) at the start of its step, after the slot's timer pass. rh-core has already dropped every command whose key person has no ledger row or alive = 0 (key = living; BCK-002 A-30; EVO-001); M2 drops and counts, per (sender, command, reason): a ScheduleDeath with cause = none (INV-M2-05), a Marry failing N7's preconditions (a command carries no date: its sender's timer submitted it in this instant, 05.1 §2 rule 2; nothing is ever held).",
  "L2 Apply. Every remaining command is applied in this step: ScheduleDeath through apply_death(victim, cause, culprit, cause_event) (S12 as amended, then H4), Marry through apply_marry (N7, source = the sender). The step's own order is the inbox's key order, after every timer of the slot, so a natural death timer of the same instant has already taken effect (S12 then drops the command's death as a second death of the same person, counted) and a commanded death cancels the victim's later DEATH_TIMER (S12).",
  "L3 Age. A command waits at most until M2's next Day/Vital binding: at most one day in P1a, where every sender submits at a day start; the queue-age invariant (A-31) holds by construction, and a violation means a skipped drain.",
  "L4 Shape (a), not chosen (REV-SPR-015 R12): M2 would hold a later-dated command in an M2-owned pending table with a timer that keeps its tick on a re-sample; that needs an amendment of ADR-0025 item 3 and DET-13 for queued commands (REV-SPR-015 §4) and was withdrawn with EVO-001's D39. Recorded so that the choice is visible; nothing of it is in this spec.",
]

[algorithm.mortality_f1]
# F1 mortality (SPR-016; PR #51, 05.1 §6 item 4 v1.10). Stated as [algorithm.mortality_rung0] is. Every quantity is an
# exact integer; every width is the smallest standard width that holds every intermediate; every division is rounded
# exactly once, as stated. The only non-rational functions are the exp and ln of 05.1 §6 item 4: integer procedures with
# a stated error bound, evaluated at construction on fixed grids (and, from P1.5a, once per household per month), never
# per person per month. The exact reference (specs/demography/selftest_m2_f1_mortality.py, golden file
# specs/demography/golden/m2_f1_mortality.txt) reproduces every step bit for bit and asserts the check values; SPR-016's
# bin/gen_m2_reference.py ports it and generates the golden vectors the crate replays. Data: brass_general_standard.toml
# (MR1), infant_sub_schedule.toml (MR7). Steps are MR0-MR13 because M1-M9 are system ids and S, F, N, H, L are taken.
# At F1 the crate forms the month's probability by this table. Rung 0's table above is the frozen statement SPR-012
# built against (its arithmetic S0-S11 untouched; S2 and S12 amended, under m2-rung0-v1.1), and is the special case beta = 1, N <= K_cap, no newborn, ages 1 to 90 of this one:
# there MR3-MR6 compute S3-S6's integers (the odds grid is the exact rational one, by pow(x, 1) = x), MR9 is S7 on
# the same grid points, MR10 is S8 and MR11 is the identity, which the reference's check 1 proves bit for bit at every
# sampled minute of age on both calendars. F1 differs from rung 0 exactly (i) below age 1, where MR7's knots carry the
# year's deaths (l(0) and l(1) unchanged) and MR10 starts a newborn's hazard at its birth, (ii) above 90, where MR8's
# logistic tail runs to 120 with death certain from the first knot where survivorship rounds to 0, and (iii) above the
# capacity, where MR11 raises q. Where the P1a goldens move when SPR-016 merges: a founder under one year old, a child
# born since SPR-015 (its first months) or a person aged over 90 - D at a pulse draws against a different q; nothing
# else (SPR-016 is C3 and announces the change with its evidence). The monthly q steps at every grid
# boundary (e0 30, beta 1: under 7% from 50 to 72.5, -11.5% to -36% from 75 to 87.5, -31% at the join at 90, -57% at
# age 2): rung 0's linear-l sawtooth, kept on purpose (REV-SPR-016 R6; BCK-002 A-48 has the figures).
# Narrative, seam and design values: docs/05_architecture/systems/M2.demography_F1.md §8.
version = "m2-f1-v1"
steps = [
  "MR0 Rounding and the transcendentals. rhe(n / d) as S0 (n signed, d > 0, ties to even). exp(y) and ln(n / d) are 05.1 §6 item 4's functions on Q32_32 (an i64 with 32 fraction bits; results within 3/4 ulp, faithful), with their refusals: a refusal during construction is a load error naming the step. No float, no truncating cast, no other rounding.",
  "MR1 Standard. As S1: h_i = 2 a_i (u8) and s_i = 10^4 ls_i (u16) for the 71 grid ages. The interior odds O_i = (10^4 - s_i) / s_i, i = 1..69, exact rationals; their logarithms lambda_i = ln_ratio(10^4 - s_i, s_i) (Q32_32 bits, i64), 69 compiled-in constants that the reference pins (lambda_1 = ln(0.1766...) < 0, lambda_69 = ln 9999 = 9.2102...).",
  "MR2 Parameters. E = e0 bits (Q16_16, as S2; the Registry default 30 when the manifest sets none). B = brass_beta bits (Q16_16), in the Registry bounds [0.6, 1.65] (bits 39322 to 108134, rounded half to even from the literal; the manifest validator checks the decimal against the bounds). brass_alpha set in a manifest is refused at load by name (DV-SPR016-2). K_cap = density_capacity (a count, u64, declared type = \"count\" in [[params]]: the manifest literal must be an integer and a non-integer literal is a load error naming the parameter, since the manifest validator checks bounds only; the generated skeleton types it u64; default 10,000,000) and S_d = density_mortality_slope bits (Q16_16; default 1.0 = 65536). eps_m is not read (MR11). rh_manifest::compile fills each of these from the manifest, else from the Registry default, as SPR-011 T-04 does; tfr and elite_fertility_mult are births' ([algorithm.fertility_f1] F2, F3); eps_f is unread until P1.5a.",
  "MR3 Odds grid. For i = 1..69: if B = 65536 (beta exactly 1) then W_i is the exact rational O_i and MR4 uses its rational form (pow(x, 1) = x exactly, as IEEE 754's pow: the rung-0 schedule is reproduced bit for bit); otherwise w_i = exp(rhe(B lambda_i / 2^16)) (the product has 48 fraction bits and is rounded once to 32; exp's argument is in [-2.9, 15.2] inside the bounds (beta lambda_1 at beta 1.65 to beta lambda_69 at beta 1.65), within its domain y <= 16), a u64 with 32 fraction bits (w_i < 2^54: W_69 <= 9999^1.65 < 4 x 10^6). w_0 = 0 and w_70 = infinity stand for l = 1 and l = 0.",
  "MR4 Survivors at a grid age for a level k (K = k / 2^32, k a u64 in [0, 2^40]). L_0(k) = 2^32; L_70(k) = 0; for i = 1..69: rational form (beta = 1) L_i(k) = rhe(s_i 2^64 / (s_i 2^32 + k (10^4 - s_i))) (S3 verbatim; numerator < 2^78, denominator < 2^54); power form L_i(k) = rhe(2^96 / (2^64 + k w_i)) (numerator 2^96, k w_i < 2^94, denominator < 2^95: u128). Both are 2^32 / (1 + K W_i) rounded once; L_i(k) is in [0, 2^32], non-increasing in i and in k.",
  "MR5 Level from e0. The trapezoid T(k) over the 71 grid points (S4 verbatim, with M4's L_i(k)) and the 40-step bisection (S5 verbatim): K = the largest k with T(k) >= E 2^18. The infant knots and the tail do not enter the bisection: the compiled e0 is the Brass e0 of (K, beta) on the standard grid, so at beta = 1 K is rung 0's K exactly (the seven check values of mortality_rung0 hold). The F1 schedule's own trapezoid e0 differs from E by the infant redistribution (-0.06 years at e0 = 30) and by the tail's life past Brass's l(100) = 0 (+0.003 years at e0 = 30, +0.5 at e0 = 85); the reference measures it (check 8). Bracketing holds at every corner of the bounds (check 3): T(1) / 2^34 > 85 and T(2^40) / 2^34 < 20 years for beta in [0.6, 1.65]. Computed once, at construction.",
  "MR6 Brass schedule. L_i = L_i(K) for i = 0..70 (S6 verbatim).",
  "MR7 Infant sub-schedule. Thirteen knots at ages j Y / 12 minutes, j = 0..12 (Y the calendar's minutes per year, divisible by 12 for both calendars: 43200 and 43800 per knot). q0 = 2^32 - L_1 (the year's Prob32). c_j = cumulative_share_q16[j] from specs/demography/infant_sub_schedule.toml (13 u16 constants: c_0 = 0, c_12 = 65536, non-decreasing; Bourgeois-Pichat's biometric law with endogenous share 0.15, a design table, DV-SPR016-4). I_j = 2^32 - rhe(q0 c_j / 2^16): I_0 = 2^32, I_12 = L_1 exactly, non-increasing. The grid's age-0 and age-1 points are these knots; q(0) = q0 is unchanged from rung 0, only its timing within the year moves (32% of it in the first month).",
  "MR8 Old-age tail (Beard's Perks logistic, R12 §9 p. 59: mu(u) = a e^{b u} / (1 + a e^{b u}), the simplest member of Perks's family, bounded; the Gompertz mu = B c^x is unbounded and Brass's own grid reaches l = 0 at 100). Anchor: age 90 = grid index 66, with L_65 (87.5), L_66 (90), L_67 (92.5), all > 0 and strictly decreasing inside the bounds (L_i >= 4 since K W_i < 2^30; a violation is a construction error naming MR8). Brass's per-year interval hazards: m1 = rhe(2 ln_ratio(L_65, L_66) / 5), m2 = rhe(2 ln_ratio(L_66, L_67) / 5) (Q32_32; 2.5 years = 5 half-years). m2 > m1 for every K > 0 and beta > 0 (proof: with r1 = W_66 / W_65 < r2 = W_67 / W_66 and u = K W_66, (1 + u r2) / (1 + u) > (1 + u r1) / (1 + u) >= r1 (1 + u) / (r1 + u) because (1 + u r1)(r1 + u) - r1 (1 + u)^2 = u (1 - r1)^2 >= 0). The hazard at 90: mu = rhe((m1 + m2) / 2), which must be < 2^32 (one per year; it is at most 0.55 inside the bounds; otherwise a construction error naming MR8). a = rhe(mu 2^32 / (2^32 - mu)). The log-slope g = rhe(2 ln_ratio(m2, m1) / 5) > 0 and b = rhe(g 2^32 / (2^32 - mu)) (the logistic's d ln mu / du at u = 0 is b (1 - mu), matched to Brass's g); b (120 - 90) <= 16 2^32 must hold (exp's domain; it is at most 0.17 x 30 inside the bounds; otherwise a construction error naming MR8). Knots at ages 90 Y + j Y / 12 minutes, j = 0..360: T_0 = L_66; for j = 1..359: E_j = exp(rhe(b j / 12)); A_j = 2^32 + rhe(a E_j / 2^32) (1 + a e^{b u}, Q32_32, < 2^44); R_j = ln_ratio(2^32 + a, A_j) (<= 0); y_j = rhe(R_j 2^32 / b) (ln S(u) = (1 / b) ln((1 + a) / (1 + a e^{b u})), the closed form of the logistic's survival); S_j = exp(y_j) (0 when y_j < -23 2^32, exp's rule); T_j = min(T_(j-1), rhe(L_66 S_j / 2^32)) (forced non-increasing: faithful rounding is not monotone below 2^-27); T_360 = 0, the cap: no knot lies past 120. Death becomes certain at the first knot j_0 where T_j = 0 (REV-SPR-016 R2): rhe rounds L_66 S_j / 2^32 to 0 once L_66 S_j < 2^31 (S_j in bits), that is once S(u) < 1 / (2 L_66) with L_66 in bits (2^-33 / l_90 for the survivorship l_90 = L_66 / 2^32 as a fraction), which the closed form puts at u_0 = (1 / b) ln(((1 + a) (2 L_66)^b - 1) / a) years past 90 (L_66 in bits); j_0 = the first j with u_j past u_0, or 360 when u_0 is past 30 years (the cap reaches 0 first: T_360 = 0 by construction). The exact value is the knot index; the reference checks that u_0 lies within 2 knots of it, or past the cap where j_0 = 360 (check 4). At e0 30, beta 1 j_0 = 360 (T_359 = 15 bits); over the Registry box j_0 falls to 234 (109.5 years) at e0 20, beta 1.65: check_values gives l_zero_twelfths = 1080 + j_0 per design point and the reference asserts l > 0 at the knot before j_0 and l = 0 at j_0 (check 4); between those two knots MR9's interpolation toward 0 can itself round to 0 a few minutes early when T_(j_0 - 1) is a few bits, so the exact statement is: l(x) = 0 at every age from knot j_0, l(x) > 0 at every knot below it, and q = 2^32 if and only if l(x + D) = 0 (MR10). The grid points 92.5, 95, 97.5 and 100 are not knots. Continuity: l(90) = L_66 exactly; the tail's first-month hazard is within 1% of mu (check 4). The monthly q is not continuous at 90: it drops by about 31% at e0 30 (0.0392 to 0.0271), because the linear-l tooth [87.5, 90] of rung 0's S7 ends at a hazard 48% above the mid-interval hazard the tail starts from; rung 0 has a tooth at every grid boundary (at e0 30: under 7% from 50 to 72.5, -11.5% at 75, -22% at 77.5, -20% at 80, -27% at 82.5, -32% at 85, -36% at 87.5, and -57% at age 2; at e0 85 the teeth run the other way, +17% to +56%; BCK-002 A-48), so the join is one more tooth, not a new artefact (REV-SPR-016 R6: docs/05_architecture/systems/M2.demography_F1.md §8.2).",
  "MR9 Knots and survivors at an age in minutes. The knot ages, in twelfths of a year (exact minutes for both calendars: twelfth x Y / 12): the infant knots 0..12, the grid ages 2..90 (h_i / 2 years for i = 2..66), the tail knots 90 + j / 12 for j = 1..360: 438 knots, strictly increasing in age (0 to 120 years), non-increasing in survivorship (2^32 to 0). For an age x (i64 minutes, x >= 0; negative is an error): if x >= 120 Y then l(x) = 0 (the cap; l reaches 0 at the knot j_0 of MR8, at or before 120); otherwise, for the unique knot interval [A_j, A_(j+1)) holding x, l(x) = T_j + rhe((T_(j+1) - T_j)(x - A_j) / (A_(j+1) - A_j)) (S7's rule; |T_(j+1) - T_j| <= 2^32 and x - A_j < 2.5 x 525600 < 2^21, so the product is < 2^53, i64). l(x) is in [0, 2^32] and non-increasing in x; on [Y, 90 Y] it is rung 0's S7 value at every minute when beta = 1 (check 1).",
  "MR10 Monthly probability. As S8, with MR9's l: at the Month pulse instant t_m with month length D (minutes), a living person with birth tick b has x = t_m - b; q = 2^32 if l(x) = 0, else rhe(2^32 (l(x) - l(x + D)) / l(x)) (numerator u128). q is a Prob32 (bits in [0, 2^32]); q = 2^32 if and only if l(x + D) = 0, which holds from the zero knot j_0 of MR8 (at the latest when x + D >= 120 Y), and q = 0 if and only if l(x + D) = l(x). A newborn's first draw (the seam with births: docs/05_architecture/systems/M2.demography_F1.md §8.1): if m >= 1 and b > t_(m-1) (born since the previous Month pulse; a founder's birth tick is at or before the epoch, so never a founder), the probability covers [0, x + D) instead of [x, x + D): q = rhe(2^32 (2^32 - l(x + D)) / 2^32) = 2^32 - l(x + D) exactly. Without it a child born inside a month would carry no hazard for its first x minutes (SPR-015 as drafted; closed by SPR-016).",
  "MR11 Density modifier and the entitlement hook. Once per Month pulse, before any draw: N = the number of ledger rows with alive = 1 at that instant (M2's own column, so no coupling and no lag). The density term m_d (Q16_16 bits): if N <= K_cap then m_d = 65536 exactly; else m_d = min(4 x 65536, 65536 + rhe(S_d (N - K_cap) / K_cap)) (S_d < 2^18 and N - K_cap < 2^24, so the product is a u64 < 2^42; a one-sided positive check: 1 + slope (N / K_cap - 1), ceiling 4; R09 §2's d (1 + x) above capacity only; DV-SPR016-1). Per person: q' = min(2^32, rhe(q m_d / 2^16)); with m_d = 65536, q' = q exactly, so rung 0's draws are unchanged at or under the capacity. Form: a multiplier on the monthly probability, exact in integers at one multiply per person-month; it is the first-order form of a proportional hazard, 1 - (1 - q)^m, whose relative difference is (m - 1) q / 2 (below 1% wherever q < 0.02 / (m - 1): at m = 2 that is q < 0.02 per month, which at e0 = 30 (beta 1) excludes the first six months of life, the ends of rung 0's linear-l teeth from 84.4 and every month from 87.9; at the ceiling m = 4 it is q < 0.0067, which excludes ages 0 to 1.9 and every age from 69.4). The entitlement term, R09 §2's form q'' = 1 - (1 - q')(y / y*)^eps_m, clamped: once per household per month, with w = the household's entitlement ratio y / y* (Q16_16 bits; the read, its in-coupling and its isolation forcing come with M4's first spec, P1.5a: REV-SPR-016-FOLD R2) clamped first to [19661, 65536] (0.3 to 1.0, the data range that coupling states: ln_ratio never sees 0) and eps = eps_m bits (Q16_16, < 2^18): f = 2^32 if w = 65536, else f = exp(rhe(eps ln_ratio(w, 65536) / 2^16)) (the product is an i128 < 2^52; f a Q32_32 in (0, 2^32); the argument is in [-3.7, 0], within exp's domain); per member q'' = 2^32 - rhe((2^32 - q') f / 2^32) (numerator < 2^64; q'' in [q', 2^32]). With f = 2^32, q'' = q' exactly. In P1a the term is not evaluated: the read does not exist yet (M4's first spec declares the column; until then w = 65536 by definition, f = 2^32 and the factor is exactly 1), eps_m is not compiled (the Registry delta keeps it unread), and q'' = q'; P1.5a turns the evaluation on with eps_m's default, which is then a C3 change on no P1a golden (every P1a household has the neutral ratio).",
  "MR12 Draws, timer, re-sample. S9, S10 and S11 verbatim, on q'' instead of q: k = 0 hits iff q'' = 2^32 or d0 < q'' 2^32, exactly one k = 0 draw per living person per month; k = 1 the day start inside the month; the timer at (tau, Vital); the re-sample through ResampleCtx: with t_m the pending month's pulse, t_end its end, x = t_m - b, x0 = t_in - b, x1 = t_end - b, the base probability is S11's q_r = 2^32 if l(x0) = 0, else rhe(2^32 (l(x0) - l(x1)) / l(x0)); for a person whose pending timer was drawn under MR10's newborn rule (b > t_(m-1)), the deferred exposure [0, x) stays charged and only [x, x0) counts as survived: q_r = 2^32 if l(x0) = 0, else 2^32 - rhe(l(x) l(x1) / l(x0)) (REV-SPR-016 R4; the product is < 2^64; this is 1 - (l(x) / l(0)) (l(x1) / l(x0)), not 2^32 - l(x1), which would charge [x, x0) twice, and not S11's conditional, which would drop the deferred [0, x): check 7 pins all three readings on one case, born 20 days before the pulse, input 25 days into the month, at e0 30: 0.0662 against 0.1130 and 0.0064). MR11's terms in a re-sample: N is the living count at the start of the Inputs phase of t_in, before the input's own effects, counted once per input (REV-SPR-016 MIN-7); the entitlement term as at the pulse. q'' from q_r as in MR11; nothing is stored.",
  "MR13 apply_death. S12 verbatim, then births' H4 ([algorithm.households_f1]): the single death path for every cause.",
]
# Check values (from the exact reference; selftest_m2_f1_mortality.py asserts them). K, a and b are in units of 2^-32;
# K at beta = 1 equals mortality_rung0's. a = mu(90) / (1 - mu(90)); b per year; l_zero_twelfths = the age in twelfths
# of a year of the first knot where l = 0 (1440 = the cap at 120).
check_values = [
  { e0 = "30", beta = "1", K = 9582773732, tail_a = 2113825997, tail_b = 155061017, l_zero_twelfths = 1440 },
  { e0 = "30", beta = "0.8", K = 8976400291, tail_a = 1526879409, tail_b = 148737350, l_zero_twelfths = 1440 },
  { e0 = "30", beta = "1.3", K = 10833527583, tail_a = 3239314466, tail_b = 176323153, l_zero_twelfths = 1408 },
  { e0 = "23.441086", beta = "1", K = 14649764166, tail_a = 2117578026, tail_b = 152752039, l_zero_twelfths = 1440 },
  { e0 = "60", beta = "1.65", K = 1195340568, tail_a = 5152537621, tail_b = 224241131, l_zero_twelfths = 1361 },
  { e0 = "85", beta = "0.6", K = 219332176, tail_a = 476725642, tail_b = 580391773, l_zero_twelfths = 1440 },
  { e0 = "20", beta = "1.65", K = 27498377919, tail_a = 5166640489, tail_b = 218892643, l_zero_twelfths = 1314 },
  { e0 = "85", beta = "1.65", K = 9586827, tail_a = 3877905714, tail_b = 720402679, l_zero_twelfths = 1381 },
]
# Facts of the F1 schedule the plan's acceptance criteria must use (the reference proves them):
#   * At beta = 1 the seven K values of mortality_rung0 are reproduced, the 71 grid survivors are S3's bit for bit,
#     and l(x) equals S7's at every sampled minute of age from 1 to 90 years, on both calendars.
#   * e0 30, beta 1 (360-day calendar): q(0) = 0.2827 (unchanged); the first month's q = 0.0903, the twelfth month's
#     0.0143; age 10 q = 4.73e-4 per month (the golden file has the exact bits); mu(90) = 0.330 per year, b = 0.036
#     per year, survival 90 -> 100 = 2.4%, l(110) / l(90) = 2.5e-4; l reaches 0 at 120 (109.5 years at (20, 1.65)).
#   * A newborn's first draw: born 10 days before the pulse, q covers 40 days from birth (MR10; check 7); on the
#     365-day calendar a child born on 2 January draws on 1 February with x = 30 days and D = 28 (check 7).
#   * The re-sample of a newborn's pending timer (MR12): 0.0662 on the case born 20 days before the pulse with the
#     input 25 days in, against 0.1130 and 0.0064 for the two other readings (check 7, qresample vectors).
#   * V-SF-02 (q(15)) and its e0 band [23.441086, 36.569855] at beta = 1 are unchanged from rung 0.
#   * V-SF-02b at e0 30: l(65) / l(15) = 0.481 (beta 0.64), 0.315 (beta 1), 0.139 (beta 1.64).
#   * Widths at the bounds' extremes: k w_i < 2^94, MR4's numerator 2^96, knot products < 2^53, A_j < 2^44.

[initialization]
state = "rh-worldgen (SPR-011 ruling 10; extended by SPR-015 for F1) writes the founders: person.id = founder(seed, k) with the deterministic rehash, birth_tick from age_years (pre-epoch, with a keyed offset inside the year), sex as given or a keyed fair draw, alive = 1, death_tick = i64::MAX, death_cause = none; mother, father and spouse 0 except as [algorithm.households_f1] H2 states for a manifest household's couple and children; household per H2; parity = the number of manifest children whose mother she is, else 0; last_birth_tick = i64::MIN; conceived_tick = i64::MIN; unborn_father = 0; and one life_course row per founder (origin founder, sex, mother and father as person.*, birth_tick as person.birth_tick, entry_tick 0, exit open), in ascending PersonId; the household rows per H2; the genesis marriage rows per H2, in manifest household order. No timer and no pending command exist at genesis: the first Month pulse at tick 0 draws the first month's deaths, conceptions and marriages. SPR-019 (specs/worldgen/population_synthesis.toml, folded here at its freeze): for the anonymous rest of a people, [algorithm.population_synthesis] P1-P12 replaces ruling 10's sex and age draws (birth ticks from the compiled schedule's stationary age-sex marginal with keyed birthdays, couples by iterative proportional fitting, dependent children, households and residence); for a dynastic world, [algorithm.dynastic_backfill] B1-B11 first writes each dynasty's pre-epoch rows: a closed life-course row with entry_tick 0 and a pre-epoch exit_tick for the dead (so exit_tick < entry_tick marks a back-filled row; no ledger row, no event, no channel-A record), a ledger row for the living with spouse, household, parity and last_birth_tick as B11 states, the marriage and household rows with their pre-epoch ticks; the manifest cast and households stay as H2"
from_manifest = ["peoples", "cast", "households"]

[input_data]
drivers = []

[[params]]
name = "e0"
meaning = "Life expectancy at birth in years, a convenience converted to the Brass level K = exp(2 alpha) at the manifest's beta by [algorithm.mortality_f1] MR5 (at beta = 1 by [algorithm.mortality_rung0] S5: the same integer)"
source = "R12 §9; default 30: a design value inside V-SF-02's band (e0 in [23.441086, 36.569855], about [23.4, 36.6], at beta = 1), the value uz_job already uses (SPR-011 ruling 8)"
default = 30.0
[[params]]
name = "brass_alpha"
meaning = "Level of mortality on the logit scale. Refused at load at rung 0 and at F1 alike (DV-SPR016-2): e0 sets the level and K = exp(2 alpha) is its image, so any (alpha, beta) is reachable through e0 at the given beta ([algorithm.mortality_f1] MR5). P1b reads era-state shifts delta_alpha as K_eff = K exp(2 delta_alpha)"
source = "Brass 1971; observed -1.36 to 0.55"
[[params]]
name = "brass_beta"
meaning = "Slope (shape) of mortality on the logit scale: O(x)^beta on the General Standard ([algorithm.mortality_f1] MR3). Any value in the Registry bounds; 1 is the standard's own shape and reproduces rung 0 bit for bit (MR3, MR4)"
source = "Brass 1971; observed 0.64 to 1.64; default 1: the General Standard's own shape (SPR-011 ruling 8)"
default = 1.0
[[params]]
name = "tfr"
meaning = "Total fertility rate of a cohort under the F1 marriage pattern with no mortality ([algorithm.fertility_f1] F3): sets the Coale-Trussell level M = tfr / TFR1, TFR1 = 9.3935. The realised TFR is lower (widowhood, death before 50)"
source = "Design value 4.9: with widowhood (the reference's check 5, the 42-state chain at e0 = 30, husband 3 years older) NRR = 1 at tfr = 4.74 and 4.9 sits at r = +0.11% a year, near the middle of V-SF-01's band [-0.1, +0.3] (REV-SPR-015 MIN-1). R09 §2 gives the manifest range [1.2, 7.5] and the hard guard on r; SPR-015 confirms the default on the hamlet and the 10,000-founder fixture (a default change is C3). The director's Q5 carries this number and the birth-interval trade-off (MIN-10)"
default = 4.9
[[params]]
name = "eps_f"
meaning = "Fertility response to food entitlement (P1.5a): the exponent of fertility's hook, one Q16_16 factor on the level M, which shares mortality's read of M4's household entitlement ratio ([algorithm.mortality_f1] MR11; the read comes with M4's first spec); its step comes in P1.5a. Not read at F1; no default"
source = "R09"
[[params]]
name = "eps_m"
meaning = "Mortality response to food entitlement (P1.5a): the exponent of R09 §2's survival factor in [algorithm.mortality_f1] MR11, declared there and not evaluated until M4 F0 registers. Not read at F1; no default yet"
source = "R09"
[[params]]
name = "elite_fertility_mult"
meaning = "Multiplier on the fertility level M for a woman with an M7 house_member row ([algorithm.fertility_f1] F3, F4). 1.0 makes the read inert"
source = "Turchin & Nefedov 2009 (elite numbers outgrow commoners'; R12 §12); default 1.0: a design value, neutral until a band exists (V-SF-04 is gated from G4); the dynastic fixture world (SPR-030) may set it inside [1.0, 1.6]"
default = 1.0
# F1 mortality's two parameters (SPR-016; registry_delta.toml adds them with their defaults). Both inert in every P1a world.
[[params]]
name = "density_capacity"
type = "count"                 # an integer (u64 in the skeleton; a non-integer manifest literal is a load error, MR2); the default is q16_16
meaning = "The living count K_cap at and under which the density modifier is exactly 1 ([algorithm.mortality_f1] MR11); above it mortality rises linearly in N / K_cap - 1. A count (integer), compiled as u64, the world's one capacity in P1a (not_yet: settlement capacities from M1 F0 / M3). Default 10,000,000, the manifest's maximum population, so no P1a world is above it unless its manifest sets one: the P1a goldens do not move for it"
source = "R09 §2: density dependence d (1 + x), x = N / K - 1, which removed every extinction and bounded the band in R09's own simulation; V-SF-01 reads K for its population band [0.3, 5] K, and gets no support from this term until a manifest sets a capacity (SPR-030's dynastic world)"
default = 10000000
[[params]]
name = "density_mortality_slope"
meaning = "The slope of the density modifier above the capacity ([algorithm.mortality_f1] MR11): m_d = 1 + slope (N / K_cap - 1), capped at 4. A q16_16"
source = "R09 §2 uses slope 1 in its toy; a design value until SPR-028 calibrates it against V-SF-01 on the dynastic fixture world"
default = 1.0

[[submodels]]
name = "mortality"
summary = "[algorithm.mortality_f1] MR1-MR12: the odds grid O(x)^beta by fixed-point exp and ln (MR3); K from e0 by the rung-0 bisection on that grid (MR5); the infant sub-schedule (MR7) and the logistic tail to 120 (MR8) as knots in minutes of age; monthly q = 1 - l(x + D) / l(x) as Prob32 (MR10), a newborn's first draw from its birth; the density modifier and the stubbed entitlement term (MR11); one keyed Bernoulli per living person per month (k = 0) and a death timer at a keyed day start (k = 1). At beta = 1, under the capacity, ages 1 to 90, this is [algorithm.mortality_rung0] S1-S10 bit for bit"
earns_its_place_by = ["V-SF-02", "V-SF-02b", "V-INV-08"]
[[submodels]]
name = "apply_death"
summary = "[algorithm.mortality_rung0] S12 as amended, then [algorithm.households_f1] H4: the single death path for M2's timers and ScheduleDeath commands alike. Drops a death of an absent or already dead row (counted), writes the dead row and the life-course exit once, cancels the victim's own later death timer after a commanded death, emits DEATH (the culprit as actor and cause_event as cause for a commanded death) and, when the last living person dies and no child of the slot enters, EXTINCTION; then widows the spouse, closes the marriage row and moves the household's headship on"
earns_its_place_by = ["V-INV-01", "V-DATA-04", "V-SCALE-04", "V-INV-03"]
[[submodels]]
name = "fertility"
summary = "[algorithm.fertility_f1] F3-F8: M from tfr and TFR1; seven Prob32 conception probabilities per level, c_i = b_i / (12 - 20 b_i), so the long-run birth rate is M n(a) exactly; one keyed Bernoulli per susceptible married woman per month (k = 0); on a hit a birth timer at the start of a keyed day of the ninth month after this one (k = 1), the conception pulse in the payload, conceived_tick and unborn_father written"
earns_its_place_by = ["V-SF-24", "V-SF-01", "V-INV-08"]
[[submodels]]
name = "apply_birth"
summary = "[algorithm.fertility_f1] F9, F10: the single birth path. Drops the birth of a mother compacted before the instant, bears the child of a mother dying in the slot; issues H64(mother, parity) with the deterministic rehash; draws the sex keyed by the child alone; inserts the row through SPR-014's row insert (M7 and T1 read it in the same instant; M2's own scans of the step count it); appends the life-course row with mother, father, sex and birth_tick; clears the pregnancy and updates the mother's parity and last birth; emits BIRTH"
earns_its_place_by = ["V-DATA-04", "V-DATA-05", "V-INV-01", "V-INV-12"]
[[submodels]]
name = "partnering"
summary = "[algorithm.partnering_f1] N1-N6: one keyed Bernoulli per eligible unmarried woman per month on her band's nuptiality probability (k = 0); on a hit the husband is the candidate with the least husband_pick draw among the eligible men of her settlement (not named, not in holy orders, not kin within two degrees, preferably -5 to +15 years older) and a marriage timer at the start of a keyed day inside the month (k = 1). Named actors are left to T1's Marry command"
earns_its_place_by = ["V-SF-25", "V-SF-18"]
[[submodels]]
name = "apply_marry"
summary = "[algorithm.partnering_f1] N7: the single marriage path for M2's own timers and T1's Marry commands alike. Checks both alive, unmarried, of opposite sex, not in holy orders, not kin within two degrees, and M2's minimum ages for M2's own timers; drops and reports otherwise; writes both spouse columns, appends the marriage row, settles the household (H3), emits MARRIAGE"
earns_its_place_by = ["V-SF-25", "V-INV-01"]
[[submodels]]
name = "households"
summary = "[algorithm.households_f1] H1-H6: H64(head, formation tick) ids; genesis households and marriages from the manifest; the couple's household at a marriage; headship to the surviving spouse, else the oldest member; dissolution when empty; the child in the mother's household"
earns_its_place_by = ["V-SF-18", "V-INV-01"]
[[submodels]]
name = "lifecycle"
summary = "[algorithm.lifecycle_f1] L1-L3: the Day/Vital drain of M2's command queue (EVO-001, shape (b)): every ScheduleDeath and Marry the senders' timers submitted in this instant is applied now through apply_death and apply_marry, with its cause, culprit and cause_event; a command for a dead key person is dropped and counted (BCK-002 A-30); queue age at most one day (A-31). M2 holds no commanded outcome"
earns_its_place_by = ["V-INV-03", "V-SAGA-19"]

[[invariants]]
id = "INV-M2-01"
statement = "People are conserved: for each month, living count at its end - living count at its start = entries - exits in the life-course log over the month (at rung 0: - deaths), and the living count equals the number of open life-course rows after every Bookkeeping"
test = "V-INV-01"
[[invariants]]
id = "INV-M2-02"
statement = "Life-course consistency: every ledger row has exactly one life_course row with the same person_id and birth_tick, and it is open; every closed row's person_id is absent from the ledger after Bookkeeping; exit fields change at most once (open -> closed) and entry fields never"
test = "V-DATA-04"
[[invariants]]
id = "INV-M2-03"
statement = "Death and marriage timers stay inside their month, on day starts: every pending DEATH_TIMER or MARRIAGE_TIMER drawn at the Month pulse t_m (or re-drawn in its month) lies on a day start in [t_m + 1440, t_(m+1) - 1440], so none is pending at a Month pulse instant and none fires at one. The one F1 timer that crosses Month pulses, a BIRTH_TIMER, lies on a day start of its window that is not a Month pulse instant (INV-M2-10)"
test = "V-DET-12"
[[invariants]]
id = "INV-M2-04"
statement = "Alive and death tick agree: death_tick = i64::MAX iff alive = 1; a row with alive = 0 has death_tick = now and exists only between Vital and the Bookkeeping compaction of that instant"
test = "V-INV-01"
[[invariants]]
id = "INV-M2-05"
statement = "No death without a cause: apply_death never writes death_cause = none. A ScheduleDeath command whose cause is none (an invalid payload; effect language round 3, Q13) is dropped and reported, never applied, as a command for an already-dead victim is (BCK-002 A-30); the report names the sender, the victim and the tick. Applies from P1.13, when M2 drains ScheduleDeath; rung 0 has only natural deaths"
test = "V-INV-01"
# F1 invariants (SPR-015).
[[invariants]]
id = "INV-M2-06"
statement = "Genealogy is acyclic with a minimum parental age: every life_course row with origin born has mother != 0 and father != 0 (a conception needs a husband), the mother's row has sex female and the father's sex male; with m the conception month (the mother was in band 15-49 at t_m: 15 Y <= t_m - birth_tick(mother) < 50 Y) the child's birth_tick lies in [t_(m+G) + 1440, t_(m+G+1) + 1440] (F6, F8), so birth_tick(child) - birth_tick(mother) > 15 Y + (t_(m+G) - t_m) and < 50 Y + (t_(m+G+1) - t_m) + 1440 in the world's calendar (REV-SPR-015 MIN-4); birth_tick(father) < t_m - 18 Y for an M2 marriage, and before the child's birth for any marriage; a founder's or immigrant's parents are 0 or rows born before it. The children of one mother have distinct birth_ticks"
test = "V-INV-01"
[[invariants]]
id = "INV-M2-07"
statement = "Genealogical ids: every born person_id is the rh-ids child id of (mother, k) or its deterministic rehash for the k that is its birth order among the mother's born children in birth_tick order (0-based), plus her genesis children; person.parity of a living woman equals the number of life_course rows with mother = her; no id is issued twice; founders match founder(seed, k)"
test = "V-DATA-05"
[[invariants]]
id = "INV-M2-08"
statement = "Marriage is exclusive and symmetric: a.spouse = b != 0 iff b.spouse = a, both alive, of opposite sex, and exactly one marriage row with end_tick = i64::MAX names them; a person with spouse = 0 is in no open marriage row; a marriage row's start_tick <= end_tick, and a closed row's end_tick is the death instant of one of its parties; no row pairs kin within two degrees"
test = "V-INV-01"
[[invariants]]
id = "INV-M2-09"
statement = "Households are consistent at every Bookkeeping: every living person's household names a row with dissolved_tick = i64::MAX whose head is a living member of it; a row with dissolved_tick = i64::MAX has at least one living member; a row with dissolved_tick <= now has none and head = 0; dissolved_tick changes at most twice and only within one instant (set by H4, cleared again by F9's same-slot re-open), so across instants it is written once"
test = "V-INV-01"
[[invariants]]
id = "INV-M2-10"
statement = "Pregnancy and birth timers agree: a woman has conceived_tick != i64::MIN iff exactly one BIRTH_TIMER about her is pending; that timer's payload equals conceived_tick, a Month pulse instant at which she was married and in band 15-49, and its tick is a day start in [t_(m+G) + 1440, t_(m+G+1) + 1440] (m = the month of conceived_tick) that is not a Month pulse instant; unborn_father != 0 iff conceived_tick != i64::MIN, and it names her spouse at conceived_tick (a male; dead or alive); a man always has conceived_tick = i64::MIN and unborn_father = 0; a widow keeps her pending birth, so an unmarried woman may be pregnant (REV-SPR-015 R2)"
test = "V-DET-12"
[[invariants]]
id = "INV-M2-11"
statement = "M2's marriage timers (kind 3) stay inside their month, on day starts, like deaths (INV-M2-03), name two living unmarried persons when drawn, and no two pending marriage timers name the same person"
test = "V-DET-12"
[[invariants]]
id = "INV-M2-13"
statement = "No marriage M2 drew pairs two settlements: for every marriage row with source = partnering, the husband's and the wife's person.residence (S3's column through M2's lagged mode read, neutral 0) are equal or one of them is 0, the two-settlement filter of N4 having run before the husband draw (REV-SPR-018 R8). Checked at every Bookkeeping over the rows opened since the last check against the current residences, which in P1a are the residences at start_tick (no residence moves: PRJ-002 ruling M-6); S3 F1 restates the check at the marriage instant when moves exist. Rows with source = command (a T1 Marry may pair two settlements: the documented P1a limitation, N7, R17.7) and source = genesis are exempt. Gates every run, G1a included, so a broken filter fails rather than reports (REV-SPR-015 round 3 MIN-3)."
test = "V-INV-01"

[[invariants]]
id = "INV-M2-12"
statement = "Births are conserved with the log and the events: each BIRTH event matches one life_course row with origin born and entry_tick = the event's tick, and each MARRIAGE event one marriage row with start_tick = its tick; STEP_DIGEST.births over a month equals the LIFE_ENTRY records with origin born in it"
test = "V-DATA-04"

# F1 mortality's invariants (SPR-016): births hold INV-M2-06 to 19 (REV-SPR-016 round 2). Both apply from SPR-016's code
# (REV-SPR-016-FOLD R3): under the interim rule of [algorithm.parameters_f1] P1 there is no F1 schedule to hold them to.
[[invariants]]
id = "INV-M2-20"
statement = "The modifier is neutral at or under capacity: in any month where the living count at the pulse is at most density_capacity and no entitlement owner is registered, every person's q'' equals [algorithm.mortality_f1] MR10's q bit for bit (so on ages 1 to 90 - D, a newborn's first month aside, rungs 0-2 draw as rung 0 does; below 1 and above 90 - D MR7's infant knots and MR8's tail differ from rung 0 by construction)"
test = "V-INV-08"
[[invariants]]
id = "INV-M2-21"
statement = "Survivorship is a non-increasing function of age: for every compiled schedule the 438 knots of [algorithm.mortality_f1] MR9 are strictly increasing in age and non-increasing in l, l(90) equals the Brass grid's L_66, and l(x) = 0 exactly for x >= 120 years"
test = "V-INV-08"

[[couplings]]
system = "S5.daily_life"
direction = "out"
via = "S5 reads birth_tick, sex and alive at the start of each day"
lag = "start of day"
[[couplings]]
system = "T1.minds"
direction = "out"
