# ODD-R v2 system spec (ADR-0033): minds v0 for named actors (T1), WP P3.2a, moved into P1a (docs/11 v1.3). Draft.
# Every number is a design value: there is no empirical band for stress, breaks or IAUS weights. Each parameter says what
# would settle it. lint_odd.py checks this file against the Registry, the other specs and the test catalogue.
# Phasing: P1a is traits, ambition, relations, opinions, four decision types (marry, seek_office, press_claim, feud),
# stress from grief and value conflict, and mental breaks. P1b adds the vow, relic and knowledge couplings (S6, S7,
# secrets v0) and the swear_vow and pursue_goal decision types. Items that wait for P1b say so.
# Round 1 rulings (Architect, PR #32): decisions 1-20 accepted; grief finds the instant's dead through minds' own relation
# rows (alive = 0, death_tick = now); the dead are readable until Bookkeeping of their death instant (SPR-011 ruling 5),
# and a read of a dead row after that instant is a bug; every death takes effect as an M2 death timer in Vital (A-30);
# no P1a-only stress source (the P1a break rate is measured in isolation and taken to the director before G1a);
# respond_to_threat goes to the P1b sprint; action_order stays here until a second system needs the permutation;
# the cascade scenario test is V-SAGA-16b.
# Round 3 rulings (Architect, on the independent review REV-P1a): BLK-1 deaths fire at day-start instants in P1a, so grief
# runs in the Day/Vital binding of the death instant, after M2's timer pass; minute-level death times wait for BCK-002
# A-35. MAJ-1 no previous_pulse read (A-28 is P1b). MAJ-2 (superseded by round 4 NEW-4) the coupling's neutral
# value applies to a read of an absent owner. MAJ-4 Marry and ScheduleDeath carry M2's declared payloads; an
# attempt's death is at the next day start. MAJ-5 kinship is derived from M2's mother, father and spouse at read time;
# relation rows hold only liege and vassal. MAJ-6 considerations and response curves are typed Registry tables. MAJ-9
# re-promotion reuses the kept mind; traits are drawn once. Minor findings: RNG key mapping, enumeration order, separate
# outcome purposes, grief_instant_cap below stress_threshold by its bounds, decision types gated by `requires`.
# Round 4 rulings (REV-P1a §7): NEW-1 derived kinship walks M2's life-course columns (the dead stay in it), read at same_instant (round 4c, NEW-6),
# through the effect language's kin(p, n) (SPR-017), so grandparents through a dead parent and cousins are reached; the
# living spouse stays person.spouse. NEW-3 claim_rank reads M7's claim.rank column. NEW-4 every read is declared, and
# SPR-014's registration rule drops a read of an absent owner and applies the coupling's neutral value.
# Round 4d (from the effect-language spec, PR #41 §5.3): relations by their exact names, kin(p, n) and related(a, b, n);
# DESPAIR_PACT's opinion effect is a declared self-send (OpinionModifier to T1), with T1's [[applies]].
# Frozen 2026-10-16, director D36 (PR #32 approved; merges before PR #37).
# 0.3.2 (2026-10-17, EVO-001, the Architect's R9 and R12, merged with PR #49): the rate reads of S6 and S7 carry the
# machine-readable `neutral` SPR-014's absent-owner rule serves (05.1 §2 rule 2; the effect language's loader reads it,
# REV-SPR-017 round 3); an identity read requires its owner (R12), so a world that registers minds registers M2 and M7, and
# the P1b identity reads of S6 and S7 (vow.vower, artifact.bearer, artifact.location) are declared with those specs in P1b,
# not here; enum columns carry their codes; the [[applies]] payloads are typed, drained at Day/Agenda and keyed by a named
# PersonId field; Marry and ScheduleDeath carry no date and a sampled outcome (EVO-001 R9): the decision schedules a T1
# timer, MARRY_DUE or DEATH_DUE, at (the next day start, Vital) under the new purpose outcome_delay, whose fire in that
# Vital's timer pass submits the command, and M2's drain applies it in the same Vital (the timing MAJ-4 asked for); the
# Day/Vital `when` names apply_death (timer fire or drain) rather than the timer pass alone (REV-EVO-001 MIN-1). Round 4
# (NIT-15): a due timer whose victim or partner is already dead is dropped (drop_timer), never submitted.
# 0.3.3 (2026-10-17, SPR-020, the event envelope; specs/chronicle/envelope_v0.md; no mechanics changed): every [[emits]] entry
# declares the Registry [event_roles] it fills, the [motive_edges] its motivated_by edges may carry and the one anchored snapshot
# of P1a, stress(actor) read from mind.stress at emit on its seven acts, the pre-act value (envelope_v0.md §4), checked by lint_odd.py.
# 0.4.0 (2026-10-18, draft in specs/systems/next/; the T1-A spec PR, before SPR-023; the Architect's cross-plan rulings X1, X4, X7, X13
# and the minds-plans rulings on REV-MINDS M1, M5-M7, M10, findings 2, 3, 15 and 16): [algorithm.minds_f1] with the A-steps only
# (A0-A16: the mind table and its key mind.person, the derived indexes and their freshness inside a binding, the trait draw, world
# start, Promote and Demote with the deferred Demote dropped, the instant's exits through the engine's instant log, liege and
# vassal rows refreshed monthly, opinion modifiers, thoughts and goals, the Registry tables the A-part reads, the invariants'
# cadence); the I-steps (decisions) and S-steps (stress, grief, breaks) follow in T1-I/S, a later next-version draft. New:
# mind.person, thought.refreshed_at, the reads person.id and title.id, the steps world_start, exits and relations, INV-T1-11 to 14.
# It consumes SPR-038 stage B's instant log (StepCtx::exited(), ascending by PersonId: ruling R9) and its one DropReason change
# (Ended's generic meaning, Deferred, cancelled{...} with cancel_because: ruling R14); a command whose premise no longer holds
# (a Promote of a named person, a Demote of an unnamed one, a ClearGoal of no row) is dropped as ended.
# The frozen texts this changes are the [[amends]] records at the end. The exact reference is specs/minds/selftest_minds_v0.py
# (golden file specs/minds/golden/minds_v0.txt).
odd_r = 2

[system]
id = "T1.minds"
name = "Minds of named actors (minds v0)"
spec_version = "0.4.0"
fidelity = "F1"
status = "draft"
crate = "rh-minds"
adrs = ["ADR-0012", "ADR-0034", "ADR-0035", "ADR-0025", "ADR-0024", "ADR-0009", "ADR-0006", "ADR-0033"]
requirements = ["COG-1", "COG-3", "SIM-7", "SAGA-11", "SAGA-4", "SAGA-2", "DET-13"]

[purpose]
statement = "Give each named actor (T1) a small mind: fixed traits, ambition, relations and opinions, and an agenda that chooses among a few decisions (marry, seek office, press a claim, feud, swear and pursue a goal) by event-driven utility scoring. Accumulate stress from declared sources and, when it crosses the Registry threshold, schedule a mental break whose act comes from the Registry break table. The simulation decides; no language model takes part (ADR-0034)."
role = "drama_coupling"
patterns = [
  { test = "V-SAGA-16", pattern = "stress(t) = stress(t0) + accrual - decay - break relief exactly, inside [0, 100]; each threshold crossing schedules exactly one break timer, which fires at its own tick with an act from the Registry break table", kind = "identity", role = "sole" },
  { test = "V-SAGA-16", pattern = "Breaks per 100 named-actor-years inside 0.5 to 5 on the kingdom ensemble (the band this spec declares; a design value)", kind = "emergent", role = "sole" },
  { test = "V-SAGA-16b", pattern = "Cascade scenario: one court death keeps the break rate inside V-SAGA-16's band, and the chain branching ratio (breaks caused per break) stays below 1 over the fixture", kind = "emergent", role = "sole" },
  { test = "V-COG-03", pattern = "Decisions happen only at polls or interrupts; interrupts at t + 1 day or later, within the daily cap", kind = "identity", role = "sole" },
  { test = "V-COG-04", pattern = "Same-instant actions: invalidated actors re-score once, then defer; the first-applied rate is unbiased by entity id", kind = "identity", role = "sole" },
  { test = "V-COG-10", pattern = "Every utility decision records its top contributors and its margin over the runner-up as motivated_by edges", kind = "identity", role = "sole" },
  { test = "V-SAGA-13", pattern = "(a) A son who is a named actor and learns that his father was murdered by a known culprit swears AVENGE_KIN within 12 months at a rate in [0.2, 0.8] (P1b; the declared range, a design value); (b) ambitious actors inside a relic's rumour reach seek it more often than those outside", kind = "emergent", role = "contributing" },
  { test = "V-SAGA-09", pattern = "No vow weight enters a survival decision", kind = "identity", role = "contributing" },
  { test = "V-SAGA-18", pattern = "No decision, feud or vow responds to an event its actor does not know (P1b, secrets v0)", kind = "identity", role = "contributing" },
]
not_yet = [
  "No empirical band for stress or breaks: the 0.5 to 5 breaks per 100 named-actor-years is a design value (V-SAGA-16); the director judges it at G1a and G1b from the family histories",
  "In P1a only grief and value conflict raise stress; vow conflict (S7) and kin-loyalty conflict (which needs knowledge rows) arrive in P1b. The P1a break rate may fall below 0.5 per 100 actor-years: measured in the isolation run before G1a, and reported to the director if the Registry bounds cannot reach the band",
  "Needs are a stub: the needs input to every consideration is the neutral constant 1 until P3.2b",
  "Schwartz values, PAD mood, OCC emotions and memory are P3.2b (P4); no emotion snapshot is stored for the event envelope until then (05.2 §4.1a: only what is simulated)",
  "No survival-response decision type exists in v0: respond_to_threat goes to the P1b sprint (Architect round 1, Q8), reads no vow weight by construction, and serves V-SAGA-09's paired fixture at G1b",
  "HTN plans, beliefs with distortion and channels are P3.2b and P3.3 (P4): a decision is one act, not a plan",
  "Minute-level death times: in P1a every death fires at a day-start instant (round 3, BLK-1); a successful MURDER_ATTEMPT kills at the next day start. Same-instant reactions at minute resolution wait for BCK-002 A-35",
  "Open for SPR-023 (MIN-12): this spec declares minds' state as plane-A entity.column tables, the form state_hash and keyframes cover (05.1 §6 item 6); 05.1 §5 puts named actors in a bevy_ecs World. Decide before SPR-023: columns in rh-core tables (no bevy_ecs in P1a), or the plane-A bevy_ecs review",
  "Social practices (Versu; RT-2026-10-16 item 10a): evaluated and not adopted in v0 (see design.interaction); a candidate for the inquest institution with M6-lite",
]

# ----------------------------------------------------------------------------- owned columns
[[owns]]
column = "person.named"
entity = "person"
type = "bool"
plane = "A"
meaning = "T1 flag: the person holds a mind. Set and cleared only by Promote and Demote commands (M7's dormancy criteria, SIM-9) or by world creation; never by a pin (ADR-0024)"
fixed_point = false
[[owns]]
column = "mind.person"
entity = "mind"
type = "u64"
plane = "A"
meaning = "PersonId whose mind the row is: the mind table's key (0.4.0; REV-MINDS finding 2). One row per person ever named, appended when the mind is created ([algorithm.minds_f1] A4: world start or a first Promote), in creation order, never removed or moved, kept through dormancy and death (ADR-0007) and reused by a re-promotion (REV-P1a MAJ-9). No sort claim: every iteration goes through the person-to-row index in ascending PersonId (A1, A2; REV-MINDS M10). A foreign reader (S6, S7 in P1b) finds a person's traits through this column"
fixed_point = false
[[owns]]
column = "mind.honesty_humility"
entity = "mind"
type = "q8_8"
plane = "A"
meaning = "HEXACO Honesty-Humility on -100..100; static for life (05.3 §2). Artifacts and curses change what IAUS reads through bounded thoughts, never this column (RT-2026-10-16 item 8)"
fixed_point = true
[[owns]]
column = "mind.emotionality"
