# ----------------------------------------------------------------------------- events
[[emits]]
kind = "MENTAL_BREAK"
when = "A break timer fires: the actor drops rational self-preservation for one act (SAGA-11); its motive edge points to the event that pushed stress over the threshold"
roles = ["actor"]
motives = ["GRIEF_FOR", "RETALIATION_FOR", "AMBITION_FOR", "JEALOUSY_OF", "VOW_OF"]   # the motivated_by edge to the event that pushed stress over the threshold
snapshots = [{ attr = "stress", of = "actor", from = "mind.stress" }]   # stress(actor)@eN (envelope_v0.md §4)
[[emits]]
kind = "MURDER_ATTEMPT"
when = "The act of an ASSASSINATION_ATTEMPT break, or a feud's attack option chosen by IAUS; the outcome (success or failure) is in the event; success schedules a DEATH_DUE timer at (the next day start, Vital) whose fire submits ScheduleDeath to M2, and the victim dies at the next day start (the attempt-to-death delay is one day; round 3, MAJ-4; EVO-001 R9)"
roles = ["actor", "target"]
motives = ["RETALIATION_FOR", "AMBITION_FOR", "JEALOUSY_OF", "VOW_OF"]
snapshots = [{ attr = "stress", of = "actor", from = "mind.stress" }]
[[emits]]
kind = "FLED"
when = "The act of a FLIGHT break (P1a: the actor resigns every office and leaves the court; P1b: the actor becomes a fugitive, SAGA-14)"
roles = ["actor"]
motives = ["FEAR_OF"]
snapshots = [{ attr = "stress", of = "actor", from = "mind.stress" }]
[[emits]]
kind = "HOLDINGS_BURNED"
when = "The act of a BURN_HOLDINGS break (available only when M4 is registered, P1b)"
roles = ["actor"]
motives = ["GRIEF_FOR", "RETALIATION_FOR"]
snapshots = [{ attr = "stress", of = "actor", from = "mind.stress" }]
[[emits]]
kind = "DESPAIR_PACT"
when = "The act of a PACT_OF_DESPAIR break: a bond with a stressed named relation and the renunciation of the actor's claims"
roles = ["actor", "target"]   # actor: the breaking actor; target: the stressed relation
motives = ["GRIEF_FOR", "LOYALTY_TO"]
snapshots = [{ attr = "stress", of = "actor", from = "mind.stress" }]
[[emits]]
kind = "FEUD_DECLARED"
when = "IAUS chooses the feud decision's declare option against a target"
roles = ["actor", "target"]
motives = ["RETALIATION_FOR", "JEALOUSY_OF", "AMBITION_FOR"]   # to feud.cause_event
snapshots = [{ attr = "stress", of = "actor", from = "mind.stress" }]
[[emits]]
kind = "FEUD_ENDED"
when = "IAUS chooses the reconcile option, or a party dies (the death path)"
roles = ["actor", "target"]   # the party who reconciled (or died: the death path) and the other party
snapshots = [{ attr = "stress", of = "actor", from = "mind.stress" }]   # the pre-act value (envelope_v0.md §4)

# ----------------------------------------------------------------------------- lifecycle commands sent
[[commands]]
target = "M2.demography"
command = "Marry"
payload = "{ a, b }"
timer = "MARRY_DUE"
purpose = "outcome_delay"
why = "The marry decision at Agenda d schedules a T1 timer MARRY_DUE at (d + 1 day start, Vital) under outcome_delay (entity = a, payload = b, cause = None), whose fire in that Vital's timer pass submits Marry {a, b} with M2's declared payload, and M2's Day/Vital binding drains it in the same Vital (EVO-001 R9: a command carries no date, and a decided outcome due later is the decider's timer); M2 owns marriages (P1.3) and writes person.spouse when it applies the command"
[[commands]]
target = "M2.demography"
command = "ScheduleDeath"
payload = "{ victim, cause, culprit, cause_event }"
timer = "DEATH_DUE"
purpose = "outcome_delay"
why = "A successful MURDER_ATTEMPT at Agenda d kills only through the single death path (05.1 §2 rule 2): it schedules a T1 timer DEATH_DUE at (d + 1 day start, Vital) under outcome_delay (entity = the victim, payload = the actor, cause = the MURDER_ATTEMPT as a DraftRef, rewritten to its EventId at the merge), whose fire in that Vital's timer pass submits ScheduleDeath {victim, cause = murder, culprit = the actor, cause_event = the timer's cause} with M2's declared payload, and M2's Day/Vital binding drains it in the same Vital (EVO-001 R9), so the victim dies at the next day start"
[[commands]]
target = "T1.minds"
command = "OpinionModifier"
payload = "{ holder, about, kind, magnitude, source_event }"
why = "A self-send (round 4d): DESPAIR_PACT's opinion effect, the DESPAIR_PACT_WITH modifiers both ways, is a command from minds to minds, applied at the next tick boundary like any other OpinionModifier"
[[commands]]
target = "M7.dynasty"
command = "PetitionSeat"
payload = "{ person, target }"
why = "The seek_office decision asks for a vacant office or a seat held in demesne; M7 grants by its rule"
[[commands]]
target = "M7.dynasty"
command = "PressClaim"
payload = "{ claimant, claim }"
why = "The press_claim decision; M7 owns claims"
[[commands]]
target = "M7.dynasty"
command = "RenounceClaim"
payload = "{ claimant, claim }"
why = "A PACT_OF_DESPAIR renounces the actor's claims"
[[commands]]
target = "M7.dynasty"
command = "Resign"
payload = "{ person, office }"
why = "FLIGHT resigns the actor's offices; M7 owns offices"
[[commands]]
target = "M4.economy"
command = "BurnHoldings"
payload = "{ actor, household, cause_event }"
why = "The act of a BURN_HOLDINGS break (HOLDINGS_BURNED): destroy the stocks of the actor's household (actor = the breaking named actor, household = its household, cause_event = the HOLDINGS_BURNED event); M4 owns the stocks (P1b). In a P1a world M4 is not registered, so SPR-014's absent-owner rule drops and reports the send; BURN_HOLDINGS is then unavailable anyway (its needs include holdings)"
[[commands]]
target = "S7.vows"
command = "SwearVow"
why = "The swear_vow decision (P1b): {vower, kind, target, public}; S7 owns vows"
[[commands]]
target = "S6.artifacts"
command = "Transfer"
why = "pursue_goal steps on artifacts (P1b): gift, trade or theft; S6 owns artifacts"
[[commands]]
target = "S6.artifacts"
command = "Search"
why = "pursue_goal for RECOVER_RELIC at the artifact's believed place (P1b)"
[[commands]]
target = "S6.artifacts"
command = "Destroy"
why = "pursue_goal for DESTROY_RELIC (P1b)"

# ----------------------------------------------------------------------------- lifecycle commands applied
# For PR #37's [[applies]] lint (round 4d); typed by EVO-001 (05.1 §2 rule 2). Each payload is the one every sender uses.
# All are drained by the Day/Agenda binding (apply_commands and promote). Keyed by the holder, bearer or person named by
# key_field, who must be living (key = "living": rh-core drops a command for someone dead, dropped{T1, kind, dead_key});
# ClearGoal clears what may belong to a dead holder, so it takes any key. kind, overlay and the event slots are typed by the columns and the merge rewrite.
[[applies]]
command = "OpinionModifier"
payload = "{ holder: PersonId, about: PersonId, kind: enum(opinion.kind), magnitude: q8_8, source_event: EventRef }"
from = ["M7.dynasty", "S7.vows", "T1.minds"]
drained_by = "Day/Agenda"
key = "living"
key_field = "holder"
[[applies]]
command = "AgendaGoal"
payload = "{ vow: VowId, holder: PersonId, kind: enum(goal.kind), target: u64, priority: q8_8 }"
from = ["S7.vows"]
drained_by = "Day/Agenda"
key = "living"
key_field = "holder"
[[applies]]
command = "ClearGoal"
payload = "{ vow: VowId, holder: PersonId }"
from = ["S7.vows"]
drained_by = "Day/Agenda"
key = "any"
key_field = "holder"
[[applies]]
command = "ApplyThought"
payload = "{ holder: PersonId, overlay: enum(thought.overlay), delta: q8_8, source_event: EventRef }"
from = ["S7.vows"]
drained_by = "Day/Agenda"
key = "living"
key_field = "holder"
[[applies]]
command = "ApplyInfluence"
payload = "{ bearer: PersonId, overlay: enum(thought.overlay), delta: q8_8 }"
from = ["S6.artifacts"]
drained_by = "Day/Agenda"
key = "living"
key_field = "bearer"
[[applies]]
command = "Promote"
payload = "{ person: PersonId }"
from = ["M7.dynasty"]
drained_by = "Day/Agenda"
key = "living"
key_field = "person"
[[applies]]
command = "Demote"
payload = "{ person: PersonId }"
from = ["M7.dynasty"]
drained_by = "Day/Agenda"
key = "living"
key_field = "person"

# ----------------------------------------------------------------------------- reads
# Round 4 (NEW-4) and EVO-001 (R12): the reads below are declared unconditionally. An identity read requires its owner, so a world
# that registers minds registers M2 and M7 (registration refuses one that does not, by name; SPR-023 develops against a stub M7 owner,
# as [isolation] says, and integrates into real worlds after SPR-021).
# A rate read carries its neutral and is dropped when its owner is absent: SPR-014's registration rule reports it, the dropped
# column enumerates as an empty table (no vows, no artifacts) and a keyed lookup returns the neutral (S7: vow conflict 0, so
# s_vow = 0; S6: rumour_reach 0, so the seek consideration is as at R = 0). The P1b identity reads of S6 and S7 (the vower, the
# bearer and the place of an artifact) are declared when those specs are frozen (P1b); the [[couplings]] entries keep the rules.
# Kinship walks life_course.mother/father through kin(p, n) (SPR-017), read at same_instant (round 4c, NEW-6: the log is append-only and written only by M2 in Vital, so same_instant is exact and avoids P0's per-instant clone of a lagged column) (round 4, NEW-1). minds rebuilds a
# children-by-parent index over those columns at restore and on each birth: derived state, outside the plane-A hash and
# the keyframe. Neutral values (S7: vow conflict 0, so s_vow = 0, and no goals; S6: rumour_reach 0, so the
# seek consideration is as at R = 0). M2 is read at same_instant (M2 binds only Vital and precedes minds there).
