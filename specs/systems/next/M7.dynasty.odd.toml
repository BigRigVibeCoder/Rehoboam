# ----------------------------------------------------------------------------- events
[[emits]]
kind = "SUCCEED"
when = "Arbitration names a holder (immediate succession, the regrant of a title held in demesne excepted, which is SEAT_GRANTED); roles: actor = the successor, target = the predecessor. Payload: [title id]. Edges: one triggered edge (a motive needs a mind; envelope_v0.md §3, §5) to the event that vacated the title: the predecessor's DEATH in the merge-time form EventRef::same_instant(DEATH, the predecessor), which the merge resolves against the instant log's part (c) (EVO-002 §4; [[observes]] DEATH); the DEPOSED of the same step, by its DraftRef; or, at an interregnum's resolution, the INTERREGNUM_CRISIS that the resolution timer carries in its cause slot (a Known id; a joined vassal's SUCCEED cites its liege's crisis, the one the timer carries)"
roles = ["actor", "target"]   # actor: the successor; target: the predecessor. Its edge to the death or deposition is `triggered` (a motive needs a mind; envelope_v0.md §3, for the next version)
[[emits]]
kind = "INTERREGNUM_CRISIS"
when = "Arbitration of a sovereign title finds no candidate, or no candidate leads the runner-up by contest_margin; or arbitration of a vassal title finds no candidate while its liege is in interregnum, and the vassal joins that interregnum (K2 of REV-WAVE7: the vassal's own crisis, so its holder's death is answered in its instant, V-SAGA-19); or a sovereign's resolution finds no candidate, no vassal holder and no stand-in, and the crisis is renewed (F-11). The title is held by the declared interregnum until its resolution: a sovereign's at its own resolution timer, a joined vassal's at its liege's, right after the liege. Roles: none (a title is not an entity). Payload: [title id]. Edges: one triggered edge to the event that vacated the title: the holder's DEATH in the merge-time form EventRef::same_instant(DEATH, the holder) (EVO-002 §4), or the DEPOSED of the same step, by its DraftRef; a renewed crisis, to the crisis its resolution timer carries (a Known id)"
roles = []                   # a title is not an entity: the payload names it
[[emits]]
kind = "DEPOSED"
when = "A sovereign's deposition timer fires: actor = the leading pressed claimant (or none), target = the ruler, who lives and gains a claim. Payload: [title id]"
roles = ["actor", "target"]   # actor: the leading pressed claimant, when there is one; target: the ruler
[[emits]]
kind = "REGENCY_BEGUN"
when = "A successor under majority_age succeeds: the regent is named by rule. Payload: [title id]"
roles = ["actor", "target"]   # actor: the regent; target: the minor holder
[[emits]]
kind = "REGENCY_ENDED"
when = "The holder reaches majority_age, or a regent dies and the next is named (a new REGENCY_BEGUN follows). Payload: [title id]"
roles = ["actor", "target"]   # actor: the regent who stood down (or died); target: the holder
[[emits]]
kind = "CLAIM_CREATED"
when = "A succession passes over the legal heir (the heir gains a claim) or a ruler is deposed (the deposed gains one). Payload: [title id], the claimed title. Edges: one triggered edge to the event that created the claim, a draft of the same step named by its DraftRef: the SUCCEED that passed the heir over, or the DEPOSED (never an interregnum: annals_v0.md §12 check 5); claim.cause_event is set to the same draft in the same step through ctx.set_cause (envelope_v0.md §7; K7 of REV-WAVE7)"
roles = ["actor", "target"]   # actor: the claimant; target: the holder the claim is against, when one holds the title
[[emits]]
kind = "CLAIM_PRESSED"
when = "A PressClaim command from T1.minds is applied. Payload: [title id], the claimed title"
roles = ["actor", "target"]   # actor: the claimant; target: the holder
[[emits]]
kind = "CLAIM_RENOUNCED"
when = "A RenounceClaim command is applied. Payload: [title id], the title of the renounced claim"
roles = ["actor"]             # actor: the claimant
[[emits]]
kind = "SEAT_GRANTED"
when = "A title held in demesne or a vacant office is granted to a petitioner or an eligible kin (finite seats, re-grant). Payload: [title id]: the granted title, or the title whose court the granted office belongs to"
roles = ["actor", "target"]   # actor: the granting holder; target: the grantee
[[emits]]
kind = "HOUSE_EXTINCT"
when = "The last living member of a house dies (on_death's phase 1 counts the house through M7's own house → members index and person.alive at same_instant, and sets house.extinct_at := now). Roles: target = the member whose death ended the house (the one with the largest PersonId when several of its members died in this instant: one event per house). Payload: [house id]. Edges: one triggered edge to that member's DEATH, in the merge-time form EventRef::same_instant(DEATH, the member) (EVO-002 §4). Emitted after the step's successions and crises, in ascending HouseId (the order of the annals fixtures)"
roles = ["target"]            # target: the last member, whose death ended the house
# ----------------------------------------------------------------------------- lifecycle commands sent
[[commands]]
target = "M2.demography"
command = "ScheduleDeath"
payload = "{ victim, cause, culprit, cause_event }"
timer = "MURDER_DUE"
purpose = "exit_murder"
why = "A sovereign's background murder, with M2's declared payload ScheduleDeath {victim = the ruler, cause = murder, culprit = the MURDER_DUE timer's payload (the murder_culprit draw or 0), cause_event = None (a hazard draw has no inciting event)}, submitted by the MURDER_DUE timer when it fires at (the drawn day, Vital) (EVO-001 R9: a command carries no date; the timer is M7's under exit_murder, re-sampled by M7 on a material input, see [[rng]]); every death goes through M2's single death path (05.1 §2 rule 2)"
[[commands]]
target = "T1.minds"
command = "Promote"
payload = "{ person }"
why = "A person meets a naming criterion of the dormancy submodel (SIM-9; one list, A-57): a seat, office or claim, member of a great house or not (N7), or a place in the manifest's cast (criterion (e): genesis names the cast, so it needs no Promote); and for a great-house member, an active vow (P1b), within dormancy_degrees of a holder of its house, or first or second in the line of any title (an heir apparent, whatever its house; R6). Sent at the first pass, yearly, and by on_birth for a newborn meeting any criterion"
[[commands]]
target = "T1.minds"
command = "Demote"
payload = "{ person }"
why = "A named adult (a great-house member, or a holder of no house named under criterion (a)) meets no naming criterion (the dormancy submodel; a far heir is named, A-57; a named minor is never demoted; a cast member always meets criterion (e) and is never demoted); minds defers it while a break is pending or refractory"
[[commands]]
target = "T1.minds"
command = "OpinionModifier"
payload = "{ holder, about, kind, magnitude, source_event }"
why = "PASSED_OVER (the legal heir about the successor), DEPOSED_BY (the deposed about the deposer), CLAIM_PRESSED_BY (the holder about the claimant), GRANTED_BY (the grantee about the granter); minds owns opinions"
[[commands]]
target = "M4.economy"
command = "TransferHoldings"
why = "Property inheritance through the death path by the house's [inheritance_rules] id (P1b, when M4 F0 lands)"

# ----------------------------------------------------------------------------- lifecycle commands applied
# Typed by EVO-001 (05.1 §2 rule 2); the semantics are apply_commands'. Each is keyed by a living person (the claimant, the
# petitioner, the office holder, named by key_field): a command for someone dead is rh-core's drop (key = "living",
# dropped{M7, kind, dead_key}); one for an ended claim is apply_commands' own drop (StepCtx::drop_command, dropped{M7, kind, ended}).
[[applies]]
command = "PressClaim"
payload = "{ claimant: PersonId, claim: ClaimId }"
from = ["T1.minds"]
drained_by = "Day/Agenda"
key = "living"
key_field = "claimant"
[[applies]]
command = "PetitionSeat"
payload = "{ person: PersonId, target: u64 }"
from = ["T1.minds"]
drained_by = "Day/Agenda"
key = "living"
key_field = "person"
[[applies]]
command = "RenounceClaim"
payload = "{ claimant: PersonId, claim: ClaimId }"
from = ["T1.minds"]
drained_by = "Day/Agenda"
key = "living"
key_field = "claimant"
[[applies]]
command = "Resign"
payload = "{ person: PersonId, office: OfficeId }"
from = ["T1.minds"]
drained_by = "Day/Agenda"
key = "living"
key_field = "person"

# ----------------------------------------------------------------------------- reads
# Round 4 (NEW-4) and EVO-001 (R12): the reads below are declared unconditionally. An identity read requires its owner, so a world
# that registers M7 registers M2 (registration refuses one that does not, by name). A rate or mode read carries its neutral and is
# dropped when its owner is absent: SPR-014's registration rule reports it, the dropped column enumerates as an empty table and a
# keyed lookup returns the neutral (M6: exec_constraint = 0, so m_ec = 1; T1: named = false, nobody holds a mind, so dormancy sends
# nothing). The S7 reads of the dormancy criterion (an active vow keeps its vower named) are identity reads of a P1b system and are
# declared when S7 is specified (P1b; the [[couplings]] entry below keeps the rule).
# Kinship (heirs, regents, dormancy distance, regrant kin) walks life_course.mother/father through kin(p, n) (SPR-017), read
# at same_instant (round 4c, NEW-6): everyone born up to this instant's Vital slot is in it, the dead included (round 4, NEW-1). 0.6.0 (X2):
# M7 keeps no children index of its own; kin(p, n) and children(p) read rh-core's genealogy index through SPR-017's host Indexes
# (EVO-002 §6), derived state outside every hash, keyframe and journal. M2 is read at same_instant (M2 binds only Vital: the edge orders
# its Vital binding before M7's Day/Vital one, and every other M7 binding is in a later phase), so births and deaths of this instant are
# visible; which births and deaths they are, M7 reads from rh-core's instant
# log (inserted(), exited(); EVO-002 §2), never by a scan. person.id (F-5 of the wave-7 plan): SystemView::person_row resolves a
# PersonId to its ledger row through person.id (SPR-014's crates/rh-core/src/world.rs:244-254, at 921d372).
[[reads]]
column = "person.id"
owner = "M2.demography"
lag = "same_instant"
use = "identity"
# No read is previous_pulse (MAJ-1: Engine::new refuses it until BCK-002 A-28).
[[reads]]
column = "person.alive"
owner = "M2.demography"
lag = "same_instant"
use = "identity"
[[reads]]
column = "person.death_cause"
owner = "M2.demography"
lag = "same_instant"
use = "mode"
neutral = "none"
[[reads]]
column = "person.death_tick"
owner = "M2.demography"
lag = "same_instant"
use = "identity"
[[reads]]
column = "person.birth_tick"
owner = "M2.demography"
lag = "same_instant"
use = "identity"
[[reads]]
column = "person.sex"
owner = "M2.demography"
lag = "same_instant"
use = "identity"
[[reads]]
column = "person.mother"
owner = "M2.demography"
lag = "same_instant"
use = "identity"
[[reads]]
column = "person.father"
owner = "M2.demography"
lag = "same_instant"
use = "identity"
[[reads]]
column = "life_course.person_id"
owner = "M2.demography"
lag = "same_instant"
use = "identity"
[[reads]]
column = "life_course.mother"
owner = "M2.demography"
lag = "same_instant"
use = "identity"
[[reads]]
column = "life_course.father"
owner = "M2.demography"
lag = "same_instant"
use = "identity"
[[reads]]
column = "life_course.birth_tick"
owner = "M2.demography"
lag = "same_instant"
use = "identity"
[[reads]]
column = "life_course.sex"
owner = "M2.demography"
lag = "same_instant"
use = "identity"
[[reads]]
column = "person.named"
owner = "T1.minds"
lag = "lagged"
use = "mode"
neutral = false
[[reads]]
