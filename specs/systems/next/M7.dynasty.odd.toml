# ODD-R v2 system spec (ADR-0033): succession and dynasts F1, WP P1.7 (moved into P1a, docs/11 v1.3). Draft.
# The ruler-exit hazards are sourced (Eisner 2011; Kokkonen & Sundell 2014; R12 §1–2); the arbitration, regency,
# dormancy and vocation rules are design values. V-SF-06c is a HELD-OUT band (09 §3.1): nothing here is tuned to it,
# and its source (Blaydes & Chaney 2013) is deliberately not used to set any parameter.
# lint_odd.py checks this file against the Registry, the other specs and the test catalogue.
# Round 1 rulings (Architect, PR #32): decisions 1-20 accepted; V-SF-06c is held-out (predict, never calibrate);
# the dead are readable until Bookkeeping of their death instant (SPR-011 ruling 5: core compaction at the start of
# Bookkeeping), so M7 reads person.death_cause and person.death_tick of the dead row at Polity; a read of a dead row after
# that instant is a bug; every death takes effect as an M2 death timer in Vital (BCK-002 A-30);
# filial_piety_mean removed; S6/S7 lag fixes and regalia at the seat are BCK-002 A-34, outside this spec.
# Round 3 rulings (Architect, on the independent review REV-P1a): BLK-1 deaths fire at day-start instants in P1a, so the
# death instant is a day boundary and M7 arbitrates inside its Day/Polity binding in that instant (no self-timer);
# minute-level death times wait for BCK-002 A-35. MAJ-1 no previous_pulse read (A-28 is P1b). MAJ-2 (superseded by round 4
# NEW-4) the coupling's neutral value applies to a read of an absent owner. MAJ-3 exit probabilities are
# Prob32 (SPR-011 ruling 4), linear in h. MAJ-4 ScheduleDeath carries M2's declared payload. MAJ-5 an on_birth step sets
# the newborn's house. Minor findings: RNG key mapping, enumeration order, separate tie purposes, derived values labelled.
# Round 4 rulings (REV-P1a §7): NEW-1 kinship walks M2's life-course columns (the dead stay in it), read at same_instant (4c), through
# the effect language's kin(p, n) (SPR-017); house membership moves from person.house (compacted with the dead) to
# house_member rows; NEW-2 exit probabilities cover the whole month; NEW-3 claim.rank is an M7 column; NEW-4 every read
# is declared, and SPR-014's registration rule drops a read of an absent owner and applies the coupling's neutral value.
# Round 4d (from the effect-language spec, PR #41 §5.3): relations by their exact names, kin(p, n) and related(a, b, n);
# the legal heir is "by the title's law (the effect language's succession laws, SPR-017)", the candidate set is not
# restated here; the sortition law's draws are the `sortition` purpose.
# Round 4g (effect-language re-check, B3): title.founder is replaced by an append-only tenure log (tenure.*) that the
# title's law may read (holders_of(title, 16)); `sortition` is keyed by the title too.
# Frozen 2026-10-16, director D36 (PR #32 approved; merges before PR #37).
# 0.3.2 (2026-10-17, EVO-001, the Architect's R9 and R12, merged with PR #49): the rate read of M6 and the mode read of T1's
# person.named carry the machine-readable `neutral` SPR-014's absent-owner rule serves when the owner is absent (05.1 §2
# rule 2; the effect language's loader reads it, REV-SPR-017 round 3); an identity read requires its owner (R12), so the
# P1b identity reads of S7 (vow.vower, vow.status) are declared with S7 in P1b, not here, or M7 could not register in P1a;
# enum columns carry their codes; the commands M7 applies are declared in typed [[applies]] entries drained at Day/Agenda,
# each keyed by a named PersonId field; ScheduleDeath carries no date: the background murder is M7's own MURDER_DUE timer
# at (the drawn day, Vital), keyed by exit_murder, re-sampled by M7 and carrying the culprit, fired in that Vital's timer
# pass through a new Day/Vital binding (murder_due) and drained by M2 in the same Vital (EVO-001 R9, R10). Round 4 (R17,
# NIT-15): the re-sample draws among the month's day starts at or after the input, never cancelling while one remains, else
# the next month's first day start; title.exit_timer keeps the MURDER_DUE id too, cancelled on death or loss of the title.
# 0.3.3 (2026-10-17, SPR-020, the event envelope; specs/chronicle/envelope_v0.md; no mechanics changed): every [[emits]] entry
# declares the Registry [event_roles] it fills, checked by lint_odd.py. Note for the next version: SUCCEED's edge to the death or
# deposition is a `triggered` edge under the envelope contract (a motive needs a mind); the frozen `when` and INV text say
# "motive edge" and are amended at M7's next version (SPR-021), not here.
# 0.4.0 (2026-10-17, SPR-019, draft in specs/systems/next/ per REV-SPR-019 R4; re-derived from the frozen 0.3.4 per R13 and REV-SPR-017 N5: the title-blood window is 16):
# rh-worldgen's dynastic back-fill ([algorithm.dynastic_backfill] of specs/worldgen/population_synthesis.toml) writes each
# dynasty's pre-epoch genealogy, house_member rows and tenure log by the title's law; three frozen texts are amended through
# the [[amends]] records at the end ([initialization], tenure.title, house_member.house).
# 0.5.0 (2026-10-17, BCK-002 A-56 and A-57, before SPR-021's plan; specs/systems/next/M7_membership.md; director item D56; round 1 of
# PR #79's review applied): the membership rule of on_birth is agnatic (the father's house, else none: the back-fill's rule), since the
# frozen cognatic fallback saturates a world and a bounded one is idle in a world with T1 (R1); the naming criteria of dormancy are one list
# with the precedence stated (naming wins; a named minor is never demoted; A-57) and criterion (d) widened to any title's heir (R6); the
# vocation step draws for later children, an elder child of the same father alive at the draw (R4, N5); on_birth states its edge cases
# (R5) and gives no row to a child born into an extinct house (N6); criterion (a) names any holder, member or not (N7). house_member.house's
# amendment is re-stated, INV-M7-06 is amended, and the on_birth, vocation and dormancy summaries, the Year step and the Promote and Demote
# `why` texts are recorded amendments under the deny-by-default next lint (R3). 0.3.4's declarations are otherwise unchanged.
# 0.6.0 (2026-10-18, T-00a, the spec PR before SPR-021; the P1a shared rulings X1-X4 and X13, REV-WAVE7's K2, K3, K6, K7 and K12, the
# Architect's re-check rulings R3, R9, R10 and R14; CODEX/60_EVOLUTION/EVO-002_InstantLog.md): the shared amendments SPR-021 needs. M7 reads
# this instant's births and deaths from rh-core's instant log (inserted(), exited()) and cites each death's DEATH through [[observes]] in the
# merge-time form, and reads kinship from rh-core's genealogy index: it keeps no private copy (X1, X2); person.id is read (F-5);
# interregnum_max_days and dormancy_degrees are counts (F-6); the 16 parameters other than majority_age carry Registry defaults at
# twin_vales' values, mirrored here and in next/registry_delta.toml (K3 with R3); every [[emits]] `when` states its payload, [title id]
# but HOUSE_EXTINCT's [house id], and SUCCEED, INTERREGNUM_CRISIS, CLAIM_CREATED and HOUSE_EXTINCT their triggered edges (F-7, F-8, K7);
# on_death runs in two phases and arbitrates by tier (K6, F-11); a vassal with no candidate whose liege is in interregnum emits its own
# crisis and joins it, and a sovereign's resolution with no candidate, no vassal holder and no stand-in renews the crisis (K2, F-11); each
# M7 timer states its re-sample (F-9); title.exit_timer is a pending-timer flag (F-3); house_member rows are kept in person order (X3,
# INV-M7-09); a holder dead this instant still holds
# for that instant's Year pass (K12); world-start naming is the Year/Polity dormancy pass at tick 0, and the manifest's cast is a naming
# criterion, (e), so a cast member stays named (X4 and the Architect's cast ruling of 2026-10-18); D35's "claims" and SIM-9's house
# scope are read in the text (F-15, F-16). Not here: [algorithm.dynastic_backfill] (X13b: SPR-019b folds it into the current draft), and
# F-10, F-19, F-20's remaining Year-pass cases, F-25 and K19's vocation timer (T-00b), which also states that the persons of
# exited() are skipped by Promote, Demote, regrant and vocation (Q6 of T-00a's review) and declares the regency-end timer's
# purpose (MIN-10).
odd_r = 2

[system]
id = "M7.dynasty"
name = "Succession and dynasts"
spec_version = "0.6.0"
fidelity = "F1"
status = "draft"
crate = "rh-sys-dynasty"
adrs = ["ADR-0027", "ADR-0035", "ADR-0025", "ADR-0026", "ADR-0007", "ADR-0009", "ADR-0006", "ADR-0024"]
requirements = ["SIM-3", "SIM-9", "SIM-13", "SAGA-13", "DET-13"]

[purpose]
statement = "Keep houses, landed titles (seats), court offices and claims; decide who holds each title when its holder dies or is deposed, in the same instant (immediate succession), by the title's succession law, claims and the candidates' hold on the court; draw the competing ruler-exit hazards (murder, deposition) of sovereigns as functions of institutional state; and decide which great-house members are named actors (dormancy, SIM-9) and what later children do (vocations), without ever enforcing a count."
role = "stylized_fact_producer"
patterns = [
  { test = "V-SAGA-19", pattern = "Every titleholder death ends its instant with SUCCEED or INTERREGNUM_CRISIS; no title is without a holder across a tick boundary unless a declared interregnum holds it", kind = "identity", role = "sole" },
  { test = "V-SF-06", pattern = "Ruler murders per 1,000 ruler-years inside the band of the realm's institutional window, mapped at F1 as: primogeniture or ultimogeniture -> institutionalised hereditary monarchy (1–5); elective, tanistry, seniority, partition, sortition -> weak or contested succession (6–25); the consolidating window (7–12) has no F1 mapping (it needs succession_institutionalisation, SIM-14). The violent share of ruler deaths (15–30%) counts battle and execution, which have no mechanism before M8: at F1 the murder share of ruler deaths is reported (Eisner: 14.6%), and the violent-share sub-band is reported, not gated, until M8", kind = "identity", role = "sole" },
  { test = "V-SF-06b", pattern = "Share of reigns ending in domestic deposition (murder or non-lethal deposition) by succession law; primogeniture vs elective HR inside [0.17, 0.63]", kind = "identity", role = "sole" },
  { test = "V-SF-06d", pattern = "A murdered predecessor raises the odds of the next ruler's murder: OR 1.5–4 (identity in isolation through predecessor_killed_or; coupled, minds' revenge adds to it)", kind = "identity", role = "contributing" },
  { test = "V-SF-06c", pattern = "Mean completed reign longer under constrained rulers (17–22 years) than unconstrained (8–15): a HELD-OUT prediction from K&S's parliament effect and M2's mortality, never tuned to", kind = "emergent", role = "contributing" },
  { test = "V-ERA-03", pattern = "Murder and deposition rates fall with executive constraint, not with the date", kind = "emergent", role = "contributing" },
  { test = "V-INV-12", pattern = "Ruling houses and active great-house members are named from world start; dormancy and re-promotion follow simulation criteria only; genealogy reconstructs from the life-course log", kind = "identity", role = "sole" },
  { test = "V-INV-03", pattern = "Every titleholder death, whatever its cause, reaches succession through the one death path. At F1 the death path passes on titles, and the claims it creates or voids (a passed-over heir's CLAIM_CREATED, a dead claimant's claims made void): D35's 'inheritance is of titles and claims' is read so, since no claim is itself inherited before F2 ([purpose] not_yet; F-15 of the wave-7 plan; the requirement texts are the director's, D58 item 6); property from P1b", kind = "identity", role = "contributing" },
]
not_yet = [
  "Minute-level death times: in P1a every death fires at a day-start instant (round 3, BLK-1), so the death instant, on_death and arbitration share one day boundary; minute resolution waits for an engine mechanism for same-instant reactions (BCK-002 A-35)",
  "murder_culprit makes a living claimant a murderer by a draw, with no decision by its mind and no knowledge path (allowed at F1 under the principle-8 reading: a system's mechanics); coupled with T1 the same person may also attempt a murder through MURDER_ATTEMPT. From P1b the culprit's knowledge row must exist (V-SAGA-18)",
  "Battle deaths of rulers (M8, P4) and civil war after a failed interregnum (V-COUP-01 truncates at the INTERREGNUM_CRISIS or regency until M8)",
  "Treasury size and military proximity: at F1 arbitration uses who holds the title's steward and marshal offices as proxies; M4's treasury (P1b) and M8's armies (P4) replace them",
  "Executive constraint is held at the manifest's reference value until M6-lite (P1.6a); V-SF-06c and V-ERA-03 cannot be evaluated before then (G1b)",
  "succession_institutionalisation is owned and held constant: its effect on hazards and its endogenous change are SIM-14 (P4)",
  "Tenure-dependent hazards: K&S's smoothed hazards fall for about 40 years then rise (R12 §2); F1 hazards are constant within a reign",
  "Eisner's second-order contagion (OR 2.4 two reigns back) and the accession-age effects (Eisner: victims acceded younger; K&S: younger is safer) are not modelled; the two sources disagree",
  "Hazard ratios for ultimogeniture, partition and sortition are not estimated in any source read: ultimogeniture borrows primogeniture_hr, partition and sortition the reference (1.0)",
  "Inherited claims, cadet branches and title creation or destruction are F2 / SIM-14 (P4); successor purges (the Registry hazard successor_purge) arise only from minds' feuds at F1",
  "Property inheritance (TransferHoldings to M4 by the house's inheritance rule) waits for M4 F0 (P1b)",
  "The named-actor count has no band: rebuilt prototype 7 ended at 98 active nobles with no count rule; it is reported and scales with population (08), never enforced (RT-2026-10-16 item 12)",
]

# ----------------------------------------------------------------------------- owned columns
[[owns]]
column = "house.id"
entity = "house"
type = "u64"
plane = "A"
meaning = "HouseId = H64(seed, \"house\", k) for a manifest dynasty; never reused. F1 creates no houses in-run (cadet branches are F2)"
fixed_point = false
[[owns]]
column = "house.great"
entity = "house"
type = "bool"
plane = "A"
meaning = "A great house (SIM-9): its members are candidates for naming from world start"
fixed_point = false
[[owns]]
column = "house.extinct_at"
entity = "house"
type = "i64"
plane = "A"
meaning = "Sim-time its last living member died (HOUSE_EXTINCT), or 0"
fixed_point = false
[[owns]]
column = "house_member.person"
entity = "house_member"
type = "u64"
plane = "A"
meaning = "PersonId of a person born into (or founding) a house: one row per such person, written by on_birth or world creation and never removed, so the house of a dead parent stays readable (round 4, NEW-1; person.* rows are compacted at their death instant); the rows are kept in strictly ascending person order: on_birth inserts each new row at its sorted position (never an append), world creation writes them sorted, and no row is ever removed, so no compaction can reorder them; a reader's lookup of a person is therefore a binary search over the column (M2's F4/F6 elite read on the lagged column; X3; INV-M7-09)"
fixed_point = false
[[owns]]
column = "house_member.house"
entity = "house_member"
type = "u64"
plane = "A"
meaning = "HouseId of that person, set once at birth by on_birth under the membership rule (BCK-002 A-56; D56): the father's house when he has a house_member row (the row keeps the dead, so a posthumous child takes its dead father's house) and that house is not extinct (house.extinct_at = 0; a child born to the last male of an extinct house gets no row, so no house is resurrected, N6), else none (no row). Membership is agnatic, as the back-fill writes it: a daughter's children belong to their father's house or to none, and the mother's house never passes. The frozen cognatic fallback saturates a world with members (REV-SPR-030 F1: kingdom_10k at 98% members by year 300), and a fallback bounded by the mother's nearness to the seat adds nothing in a world with T1, where the named marry the named (PR #79's review, R1; specs/systems/next/M7_membership.md). A house persists by its men, which at the fixtures' values needs the later-children vocation reading (the vocation submodel) and M2's elite fertility read on the couple (D56). Rows are written for great houses only (every manifest dynasty is a great house at F1). At world creation the dynasty's house for its root and every agnatic descendant the back-fill writes, the dead included, and no row for a wife married in ([algorithm.dynastic_backfill] B4, B6, B11; SPR-019), the same rule; the manifest's for the cast"
fixed_point = false
