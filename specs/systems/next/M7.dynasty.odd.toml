frozen = "HouseId of that person: the father's house, else the mother's, else none (no row), set at birth; the manifest's for founders"
to = "HouseId of that person, set once at birth by on_birth under the membership rule (BCK-002 A-56; D56): the father's house when he has a house_member row (the row keeps the dead, so a posthumous child takes its dead father's house) and that house is not extinct (house.extinct_at = 0; a child born to the last male of an extinct house gets no row, so no house is resurrected, N6), else none (no row). Membership is agnatic, as the back-fill writes it: a daughter's children belong to their father's house or to none, and the mother's house never passes. The frozen cognatic fallback saturates a world with members (REV-SPR-030 F1: kingdom_10k at 98% members by year 300), and a fallback bounded by the mother's nearness to the seat adds nothing in a world with T1, where the named marry the named (PR #79's review, R1; specs/systems/next/M7_membership.md). A house persists by its men, which at the fixtures' values needs the later-children vocation reading (the vocation submodel) and M2's elite fertility read on the couple (D56). Rows are written for great houses only (every manifest dynasty is a great house at F1). At world creation the dynasty's house for its root and every agnatic descendant the back-fill writes, the dead included, and no row for a wife married in ([algorithm.dynastic_backfill] B4, B6, B11; SPR-019), the same rule; the manifest's for the cast"
reason = "SPR-019: the back-fill writes a house_member row for every agnatic descendant of a dynasty's root, the dead included, and none for a wife married in; the frozen text named only the manifest's founders. 0.5.0 (BCK-002 A-56; PR #79's review R1): the frozen cognatic fallback saturates a world with members, and a bounded fallback is idle in a world with T1, so membership is agnatic, the back-fill's rule; the levers that keep a house alive are named"
