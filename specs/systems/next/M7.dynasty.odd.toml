# ----------------------------------------------------------------------------- observed event kinds (EVO-002; X1 (c))
# The instant log's part (c) records the merged events of the kinds some registered system observes; M7 reads M2's DEATH there. M2 is one
# of M7's reads at same_instant (the edge orders M2 first in every phase both bind; M7 runs in Polity, after Vital in any case).
[[observes]]
kind = "DEATH"
owner = "M2.demography"
why = "on_death answers each death of this instant with a triggered edge to its DEATH: SUCCEED, INTERREGNUM_CRISIS (a sovereign's, or a joined vassal's, K2) and HOUSE_EXTINCT cite it in the merge-time form EventRef::same_instant(DEATH, the dead person), which the merge resolves against the instant log's part (c) and refuses by name if absent (EVO-002 §4; BCK-002 A-59; F-1 of the wave-7 plan)"

[scales]
spatial = "houses, titles (sovereign, major, minor seats), offices and claims; a realm is a sovereign title and its vassal titles"
temporal = "Day pulse (every day start; in P1a every birth and death fires at a day start, round 3 BLK-1): births, deaths, arbitration, deposition, interregnum and regency timers, queued commands; Month pulse for the sovereigns' exit hazards (drawn on the first day over the whole month; the event placed on a keyed day among days 2 to the last); Year pulse for regrants, vocations and dormancy"
extent = "every house and title of the manifest: typically 1 to 20 houses, 5 to 200 titles; persons of great houses only for dormancy and vocations"
restart = "Owned columns plus M7's pending timers (MURDER_DUE with its culprit payload, deposition, interregnum resolution, regency end) restore the system exactly; derived state is rebuilt, never restored (M7's own index over its columns; kinship reads rh-core's genealogy index, EVO-002 §6). Each timer's re-sample at a material input in its entity's scope (resample_timer; ADR-0025 item 3; F-9 of the wave-7 plan): MURDER_DUE as [[rng]] exit_murder states; the deposition timer by the same rule, under exit_deposition, as its [[rng]] use states; the interregnum-resolution timer (about the title, under interregnum_delay) is kept: resample_timer returns its own time and keeps its cause, and never errors (05.1 §2 rule 2's exception for a timer whose drawn time decided an outcome already emitted). The regency-end timer (about the minor holder, at a date fixed by its birth and majority_age) has no [[rng]] purpose here: T-00b declares it, a no-draw purpose as T1's outcome_delay, with its re-sample rule. No P1a input scope names a title (EVO-002 §8), so the interregnum timer's rule is not exercised before a scope can name one"

[[fidelity_ladder]]
level = "F0"
representation = "Heir = eldest child (05.1 §3); no hazards"
status = "available"
[[fidelity_ladder]]
level = "F1"
representation = "Succession-law enum, competing exit hazards of sovereigns at the reference institutional state, immediate arbitration, claims, regencies, finite seats and re-grants, vocations, great-house dormancy"
status = "target"

# ----------------------------------------------------------------------------- schedule
# The death instant is a day boundary (round 3, BLK-1): every death takes effect through M2's apply_death in (day start, Vital),
# from M2's own timer in the timer pass or from M2's Day/Vital drain of a ScheduleDeath that a sender's timer submitted in that
# timer pass (EVO-001), and this Day/Polity binding runs later in the same instant, so on_death arbitrates there and then. The binding runs at
# every day start (rh-core runs every binding whose pulse fires; a `when` clause is documentation) and does work only
# where a birth or death happened in this instant's Vital slot or an M7 timer is due.
[[schedule]]
pulse = "Day"
phase = "Polity"
steps = ["on_birth: write the house_member row of each person born this instant, and send Promote for a newborn who meets the naming criteria", "on_death: for the persons who died this instant (exited(), the instant log's part (b); EVO-002), first void their claims, vacate their offices, close their regencies and count their houses; then arbitrate each title they held, by tier then TitleId, in the same step (K6); last, HOUSE_EXTINCT for each house that ended", "arbitrate: fire due interregnum-resolution timers: name the successor (or, still contested, draw one)", "exit: fire due deposition timers: depose the ruler and arbitrate in the same step", "regency: fire due regency-end timers"]
when = "every day start; work only at a birth or death of this instant or a due M7 timer"
[[schedule]]
pulse = "Month"
phase = "Polity"
steps = ["exit_hazards: for each sovereign, draw whether it is murdered or deposed this month (probability over the whole month; the event on a keyed day among days 2 to the last: a murder is an M7 timer at (that day, Vital), a deposition an M7 timer at (that day, Polity))"]
when = "always (the first day of each month)"
[[schedule]]
pulse = "Day"
phase = "Vital"
steps = ["murder_due: the fire of a due MURDER_DUE timer in this Vital's timer pass (M7's fire, which precedes every binding; the binding's own step is empty, and the fire must not be done in it, where it would run after M2's drain and lose a day): if the ruler is alive and still holds the title, submit ScheduleDeath {the ruler, murder, the timer's culprit payload, None} to M2, which drains it in this same Vital before the bindings that read M2 (05.1 §2 rule 2; EVO-001 R9); otherwise drop_timer(dead) (the timer is cancelled on death or loss of the title, title.exit_timer, so this is the same-instant race only: a natural death drawn for the same day start fires in M2's pass, before M7's; REV-EVO-001 NIT-15)"]
when = "every day start; the binding exists so that M7's Vital timer pass has a level; its step does nothing"
[[schedule]]
pulse = "Day"
phase = "Agenda"
steps = ["apply_commands: apply PressClaim, PetitionSeat, RenounceClaim and Resign from T1.minds"]
when = "every day start; work only with queued M7 commands"
[[schedule]]
pulse = "Year"
phase = "Polity"
steps = ["regrant: grant titles held in demesne and vacant offices to petitioners or eligible kin", "vocation: draw a vocation for each great-house member who reached majority_age this year, is a later child (an elder child of the same father is alive at the draw), is not first or second in any title's line, and holds no seat, office or claim", "dormancy: recompute claim.rank and send Demote and Promote by SIM-9's criteria"]
when = "always (the first day start of each year). At a year's first instant this binding runs before Day/Polity (two bindings of one system in one phase run as two levels, the coarser pulse first: 05.1 §2 rule 4), so a holder who died in this instant's Vital still holds his titles, offices and claims for regrant, vocation and dormancy here, the rule on_birth states (K12 of REV-WAVE7); on_death vacates them in Day/Polity later in the same instant. At tick 0, the world's first instant, the dormancy step is the world-start naming pass (X4)"

# ----------------------------------------------------------------------------- RNG
# Mapping onto H (05.1 §6 item 2; MIN-1): StepCtx::rng(purpose, entity, k) supplies the world seed, branch salt, system id,
# the entity's epoch and the instant t itself; each purpose below names its entity and k. Each draw is one u64 from its own
# keyed stream. Enumeration before a draw is in ascending id (MIN-2): candidates and claimants by PersonId, claims by
# ClaimId, titles by TitleId; tied scores are listed in ascending PersonId before a tie draw.
[[rng]]
purpose = "exit_murder"
key = ["ruler", "month"]
use = "entity = the ruler, k = 0, t = the month's first instant: hits iff draw < p_m (Prob32 draw_hits, SPR-011 ruling 4). A hit is an M7 timer MURDER_DUE at (the drawn day, Vital) under this purpose (EVO-001 R9, R10): entity = the ruler, payload = the culprit drawn by murder_culprit at the month start (0 = none), cause = None. resample_timer (a material input in the ruler's scope, ADR-0025 item 3; R17): the day is re-drawn, under this purpose at the ruler's new epoch with k as exit_day uses it, uniformly among the month's day starts at or after the input's instant (the input's own day included when its day start is after the input; the timer, due at (k, Vital), is still pending at (k, Inputs)), so a re-sample never cancels a murder while a day start remains; a month with no remaining day start (an input in the last day's instants after its start) moves the murder to the next month's first day start. The hit itself is kept, deliberately (unlike M2's S11, which re-draws the hit with q'): the month's hazard was decided at the month start and the input changes only when the murder falls. The payload is kept; it never errors and drops nothing"
resample_on_fork = true
[[rng]]
purpose = "exit_deposition"
key = ["ruler", "month"]
use = "entity = the ruler, k = 0, t = the month's first instant: hits iff draw < p_d (Prob32). A hit is an M7 deposition timer at (the drawn day, Polity), the day from exit_day (k = 1), filed under this purpose: entity = the ruler, payload 0, cause = None (a hazard draw has no inciting event). resample_timer (a material input in the ruler's scope, ADR-0025 item 3; F-9 of the wave-7 plan, exit_murder's rule): the day is re-drawn, under this purpose at the ruler's new epoch with k = 1 as exit_day uses it, uniformly among the month's day starts at or after the input's instant (the input's own day included when its day start is after the input; the timer, due at (k, Polity), is still pending at (k, Inputs)), so a re-sample never cancels a deposition while a day start remains; a month with no remaining day start moves it to the next month's first day start. The hit is kept, deliberately, as exit_murder keeps its; the payload is kept; it never errors and drops nothing"
[[rng]]
purpose = "exit_day"
key = ["ruler", "month"]
use = "entity = the ruler, t = the month's first instant; k = 0 the murder's day, k = 1 the deposition's day, each uniform on days 2 to the last of the month (draw mod n). If both hit, the earlier day wins (murder on a tie) and the other is dropped"
[[rng]]
purpose = "murder_culprit"
key = ["ruler", "month"]
use = "entity = the ruler, k = 0, t = the month's first instant: the culprit of a background murder, uniform (draw mod n) over the title's living claimants in ascending PersonId, or none (an unnamed court faction) when there are none"
[[rng]]
purpose = "arbitration_tie"
key = ["title", "tick"]
use = "entity = the title, k = 0, t = the arbitration instant: an exact score tie in on_death, exit or an interregnum resolution, and the score-weighted pick of a still-contested interregnum resolution; candidates in ascending PersonId"
[[rng]]
purpose = "regrant_tie"
key = ["title", "tick"]
use = "entity = the title or office, k = 0, t = the year's first instant: an exact score tie in the yearly regrant (separate from arbitration_tie, which an interregnum resolution can draw at the same instant)"
[[rng]]
purpose = "sortition"
key = ["person", "title", "tick"]
use = "entity = the candidate, k = the title's TitleId (so titles vacated in one step with overlapping candidates get independent orders; round 4g), t = the arbitration instant: under the sortition law the effect language's rng_permutation(purpose = \"sortition\") (05.5 §2.1; SPR-017) orders the eligible candidates by ascending draw, ties in ascending PersonId; one draw per candidate per arbitration"
[[rng]]
purpose = "interregnum_delay"
key = ["title", "tick"]
use = "entity = the title, k = 0, t = the crisis instant: days to the resolution, 1 + draw mod interregnum_max_days; the timer is at that day's start, Polity. The resolution timer is filed under this purpose about the title, its cause slot the crisis (the INTERREGNUM_CRISIS's DraftRef, rewritten at the merge); a vassal that joins its liege's interregnum (K2) draws nothing and has no timer; a renewed crisis draws again at its own instant. resample_timer keeps the timer (F-9 of the wave-7 plan): it returns the timer's own time and keeps its cause, deliberately, as exit_murder keeps its hit (the delay was decided at the crisis); no P1a input scope names a title (EVO-002 §8), so it is not called before a scope can name one; it never errors"
[[rng]]
purpose = "vocation"
key = ["person"]
use = "entity = the person, k = 0, t = the year's first instant in which it reaches majority_age (so one draw per life): holy_orders if draw < vocation_holy_orders, else mercenary if draw < vocation_holy_orders + vocation_mercenary, else household (Prob32 thresholds)"

# ----------------------------------------------------------------------------- design concepts
[design]
basic_principles = "Competing ruler-exit hazards as functions of institutional state, not of date (ADR-0027; Eisner 2011, Kokkonen & Sundell 2014; R12 §1–2); natural death stays M2's Brass hazard. Succession is immediate (SAGA-13, ADR-0035) and decided by law, claims and the court, never by a director (ADR-0009). Counts are outcomes, never targets (docs/01 principle 8)"
emergence = "Reign lengths, the deposition share by law, regicide contagion, interregna, regencies, contested successions, house extinctions and the size of the named nobility emerge from the hazards, M2's demography, minds' decisions and the finite seats"
adaptation = "n/a: M7 has no agents; claimants, petitioners and feuding houses decide through T1.minds"
objectives = "n/a"
learning = "n/a"
prediction = "n/a"
sensing = "Births, deaths and their causes at the same instant (M2 binds only Vital); named status, active vows and executive constraint at the start of the instant (lagged); a read of an absent owner is dropped by SPR-014's registration rule and its neutral value applies. Kinship through the life-course columns, dead kin included"
interaction = "Lifecycle commands only: ScheduleDeath to M2 (background murders), Promote, Demote and OpinionModifier to T1.minds, TransferHoldings to M4 (P1b); PressClaim, PetitionSeat, RenounceClaim and Resign applied from T1.minds. S6 and S7 read title.holder (regalia, CLAIM_TITLE vows)"
stochasticity = "Keyed RNG only: monthly exit draws and their day, culprit, ties, interregnum delay, vocation. Arbitration itself is deterministic given its inputs"
collectives = "Houses (SIM-9 great houses), realms (a sovereign title with its vassal titles) and courts (the named holders of a realm's seats and offices)"
observation = "SUCCEED, INTERREGNUM_CRISIS, DEPOSED, REGENCY_*, CLAIM_*, SEAT_GRANTED and HOUSE_EXTINCT in channel A; reign records (held_since, predecessor_exit) for V-SF-06, 06b, 06c, 06d; the attribute succession_rank(actor, partner)@eN; the named-actor count in the run report"
era_state = ["succession_institutionalisation", "exec_constraint"]
scale_behaviour = "Identical at every N. A micro world may hold one title and no hazards fire visibly; the V-SF-06 bands report INSUFFICIENT below their minimum ruler-years (09 §3). Dormancy keeps the named set proportional to seats, offices, claims and vows, so it scales with the manifest's titles rather than with house growth"

[initialization]
state = "Houses, titles (tier, liege, polity, law, holder) and offices from the manifest's dynasties, as the journaled world-creation event, written by rh-worldgen's [algorithm.dynastic_backfill] (SPR-019, specs/worldgen/population_synthesis.toml B1 and B9-B11): one sovereign title per polity with a dynasty and one major title per further dynasty, liege the sovereign; each dynasty's pre-epoch genealogy as life-course rows (closed for the dead, with house_member rows for the root and every agnatic descendant); each title's tenure log from the root's majority to the genesis holder, each past holder the first of the title's succession law's line as the effect language's programs state it, or, when that line is empty, the back-fill's stand-in (the oldest living male of the house: an adult when one lives, else a minor; B9 counts them) (the court laws, elective and sortition, write the genesis holder's row only, the stand-in at tick 0); holder and held_since from the log's open row (held_since from the manifest (or world start) for a court law's title), predecessor_exit natural when the log has a past holder, else none; offices vacant; no claims unless the manifest declares them; regent = 0, a holder under majority_age at genesis included: no step names one until SPR-021; succession_institutionalisation from the manifest; the manifest's cast is compiled at load into cast_ids, a sorted run constant of PersonIds, each the founder id of its cast entry by V-DATA-05's founder index (founder(seed, k)); it enters the history through manifest_hash and never changes in a run ([input_data]); genesis names only the cast, which stays named (the dormancy submodel's criterion (e) tests membership in cast_ids), and world-start naming has one route (X4): the dormancy step of M7's Year/Polity binding at tick 0, the world's first instant, sends Promote for every person who meets a naming criterion (SIM-9; the dormancy submodel), so the ruling houses and the great-house members who meet the criteria are named from world start; the first exit draws at the first Month pulse"
from_manifest = ["dynasties", "cast", "polities", "institutions"]

[input_data]
drivers = []
# 0.6.0 (T-00a revision 1, MIN-11): criterion (e)'s data. A run constant, not a driver: compiled once from the manifest.
constants = ["cast_ids: the PersonIds of the manifest's cast, sorted ascending, each the founder id of its cast entry by V-DATA-05's founder index (founder(seed, k)); compiled at load, it enters the history through manifest_hash and never changes in a run; the dormancy submodel's criterion (e) tests membership in it (a binary search)"]

# ----------------------------------------------------------------------------- parameters
# 0.6.0 (K3 of REV-WAVE7 with the re-check's R3): the 16 parameters other than majority_age carry a Registry default, at
# twin_vales.yaml's values, so a manifest such as manor.yaml, which sets majority_age alone, compiles. The defaults are mirrored here
# and in specs/systems/next/registry_delta.toml ([systems."M7.dynasty"], M2's mechanism), and move into registry_v0.toml at
# SPR-021a T-01, with no registry_version bump (X6). interregnum_max_days and dormancy_degrees are counts (F-6).
[[params]]
name = "murder_hazard_base"
meaning = "Murder hazard per ruler-year of a sovereign at the reference institutional state (elective law, no assembly, no murdered predecessor). Coupled with T1.minds, it is the background part: recalibrated against V-SF-06 so background plus minds' foreground murders hit the band"
source = "Eisner 2011, Table 2 and Figs 1–2 (R12 §1): century rates 0.0019–0.025, pooled 0.010. The pooled rate is a mixture over laws and feud states, not the reference-state hazard itself; the bounds are sourced, a point value is a calibration choice"
default = 0.01
[[params]]
name = "deposition_hazard_ref"
meaning = "Non-lethal deposition hazard per ruler-year at the reference state (forced abdication, overthrow survived); K&S's deposition minus the murders M7 draws separately"
source = "Derived design value inside the K&S bounds (MIN-4): Kokkonen & Sundell 2014, Table 1, p. 445 (R12 §2) give 0.040 deposed per ruler-year under election; subtracting Eisner's pooled, all-law murder rate 0.010 gives about 0.03. The subtraction mixes an election-only rate with a pooled one, and K&S also count death in civil war, which has no mechanism before M8; the bounds [0.01, 0.05] are sourced, the point value is not"
default = 0.03
[[params]]
name = "primogeniture_hr"
meaning = "Multiplier on both exit hazards under primogeniture (and, by analogy, ultimogeniture) relative to election"
source = "Kokkonen & Sundell 2014, p. 447 and p. 450 (R12 §2): HR 0.25 [0.17, 0.37], 0.34 [0.18, 0.63] stratified"
default = 0.3
[[params]]
name = "seniority_hr"
meaning = "Multiplier on both exit hazards under agnatic seniority relative to election"
source = "Kokkonen & Sundell 2014, p. 447 (R12 §2): HR 1.98 [1.17, 3.35], 2.57 stratified"
default = 2.0
[[params]]
name = "predecessor_killed_or"
meaning = "Multiplier on the murder hazard when the predecessor was murdered (an odds ratio applied as a hazard ratio: exact enough for monthly probabilities below 0.01)"
source = "Eisner 2011, p. 570 (R12 §1): OR 2.98"
default = 2.8
[[params]]
name = "predecessor_deposed_hr"
meaning = "Multiplier on the deposition hazard when the predecessor was deposed or murdered"
source = "Kokkonen & Sundell 2014, p. 447 (R12 §2): predecessor deposed HR 1.56–1.80"
default = 1.7
[[params]]
name = "exec_constraint_hr"
meaning = "Multiplier on both exit hazards at full executive constraint (an assembly); m_ec = 1 + (exec_constraint_hr - 1) x exec_constraint"
source = "Kokkonen & Sundell 2014 (R12 §2): parliament HR 0.50 between countries, not significant within them, so the range reaches 1.0. Not from Blaydes & Chaney 2013, which is the held-out V-SF-06c's source"
default = 0.5
[[params]]
name = "majority_age"
meaning = "Age (years) below which a holder rules through a regent; also the age of vocations and of dormancy decisions"
source = "design value; no source read. Medieval royal majorities varied (roughly 12–21)"
# no default: majority_age stays required (REV-SPR-019 R15; K3 of REV-WAVE7)
[[params]]
name = "arb_legal_weight"
meaning = "Arbitration weight of being the legal heir under the title's law"
source = "design value (SAGA-13). Settled by V-SAGA-19's fixtures and the director's reading of G1a histories"
default = 1.0
[[params]]
name = "arb_claim_weight"
meaning = "Arbitration weight of holding a pressed claim on the title"
source = "design value (SAGA-13)"
default = 0.6
[[params]]
name = "arb_military_weight"
meaning = "Arbitration weight of military proximity: at F1, holding the title's marshal office (M8's armies replace the proxy in P4)"
source = "design value (SAGA-13)"
default = 0.3
[[params]]
name = "arb_treasury_weight"
meaning = "Arbitration weight of treasury control: at F1, holding the title's steward office (M4's treasury joins in P1b)"
source = "design value (SAGA-13)"
default = 0.3
[[params]]
name = "contest_margin"
meaning = "Lead (in score units) the best candidate needs over the runner-up for a sovereign title to pass without an interregnum"
source = "design value (SAGA-13). Settled by the share of interregna in the G1a histories; no historical band read"
default = 0.5
[[params]]
name = "interregnum_max_days"
meaning = "Upper bound of the keyed delay to an interregnum's resolution"
source = "design value (SAGA-13)"
type = "count"                 # an integer: u64 in the skeleton (F-6 of the wave-7 plan; SPR-016 MR2)
default = 180
[[params]]
name = "dormancy_degrees"
meaning = "SIM-9's N: a great-house member farther than this many degrees of kinship from every holder of a title, claim or office of the house, and holding none, with no active vow, becomes dormant"
source = "design value (SIM-9). Settled by V-INV-12, the G1a performance budget (at most 500 named actors) and the family histories"
type = "count"                 # an integer: u64 in the skeleton (F-6 of the wave-7 plan; SPR-016 MR2)
default = 2
[[params]]
name = "vocation_holy_orders"
meaning = "Share of later children who enter holy orders at majority (celibate; leave every succession line)"
source = "design value (RT-2026-10-16 item 12); prototype 7's 0.40 is illustrative, not sourced"
default = 0.2
[[params]]
name = "vocation_mercenary"
meaning = "Share of later children who join a mercenary company at majority (leave the court's candidate sets; keep their place in lines)"
source = "design value (RT-2026-10-16 item 12); prototype 7's 0.35 is illustrative, not sourced"
default = 0.15

# ----------------------------------------------------------------------------- submodels
[[submodels]]
name = "exit_hazards"
summary = "On the first day of each month, for each sovereign title (ascending TitleId) with a living holder: law multiplier L = primogeniture_hr (primogeniture, ultimogeniture), seniority_hr (seniority), 1 (elective, tanistry, partition, sortition); m_ec = 1 + (exec_constraint_hr - 1) x exec_constraint (1 when M6 is not registered); h_m = murder_hazard_base x L x m_ec x (predecessor_killed_or if predecessor_exit = murdered); h_d = deposition_hazard_ref x L x m_ec x (predecessor_deposed_hr if predecessor_exit in {murdered, deposed}). Widths (MAJ-3, NEW-2): every factor is a Q16_16 parameter or column; h is their product computed exactly in u128 from the Q16_16 bits; the month's probability is p = h x D_m / D over the whole month, D_m = days_in_month, D = days_per_year, rounded down once to Prob32 (32 fraction bits, SPR-011 ruling 4), so the rate per ruler-year is exact; only the placement of the event excludes the pulse instant (a keyed day among days 2 to the last). p = h x D_m / D is linear in h, not 1 - exp(-h x D_m / D): it overstates by at most x²/2 for x = h D_m / D (about h²/288 for a 30-day month), a relative excess of at most x/2, under 0.05% at the reference h = 0.01 and about 1.1% at the Registry's upper corner (h near 0.27); no transcendental is needed. At the lower corner (h = 6 x 10^-5 a year) p is about 2 x 10^4 Prob32 steps, so no hazard rounds to zero. Draws: exit_murder and exit_deposition against p_m and p_d; exit_day for the day; murder wins a tie of days. A murder sends an M7 MURDER_DUE timer at (that day, Vital) under exit_murder, payload = the murder_culprit draw, whose fire (murder_due, in the timer pass) submits ScheduleDeath {victim = ruler, cause = murder, culprit = murder_culprit, cause_event = None}; M2 drains it in that same Vital (SPR-014; EVO-001) and the death takes effect there, before this binding. A deposition schedules M7's deposition timer at (that day's start, Polity). Either timer sets title.exit_timer := 1 (a flag: StepCtx::schedule returns no TimerId), and on_death and a loss of the title find and cancel it through StepCtx::own_timers, writing 0 (NIT-15; F-3)"
earns_its_place_by = ["V-SF-06", "V-SF-06b", "V-SF-06d", "V-ERA-03"]
[[submodels]]
name = "on_birth"
summary = "MAJ-5: for each person born this instant, the persons of StepCtx::inserted() in ascending PersonId (the instant log's part (a), EVO-002 §2: the rows inserted at the merges before this binding's level; no scan of the ledger; birth_tick = now; births are M2 timers in this instant's Vital slot; the newborn's parents are read from person.mother and person.father at the same instant, and the father's house from house_member, which keeps the dead, so a parent dead in this slot or earlier counts by its state at the start of the instant: the father's row outlives him and kinship is the log): a house_member row, inserted at its sorted position by person (X3: never an append; INV-M7-09), with the father's house when he has one and that house is not extinct (house.extinct_at = 0), else no row (the membership rule of house_member.house, 0.5.0, BCK-002 A-56: agnatic; the mother's house never passes; great houses only; a child of the last male of a house extinct at the child's birth gets no row, so no house is resurrected: N6 of PR #79's review). The newborn's kinship needs no step: it is the life-course columns, which kin(p, n) walks from this instant on (round 4, NEW-1). Then the naming criteria of the dormancy submodel are evaluated for a newborn member on this instant's state: a holder who dies this instant still holds here (on_birth runs before on_death in this binding); the line of a title is the line after M7's exclusions (the deposed and persons in holy orders); a sortition title has no first or second outside its arbitration instant; and a newborn meeting any criterion (within dormancy_degrees of a holder of its house, which a holder's own child is if the holder is male; or first or second in the line of any title; or, for anyone, a title, office or claim of its own) is Promoted at once (one list, A-57; the same criteria the yearly pass applies). Other relations are not stored: T1.minds derives kinship from M2's life-course columns (life_course.mother and life_course.father) through kin(p, n), plus person.spouse for the living spouse, when it reads them"
earns_its_place_by = ["V-INV-12"]
[[submodels]]
name = "on_death"
summary = "In the death instant's Day/Polity binding (every death takes effect through M2's apply_death in this day start's Vital slot, from a timer fire or from M2's drain; round 3, BLK-1; EVO-001). The dead are the persons of StepCtx::exited(), the instant log's part (b) (EVO-002 §2; 05.1 §2 rule 2): those whose person.alive went from 1 to 0 at a merge before this binding's level, ascending by PersonId across the instant (SPR-038 stage B builds it, R9; M7 does not sort them), found with no scan of the ledger; their rows are readable until Bookkeeping of this instant (SPR-011 ruling 5), and a read of a dead row after this instant is a bug. Two phases in one step (K6 of REV-WAVE7), so that no one dead this instant is a candidate or scores. Phase 1, for each dead person in ascending PersonId: its claims, claim.status := void; its offices, office.holder := 0; the regencies it held, closed (the next regent by rule, REGENCY_ENDED and REGENCY_BEGUN: the regency submodel); and its house, if it was a member, counted through M7's house → members index and person.alive at same_instant (a house whose last living member died: house.extinct_at := now). Phase 2, each title whose holder died, by tier (sovereign, then major, then minor) then ascending TitleId, so a liege is arbitrated before its vassals (F-11): predecessor_exit := murdered, other_violent or natural from person.death_cause; holder := 0; state := awaiting; its pending M7 exit timer cancelled through StepCtx::own_timers and title.exit_timer := 0 (F-3); then run arbitrate on it in this same step (SAGA-13), so awaiting never leaves the step. Last, HOUSE_EXTINCT for each house counted extinct in phase 1, in ascending HouseId, after the step's successions and crises. Every event this step emits for a death carries its triggered edge to that DEATH in the merge-time form, EventRef::same_instant(DEATH, the dead person), which the merge resolves against the instant log's part (c) ([[observes]] DEATH) and refuses by name if absent (EVO-002 §4). Property: TransferHoldings to M4 (P1b)"
earns_its_place_by = ["V-SAGA-19", "V-INV-03"]
[[submodels]]
name = "arbitrate"
summary = "Run in-step by on_death and exit, and by a due interregnum-resolution timer. Candidates (each list in ascending PersonId; never a person who died this instant, whose claims and offices on_death's phase 1 has already voided and vacated: K6): the legal heir by the title's law (the effect language's succession laws, SPR-017, which may read the tenure log, e.g. holders_of(title, 16) for the title-blood rule; every holder change below appends a tenure row and closes the previous one; the deposed ruler and persons in holy orders excluded), the claimants with pressed active claims (each claim.rank is recomputed here), and for a title without either, the liege's re-grant candidates (petitioners, then kin of the liege's holder within dormancy_degrees through kin(holder, dormancy_degrees) over the life-course columns); a vassal title with no candidate at all reverts to its liege's holder in demesne (SUCCEED) while the liege is held; when the liege is in interregnum (its holder dead this instant and arbitrated earlier in this step, by tier, or in an earlier crisis), the vassal emits its own INTERREGNUM_CRISIS (payload its title; triggered to its holder's DEATH or the DEPOSED), state := interregnum, with no timer of its own: it joins the liege's interregnum and is resolved at the liege's resolution, right after the liege (K2 of REV-WAVE7). Score (Q16_16) = arb_legal_weight x [legal heir] + arb_claim_weight x [pressed claim] + arb_military_weight x [holds the title's marshal office] + arb_treasury_weight x [holds its steward office]; an exact tie is broken by arbitration_tie. Best leads the runner-up by contest_margin or more (or is alone), or the title is not sovereign: SUCCEED (triggered to the vacating DEATH in the merge-time form, the DEPOSED by its DraftRef, or at a resolution the crisis the timer carries), holder := best, held_since := now, state := held; if best is not the legal heir, the heir gains a claim (CLAIM_CREATED, payload the title, triggered to this SUCCEED by its DraftRef, with claim.cause_event set to the same draft through ctx.set_cause: K7) and a PASSED_OVER modifier about best; a realised claim's status := realised. Otherwise, for a sovereign title: INTERREGNUM_CRISIS (triggered to the vacating DEATH or DEPOSED), state := interregnum, a resolution timer interregnum_delay days later (at that day's start, Polity; its cause slot the crisis's DraftRef), and title.exit_timer := 1 (F-3); at resolution, re-arbitrate with the same rule, and if still contested pick by arbitration_tie weighted by score; a sovereign with no candidate at resolution goes to the realm's highest-tier vassal holder (election by the magnates; ties in ascending TitleId), else to the back-fill's stand-in (the oldest living male of the late holder's house, an adult when one lives, else a minor: the rule of SPR-019's [algorithm.dynastic_backfill] B9, applied in-run), else the crisis is renewed (INTERREGNUM_CRISIS triggered to the previous crisis and a new resolution timer: F-11, a one-dynasty realm with no candidate); once the sovereign is seated, each vassal that joined its interregnum is resolved, by tier then TitleId, with the same rule (K2). A successor under majority_age gets a regent by rule (the living adult mother, else the nearest living adult kin in the law's order through kin(p, n), else the steward): REGENCY_BEGUN and a regency-end timer at the first day start at or after the holder's majority"
earns_its_place_by = ["V-SAGA-19", "V-SF-06b"]
[[submodels]]
name = "exit"
summary = "A deposition timer fires at a day start: if the ruler is alive and still holds the title, emit DEPOSED (actor = the leading pressed claimant, if any: the highest arbitration score, ties in ascending PersonId), give the ruler a claim (CLAIM_CREATED) and a DEPOSED_BY modifier about the deposer, predecessor_exit := deposed, state := awaiting, and run arbitrate in the same step with the deposed excluded"
earns_its_place_by = ["V-SF-06b", "V-SAGA-19"]
[[submodels]]
name = "regency"
summary = "At the holder's majority: regent := 0, REGENCY_ENDED"
earns_its_place_by = ["V-SAGA-19"]
[[submodels]]
name = "apply_commands"
summary = "PressClaim{claim}: pressed := true, CLAIM_PRESSED, CLAIM_PRESSED_BY modifier for the holder about the claimant. PetitionSeat{person, target}: a petition row (one per person and target). RenounceClaim{claim}: status := renounced, CLAIM_RENOUNCED. Resign{person, office}: office.holder := 0. A command naming a dead person or an ended claim is dropped with a diagnostic"
earns_its_place_by = ["V-SAGA-19", "V-SF-06b"]
[[submodels]]
name = "regrant"
summary = "Yearly: each title held in demesne by its liege's holder (a second title of the same holder below its own tier) and each vacant office goes to the best candidate: petitioners for it, then the holder's kin within dormancy_degrees (kin(holder, dormancy_degrees) over the life-course columns) who hold no seat or office (persons in holy orders only for chaplain), scored by the arbitration score without the legal term, ties by regrant_tie, candidates in ascending PersonId; SEAT_GRANTED and a GRANTED_BY modifier; the liege keeps the seat when no candidate exists. Seats are never created (finite seats)"
earns_its_place_by = ["V-INV-12"]
[[submodels]]
name = "vocation"
summary = "Yearly: each great-house member who reached majority_age this year and is a later child (an elder child of the same father is alive at the draw: so the father's eldest living child is exempt, and at e0 30, where l(16) is 0.55, the first-born is often dead and a younger child is the eldest living) who is not first or second in any title's line, and holds no seat, office or claim, draws a vocation (PR #79's review R4 and N5: the reading of this spec's [[params]] meanings, the Year schedule step and RT-2026-10-16 item 12; the frozen 0.3.4 submodel exempted the first in any title's line alone, a reading the population projection keeps as a sensitivity line): holy_orders (leaves every line; eligible only for chaplain; M2's fertility reads it, P1.3), mercenary (leaves the court candidate sets; keeps lines), or household. Everyone stays in the ledger and the life-course log"
earns_its_place_by = ["V-INV-12"]
[[submodels]]
name = "dormancy"
summary = "Yearly, and at world start. The naming criteria (SIM-9) are one list; (a) and (e) apply to any person, the rest to great-house members (the house read from house_member; a holder of the house is a member of it who holds a title, office or claim): (a) it holds a title, office or claim, member or not (N7 of PR #79's review: a holder of no house, such as a houseless heir who succeeded, is named by its seat, which closes the path a periphery woman opens when she marries a commoner while un-named and later becomes heir); (b) it has an active vow (S7, P1b; read with S7); (c) it is within dormancy_degrees (related(member, holder, dormancy_degrees) over the life-course columns, through dead kin) of a holder of its house (house-scoped: SIM-9's 'more than N degrees from any title, claim or office' is read as from any title, claim or office held by a member of its own house, F-16 of the wave-7 plan; the requirement text is the director's, D58 item 6); (d) it is first or second in the line, by the title's law as arbitrate computes it (the line after M7's exclusions, the deposed and persons in holy orders; a court law's line is the court's order; a sortition title has no first or second outside its arbitration instant), of any title, whatever house holds it (an heir apparent is named whatever its house: R6 of PR #79's review widens the frozen 'a ruling house's heir'); (e) its PersonId is in cast_ids, the manifest's cast compiled at load ([initialization], [input_data]), member of a house or not (genesis names the cast, X4), so a cast member is named from world start and never dormant-eligible (the Architect's ruling of 2026-10-18 on the T1-A draft's finding under X4: without it, tick 0's pass would demote a cast member who meets no other criterion, solo's Ada in a world with M7 and T1). Precedence (BCK-002 A-57): a person that meets any criterion is named, so a far adult heir or second, beyond the degrees, is named and not dormant-eligible; a named adult (majority_age) that meets none is dormant-eligible: Demote; a named minor is never demoted (age enters Demote only). Promote: a person not named (person.named, lagged, neutral false) that meets a criterion (a member, or a person of no house under (a) or (e)), at this pass or at on_birth. At world start (this step of the Year/Polity binding at tick 0, the world's first instant: the one route by which a person beyond the manifest's cast is named at world start, X4; genesis names the cast) the pass names exactly the persons meeting a criterion, so a minor beyond the degrees who is not in a line's head is not named at start. The named set after a pass is therefore the persons meeting a criterion plus the named minors, and the dormancy counts are the Demotes and Promotes sent (reported, never a target). Criteria only; never a count; nothing is deleted (ADR-0007)"
earns_its_place_by = ["V-INV-12"]

# ----------------------------------------------------------------------------- invariants
[[invariants]]
id = "INV-M7-01"
statement = "At every tick boundary every title is held by a living holder or is in a declared interregnum (a sovereign's, with its resolution timer pending, or a vassal's joined to its liege's interregnum, K2); awaiting never leaves the step that set it (on_death or exit arbitrate in-step); a holder holds each title at most once"
test = "V-SAGA-19"
[[invariants]]
id = "INV-M7-08"
statement = "Exactly one open tenure row (end = i64::MAX) per held title, and its holder is title.holder; a title in interregnum has none; tenure rows are never removed and each end is written once"
test = "V-SAGA-19"
[[invariants]]
id = "INV-M7-02"
statement = "Every titleholder death or deposition is followed in the same instant by SUCCEED or INTERREGNUM_CRISIS for that title (a vassal that joins its liege's interregnum emits its own INTERREGNUM_CRISIS, K2), with a triggered edge to the death or deposition (the envelope's edge kinds; envelope_v0.md §3, §5)"
test = "V-SAGA-19"
[[invariants]]
id = "INV-M7-03"
statement = "Every interregnum period ends at most interregnum_max_days after the INTERREGNUM_CRISIS that opened it: with SUCCEED at its resolution (a joined vassal's at its liege's resolution, right after the liege, K2), or, when the resolution finds no candidate, no vassal holder and no stand-in, with a renewed INTERREGNUM_CRISIS triggered to the previous one, which opens the next period (F-11)"
test = "V-SAGA-19"
[[invariants]]
id = "INV-M7-04"
statement = "Realised hazards stay in their bounds: h_m in [murder_hazard_base x min(L) x exec_constraint_hr, murder_hazard_base x max(L) x predecessor_killed_or], likewise h_d; every window probability is a Prob32 greater than 0 for every h greater than 0 in the Registry bounds"
test = "V-SF-22"
[[invariants]]
id = "INV-M7-05"
statement = "Every active claim has a living claimant who does not hold the claimed title; every regent is living and adult while regent"
test = "V-INV-01"
[[invariants]]
id = "INV-M7-06"
statement = "Ruling houses and active great-house members are named from world start; Promote and Demote follow the criteria only, as one list (the dormancy submodel): a member meeting any naming criterion is named, so naming wins over distance for a far heir (BCK-002 A-57), a named adult meeting none is demoted, and a named minor is never demoted before its majority; a holder of a title, office or claim is named whether or not it is a great-house member (N7), and so is a person of the manifest's cast, from world start and never demoted (criterion (e)); no dormant person leaves the ledger or the life-course log; every house_member row written in-run follows the membership rule of house_member.house (the father's house, else none), and a child born into an extinct house gets no row, so no house is resurrected"
test = "V-INV-12"
[[invariants]]
id = "INV-M7-09"
statement = "house_member rows are in strictly ascending house_member.person order at every tick boundary: on_birth inserts each row at its sorted position (never an append), world creation writes them sorted and no row is removed, so M2's F4/F6 elite lookup is a binary search over the lagged column (X3 of the P1a shared rulings)"
test = "V-INV-01"
[[invariants]]
id = "INV-M7-07"
statement = "M7 writes only its own columns; every death it causes is a ScheduleDeath through M2's single death path"
test = "V-INV-04"

# ----------------------------------------------------------------------------- couplings
[[couplings]]
system = "M6.polity"
direction = "in"
via = "executive constraint (an assembly, landed military elite) lowers both exit hazards of the polity's sovereign. Until M6-lite (P1.6a) no P1a world registers M6, so SPR-014's registration rule drops the read and the neutral value applies: exec_constraint = 0, m_ec = 1 (round 4, NEW-4)"
lag = "start of instant (lagged)"
column = "polity.exec_constraint"
form = "m_ec = 1 + (exec_constraint_hr - 1) x exec_constraint, multiplying h_m and h_d"
neutral = "exec_constraint = 0, the reference institutional state (no assembly): m_ec = 1"
output_bounds = ["exec_constraint_hr (at least 0.3)", "1"]
data_range = "exec_constraint in [0, 1] (q8_8). The evidence is binary, parliament or none (K&S 2014: HR 0.50 between countries, not significant within; R12 §2); intermediate values interpolate linearly by design"
beyond_range = "Not reachable: M6 owns exec_constraint in [0, 1] (q8_8 era state)"
source = "Kokkonen & Sundell 2014, p. 447 (R12 §2); deliberately not Blaydes & Chaney 2013 (V-SF-06c's source)"
[[couplings]]
system = "M2.demography"
direction = "in"
via = "the death path: a titleholder's death in the Vital slot starts arbitration later in the same instant; person.death_cause sets the feud stock (the dead row is readable until Bookkeeping of its death instant, SPR-011 ruling 5) (a mode: it switches the predecessor multipliers on or off); genealogy, sex and age define the lines; natural death of rulers is M2's Brass hazard"
lag = "same instant for deaths; start of instant for genealogy"
[[couplings]]
system = "M2.demography"
direction = "out"
via = "ScheduleDeath {victim, cause, culprit, cause_event} for background murders, the payload M2 declares it applies (round 3, MAJ-4), submitted by M7's murder timer when it fires (EVO-001)"
lag = "the timer fires at (the drawn day, Vital), a day start in the same month, and M2's Day/Vital binding drains the command in that same Vital (SPR-014; EVO-001)"
[[couplings]]
system = "T1.minds"
direction = "in"
via = "PressClaim, PetitionSeat, RenounceClaim, Resign, drained at Day/Agenda of the day after they are sent (T1 sends at Agenda after M7's Agenda binding); minds' foreground murders of sovereigns (MURDER_ATTEMPT through M2) add to the background hazard, so coupled calibration lowers murder_hazard_base until V-SF-06 holds"
lag = "applied at the next tick boundary"
[[couplings]]
system = "T1.minds"
direction = "out"
via = "Promote, Demote, OpinionModifier; minds reads seats, offices, claims, houses and regents as identity (lagged)"
lag = "applied at the next tick boundary"
[[couplings]]
system = "S7.vows"
direction = "in"
via = "an active vow keeps its vower named (dormancy criterion; P1b). The reads of vow.vower and vow.status are declared with S7 in P1b, not here (R12): as identity reads they would make every M7 world require S7, which requires S6 and T1, so M7's own [isolation] run (T1 stubbed) could not register; P1b decides whether to read them as mode reads with a neutral (no active vow) instead (REV-EVO-001 NIT-12)"
lag = "start of instant (lagged)"
[[couplings]]
system = "S7.vows"
direction = "out"
via = "S7 reads title.holder to fulfil CLAIM_TITLE vows"
lag = "same instant, later phase (Agenda)"
[[couplings]]
system = "S6.artifacts"
direction = "out"
via = "regalia pass with the title (S6 reads title.holder). Open question: S6's inherit reads title.holder at Vital, but the successor is named at Polity; proposed fix in S6: regalia of a title awaiting arbitration are placed at the seat and pass at S6's Agenda step"
lag = "same instant, later phase"
[[couplings]]
system = "M4.economy"
direction = "out"
via = "TransferHoldings by the house's inheritance rule (P1b)"
lag = "applied at the next tick boundary"

# ----------------------------------------------------------------------------- isolation (V-SF-22)
[isolation]
forcing = [
  { input = "polity.exec_constraint", series = "step", note = "0 (reference) for 500 years, then 1 (an assembly) for 500 years, on the same seeds; also constants 0 and 1" },
  { input = "person.named", series = "constant", note = "false throughout (T1.minds stubbed: nobody holds a mind, so dormancy sends nothing and the named-actor count is the fixture's); the coupled run with T1 live is V-SF-23's" },
  { input = "person.death_cause", series = "historical:fixture_regicides", note = "M2 live; scripted runs of consecutive murdered predecessors to exercise the feud stock, plus the fixture deaths of V-SAGA-19 (every titleholder through each death cause)" },
]
horizon = "1,000 sim-years on the dynastic fixture world of G1a (a few great houses, 1 to 4 realms, each law in turn; M6 held at neutral; M2 live; T1.minds stubbed: no petitions, no pressed claims, no foreground murders), 32 seeds"
expect = "INV-M7-01 to 07 with 0 violations; murders per 1,000 ruler-years at the reference state equal 1000 x murder_hazard_base x L within Poisson error (the monthly probability covers the whole month, so the yearly rate is exact up to the linear-vs-exp excess of at most h/24, NEW-2) and inside the V-SF-06 band of the matching institutional state; deposition shares by law inside V-SF-06b (reported at G1a, gated at G1b); the predecessor-murdered OR recovers predecessor_killed_or (V-SF-06d, logistic CI); after the step to exec_constraint = 1 both rates fall by exec_constraint_hr and reigns lengthen (V-SF-06c computed but sealed: reported only once the held-out evaluation runs); the named-actor count stays bounded with no count rule and is reported against population; no house is resurrected and no title is created"

[verification]
tests = ["V-SAGA-19", "V-SF-06", "V-SF-06b", "V-SF-06c", "V-SF-06d", "V-ERA-03", "V-INV-03", "V-INV-04", "V-INV-12", "V-INV-01", "V-SF-22", "V-SF-23", "V-COUP-01", "V-DET-12"]
prototype = ""

