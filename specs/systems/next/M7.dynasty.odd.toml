t meets none is dormant-eligible: Demote; a named minor is never demoted (age enters Demote only). Promote: a person not named (person.named, lagged, neutral false) that meets a criterion (a member, or a person of no house under (a) or (e)), at this pass or at on_birth. At world start (this step of the Year/Polity binding at tick 0, the world's first instant: the one route by which a person beyond the manifest's cast is named at world start, X4; genesis names the cast) the pass names exactly the persons meeting a criterion, so a minor beyond the degrees who is not in a line's head is not named at start. The named set after a pass is therefore the persons meeting a criterion plus the named minors, and the dormancy counts are the Demotes and Promotes sent (reported, never a target). Criteria only; never a count; nothing is deleted (ADR-0007)"
