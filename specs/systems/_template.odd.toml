# ODD-R v2 system spec TEMPLATE (ADR-0033). Copy to specs/systems/<SYS.id>.odd.toml and fill EVERY field.
# Exhaustive is the goal: agents maintain it, lint_odd.py checks it, the director reads the generated brief.
# Unknown or not-applicable fields are written as "n/a: <reason>", never omitted.
odd_r = 2

[system]
id = "<SYS.id as in the Registry, e.g. M4.economy>"
name = "<plain name>"
spec_version = "0.1.0"
fidelity = "<F0|F1|F2: a level the Registry declares for this system>"
status = "draft"                           # draft | frozen (frozen = the sprint is building against it)
crate = "rh-sys-<name>"
adrs = []                                  # e.g. ["ADR-0027"]
requirements = []                          # IDs from docs/03

[purpose]                                  # ODD 1
statement = "<what the system is for, in <= 3 sentences, no mechanism>"
role = "<substrate | drama_coupling | stylized_fact_producer>"
patterns = []                              # [{ test = "V-SF-..", pattern = "..", kind = "identity|emergent", role = "sole|contributing" }]
not_yet = []                               # patterns known NOT to be reproduced yet

[[owns]]                                   # ODD 2: every column this system writes (single writer)
column = "<entity.column>"
entity = "<person|household|settlement|region|polity|market|...>"
type = "<i64|u64|i32|u32|u16|u8|bool|enum|q8_8|q16_16|f32_field>"
# values = ["<a>", "<b>"]                 # an enum column carries its codes (EVO-001): values by position, or
# registry = "<table>"                     # a Registry table (its ids list, else its keys in byte-wise order)
plane = "<A|B|C>"
meaning = "<units and meaning>"
fixed_point = false                        # true for q8_8/q16_16 and anything that crosses a threshold

[[emits]]                                  # events into channel A of the World Stream
kind = "<EVENT_KIND>"
when = "<condition>"

[[commands]]                               # lifecycle commands to other owners (never write their columns)
target = "<SYS.id>"
command = "<CommandName>"
payload = "{ <field>, <field> }"             # the owner's [[applies]] field names, in its order
why = "<reason>"

[[applies]]                                # lifecycle commands this system owns and applies (05.1 §2 rule 2; EVO-001)
command = "<CommandName>"
payload = "{ <field>: <Type>, ... }"       # typed: PersonId, EventRef, SimTime, TitleId, OfficeId, ClaimId, HouseId,
                                           # VowId, ArtifactId, HouseholdId, PlaceId, u8..u64, i64, bool, q8_8,
                                           # q16_16, enum(<entity.column>); every sender uses these names
from = ["<SYS.id>"]                        # exactly the specs that send it
drained_by = "<Pulse>/<Phase>"             # the one binding of [[schedule]] that takes the queue
key = "<living|any>"                       # living: rh-core drops a command whose key person is dead (A-30)

[[reads]]                                  # read set, through contract accessors only
column = "<entity.column>"
owner = "<SYS.id>"
lag = "<same_instant|start_of_day|previous_pulse|lagged>"
use = "<identity|mode|rate>"               # identity: who/where/what; mode: switches a discrete regime;
                                           # rate: enters a rate, hazard, price or probability (needs an
                                           # in-coupling below and an [isolation] forcing; RT-2026-10-16)
required = <true|false>                    # EVO-001 (05.1 §2 rule 2): true = registration refuses a world without
                                           # this owner; false = the read is dropped when the owner is absent, its
                                           # column enumerates as an empty table and a keyed lookup returns neutral
neutral = <value>                          # required when required = false and use is rate or mode (optional for
                                           # identity: the type's zero otherwise); typed by the column: an integer
                                           # in range, true/false, one of the enum's codes, or a number inside
                                           # q8_8/q16_16; a rate read's coupling prose names it; the lint checks it

[scales]
spatial = ""
temporal = ""
extent = ""
restart = "<what a keyframe must hold to restore this system exactly>"

[[fidelity_ladder]]
level = "<F0|F1|F2>"
representation = ""
status = "<target|available|n/a>"

[[schedule]]                               # ODD 3 (05.1 §4.2 phases)
pulse = "<Year|Season|Month|Day|Hour>"
phase = "<Inputs|Environment|Production|Exchange|Vital|Activity|Contagion|Polity|Military|Agenda|Culture|Bookkeeping>"
steps = ["<step_name>: <what it does>"]    # step names must match [[submodels]] names
when = "<always | active regions only | ...>"

[[rng]]                                    # ODD 4.9: keyed purposes (ADR-0006)
purpose = "<snake_case>"
key = ["<entity>", "<time unit>"]
use = ""

[design]                                   # ODD 4: one line each; "n/a: <reason>" where it does not apply
basic_principles = ""
emergence = ""
adaptation = ""
objectives = ""
learning = ""
prediction = ""
sensing = ""
interaction = ""
stochasticity = ""
collectives = ""
observation = ""
era_state = []                             # Registry [era_state] variables read (ADR-0027)
scale_behaviour = ""                       # micro / meso / macro (ADR-0028)

[initialization]                           # ODD 5
state = ""
from_manifest = []

[input_data]                               # ODD 6: time-varying external drivers (not parameters)
drivers = []

[[params]]                                 # ODD 7.0: exactly the Registry's parameter set for this system
name = "<registry param>"
meaning = ""
source = "<R12 §n | paper, page | design value>"

[[submodels]]                              # ODD 7: one per step; each must earn its place (ADR-0033 §5)
name = "<step_name>"
summary = "<equations or algorithm, in the effect language where possible>"
earns_its_place_by = []                    # test or band IDs from docs/09

[[invariants]]
id = "INV-<SYS>-01"
statement = ""
test = "<V-.. ID>"

[[couplings]]                              # ODD-R 8
system = "<SYS.id>"
direction = "<in|out>"                     # in: another system's output drives this system; out: the reverse
via = ""
lag = ""
# For direction = "in" and a read with use = "rate", all of these (RT-2026-10-16, docs/09 V-SF-22/23):
column = "<the entity.column read>"
form = "<the response, in the effect language or a Registry function id>"
neutral = "<the input value at which the coupling has no effect; the coupling sweep scales deviations from it>"
output_bounds = ["<min>", "<max>"]         # the effect can never leave these bounds
data_range = "<the input range the form is supported by evidence, with its source>"
beyond_range = "<what happens outside data_range, and why (clamp, a different mechanism, ...), with a source>"
source = "<R12 §n | paper, page | design value>"

[isolation]                                # RT-2026-10-16; docs/09 V-SF-22: this system alone, under synthetic forcing
forcing = []                               # [{ input = "<entity.column of every rate or mode read>", series = "<constant|step|sine|ramp|historical:<id>>", note = "" }]
horizon = "<e.g. 1,000 sim-years>"
expect = "<what healthy behaviour looks like: bounded, no runaway, bands that must hold>"

[verification]                             # ODD-R 9
tests = []
prototype = ""                             # optional path to an executable prototype
