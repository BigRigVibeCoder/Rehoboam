# Rehoboam sifting patterns, DSL v0 examples (docs/05_architecture/05.4 §2, ADR-0008).
# Rules:
#   * Roles and act classes come from the Registry (setting-agnostic). The world compiler maps concrete verbs and titles onto them.
#   * Every state read is ANCHORED to a bound event: `attr(...)@eN`. A bare read is a lint error (fixes the draft's temporal bug).
#   * `unless` clauses cancel partial matches. `emit` produces a match event that higher-order patterns can consume.
#   * Attributes are typed in the Registry [attributes]. Enum attributes may be compared to symbolic values, which are stored as integer codes.
#   * A clause may match an act class (`act`), a concrete Registry verb (`verb`), or a match event emitted by another pattern (`match_event`).
#     Consuming a match event imports that match's role bindings.
#   * Every pattern must have an SQL twin before it is enabled (SIFT-3). This file is paired with one example twin
#     (trust_then_betrayal, in specs/chronicle/schema.sql, under three semantics).
#   * Match semantics are declared, never implicit (05.4 §2.3, SIFT-8):
#       selection   = "latest" | "earliest" | "all"            which open partial a completing event pairs with (default latest)
#       on_complete = "clear_binding" | "consume" | "keep"     what happens to open partials after a match (default clear_binding)
#       dedupe      = { key = [role vars], bucket_days = N }   at most one emitted match per key per bucket
#   * firing_budget is REQUIRED: expected completed matches per simulated century per 100k persons. CI fails a
#     pattern that fires above 3x its budget on the reference ensembles.
#   * completion_hazard (optional) names a Registry system hazard used for suspense (05.4 §2.3). It requires threatened_role:
#     the bound role for whom completion is a negative outcome (Dramatis: suspense exists only once a bad outcome is expected).
#     The pattern's `unless` clauses are its escape routes.
#   * Clause order is the kernel order (B3 p3): each clause's event has a strictly greater EventId than the previous
#     clause's. `after` names the event `within_days` is measured from. Patterns with >2 clauses use
#     selection = "all", on_complete = "keep" (B3 fork-and-accept) until 05.4 §2.3 defines per-stage semantics.
#   * [[pattern.unless]] may `bind = "uN"` and carry anchored `where` reads of itself and of kernel events bound at or
#     before between[0]. `between` defaults to [first clause, last clause]. An event that both completes a match and
#     matches an unless completes it (between is strict, as in the SQL twin).
#   * death_tolerant (optional) lists role variables whose death does NOT kill an open partial. The death of any other
#     bound role kills it (an implicit unless on act class `death`, and an escape route for suspense; B3 p7).
#   * surface_from (optional, default: the penultimate clause) is the first clause whose binding makes an open partial
#     eligible for `sift.partial` and suspense (B3 p5: narrate FATAL ERROR once ?loseLead is bound).

[[pattern]]
id = "authority_purges_successor"
version = 1
tellability = 0.9
description = "An authority coerces or harms their designated successor, motivated by fear."
roles = { A = "authority", S = "successor" }
selection = "latest"
on_complete = "clear_binding"
firing_budget = { per_century_per_100k = 0.5 }
  [[pattern.clause]]
  bind = "e1"
  act = ["coerce", "harm", "purge"]
  actor = "A"
  target = "S"
  where = ["succession_rank(S, A)@e1 == 1", "fear(A)@e1 >= 0.6"]
  require_edge = { into = "e1", kind = "motivated_by", from_state = "fear(A)" }
  [pattern.emit]
  match_event = "successor_purged"

[[pattern]]
id = "trust_then_betrayal"
version = 1
tellability = 0.8
roles = { A = "any", B = "any" }
selection = "latest"                  # twin: twin_trust_then_betrayal (the `all` and `dedupe` variants are also twinned)
on_complete = "clear_binding"
firing_budget = { per_century_per_100k = 20 }
  [[pattern.clause]]
  bind = "e1"
  act = ["aid", "promise"]
  actor = "A"
  target = "B"
  where = ["trust(B, A)@e1 >= 0.6"]
  [[pattern.clause]]
  bind = "e2"
  act = ["harm", "betray", "conceal"]
  actor = "A"
  target = "B"
  after = "e1"
  within_days = 3650
  [[pattern.unless]]
  act = ["aid"]
  actor = "B"
  target = "A"
  between = ["e1", "e2"]
  [pattern.emit]
  match_event = "betrayal_arc"

[[pattern]]
id = "revenge_chain"
version = 1
tellability = 0.85
description = "A victim (or their kin) later harms the original aggressor, with a contingency edge referencing the first harm."
roles = { X = "any", V = "any", R = "any" }
selection = "earliest"                # the first harm that the revenge explicitly references
on_complete = "consume"
dedupe = { key = ["X", "R"], bucket_days = 365 }
death_tolerant = ["V"]                # kin avenging a dead victim is the point of the trope
firing_budget = { per_century_per_100k = 10 }
  [[pattern.clause]]
  bind = "e1"
  act = ["harm"]
  actor = "X"
  target = "V"
  [[pattern.clause]]
  bind = "e2"
  act = ["harm", "depose", "accuse"]
  actor = "R"
  target = "X"
  after = "e1"
  within_days = 18000
  where = ["is_self_or_kin(R, V)@e2"]
  require_edge = { from = "e1", into = "e2", kind = "contingent" }

[[pattern]]
id = "false_positive_purge_of_notable_child"
version = 1
tellability = 0.95
description = "Covert-infiltration era: a test says positive, the subject is purged, and the subject was NOT infected. Irony is maximised when the subject is a notable's child."
roles = { I = "investigator", S = "suspect", P = "kin" }
selection = "latest"
on_complete = "clear_binding"
firing_budget = { per_century_per_100k = 2 }
completion_hazard = { system = "M5.contagion", hazard = "purge_after_positive" }
threatened_role = "S"
  [[pattern.clause]]
  bind = "e1"
  act = ["test"]
  actor = "I"
  target = "S"
  where = ["test_result(S)@e1 == 'positive'", "hive_member(S)@e1 == false"]
  [[pattern.clause]]
  bind = "e2"
  act = ["purge", "harm"]
  target = "S"
  after = "e1"
  within_days = 90
  where = ["is_parent(P, S)@e2", "notable(P)@e2 == true"]
  [pattern.emit]
  match_event = "innocent_purged"

[[pattern]]
id = "impossible_knowledge_noticed"
version = 1
tellability = 0.8
roles = { M = "any", O = "any" }
selection = "latest"
on_complete = "clear_binding"
dedupe = { key = ["M", "O"], bucket_days = 90 }
firing_budget = { per_century_per_100k = 5 }
  [[pattern.clause]]
  bind = "e1"
  act = ["reveal", "aid", "harm"]
  actor = "M"
  where = ["used_hive_only_knowledge(M)@e1 == true"]
  [[pattern.clause]]
  bind = "e2"
  act = ["discover", "accuse"]
  actor = "O"
  target = "M"
  after = "e1"
  within_days = 30
  where = ["knows_event(O, e1)@e2 == true", "suspicion(O, M)@e2 >= 0.5"]

[[pattern]]
id = "famine_to_succession_crisis"
version = 1
tellability = 0.9
description = "Higher-order: a famine declared in a realm, followed within five years by that realm's authority purging their successor."
roles = { A = "authority", S = "successor" }
selection = "latest"
on_complete = "clear_binding"
firing_budget = { per_century_per_100k = 0.2 }
completion_hazard = { system = "M7.dynasty", hazard = "successor_purge" }
threatened_role = "S"
  [[pattern.clause]]
  bind = "e1"
  verb = "FAMINE_DECLARED"
  [[pattern.clause]]
  bind = "e2"
  match_event = "successor_purged"      # imports bindings A and S from authority_purges_successor
  after = "e1"
  within_days = 1800
  where = ["in_realm(e1, A)@e2"]

[[pattern]]
id = "guest_right_violated"
version = 1
tellability = 0.85
description = "Three-stage kernel after Winnow's breakHospitality (B3 pp2-3): a refugee arrives, is aided by a host of high integrity at the time of the aid, then is harmed by that host before fleeing again."
roles = { H = "host", G = "guest" }
selection = "all"                     # >2 clauses: fork-and-accept (B3 p3) until per-stage semantics are defined
on_complete = "keep"
dedupe = { key = ["H", "G"], bucket_days = 365 }   # B3 p7: role bindings, not event IDs, carry perceived identity
firing_budget = { per_century_per_100k = 3 }
surface_from = "e2"
  [[pattern.clause]]
  bind = "e1"
  act = ["flee"]
  actor = "G"
  [[pattern.clause]]
  bind = "e2"
  act = ["aid"]
  actor = "H"
  target = "G"
  after = "e1"
  within_days = 365
  where = ["integrity(H)@e2 >= 0.6"]   # checked at e2, not at completion (B3 p6)
  [[pattern.clause]]
  bind = "e3"
  act = ["harm", "betray"]
  actor = "H"
  target = "G"
  after = "e2"
  within_days = 365
  [[pattern.unless]]
  bind = "u1"
  act = ["flee"]
  actor = "G"
  between = ["e1", "e3"]
