[baskets.allen2001]
# Allen (2001) Table 3, p. 421: one adult-male basket per year at the "respectability" poverty line (WR = 1), NOT bare
# subsistence. kcal and protein per unit from the table's notes; ref_price = Strasbourg 1745-54, grams of silver per unit.
# Golden values (specs/economy/selftest_basket.py): cost 414.899 g/yr, 1,941 kcal/day, 80 g protein/day.
# The printed egg price (0.010) is a misprint; 0.1028 is implied by the table's total. Bread and beer are processed grain.
# Mediterranean climate zones substitute olive oil for butter and wine for beer, and burn 2 MBTU of fuel instead of 5 (p. 422).
family_baskets = 3.0          # a man, a woman and two children (pp. 425-426)
rent_markup    = 0.05         # WR denominator = 3 x 1.05 = 3.15 baskets (p. 427)
days           = 250          # the WR convention; realised days are M4 days_worked
items = [
  { id = "bread",    qty = 182.0, unit = "kg",   good = "grain",           kcal = 2450.0, protein_g = 100.0,  ref_price = 0.693 },
  { id = "pulses",   qty = 52.0,  unit = "l",    good = "grain",           kcal = 1125.0, protein_g = 71.0,   ref_price = 0.477 },
  { id = "meat",     qty = 26.0,  unit = "kg",   good = "animal_products", kcal = 2500.0, protein_g = 200.0,  ref_price = 2.213 },
  { id = "butter",   qty = 5.2,   unit = "kg",   good = "animal_products", kcal = 7286.0, protein_g = 7.0,    ref_price = 3.470, mediterranean = "olive_oil" },
  { id = "cheese",   qty = 5.2,   unit = "kg",   good = "animal_products", kcal = 3750.0, protein_g = 214.0,  ref_price = 2.843 },
  { id = "eggs",     qty = 52.0,  unit = "each", good = "animal_products", kcal = 79.0,   protein_g = 6.25,   ref_price = 0.1028 },
  { id = "beer",     qty = 182.0, unit = "l",    good = "grain",           kcal = 426.0,  protein_g = 3.0,    ref_price = 0.470, mediterranean = "wine" },
  { id = "soap",     qty = 2.6,   unit = "kg",   good = "lighting",        kcal = 0.0,    protein_g = 0.0,    ref_price = 2.880 },
  { id = "linen",    qty = 5.0,   unit = "m",    good = "cloth",           kcal = 0.0,    protein_g = 0.0,    ref_price = 4.369 },
  { id = "candles",  qty = 2.6,   unit = "kg",   good = "lighting",        kcal = 0.0,    protein_g = 0.0,    ref_price = 4.980 },
  { id = "lamp_oil", qty = 2.6,   unit = "l",    good = "lighting",        kcal = 0.0,    protein_g = 0.0,    ref_price = 7.545 },
  { id = "fuel",     qty = 5.0,   unit = "MBTU", good = "fuel",            kcal = 0.0,    protein_g = 0.0,    ref_price = 4.164, qty_mediterranean = 2.0 },
]
substitutes = [
  { id = "olive_oil", qty = 5.2,   unit = "l", good = "oil",             kcal = 8142.0, protein_g = 0.0, ref_price = 7.545 },
  { id = "wine",      qty = 68.25, unit = "l", good = "wine",            kcal = 850.0,  protein_g = 0.0, ref_price = 0.965 },
]

