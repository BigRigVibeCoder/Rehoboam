ISSUE_DECREE    = { act_classes = ["coerce"], emitted_by = "M6.polity" }
ARREST          = { act_classes = ["coerce", "harm"], emitted_by = "rh-minds" }
PURGE           = { act_classes = ["purge", "harm"], emitted_by = "rh-minds" }
REVENGE         = { act_classes = ["harm"], emitted_by = "rh-minds", references = ["harm"] }
BLOOD_TEST      = { act_classes = ["test"], emitted_by = "M5.contagion" }
RAID_LIVESTOCK  = { act_classes = ["raid", "harm"], emitted_by = "S4.ecology" }
SUCCEED         = { act_classes = ["succeed_to"], emitted_by = "M7.dynasty" }
INCITE_RAID     = { act_classes = ["harm", "raid"], emitted_by = "agents" }     # an agent moves an off-map actor to raid
CALL_FIRE       = { act_classes = ["harm"], emitted_by = "agents" }
RAISE_WIND      = { act_classes = ["harm"], emitted_by = "agents" }
AFFLICT         = { act_classes = ["harm"], emitted_by = "agents" }
COUNSEL         = { act_classes = ["counsel"], emitted_by = "rh-minds" }
LAMENT          = { act_classes = ["lament"], emitted_by = "rh-minds" }
RENOUNCE_FAITH  = { act_classes = ["renounce"], emitted_by = "rh-minds" }
RESTORE         = { act_classes = ["restore", "aid"], emitted_by = "rh-minds" }
