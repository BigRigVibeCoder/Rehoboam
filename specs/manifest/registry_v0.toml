# ----------------------------------------------------------------------------- polity
[governments]
ids = ["feudal_monarchy", "oligarchic_council", "theocracy", "municipal_democracy", "tribal_confederation"]

[succession_laws]
ids = ["primogeniture", "ultimogeniture", "seniority", "partition", "elective", "tanistry", "sortition"]
# The laws as effect-language programs (specs/registry/effect_language_v0.md §7.3, §8; SPR-017 T-06): candidates, eligible
# and order, text-identical to the golden file's [registry.programs.succession_laws.<law>] (the texts D37 approved, with
# D14 (a) and D4). `ids` keeps its order: title.law stores ordinals (§11). The variants stay in the golden file.

[succession_laws.primogeniture]
candidates = 'lineage(holder, 3)'
eligible   = 'person.alive(x) and x != holder and not descends(holder, x) and (descends(x, holder) or any(h in holders_of(title, 16): descends(x, h)))'
order      = '(up(x, holder), [(life_course.sex(y) == sex.female, life_course.birth_tick(y)) for y in line(common(x, holder), x)])'

[succession_laws.ultimogeniture]
candidates = 'lineage(holder, 3)'
eligible   = 'person.alive(x) and x != holder and not descends(holder, x) and (descends(x, holder) or any(h in holders_of(title, 16): descends(x, h)))'
order      = '(up(x, holder), [(life_course.sex(y) == sex.female, -life_course.birth_tick(y)) for y in line(common(x, holder), x)])'

[succession_laws.seniority]
candidates = 'lineage(holder, 3)'
eligible   = 'person.alive(x) and x != holder and not descends(holder, x) and life_course.sex(x) == sex.male and up_agnatic(x, holder) <= 3 and (descends(x, holder) or any(h in holders_of(title, 16): descends(x, h)))'
order      = '(count(y in line_agnatic(common_agnatic(x, holder), x)) - up_agnatic(x, holder), life_course.birth_tick(x))'

[succession_laws.partition]
candidates = 'children(holder)'
eligible   = 'person.alive(x) and x != holder'
order      = '(life_course.sex(x) == sex.female, life_course.birth_tick(x))'

[succession_laws.elective]
candidates = 'court(title)'
eligible   = 'person.alive(x) and x != holder'
order      = '(min(t in titles(x): ordinal(title.tier(t)) else 3), life_course.birth_tick(x))'

[succession_laws.tanistry]
candidates = 'lineage(holder, 3)'
eligible   = 'person.alive(x) and x != holder and not descends(holder, x) and life_course.sex(x) == sex.male and up_agnatic(x, holder) <= 3 and count(y in line_agnatic(common_agnatic(x, holder), x)) <= 3 and (descends(x, holder) or any(h in holders_of(title, 16): descends(x, h))) and now - life_course.birth_tick(x) >= floor(params.majority_age * q16(calendar.days_per_year)) * calendar.minutes_per_day'
order      = 'life_course.birth_tick(x)'

[succession_laws.sortition]
candidates = 'court(title)'
eligible   = 'person.alive(x) and x != holder'
order      = 'draw(sortition, x, title)'

# The effect language (specs/registry/effect_language_v0.md; SPR-017 T-06). Its version is the evaluator's (§11); the
# Registry's registry_version covers it and is not bumped by SPR-017 (a C2 that moves no ladder header).
[effect_language]
version = "0.5.1"

# Every enum a program can name, with its named default (§3.1): its values come from a Registry id list (`registry`) or
# from the system specs' [[owns]] `values` of the named columns, which must all be equal. Defaults equal the golden slice's.
[effect_language.enums]
sex               = { columns = ["person.sex", "life_course.sex"], default = "male" }
death_cause       = { columns = ["person.death_cause", "life_course.death_cause"], default = "none" }
title_state       = { columns = ["title.state"], default = "held" }
claim_status      = { columns = ["claim.status"], default = "void" }
artifact_state    = { columns = ["artifact.state"], default = "lost" }
vow_status        = { columns = ["vow.status"], default = "void" }
title_tiers       = { registry = "title_tiers", default = "minor" }
succession_laws   = { registry = "succession_laws", default = "primogeniture" }
vocations         = { registry = "vocations", default = "none" }
office_kinds      = { registry = "office_kinds", default = "chancellor" }
vow_kinds         = { registry = "vow_kinds", default = "GRUDGE" }
opinion_modifiers = { registry = "opinion_modifiers", default = "KIN_HARMED_BY" }
overlays          = { registry = "overlays", default = "paranoia" }

# The entity kind of each reference column a program reads (a u64 id column of the specs; §3.1, §7.4). An unlisted u64
# column is an int. A bridge (Architect, G1): the kinds move onto [[owns]] (`ref`) at the next EVO, and the table goes.
[effect_language.refs]
"person.mother"         = "person"
"person.father"         = "person"
"person.spouse"         = "person"
"life_course.person_id" = "person"
"life_course.mother"    = "person"
"life_course.father"    = "person"
"house_member.person"   = "person"
"house_member.house"    = "house"
"tenure.title"          = "title"
"tenure.holder"         = "person"
"title.liege"           = "title"
"title.holder"          = "person"
"title.regent"          = "person"
"office.title"          = "title"
"office.holder"         = "person"
"claim.claimant"        = "person"
"claim.title"           = "title"
"artifact.bearer"       = "person"
"vow.vower"             = "person"
"relation.a"            = "person"
"relation.b"            = "person"
"opinion.holder"        = "person"
"opinion.about"         = "person"
"thought.holder"        = "person"
"goal.holder"           = "person"
"goal.vow"              = "vow"
"feud.party_a"          = "person"
"feud.party_b"          = "person"
"knowledge.holder"      = "person"
"petition.person"       = "person"
"residence_interval.person_id" = "person"

# A table whose rows are keyed by a column other than its id (§4.5, §5.3): the life-course log is read with a person.
# A column is in the environment only when a spec owns it (G4): polity.exec_constraint waits for M6's spec.
[effect_language.keys]
life_course = "person_id"

# Event-id columns, which no program reads (§3.1: an event exists only as an event-typed command argument). Columns of
# spec type event_ref are never readable; these are the u64 ones.
[effect_language.opaque]
columns = ["opinion.source_event", "thought.source_event", "feud.cause_event", "knowledge.event", "knowledge.via_event"]

[title_tiers]      # M7.dynasty F1: landed titles (seats). Only sovereign titles carry the calibrated ruler-exit hazards (R12 §1–3)
ids = ["sovereign", "major", "minor"]

