# Mechanics Registry v0, a minimal illustrative subset.
# The Registry is the closed vocabulary that manifests may reference (ADR-0010, docs/05_architecture/05.5).
# Every parameter declares bounds. Validators reject any value outside them.

registry_version = "0.1.0"

# ----------------------------------------------------------------------------- systems
[systems."M1.regions"]
fidelity_levels = ["F0", "F1"]
params = { route_cost_sea = [1.0, 1.0], route_cost_river = [3.0, 8.0], route_cost_land = [10.0, 60.0] }

[systems."M2.demography"]
fidelity_levels = ["F0", "F1", "F2"]
params = { e0 = [20.0, 85.0], tfr = [1.2, 7.5], eps_f = [0.1, 1.0], eps_m = [0.5, 3.0], elite_fertility_mult = [1.0, 1.6] }

[systems."M3.agriculture"]
fidelity_levels = ["F0", "F1"]
params = { harvest_sigma = [0.08, 0.35], autocorr = [0.0, 0.6], spatial_share = [0.2, 0.9], volcanic_rate = [0.0, 0.03], seed_yield_ratio = [2.5, 12.0] }

[systems."M4.economy"]
fidelity_levels = ["F0", "F1"]
params = { alpha = [0.4, 0.8], food_price_elasticity = [0.2, 0.6], base_tax = [0.05, 0.4], trade_kappa = [0.01, 0.2] }

[systems."M5.contagion"]
fidelity_levels = ["F0", "F1"]
hazards = ["infection", "detection", "purge_after_positive"]       # readable by pattern completion_hazard (05.4 §2.3)
params = { r0 = [1.0, 8.0], latent_days = [1.0, 365.0], infectious_days = [2.0, 1.0e9], ifr = [0.0, 0.8], waning_per_year = [0.0, 1.0], fear_kappa = [0.0, 0.8], covert_evasion = [0.0, 0.9], test_sensitivity = [0.5, 0.999], test_specificity = [0.9, 0.9999] }

[systems."M6.polity"]
fidelity_levels = ["F0", "F1"]
hazards = ["revolt", "coup", "civil_war"]
params = { tax_rate = [0.05, 0.4], elite_mobility_u = [0.0, 0.05], elite_growth_excess = [0.0, 0.01], psi_threshold = [1.0, 3.0], instability_mortality = [0.005, 0.05] }

[systems."M7.dynasty"]
fidelity_levels = ["F0", "F1"]
hazards = ["regicide", "successor_purge", "succession_crisis", "extinction"]
params = { murder_hazard_base = [0.003, 0.02], filial_piety_mean = [0.0, 1.0] }

[systems."M8.war"]
fidelity_levels = ["F0", "F1"]
params = { helmbold_w = [0.2, 1.0], breakpoint = [0.1, 0.35], campaign_months = [3, 12], fort_multiplier = [2.0, 10.0] }

[systems."S4.ecology"]
fidelity_levels = ["F1"]
params = { metabolism_multiplier = [0.1, 10.0] }

# ----------------------------------------------------------------------------- archetypes
[archetypes.human]
ledger = "persons"
capabilities = []

[archetypes.apex_predator]
ledger = "creatures"
variants = ["dragon", "great_wolf", "sea_serpent"]
capabilities = ["flying", "bondable"]
params = { mass_kg = [50.0, 20000.0] }

[archetypes.hive_node]
ledger = "persons"            # overlay on human persons: capability set by M5 covert compartment
capabilities = ["covert_capable"]

# ----------------------------------------------------------------------------- polity
[governments]
ids = ["feudal_monarchy", "oligarchic_council", "theocracy", "municipal_democracy", "tribal_confederation"]

[succession_laws]
ids = ["primogeniture", "ultimogeniture", "seniority", "partition", "elective", "tanistry", "sortition"]

[institutions]
ids = ["testing_mandate", "quarantine_law", "standing_army", "guild_charter", "inquisition"]

[technologies]
ids = ["heavy_plough", "crop_rotation", "printing", "gunpowder", "germ_theory", "blood_assay", "pcr_testing", "rail", "electric_grid"]

# ----------------------------------------------------------------------------- narrative vocabulary
[act_classes]
ids = ["harm", "aid", "promise", "betray", "coerce", "conceal", "reveal", "infect_convert", "succeed_to", "depose",
       "flee", "accuse", "purge", "marry", "birth", "death", "discover", "test", "rebel", "trade", "raid", "bond"]

[roles]
ids = ["authority", "successor", "kin", "ally", "rival", "subordinate", "member", "host", "guest", "investigator", "suspect", "any"]

[channels]
ids = ["witness", "testimony", "document", "crowd", "whisper", "hive"]

[overlays]
ids = ["paranoia", "filial_piety", "despair", "hubris", "corruption", "dragon_sympathy"]

[pattern_packs]
ids = ["succession", "revenge", "famine", "reversal", "irony", "elite_feud", "dragon_age", "covert_infiltration", "plague_era", "witch_hunt"]

[style_cards]
ids = ["mythic_chronicle", "deep_time", "saga", "historian", "ensemble_space_opera", "noir_city"]

# ----------------------------------------------------------------------------- templates
[templates.feudal_realm]
default_systems = ["M1.regions", "M2.demography", "M3.agriculture", "M4.economy", "M6.polity", "M7.dynasty", "M8.war"]
horizon_years = [50, 3000]
modern = false

[templates.merchant_republic]
default_systems = ["M1.regions", "M2.demography", "M3.agriculture", "M4.economy", "M6.polity", "M7.dynasty"]
horizon_years = [50, 3000]
modern = false

[templates.modern_metropolis]
default_systems = ["M1.regions", "M2.demography", "M4.economy", "M5.contagion", "M6.polity"]
horizon_years = [1, 50]       # longer horizons require horizon.label = "speculative"
modern = true

# ----------------------------------------------------------------------------- culture & world vocabularies (no free-string semantics)
[values]       # Schwartz basic values: keys allowed in Culture.value_bias
ids = ["self_direction", "stimulation", "hedonism", "achievement", "power", "security", "conformity", "tradition", "benevolence", "universalism"]

[doctrine_tags]
ids = ["divine_kingship", "fire_rites", "ancestor_veneration", "dragon_kinship", "rule_of_law", "communal_service", "asceticism", "holy_war", "tolerance", "inquisitorial"]

[heightmap_templates]
ids = ["caldera_with_passes", "river_delta_city", "archipelago", "continental_plains", "mountain_valleys", "flat"]

[climate_zones]
ids = ["temperate_continental", "temperate_maritime", "mediterranean", "arid", "tropical", "boreal", "urban_temperate"]

# ----------------------------------------------------------------------------- sifting vocabulary
# Anchored attributes readable by patterns as `name(args)@eN`. Stored in event_snapshot.value as INTEGER:
#   q8_8 = fixed-point (value/256); bool = 0/1; enum = index into `values`; int = raw.
[attributes]
fear                      = { type = "q8_8", args = ["actor"] }
trust                     = { type = "q8_8", args = ["actor", "partner"] }
suspicion                 = { type = "q8_8", args = ["actor", "partner"] }
succession_rank           = { type = "int",  args = ["actor", "partner"] }
is_self_or_kin            = { type = "bool", args = ["actor", "partner"] }
is_parent                 = { type = "bool", args = ["actor", "partner"] }
notable                   = { type = "bool", args = ["actor"] }
hive_member               = { type = "bool", args = ["actor"] }
used_hive_only_knowledge  = { type = "bool", args = ["actor"] }
knows_event               = { type = "bool", args = ["actor", "event"] }
in_realm                  = { type = "bool", args = ["event", "actor"] }
test_result               = { type = "enum", args = ["actor"], values = ["negative", "positive", "inconclusive"] }

# Concrete verbs (subset). Systems emit these. The world compiler maps setting verbs onto them.
[verbs]
FAMINE_DECLARED = { act_classes = ["death"], emitted_by = "M4.economy", aggregate = true }
ISSUE_DECREE    = { act_classes = ["coerce"], emitted_by = "M6.polity" }
ARREST          = { act_classes = ["coerce", "harm"], emitted_by = "rh-minds" }
PURGE           = { act_classes = ["purge", "harm"], emitted_by = "rh-minds" }
REVENGE         = { act_classes = ["harm"], emitted_by = "rh-minds", references = ["harm"] }
BLOOD_TEST      = { act_classes = ["test"], emitted_by = "M5.contagion" }
RAID_LIVESTOCK  = { act_classes = ["raid", "harm"], emitted_by = "S4.ecology" }
SUCCEED         = { act_classes = ["succeed_to"], emitted_by = "M7.dynasty" }
