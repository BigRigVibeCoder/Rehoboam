[visual_vocabulary.agrarian]   # v0 sketch (05.11 §5): the closed token sets visual DNA draws from, per era; cultures override.
physiognomy = ["long_face", "broad_face", "hawk_nose", "heavy_brow", "high_cheekbones", "round_face", "narrow_jaw", "square_jaw"]
colouring   = ["pale", "ruddy", "olive", "brown", "dark", "freckled"]
hair        = ["black", "dark_brown", "auburn", "red", "fair", "grey", "white"]
build       = ["slight", "lean", "wiry", "broad", "heavy", "tall", "short"]
signature   = ["scar_left_cheek", "missing_finger", "braided_beard", "shaven_head", "eye_patch", "house_brooch", "iron_torc", "hooded_cloak"]

# ----------------------------------------------------------------------------- templates
[templates.feudal_realm]
default_systems = ["M1.regions", "M2.demography", "M3.agriculture", "M4.economy", "M6.polity", "M7.dynasty", "M8.war"]
horizon_years = [50, 3000]
modern = false

[templates.merchant_republic]
default_systems = ["M1.regions", "M2.demography", "M3.agriculture", "M4.economy", "M6.polity", "M7.dynasty"]
horizon_years = [50, 3000]
modern = false

[templates.test_solo]   # rung 0 of the complexity ladder (D4): one person on a tiny map, for testing the engine end to end
default_systems = ["M1.regions", "M2.demography", "M3.agriculture", "M4.economy", "S5.daily_life"]
horizon_years = [1, 120]
modern = false

[templates.pastoral_household]   # micro scale (ADR-0028): one household and its neighbours
default_systems = ["M1.regions", "M2.demography", "M3.agriculture", "M4.economy", "S1.culture"]
horizon_years = [1, 200]
modern = false

[templates.modern_metropolis]
default_systems = ["M1.regions", "M2.demography", "M4.economy", "M5.contagion", "M6.polity"]
horizon_years = [1, 50]       # longer horizons require horizon.label = "speculative"
modern = true

# ----------------------------------------------------------------------------- culture & world vocabularies (no free-string semantics)
[values]       # Schwartz basic values: keys allowed in Culture.value_bias
ids = ["self_direction", "stimulation", "hedonism", "achievement", "power", "security", "conformity", "tradition", "benevolence", "universalism"]

[doctrine_tags]
ids = ["divine_kingship", "fire_rites", "ancestor_veneration", "dragon_kinship", "rule_of_law", "communal_service", "asceticism", "holy_war", "tolerance", "inquisitorial",
       "monotheism", "divine_justice"]

[heightmap_templates]
ids = ["caldera_with_passes", "river_delta_city", "archipelago", "continental_plains", "mountain_valleys", "flat", "desert_fringe"]

[climate_zones]
ids = ["temperate_continental", "temperate_maritime", "mediterranean", "arid", "tropical", "boreal", "urban_temperate"]

# ----------------------------------------------------------------------------- eras (ADR-0027; v0 sketch, not yet read by validators)
# Era-state variables: plane-A quantities that era-sensitive parameters may depend on. Each has exactly one owner.
[era_state]
tech_adoption                    = { owner = "S2.technology", scope = "region", type = "q8_8", per = "technology" }
energy_per_capita                = { owner = "M4.economy",    scope = "region", type = "q16_16" }
urban_share                      = { owner = "S3.migration",  scope = "region", type = "q8_8" }
literacy                         = { owner = "S1.culture",    scope = "region_class", type = "q8_8" }
fiscal_capacity                  = { owner = "M6.polity",     scope = "polity", type = "q8_8" }
exec_constraint                  = { owner = "M6.polity",     scope = "polity", type = "q8_8" }
franchise                        = { owner = "M6.polity",     scope = "polity", type = "q8_8" }
succession_institutionalisation  = { owner = "M7.dynasty",    scope = "polity", type = "q8_8" }
medical_level                    = { owner = "S2.technology", scope = "region", type = "q8_8" }
commons_share                    = { owner = "M4.economy",    scope = "region", type = "q8_8" }
market_integration               = { owner = "M4.economy",    scope = "region", type = "q8_8" }

# Era labels: predicates over era_state, used by presentation, narrative and validation band selection ONLY.
# A lint fails the build if any mechanic reads a label.
[eras]
ids = ["agrarian", "early_modern", "industrialising", "industrial", "contemporary"]
frontier = "agrarian"            # last era the engine build supports; reaching beyond it files a gap report

# ----------------------------------------------------------------------------- sifting vocabulary
# Anchored attributes readable by patterns as `name(args)@eN`. Stored in event_snapshot.value as INTEGER:
#   q8_8 = fixed-point (value/256); bool = 0/1; enum = index into `values`; int = raw.
[attributes]
fear                      = { type = "q8_8", args = ["actor"] }
trust                     = { type = "q8_8", args = ["actor", "partner"] }
suspicion                 = { type = "q8_8", args = ["actor", "partner"] }
succession_rank           = { type = "int",  args = ["actor", "partner"] }
is_self_or_kin            = { type = "bool", args = ["actor", "partner"] }
is_parent                 = { type = "bool", args = ["actor", "partner"] }
notable                   = { type = "bool", args = ["actor"] }
hive_member               = { type = "bool", args = ["actor"] }
used_hive_only_knowledge  = { type = "bool", args = ["actor"] }
knows_event               = { type = "bool", args = ["actor", "event"] }
in_realm                  = { type = "bool", args = ["event", "actor"] }
faith                     = { type = "q8_8", args = ["actor"] }         # confidence in the deity's goodness (micro worlds, ADR-0028)
integrity                 = { type = "q8_8", args = ["actor"] }         # commitment to one's own innocence and conduct
grief                     = { type = "q8_8", args = ["actor"] }
test_result               = { type = "enum", args = ["actor"], values = ["negative", "positive", "inconclusive"] }
bears_artifact            = { type = "bool", args = ["actor"] }          # S6: the actor bears any artifact
bearer_exposure           = { type = "q8_8", args = ["actor"] }          # S6: cumulative influence from the artifact borne
artifact_transfer_mode    = { type = "enum", args = ["event"], values = ["inheritance", "theft", "gift", "trade", "loss"] }
contaminants              = { type = "int",  args = ["event"] }          # envelope: bitflags of [contaminants] on the instrument or cell at the event
cell_x                    = { type = "int",  args = ["event"] }          # envelope: cell coordinates, where the world tracks cells
cell_y                    = { type = "int",  args = ["event"] }
fugitive                  = { type = "bool", args = ["actor"] }          # S3.migration: the actor is fleeing (SAGA-14)
vow_against               = { type = "bool", args = ["actor", "partner"] }  # S7: actor holds an active vow or grudge against partner
vow_public                = { type = "bool", args = ["actor"] }          # S7: the vow on this event was sworn publicly
stress                    = { type = "q8_8", args = ["actor"] }          # T1.minds: stress at the event, 0-100 scale (ADR-0035)
# The cinematic event envelope (ADR-0035 §7a; 05.2 §4.1a): anchored snapshots, captured only where simulated.
emotion_pleasure          = { type = "q8_8", args = ["actor"] }          # PAD mood, pleasure axis (signed)
emotion_arousal           = { type = "q8_8", args = ["actor"] }          # PAD mood, arousal axis (signed)
emotion_dominance         = { type = "q8_8", args = ["actor"] }          # PAD mood, dominance axis (signed)
emotion_occ               = { type = "enum", args = ["actor"], values = ["none", "joy", "distress", "hope", "fear", "pride", "shame", "gratitude", "anger", "love", "hate"] }
emotion_intensity         = { type = "q8_8", args = ["actor"] }          # intensity of emotion_occ
weather                   = { type = "enum", args = ["event"], values = ["clear", "overcast", "rain", "storm", "snow", "fog", "heat"] }   # once M3 simulates weather
# Role domains ([role_domains]; envelope_v0.md §1): bool attributes a pattern's `roles` compile to, captured as snapshots by the
# system that owns the source (M7's title.holder for holds_title; the life-course log for is_self_or_kin, above); "none" sources
# have no snapshot yet and are absent.
holds_title               = { type = "bool", args = ["actor"] }                 # the actor holds any title at the event (authority)
is_successor              = { type = "bool", args = ["actor", "partner"] }      # the actor is the partner's legal heir at the event
is_ally                   = { type = "bool", args = ["actor", "partner"] }      # no source yet (P1b: S7 vows, M6 factions)
is_rival                  = { type = "bool", args = ["actor", "partner"] }      # no source yet (feud rows are T1's: a P1b declaration)
is_subordinate            = { type = "bool", args = ["actor", "partner"] }      # no source yet (M7 liege and vassal, next version)
is_member                 = { type = "bool", args = ["actor", "partner"] }      # no source yet (factions, P4)
is_host                   = { type = "bool", args = ["actor"] }                 # no source yet (S5 daily life, P1b)
is_guest                  = { type = "bool", args = ["actor"] }                 # no source yet
is_investigator           = { type = "bool", args = ["actor"] }                 # no source yet (M5 contagion, P1b)
is_suspect                = { type = "bool", args = ["actor"] }                 # no source yet

# Concrete verbs (subset). Systems emit these. The world compiler maps setting verbs onto them.
# tellability (required, an integer 0-255; SPR-011 ruling 11): the Registry's prior of how worth telling one event of the verb
# is, copied into the plane-A event row (schema.sql event.tellability; 05.1 §2 item 8). It is NOT significance: significance
# is computed retroactively in plane C (SIFT-5), with tellability as one of its components. All values are DESIGN VALUES on
# one scale, to be calibrated against reader judgements with the significance model (P2); no source sets them yet:
#   0-63 routine (a test, an errand); 64-127 notable inside one life or household (a counsel, a lament, a claim made);
#   128-191 notable to a community or a house (a death, an arrest, a vow sworn or kept, a feud); 192-254 era-defining for a
#   polity (a succession, a deposition, a purge, a mass famine); 255 the end of a world's people (EXTINCTION).
# DEATH is 128 and EXTINCTION 255 (ruling 11). verb_id is the verb's index in this table sorted by name (ruling 11).
[verbs]
FAMINE_DECLARED = { act_classes = ["death"], emitted_by = "M4.economy", aggregate = true, tellability = 224 }
ISSUE_DECREE    = { act_classes = ["coerce"], emitted_by = "M6.polity", tellability = 96 }
ARREST          = { act_classes = ["coerce", "harm"], emitted_by = "rh-minds", tellability = 128 }
PURGE           = { act_classes = ["purge", "harm"], emitted_by = "rh-minds", tellability = 192 }
REVENGE         = { act_classes = ["harm"], emitted_by = "rh-minds", references = ["harm"], tellability = 176 }
BLOOD_TEST      = { act_classes = ["test"], emitted_by = "M5.contagion", tellability = 64 }
RAID_LIVESTOCK  = { act_classes = ["raid", "harm"], emitted_by = "S4.ecology", tellability = 112 }
SUCCEED         = { act_classes = ["succeed_to"], emitted_by = "M7.dynasty", tellability = 192 }
INCITE_RAID     = { act_classes = ["harm", "raid"], emitted_by = "agents", tellability = 160 }     # an agent moves an off-map actor to raid
CALL_FIRE       = { act_classes = ["harm"], emitted_by = "agents", tellability = 160 }
RAISE_WIND      = { act_classes = ["harm"], emitted_by = "agents", tellability = 160 }
AFFLICT         = { act_classes = ["harm"], emitted_by = "agents", tellability = 160 }
COUNSEL         = { act_classes = ["counsel"], emitted_by = "rh-minds", tellability = 80 }
LAMENT          = { act_classes = ["lament"], emitted_by = "rh-minds", tellability = 96 }
RENOUNCE_FAITH  = { act_classes = ["renounce"], emitted_by = "rh-minds", tellability = 192 }
RESTORE         = { act_classes = ["restore", "aid"], emitted_by = "rh-minds", tellability = 176 }
ARTIFACT_FORGED    = { act_classes = ["forge"], emitted_by = "S6.artifacts", tellability = 176 }
ARTIFACT_PASSED    = { act_classes = ["pass"], emitted_by = "S6.artifacts", tellability = 128 }      # mode: inheritance | theft | gift | trade | loss
ARTIFACT_USED      = { act_classes = ["use"], emitted_by = "S6.artifacts", tellability = 112 }       # the artifact is the instrument of an act
ARTIFACT_FOUND     = { act_classes = ["discover"], emitted_by = "S6.artifacts", tellability = 160 }
ARTIFACT_DESTROYED = { act_classes = ["destroy"], emitted_by = "S6.artifacts", tellability = 192 }
BEARER_CORRUPTED   = { act_classes = ["corrupt"], emitted_by = "S6.artifacts", tellability = 176 }
VOW_SWORN          = { act_classes = ["promise"], emitted_by = "S7.vows", tellability = 144 }
VOW_FULFILLED      = { act_classes = ["fulfil"], emitted_by = "S7.vows", tellability = 192 }
VOW_BROKEN         = { act_classes = ["betray"], emitted_by = "S7.vows", tellability = 192 }
VOW_VOIDED         = { act_classes = ["lapse"], emitted_by = "S7.vows", tellability = 96 }
MENTAL_BREAK       = { act_classes = ["renounce"], emitted_by = "T1.minds", tellability = 160 }   # the break; its act is a separate event from [mental_breaks]
MURDER_ATTEMPT     = { act_classes = ["harm"], emitted_by = "T1.minds", references = ["harm", "depose", "claim"], tellability = 192 }   # a break act or a feud attack; success is a ScheduleDeath to M2
FLED               = { act_classes = ["flee"], emitted_by = "T1.minds", tellability = 144 }
HOLDINGS_BURNED    = { act_classes = ["harm", "destroy"], emitted_by = "T1.minds", tellability = 160 }
DESPAIR_PACT       = { act_classes = ["bond", "renounce"], emitted_by = "T1.minds", tellability = 176 }
FEUD_DECLARED      = { act_classes = ["accuse"], emitted_by = "T1.minds", references = ["harm", "depose", "claim", "succeed_to"], tellability = 160 }
FEUD_ENDED         = { act_classes = ["restore"], emitted_by = "T1.minds", tellability = 128 }
INTERREGNUM_CRISIS = { act_classes = ["succeed_to"], emitted_by = "M7.dynasty", tellability = 208 }   # arbitration found no clear successor (SAGA-13)
DEPOSED            = { act_classes = ["depose"], emitted_by = "M7.dynasty", references = ["claim"], tellability = 208 }
REGENCY_BEGUN      = { act_classes = ["succeed_to"], emitted_by = "M7.dynasty", tellability = 160 }
REGENCY_ENDED      = { act_classes = ["succeed_to"], emitted_by = "M7.dynasty", tellability = 128 }
CLAIM_CREATED      = { act_classes = ["claim"], emitted_by = "M7.dynasty", references = ["succeed_to", "depose"], tellability = 112 }
CLAIM_PRESSED      = { act_classes = ["claim"], emitted_by = "M7.dynasty", tellability = 144 }
CLAIM_RENOUNCED    = { act_classes = ["renounce"], emitted_by = "M7.dynasty", tellability = 112 }
SEAT_GRANTED       = { act_classes = ["succeed_to"], emitted_by = "M7.dynasty", tellability = 112 }   # a re-grant of a seat or an office (finite seats)
BIRTH              = { act_classes = ["birth"], emitted_by = "M2.demography", tellability = 96 }      # actor: the mother; target: the child; payload [sex, birth order]
MARRIAGE           = { act_classes = ["marry"], emitted_by = "M2.demography", tellability = 112 }     # actor: the husband; target: the wife; payload []
HOUSE_EXTINCT      = { act_classes = ["lapse"], emitted_by = "M7.dynasty", tellability = 208 }
DEATH              = { act_classes = ["death"], emitted_by = "M2.demography", tellability = 128 }      # target: the deceased; actor: the culprit of a caused death (P1.13), none for a natural one
EXTINCTION         = { act_classes = ["death"], emitted_by = "M2.demography", tellability = 255 }      # the last living person died; caused by that DEATH (SPR-011 ruling 17)

# Command signatures (§6, §7.3; SPR-017 T-06): one entry per command an owner's [[applies]] types, exactly its payload in
# order (the key field is `person`), with language types: PersonId -> person, ClaimId/OfficeId/VowId -> their kinds,
# u64 -> int, q8_8 -> q8_8, EventRef -> event, enum(<column>) -> that column's enum. No command carries a date (05.1 §2
# rule 2; EVO-001 R9). Commands to owners without a spec (M4, S6, S7) get no entry until an [[applies]] types them (Q14).
# Checked both ways against the owners' [[applies]] and the senders' [[commands]] by lint_odd.py.
[commands]
ScheduleDeath   = { owner = "M2.demography", person = "victim", outcome = true, params = [{ name = "cause", type = "enum:death_cause" }, { name = "culprit", type = "person" }, { name = "cause_event", type = "event" }] }
Marry           = { owner = "M2.demography", person = "a", outcome = true, params = [{ name = "b", type = "person" }] }
PressClaim      = { owner = "M7.dynasty", person = "claimant", outcome = false, params = [{ name = "claim", type = "claim" }] }
PetitionSeat    = { owner = "M7.dynasty", person = "person", outcome = false, params = [{ name = "target", type = "int" }] }
RenounceClaim   = { owner = "M7.dynasty", person = "claimant", outcome = false, params = [{ name = "claim", type = "claim" }] }
Resign          = { owner = "M7.dynasty", person = "person", outcome = false, params = [{ name = "office", type = "office" }] }
OpinionModifier = { owner = "T1.minds", person = "holder", outcome = false, params = [{ name = "about", type = "person" }, { name = "kind", type = "enum:opinion_modifiers" }, { name = "magnitude", type = "q8_8" }, { name = "source_event", type = "event" }] }
AgendaGoal      = { owner = "T1.minds", person = "holder", outcome = false, params = [{ name = "vow", type = "vow" }, { name = "kind", type = "enum:vow_kinds" }, { name = "target", type = "int" }, { name = "priority", type = "q8_8" }] }
ClearGoal       = { owner = "T1.minds", person = "holder", outcome = false, params = [{ name = "vow", type = "vow" }] }
ApplyThought    = { owner = "T1.minds", person = "holder", outcome = false, params = [{ name = "overlay", type = "enum:overlays" }, { name = "delta", type = "q8_8" }, { name = "source_event", type = "event" }] }
ApplyInfluence  = { owner = "T1.minds", person = "bearer", outcome = false, params = [{ name = "overlay", type = "enum:overlays" }, { name = "delta", type = "q8_8" }] }
Promote         = { owner = "T1.minds", person = "person", outcome = false, params = [] }
Demote          = { owner = "T1.minds", person = "person", outcome = false, params = [] }
