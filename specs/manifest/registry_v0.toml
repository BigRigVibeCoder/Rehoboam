[event_roles]          # the cast and instrument of an event (the cinematic envelope, ADR-0035 §7a; 05.2 §4.1a); plane A
ids = ["actor", "target", "witness", "instrument"]   # instrument: the S6 artifact used, if any. The index is the role code everywhere
                                                     # (schema.sql, channel A, the canonical form); a role is only ever appended (envelope_v0.md §8)

[role_domains]         # a pattern role's domain ([roles]) as an anchored bool attribute, captured as a snapshot at emission (SPR-020,
                       # envelope_v0.md §1, R1): `A = "authority"` compiles to holds_title(A)@e1 == true at A's anchor, the first clause
                       # whose cast binds A (R16); a relational domain names its partner variable (`S = "successor of A"` ->
                       # is_successor(S, A)@e1). owner: the system that owns the source column (or "life_course": the ledger's rows;
                       # "none": no source yet, so the domain is absent and lint_patterns.py warns); column: the column, algorithm or
                       # log the attribute is read from. Any emitter that reads the column may declare the snapshot. Plane C reads it.
authority    = { attribute = "holds_title",    relational = false, owner = "M7.dynasty",  column = "title.holder" }
successor    = { attribute = "is_successor",   relational = true,  owner = "M7.dynasty",  column = "claim.rank" }
kin          = { attribute = "is_self_or_kin", relational = true,  owner = "life_course", column = "life_course" }
ally         = { attribute = "is_ally",        relational = true,  owner = "none", column = "none" }
rival        = { attribute = "is_rival",       relational = true,  owner = "none", column = "none" }
subordinate  = { attribute = "is_subordinate", relational = true,  owner = "none", column = "none" }
member       = { attribute = "is_member",      relational = true,  owner = "none", column = "none" }
host         = { attribute = "is_host",        relational = false, owner = "none", column = "none" }
guest        = { attribute = "is_guest",       relational = false, owner = "none", column = "none" }
investigator = { attribute = "is_investigator", relational = false, owner = "none", column = "none" }
suspect      = { attribute = "is_suspect",     relational = false, owner = "none", column = "none" }

[motive_edges]         # typed motive edges: refinements of motivated_by that point to the inciting event; plane A
ids = ["RETALIATION_FOR", "JEALOUSY_OF", "VOW_OF", "AMBITION_FOR", "FEAR_OF", "LOYALTY_TO", "GRIEF_FOR", "GREED_FOR", "CORRUPTION_BY"]

[mental_breaks]        # T1.minds (ADR-0035): volatile acts a stressed named actor may commit; relief is the stress removed
# verb: the event the act emits. needs: what makes the act available (T1.minds spec, submodel break_act): "stressor" a
#   person the actor's stress points at; "seat" the actor holds a title; "kin" a living named relation; "holdings" a
#   registered M4 (P1b). weights: trait affinities, weight = clamp(1 + sum(w x trait/100), 0.1, 2.0) (design values).
# Authored for the saga register (docs/01 principle 9): no rule in plane A filters an outcome for its tone.
ASSASSINATION_ATTEMPT = { act_classes = ["harm"], relief = 60.0, verb = "MURDER_ATTEMPT", needs = ["stressor"], weights = { agreeableness = -1.0, honesty_humility = -0.5 } }   # relief in stress points (0-100 scale)
FLIGHT                = { act_classes = ["flee"], relief = 50.0, verb = "FLED", needs = [], weights = { emotionality = 1.0, conscientiousness = -0.5 } }   # the actor becomes a fugitive (SAGA-14)
BURN_HOLDINGS         = { act_classes = ["harm", "destroy"], relief = 50.0, verb = "HOLDINGS_BURNED", needs = ["seat", "holdings"], weights = { conscientiousness = -1.0, agreeableness = -0.5 } }
PACT_OF_DESPAIR       = { act_classes = ["bond", "renounce"], relief = 40.0, verb = "DESPAIR_PACT", needs = ["kin"], weights = { extraversion = 0.5, openness = 0.5 } }

[relation_kinds]       # T1.minds F1: the relation edges of a named actor; closeness scales grief (design values; RT-2026-10-16 item 1)
parent      = { closeness = 1.0 }
child       = { closeness = 1.0 }
spouse      = { closeness = 1.0 }
sibling     = { closeness = 0.6 }
grandparent = { closeness = 0.4 }
grandchild  = { closeness = 0.5 }
kin_other   = { closeness = 0.2 }      # uncle, aunt, nephew, niece, first cousin
liege       = { closeness = 0.2 }
vassal      = { closeness = 0.1 }

[opinion_modifiers]    # T1.minds F1 (CK3 style; 05.3 §2): magnitude on the -100..100 opinion scale, constant until it expires after `months`
KIN_HARMED_BY     = { magnitude = -60.0, months = 600 }   # the holder knows the target harmed the holder's kin (P1b knowledge)
PASSED_OVER       = { magnitude = -30.0, months = 240 }   # a succession went to the target over the holder's claim or right
DEPOSED_BY        = { magnitude = -60.0, months = 600 }
CLAIM_PRESSED_BY  = { magnitude = -30.0, months = 120 }
FEUD_WITH         = { magnitude = -40.0, months = 240 }
MARRIED_TO        = { magnitude = 30.0,  months = 600 }
GRANTED_BY        = { magnitude = 20.0,  months = 240 }
DESPAIR_PACT_WITH = { magnitude = 30.0,  months = 240 }
VOW_BROKEN_BY     = { magnitude = 0.0,   months = 240 }   # the magnitude comes with S7's command (broken_vow_opinion)
VOW_FULFILLED_BY  = { magnitude = 20.0,  months = 240 }

[act_dissonance]       # T1.minds F1 (value conflict): an act of this class costs its actor dissonance_gain x max(0, trait)/100 stress
harm    = { trait = "agreeableness" }
coerce  = { trait = "agreeableness" }
betray  = { trait = "honesty_humility" }
conceal = { trait = "honesty_humility" }
claim   = { trait = "honesty_humility" }

[overlay_traits]       # T1.minds F1: trait points per overlay point when an ApplyInfluence or ApplyThought becomes a bounded thought
# that IAUS reads; the trait columns never change (RT-2026-10-16 item 8). Design values.
corruption   = { honesty_humility = -100.0 }
hubris       = { honesty_humility = -50.0, extraversion = 50.0 }
paranoia     = { agreeableness = -50.0, emotionality = 50.0 }
despair      = { extraversion = -50.0, emotionality = 50.0 }
filial_piety = { conscientiousness = 50.0, agreeableness = 50.0 }

[decision_types]       # T1.minds F1: event-driven IAUS (05.3 §3; COG-3). poll_months: the CK3-style polling interval (design values).
# considerations: keys of [considerations]; their curves are [response_curves.<type>]. idle_score: the score of 'do
#   nothing'. requires: the owners whose commands the type sends; a world enables the type only when it registers them
#   all (SPR-006 ruling 5; MIN-11). available_from is informational only (the roadmap phase); code never keys on it.
# feud has three options: declare (the curves below), attack (the same score, only against an active feud's enemy) and
#   reconcile (1 - the declare score, only for an active feud).
marry       = { poll_months = 12, requires = ["M2.demography"], available_from = "P1a", idle_score = 0.5, considerations = ["age", "age_gap", "partner_tier", "opinion", "ambition", "stress"] }
seek_office = { poll_months = 6,  requires = ["M7.dynasty"], available_from = "P1a", idle_score = 0.5, considerations = ["ambition", "seat_tier", "kin_distance_to_granter", "opinion_of_granter", "stress"] }
press_claim = { poll_months = 12, requires = ["M7.dynasty"], available_from = "P1a", idle_score = 0.5, considerations = ["ambition", "claim_rank", "opinion_of_holder", "honesty_humility", "holder_is_minor", "stress"] }
feud        = { poll_months = 6,  requires = ["M2.demography"], available_from = "P1a", idle_score = 0.5, considerations = ["opinion", "agreeableness", "kin_harmed", "rival_claim", "stress"] }
swear_vow   = { poll_months = 1,  requires = ["S7.vows"], available_from = "P1b", idle_score = 0.5, considerations = ["kin_harmed", "closeness", "conscientiousness", "honesty_humility", "active_vows"] }
pursue_goal = { poll_months = 3,  requires = ["S6.artifacts", "S7.vows", "M7.dynasty"], available_from = "P1b", idle_score = 0.5, considerations = ["goal_priority", "target_reachable", "ambition", "stress"] }

[considerations]       # T1.minds F1 IAUS inputs (MAJ-6; typed for the A-24 loader): what each reads, its domain and type.
# All values Q16_16. `actor` is the deciding named actor, `target` the candidate (a person, seat, office, claim or goal).
# Traits are effective traits (trait + clamped thoughts, T1 spec). An input outside its domain is clamped to it.
age                    = { input = "(now - birth_tick(actor)) / minutes_per_year", reads = ["person.birth_tick"], domain = [0.0, 100.0], unit = "years" }
age_gap                = { input = "abs(age(actor) - age(target))", reads = ["person.birth_tick"], domain = [0.0, 60.0], unit = "years" }
partner_tier           = { input = "max tier of a title held by target or target's father (0 none, 1 minor, 2 major, 3 sovereign)", reads = ["title.holder", "title.tier", "life_course.father"], domain = [0.0, 3.0], unit = "tier" }
opinion                = { input = "opinion(actor, target)", reads = ["opinion.*"], domain = [-100.0, 100.0], unit = "opinion points" }
ambition               = { input = "mind.ambition(actor)", reads = ["mind.ambition"], domain = [0.0, 100.0], unit = "points" }
stress                 = { input = "mind.stress(actor)", reads = ["mind.stress"], domain = [0.0, 100.0], unit = "points" }
seat_tier              = { input = "tier of the target seat (an office counts as 1)", reads = ["title.tier", "office.title"], domain = [0.0, 3.0], unit = "tier" }
kin_distance_to_granter = { input = "kinship degrees from actor to the granter (the holder of the seat's liege title or the office's title) the smallest n in 1..6 with related(actor, granter, n) over the life-course columns (PR #41 §5.3); 6 when none", reads = ["life_course.mother", "life_course.father", "title.holder", "title.liege"], domain = [0.0, 6.0], unit = "degrees" }
opinion_of_granter     = { input = "opinion(actor, granter)", reads = ["opinion.*", "title.holder"], domain = [-100.0, 100.0], unit = "opinion points" }
claim_rank             = { input = "claim.rank of the claim (an M7 column: 1 = legal heir, capped at 10; 0 outside the line reads as 10). M7 refreshes it at each arbitration of the title and in the yearly pass, so between them a consideration sees the last value; arbitration recomputes it, so succession never reads a stale rank", reads = ["claim.rank"], domain = [1.0, 10.0], unit = "rank" }
opinion_of_holder      = { input = "opinion(actor, holder of the claimed title)", reads = ["opinion.*", "title.holder"], domain = [-100.0, 100.0], unit = "opinion points" }
honesty_humility       = { input = "effective honesty_humility(actor)", reads = ["mind.honesty_humility", "thought.*"], domain = [-100.0, 100.0], unit = "trait points" }
agreeableness          = { input = "effective agreeableness(actor)", reads = ["mind.agreeableness", "thought.*"], domain = [-100.0, 100.0], unit = "trait points" }
conscientiousness      = { input = "effective conscientiousness(actor)", reads = ["mind.conscientiousness", "thought.*"], domain = [-100.0, 100.0], unit = "trait points" }
holder_is_minor        = { input = "1 if the claimed title has a regent, else 0", reads = ["title.regent"], domain = [0.0, 1.0], unit = "bool" }
kin_harmed             = { input = "1 if actor holds an unexpired KIN_HARMED_BY modifier about target, else 0 (always 0 in P1a: the modifier needs knowledge rows, P1b)", reads = ["opinion.*"], domain = [0.0, 1.0], unit = "bool" }
rival_claim            = { input = "1 if target holds an active claim on a title actor holds or is first in line for, or actor on one of target's, else 0", reads = ["claim.claimant", "claim.title", "claim.status", "title.holder"], domain = [0.0, 1.0], unit = "bool" }
closeness              = { input = "closeness ([relation_kinds]) of the closest harmed kin behind the vow candidate (P1b)", reads = ["life_course.mother", "life_course.father", "person.spouse"], domain = [0.0, 1.0], unit = "closeness" }
active_vows            = { input = "number of goal rows of actor (P1b)", reads = ["goal.holder"], domain = [0.0, 8.0], unit = "count" }
goal_priority          = { input = "goal.priority of the goal (P1b)", reads = ["goal.priority"], domain = [0.0, 0.8], unit = "weight" }
target_reachable       = { input = "1 - h/7 for a route-graph distance of h <= 6 hops to the goal's target, else 0 (P1b)", reads = ["artifact.location", "artifact.bearer"], domain = [0.0, 1.0], unit = "reach" }

[response_curves]      # T1.minds F1 (MAJ-6; 05.1 §4.3 item 2): one piecewise-linear curve per (decision type, consideration):
# knots [[x, y], ...] with ascending x, every value a dyadic rational exactly representable in Q16_16, y in [0, 1];
# the output is clamped to the end knots' y outside them, and linear between knots, rounded down in Q16_16.
# Design values: no source; V-COG-03/04/10 and the G1a family histories judge them.
[response_curves.marry]
age          = [[0.0, 0.0], [16.0, 0.0], [20.0, 1.0], [40.0, 0.5], [60.0, 0.0]]
age_gap      = [[0.0, 1.0], [10.0, 0.75], [20.0, 0.25], [40.0, 0.0]]
partner_tier = [[0.0, 0.25], [3.0, 1.0]]
opinion      = [[-100.0, 0.0], [0.0, 0.5], [100.0, 1.0]]
ambition     = [[0.0, 0.5], [100.0, 1.0]]
stress       = [[0.0, 1.0], [100.0, 0.5]]
[response_curves.seek_office]
ambition                = [[0.0, 0.0], [100.0, 1.0]]
seat_tier               = [[0.0, 0.25], [3.0, 1.0]]
kin_distance_to_granter = [[0.0, 1.0], [6.0, 0.25]]
opinion_of_granter      = [[-100.0, 0.0], [0.0, 0.5], [100.0, 1.0]]
stress                  = [[0.0, 1.0], [100.0, 0.5]]
[response_curves.press_claim]
ambition          = [[0.0, 0.0], [50.0, 0.25], [100.0, 1.0]]
claim_rank        = [[1.0, 1.0], [10.0, 0.25]]
opinion_of_holder = [[-100.0, 1.0], [0.0, 0.5], [100.0, 0.0]]
honesty_humility  = [[-100.0, 1.0], [100.0, 0.25]]
holder_is_minor   = [[0.0, 0.5], [1.0, 1.0]]
stress            = [[0.0, 0.75], [100.0, 1.0]]
[response_curves.feud]
opinion       = [[-100.0, 1.0], [-25.0, 0.25], [0.0, 0.0]]
agreeableness = [[-100.0, 1.0], [100.0, 0.125]]
kin_harmed    = [[0.0, 0.5], [1.0, 1.0]]
rival_claim   = [[0.0, 0.5], [1.0, 1.0]]
stress        = [[0.0, 0.5], [100.0, 1.0]]
[response_curves.swear_vow]
kin_harmed        = [[0.0, 0.0], [1.0, 1.0]]
closeness         = [[0.0, 0.0], [1.0, 1.0]]
conscientiousness = [[-100.0, 0.5], [100.0, 1.0]]
honesty_humility  = [[-100.0, 0.75], [100.0, 1.0]]
active_vows       = [[0.0, 1.0], [8.0, 0.0]]
[response_curves.pursue_goal]
goal_priority    = [[0.0, 0.0], [0.75, 1.0]]
target_reachable = [[0.0, 0.0], [1.0, 1.0]]
ambition         = [[0.0, 0.5], [100.0, 1.0]]
stress           = [[0.0, 1.0], [100.0, 0.5]]

