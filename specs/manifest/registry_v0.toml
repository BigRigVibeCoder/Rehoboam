# Mechanics Registry v0, a minimal illustrative subset.
# The Registry is the closed vocabulary that manifests may reference (ADR-0010, docs/05_architecture/05.5).
# Every parameter declares bounds. Validators reject any value outside them.

# 0.2.0 (SPR-011; Architect ruling on PR #37): verbs carry a required tellability, systems may carry defaults, and DEATH and
# EXTINCTION are new verbs, which shifts verb_id (the index in [verbs] sorted by name). The version is in the history tuple.
registry_version = "0.2.0"

# ----------------------------------------------------------------------------- systems
[systems."M1.regions"]
fidelity_levels = ["F0", "F1"]
params = { route_cost_sea = [1.0, 1.0], route_cost_river = [3.0, 8.0], route_cost_land = [10.0, 60.0] }

# S3.migration (SPR-018; specs/systems/S3.migration.odd.toml): residence at F0 (no parameter), moves and fugitives at F1 (P1b),
# individual migration choice at F2 (P4). Added with the draft spec so lint_odd.py and rh-cli ownership resolve the system; the
# registry_version bumps when the spec freezes in SPR-018's PR, as the M2 F1 delta does (specs/systems/next/README.md step 4).
[systems."S3.migration"]
fidelity_levels = ["F0", "F1", "F2"]
params = {}

[systems."M2.demography"]
fidelity_levels = ["F0", "F1", "F2"]
# Mortality is a Brass relational logit (specs/demography/). e0 is a convenience input converted to alpha at beta = 1;
# observed fits span alpha [-1.36, 0.55], beta [0.64, 1.64] (Brass 1971). e0 below ~24.7 or above ~78 is extrapolation.
# Unchanged bounds (specs/manifest/registry_v0.toml) plus F1 mortality's two parameters (SPR-016). F1 reads tfr and
# elite_fertility_mult (SPR-015), brass_beta at any value, density_capacity and density_mortality_slope (SPR-016);
# brass_alpha stays refused, eps_f and eps_m stay unread (P1.5a).
params = { e0 = [20.0, 85.0], brass_alpha = [-2.1, 0.75], brass_beta = [0.6, 1.65], tfr = [1.2, 7.5], eps_f = [0.1, 1.0], eps_m = [0.5, 3.0], elite_fertility_mult = [1.0, 1.6], density_capacity = [1, 10000000], density_mortality_slope = [0.0, 3.0] }
# defaults (SPR-011 ruling 8): the value a world gets when its manifest sets none. rh_manifest::compile fills each parameter the
# built system reads from the manifest, else from this default; a parameter a built system needs with neither is a load error
# naming it (the compiled WorldSpec holds no optional parameter). Design values, mirrored as `default` in the spec's
# [[params]] and checked by lint_odd.py: e0 = 30 lies inside V-SF-02's band (q15 in [0.35, 0.55] <=> e0 in
# [23.441086, 36.569855], about [23.4, 36.6], at beta = 1; specs/demography/selftest_m2_rung0.py) and is uz_job's value; beta = 1 is the General Standard's
# own shape, the only slope rung 0 accepts.
# F1 defaults (SPR-011 ruling 8: a default arrives with the sprint that first reads the parameter). tfr = 4.9 and
# elite_fertility_mult = 1.0 are design values; the spec's [[params]] states why ([algorithm.fertility_f1] F2, F3).
# F1 mortality (SPR-016; [algorithm.mortality_f1] MR11): density_capacity is a count (integer bounds), density_mortality_slope a
# q16_16; both defaults are design values that leave every P1a world untouched (the capacity is the manifest's maximum population).
defaults = { e0 = 30.0, brass_beta = 1.0, tfr = 4.9, elite_fertility_mult = 1.0, density_capacity = 10000000, density_mortality_slope = 1.0 }

[systems."M3.agriculture"]
fidelity_levels = ["F0", "F1"]
# Campbell & O Grada 2011 (R12 §17): detrended gross yield CV, single winter staple 0.145-0.165 (1268-1467), 0.125-0.131
#   (1750-1850), composite 0.111 -> 0.097 -> 0.050 (industrial). Temperate worlds should stay inside those; the upper bound
#   0.35 is a design allowance for arid and monsoon zones (no verified source yet). Lower CV comes from technology (seed
#   selection, specialisation): sigma_eff = harvest_sigma x f_tech, falling toward yield_cv_tech_floor as adoption rises.
# autocorr: yield autocorrelation was "small and never statistically significant" (p. 867). Deep shortfalls nonetheless
#   cluster (1315-21, 1349-51), which one AR(1) cannot produce: use rare multi-year anomaly regimes for that (anomaly_regime_*).
#   A bad year carries into the next through sown area, not through the yield ratio.
# crop_corr_*: winter-spring 0.15-0.41, spring-spring 0.38-0.56 (Table 1); the two-season portfolio is the main insurance.
params = { harvest_sigma = [0.04, 0.35], autocorr = [0.0, 0.2], spatial_share = [0.2, 0.9], volcanic_rate = [0.0, 0.03], seed_yield_ratio = [2.5, 12.0], crop_corr_winter_spring = [0.1, 0.45], crop_corr_spring_spring = [0.3, 0.6], anomaly_regime_rate = [0.0, 0.02], anomaly_regime_years = [2, 7], anomaly_regime_corr = [0.3, 0.6], yield_cv_tech_floor = [0.4, 1.0] }

[systems."M4.economy"]
fidelity_levels = ["F0", "F1"]
# subsistence_kg_grain: the calorie floor per PERSON-year, as grain eaten as bread (about 2,600 kcal/kg). Allen 2001 implies
#   193 (bread-only diet), 195 (Sukhatme norms), 204 (3 baskets for 4 persons) and 278 (ICMR norms) kg per person (R12 §18).
#   Valued at grain prices it is the bare-subsistence line used for the IPF's alpha (09 V-SF-16). It is NOT Allen's
#   welfare-ratio line (baskets.allen2001), which costs about 2.3x as much in silver. An adult male needs about 272.
# tax_regressivity: 0 = proportional, 1 = fully regressive incidence (drives inequality with fiscal_capacity; R12 §13).
# days_worked: realised working days per earner-year. Allen assumes 250; about 300 in 17th-c England and Holland, 275-285 in
#   France; the medieval calendar had about 45 more holy days, so it is a function of doctrine and institutions (p. 425).
# rent_share: under 0.10 of spending; 0.04-0.05 for English workers; towns pay 2-2.5x rural rents (pp. 413-414, 422).
# ae_*: adult-male equivalents for household welfare ratios, derived from the ICMR norms Allen cites (p. 426).
# skill_premium: craftsman / labourer day wage; Allen's 10th-90th percentiles 1.31-2.06, median 1.57 (Tables 1-2).
# food_price_elasticity is STRUCTURAL (no storage, no trade): observed 0.18-0.87 (Campbell & O Grada 2011, pp. 875-877; R12 §17).
#   Davenant's 17th-c schedule (shortfall 10..50% -> price x1.3..x5.5) needs about 0.40. Never lower it for market integration:
#   integration acts through trade_kappa, imports and carry-over, or it is counted twice.
# grain_carryover_cost: interest + spoilage per year (design value); cheaper storage raises carry-over (pp. 879-880).
# poor_relief_share: share of regional income spent on relief; England about 1% (late 17th c.) to 2% (late 18th c.) (fn. 69).
params = { alpha = [0.4, 0.8], food_price_elasticity = [0.18, 0.9], base_tax = [0.05, 0.4], trade_kappa = [0.01, 0.2], subsistence_kg_grain = [180.0, 320.0], tax_regressivity = [0.0, 1.0], days_worked = [200.0, 300.0], rent_share = [0.04, 0.10], ae_adult_female = [0.70, 0.75], ae_child_4_6 = [0.55, 0.65], ae_child_1_3 = [0.40, 0.50], skill_premium = [1.2, 2.1], grain_carryover_cost = [0.05, 0.35], poor_relief_share = [0.0, 0.03] }

[systems."M5.contagion"]
fidelity_levels = ["F0", "F1"]
hazards = ["infection", "detection", "purge_after_positive"]       # readable by pattern completion_hazard (05.4 §2.3)
params = { r0 = [1.0, 8.0], latent_days = [1.0, 365.0], infectious_days = [2.0, 1.0e9], ifr = [0.0, 0.8], waning_per_year = [0.0, 1.0], fear_kappa = [0.0, 0.8], covert_evasion = [0.0, 0.9], test_sensitivity = [0.5, 0.999], test_specificity = [0.9, 0.9999] }

[systems."M6.polity"]
fidelity_levels = ["F0", "F1"]
hazards = ["revolt", "coup", "civil_war"]
# Ψ follows Turchin (2013): Ψ = MMP × EMP × SFD, each a ratio to a reference value (R12 §Turchin).
#   psi_threshold applies to the GEOMETRIC MEAN Ψ̄ = Ψ^(1/k) over the k active components, not the raw product.
#   elite_mobility_u is μ0 in dE/dt = r_e·E + μ0·(w0/w − 1)·N (per year); 0.002 in Turchin's antebellum case.
#   wage_stickiness_years is τ in W(t+τ) = f(GDP/N, labour demand/supply, institutions).
params = { tax_rate = [0.05, 0.4], elite_mobility_u = [0.0005, 0.01], elite_growth_excess = [0.0, 0.01], psi_threshold = [1.0, 3.0], instability_mortality = [0.005, 0.05], wage_stickiness_years = [3.0, 10.0] }

[systems."M7.dynasty"]
fidelity_levels = ["F0", "F1"]
hazards = ["regicide", "deposition", "successor_purge", "succession_crisis", "extinction"]
# Ruler-exit hazards are per ruler-year AT THE REFERENCE INSTITUTIONAL STATE (elective succession, no assembly,
# no recent regicide). Realised rates come from multipliers driven by institutional state (ADR-0027, R12):
#   murder: Eisner 2011 century rates span 0.0019–0.025/yr (all cases), pooled 0.010/yr.
#   deposition: Kokkonen & Sundell 2014 elective baseline ≈ 0.015–0.04/yr; Blaydes & Chaney 2013 unconstrained 0.013–0.05/yr.
#   law multipliers vs elective (Cox HR): primogeniture 0.25–0.37 (CI 0.17–0.63); agnatic seniority ≈ 2 (CI 1.17–5.6).
#   feud stock: a murdered predecessor multiplies the murder odds by ≈ 2.6–3.0 (Eisner) and deposition by ≈ 1.56–1.8 (K&S).
# M7 F1 (specs/systems/M7.dynasty.odd.toml, draft):
#   deposition_hazard_ref is the NON-LETHAL part of K&S's deposition (theirs includes domestic murder, which M7 draws
#     from murder_hazard_base): about 0.040 - 0.010 = 0.03 per ruler-year at election, inside the bounds.
#   predecessor_deposed_hr: K&S "predecessor deposed" HR 1.56–1.80 (p. 447; R12 §2), on the deposition hazard.
#   exec_constraint_hr: K&S parliament HR 0.50 between countries, not significant within them (R12 §2); the multiplier is
#     1 + (exec_constraint_hr - 1) x exec_constraint. Deliberately NOT derived from Blaydes & Chaney 2013, the source of
#     the held-out band V-SF-06c, so that band stays an independent prediction.
#   majority_age (years): design value; no source read (medieval royal majorities varied, roughly 12–21).
#   arb_*_weight, contest_margin, interregnum_max_days: immediate-succession arbitration (SAGA-13), design values.
#   dormancy_degrees: SIM-9's N, design value. vocation_*: shares of later children who enter holy orders or a mercenary
#     company at majority (RT-2026-10-16 item 12); design values: prototype 7's 0.40 / 0.35 are illustrative, not sourced.
params = { murder_hazard_base = [0.001, 0.03], deposition_hazard_ref = [0.01, 0.05], primogeniture_hr = [0.2, 0.55], seniority_hr = [1.3, 2.6], predecessor_killed_or = [1.5, 3.5], predecessor_deposed_hr = [1.3, 2.0], exec_constraint_hr = [0.3, 1.0], majority_age = [12.0, 21.0], arb_legal_weight = [0.0, 1.0], arb_claim_weight = [0.0, 1.0], arb_military_weight = [0.0, 1.0], arb_treasury_weight = [0.0, 1.0], contest_margin = [0.0, 1.0], interregnum_max_days = [7, 730], dormancy_degrees = [1, 6], vocation_holy_orders = [0.0, 0.6], vocation_mercenary = [0.0, 0.6] }

[systems."M8.war"]
fidelity_levels = ["F0", "F1"]
# helmbold_w: W in dA/dt = −β·B^W·A^(1−W); 1 = square law, 0.5 ≈ linear, 0 = logarithmic. WWII fits cannot tell the laws apart
# (Bracken 1995; Fricker 1998; Lucas & Turkes 2004; R12 §11), so the domain is [0, 1]; derive W from force composition (state).
# breakpoint and fort_multiplier are design values with no verified source yet (Helmbold 1969/1987 pending); apply per engagement.
params = { helmbold_w = [0.0, 1.0], breakpoint = [0.1, 0.35], campaign_months = [3, 12], fort_multiplier = [2.0, 10.0] }

[systems."S5.daily_life"]
fidelity_levels = ["F1", "F2"]
# ADR-0031: activity(person, day) is a pure function of start-of-day life-course state, regional conditions and the keyed RNG.
#   F1 = virtual telemetry only (plane B: shown, not consequential); F2 = authoritative at the world's or a focus region's
#   activity_resolution ("blocks" or "minutes"), with encounters resolved in a second phase as plane-A events.
# Schedule templates follow ActivitySim's day pattern -> tour -> trip hierarchy (BSD-3, reference only).
params = { blocks_per_day = [12, 24], encounter_tie_rate = [0.0, 0.05] }

[systems."S4.ecology"]
fidelity_levels = ["F1"]
params = { metabolism_multiplier = [0.1, 10.0] }

[systems."T1.minds"]
fidelity_levels = ["F1", "F2"]
# The minds of named actors (T1), crate rh-minds (05.3). Registry id added by ADR-0035; spec
#   specs/systems/T1.minds.odd.toml (draft).
#   F1 = minds v0 (P1a): HEXACO traits, ambition, relationships and opinion modifiers, IAUS for a few decision types,
#        and secrets v0 knowledge rows (P1b). F2 = the full psychological core, HTN, beliefs, channels and memory (P4).
#   It owns traits, overlays, opinions, the agenda's goals and knowledge rows; S6 and S7 change them only through
#   lifecycle commands (ApplyInfluence, AgendaGoal, ClearGoal, OpinionModifier, ApplyThought).
# Stress and mental breaks (ADR-0035; minds v0, P1a; design inspired by Crusader Kings 3, no code): stress is a q8_8
#   column on a 0-100 scale that rises with vow.conflict (S7), kin-loyalty and value conflicts and decays at
#   stress_decay points per month. Crossing stress_threshold is a deterministic state transition that schedules the
#   break outcome as a timer, at a keyed delay of at most break_delay_max_days; the act comes from [mental_breaks] and
#   stress drops by its relief (points). All values are design values (V-SAGA-16).
# Damping (RT-2026-10-16 item 1; mechanics, no lock, no fiat cap): grief stress per death is grief_gain x the
#   relationship's closeness ([relation_kinds]); the grief one actor takes in one instant saturates at
#   grief_instant_cap; after a break the actor is refractory for break_refractory_days (no new break is scheduled).
#   grief_instant_cap's upper bound (45) stays below stress_threshold's lower bound (50) (REV-P1a MIN-5).
# Units: stress, gains and caps in points on the 0-100 scale; thought_cap and thought_decay in trait points (-100..100)
#   (per month for the decay); *_days in days; marriage_min_age in years; attempt_success a probability per attempt;
#   trait_sd in trait points. Every value is a design value with no empirical band (the spec says what settles each).
params = { stress_threshold = [50.0, 95.0], stress_decay = [0.0, 10.0], vow_conflict_gain = [0.0, 20.0], break_delay_max_days = [1, 90], grief_gain = [0.0, 60.0], grief_instant_cap = [5.0, 45.0], loyalty_conflict_gain = [0.0, 20.0], dissonance_gain = [0.0, 30.0], break_refractory_days = [30, 1825], attempt_success = [0.05, 0.6], trait_sd = [15.0, 50.0], iaus_top_k = [1, 5], interrupt_daily_cap = [1, 4], thought_cap = [0.0, 50.0], thought_decay = [0.0, 10.0], marriage_min_age = [12.0, 20.0] }

[systems."S6.artifacts"]
fidelity_levels = ["F1", "F2"]
# ADR-0035; spec specs/systems/S6.artifacts.odd.toml (draft). Every value is a design value: there is no historical
# band for relics. influence_base is the per-month overlay delta at Honesty-Humility 0; the delivered delta is
#   influence_base x kind_strength x (1 - resist_slope x H/100), so it lies in [0, 2 x influence_base].
# rumour reach is in route-graph hops (M1). find_chance, theft_success and loss_on_death are per attempt or per death.
params = { influence_base = [0.0, 0.05], resist_slope = [0.0, 1.0], corruption_threshold = [0.2, 0.9], rumour_max_hops = [1, 20], rumour_decay_years = [5, 200], find_chance = [0.0, 0.2], theft_success = [0.05, 0.6], loss_on_death = [0.0, 0.5] }

[systems."S7.vows"]
fidelity_levels = ["F1", "F2"]
# ADR-0035; spec specs/systems/S7.vows.odd.toml (draft). Every value is a design value: there is no historical band
# for oath-keeping. A vow's agenda weight is min(vow_priority_base x kind_weight, vow_priority_cap) and never enters
# a survival decision. resolve = resolve_base x (1 + resolve_slope x C/100) for conscientiousness C; a vow breaks when
# its strain exceeds resolve. broken_vow_opinion is the opinion modifier (on the -100..100 opinion scale) applied by
# witnesses and kin to an oath-breaker.
params = { vow_priority_base = [0.05, 0.5], vow_priority_cap = [0.1, 0.8], max_active_vows = [1, 8], strain_rate = [0.0, 0.1], strain_decay = [0.0, 0.1], resolve_base = [0.2, 1.0], resolve_slope = [0.0, 0.9], grudge_on_harm = [0.0, 1.0], broken_vow_opinion = [-60.0, 0.0] }

