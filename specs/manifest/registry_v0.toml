# Mechanics Registry v0, a minimal illustrative subset.
# The Registry is the closed vocabulary that manifests may reference (ADR-0010, docs/05_architecture/05.5).
# Every parameter declares bounds. Validators reject any value outside them.

registry_version = "0.1.0"

# ----------------------------------------------------------------------------- systems
[systems."M1.regions"]
fidelity_levels = ["F0", "F1"]
params = { route_cost_sea = [1.0, 1.0], route_cost_river = [3.0, 8.0], route_cost_land = [10.0, 60.0] }

[systems."M2.demography"]
fidelity_levels = ["F0", "F1", "F2"]
# Mortality is a Brass relational logit (specs/demography/). e0 is a convenience input converted to alpha at beta = 1;
# observed fits span alpha [-1.36, 0.55], beta [0.64, 1.64] (Brass 1971). e0 below ~24.7 or above ~78 is extrapolation.
params = { e0 = [20.0, 85.0], brass_alpha = [-2.1, 0.75], brass_beta = [0.6, 1.65], tfr = [1.2, 7.5], eps_f = [0.1, 1.0], eps_m = [0.5, 3.0], elite_fertility_mult = [1.0, 1.6] }

[systems."M3.agriculture"]
fidelity_levels = ["F0", "F1"]
params = { harvest_sigma = [0.08, 0.35], autocorr = [0.0, 0.6], spatial_share = [0.2, 0.9], volcanic_rate = [0.0, 0.03], seed_yield_ratio = [2.5, 12.0] }

[systems."M4.economy"]
fidelity_levels = ["F0", "F1"]
params = { alpha = [0.4, 0.8], food_price_elasticity = [0.2, 0.6], base_tax = [0.05, 0.4], trade_kappa = [0.01, 0.2] }

[systems."M5.contagion"]
fidelity_levels = ["F0", "F1"]
hazards = ["infection", "detection", "purge_after_positive"]       # readable by pattern completion_hazard (05.4 §2.3)
params = { r0 = [1.0, 8.0], latent_days = [1.0, 365.0], infectious_days = [2.0, 1.0e9], ifr = [0.0, 0.8], waning_per_year = [0.0, 1.0], fear_kappa = [0.0, 0.8], covert_evasion = [0.0, 0.9], test_sensitivity = [0.5, 0.999], test_specificity = [0.9, 0.9999] }

[systems."M6.polity"]
fidelity_levels = ["F0", "F1"]
hazards = ["revolt", "coup", "civil_war"]
# Ψ follows Turchin (2013): Ψ = MMP × EMP × SFD, each a ratio to a reference value (R12 §Turchin).
#   psi_threshold applies to the GEOMETRIC MEAN Ψ̄ = Ψ^(1/k) over the k active components, not the raw product.
#   elite_mobility_u is μ0 in dE/dt = r_e·E + μ0·(w0/w − 1)·N (per year); 0.002 in Turchin's antebellum case.
#   wage_stickiness_years is τ in W(t+τ) = f(GDP/N, labour demand/supply, institutions).
params = { tax_rate = [0.05, 0.4], elite_mobility_u = [0.0005, 0.01], elite_growth_excess = [0.0, 0.01], psi_threshold = [1.0, 3.0], instability_mortality = [0.005, 0.05], wage_stickiness_years = [3.0, 10.0] }

[systems."M7.dynasty"]
fidelity_levels = ["F0", "F1"]
hazards = ["regicide", "deposition", "successor_purge", "succession_crisis", "extinction"]
# Ruler-exit hazards are per ruler-year AT THE REFERENCE INSTITUTIONAL STATE (elective succession, no assembly,
# no recent regicide). Realised rates come from multipliers driven by institutional state (ADR-0027, R12):
#   murder: Eisner 2011 century rates span 0.0019–0.025/yr (all cases), pooled 0.010/yr.
#   deposition: Kokkonen & Sundell 2014 elective baseline ≈ 0.015–0.04/yr; Blaydes & Chaney 2013 unconstrained 0.013–0.05/yr.
#   law multipliers vs elective (Cox HR): primogeniture 0.25–0.37 (CI 0.17–0.63); agnatic seniority ≈ 2 (CI 1.17–5.6).
#   feud stock: a murdered predecessor multiplies the murder odds by ≈ 2.6–3.0 (Eisner) and deposition by ≈ 1.56–1.8 (K&S).
params = { murder_hazard_base = [0.001, 0.03], deposition_hazard_ref = [0.01, 0.05], primogeniture_hr = [0.2, 0.55], seniority_hr = [1.3, 2.6], predecessor_killed_or = [1.5, 3.5], filial_piety_mean = [0.0, 1.0] }

[systems."M8.war"]
fidelity_levels = ["F0", "F1"]
# helmbold_w: W in dA/dt = −β·B^W·A^(1−W); 1 = square law, 0.5 ≈ linear, 0 = logarithmic. WWII fits cannot tell the laws apart
# (Bracken 1995; Fricker 1998; Lucas & Turkes 2004; R12 §11), so the domain is [0, 1]; derive W from force composition (state).
# breakpoint and fort_multiplier are design values with no verified source yet (Helmbold 1969/1987 pending); apply per engagement.
params = { helmbold_w = [0.0, 1.0], breakpoint = [0.1, 0.35], campaign_months = [3, 12], fort_multiplier = [2.0, 10.0] }

[systems."S4.ecology"]
fidelity_levels = ["F1"]
params = { metabolism_multiplier = [0.1, 10.0] }

# ----------------------------------------------------------------------------- archetypes
[archetypes.human]
ledger = "persons"
capabilities = []

[archetypes.apex_predator]
ledger = "creatures"
variants = ["dragon", "great_wolf", "sea_serpent"]
capabilities = ["flying", "bondable"]
params = { mass_kg = [50.0, 20000.0] }

[archetypes.supernatural_agent]   # an in-world intervening agent with a permission scope (ADR-0028 §3); plane A, own beliefs
ledger = "agents"
capabilities = ["intervene"]

[archetypes.hive_node]
ledger = "persons"            # overlay on human persons: capability set by M5 covert compartment
capabilities = ["covert_capable"]

# ----------------------------------------------------------------------------- polity
[governments]
ids = ["feudal_monarchy", "oligarchic_council", "theocracy", "municipal_democracy", "tribal_confederation"]

[succession_laws]
ids = ["primogeniture", "ultimogeniture", "seniority", "partition", "elective", "tanistry", "sortition"]

[institutions]
ids = ["testing_mandate", "quarantine_law", "standing_army", "guild_charter", "inquisition"]

[goods]          # household holdings and market goods
ids = ["grain", "sheep", "goats", "cattle", "oxen", "camels", "donkeys", "horses", "timber", "ore", "cloth", "tools", "arms", "luxuries", "silver"]

[off_map_kinds]  # actors from beyond the map that can enter it
ids = ["raiders", "caravan", "nomads", "neighbouring_polity", "empire"]

[technologies]
ids = ["heavy_plough", "crop_rotation", "printing", "gunpowder", "germ_theory", "blood_assay", "pcr_testing", "rail", "electric_grid"]

# ----------------------------------------------------------------------------- narrative vocabulary
[act_classes]
ids = ["harm", "aid", "promise", "betray", "coerce", "conceal", "reveal", "infect_convert", "succeed_to", "depose",
       "flee", "accuse", "purge", "marry", "birth", "death", "discover", "test", "rebel", "trade", "raid", "bond",
       "counsel", "lament", "renounce", "restore"]

[roles]
ids = ["authority", "successor", "kin", "ally", "rival", "subordinate", "member", "host", "guest", "investigator", "suspect", "any"]

[channels]
ids = ["witness", "testimony", "document", "crowd", "whisper", "hive"]

[overlays]
ids = ["paranoia", "filial_piety", "despair", "hubris", "corruption", "dragon_sympathy"]

[pattern_packs]
ids = ["succession", "revenge", "famine", "reversal", "irony", "elite_feud", "dragon_age", "covert_infiltration", "plague_era", "witch_hunt",
       "trial_of_faith", "grief_and_lament", "temptation", "counsel_dispute", "restoration", "betrayal_by_friends"]

[style_cards]
ids = ["mythic_chronicle", "deep_time", "saga", "historian", "ensemble_space_opera", "noir_city", "wisdom_dialogue"]

# ----------------------------------------------------------------------------- templates
[templates.feudal_realm]
default_systems = ["M1.regions", "M2.demography", "M3.agriculture", "M4.economy", "M6.polity", "M7.dynasty", "M8.war"]
horizon_years = [50, 3000]
modern = false

[templates.merchant_republic]
default_systems = ["M1.regions", "M2.demography", "M3.agriculture", "M4.economy", "M6.polity", "M7.dynasty"]
horizon_years = [50, 3000]
modern = false

[templates.pastoral_household]   # micro scale (ADR-0028): one household and its neighbours
default_systems = ["M1.regions", "M2.demography", "M3.agriculture", "M4.economy", "S1.culture"]
horizon_years = [1, 200]
modern = false

[templates.modern_metropolis]
default_systems = ["M1.regions", "M2.demography", "M4.economy", "M5.contagion", "M6.polity"]
horizon_years = [1, 50]       # longer horizons require horizon.label = "speculative"
modern = true

# ----------------------------------------------------------------------------- culture & world vocabularies (no free-string semantics)
[values]       # Schwartz basic values: keys allowed in Culture.value_bias
ids = ["self_direction", "stimulation", "hedonism", "achievement", "power", "security", "conformity", "tradition", "benevolence", "universalism"]

[doctrine_tags]
ids = ["divine_kingship", "fire_rites", "ancestor_veneration", "dragon_kinship", "rule_of_law", "communal_service", "asceticism", "holy_war", "tolerance", "inquisitorial",
       "monotheism", "divine_justice"]

[heightmap_templates]
ids = ["caldera_with_passes", "river_delta_city", "archipelago", "continental_plains", "mountain_valleys", "flat", "desert_fringe"]

[climate_zones]
ids = ["temperate_continental", "temperate_maritime", "mediterranean", "arid", "tropical", "boreal", "urban_temperate"]

# ----------------------------------------------------------------------------- eras (ADR-0027; v0 sketch, not yet read by validators)
# Era-state variables: plane-A quantities that era-sensitive parameters may depend on. Each has exactly one owner.
[era_state]
tech_adoption                    = { owner = "S2.technology", scope = "region", type = "q8_8", per = "technology" }
energy_per_capita                = { owner = "M4.economy",    scope = "region", type = "q16_16" }
urban_share                      = { owner = "S3.migration",  scope = "region", type = "q8_8" }
literacy                         = { owner = "S1.culture",    scope = "region_class", type = "q8_8" }
fiscal_capacity                  = { owner = "M6.polity",     scope = "polity", type = "q8_8" }
exec_constraint                  = { owner = "M6.polity",     scope = "polity", type = "q8_8" }
franchise                        = { owner = "M6.polity",     scope = "polity", type = "q8_8" }
succession_institutionalisation  = { owner = "M7.dynasty",    scope = "polity", type = "q8_8" }
medical_level                    = { owner = "S2.technology", scope = "region", type = "q8_8" }

# Era labels: predicates over era_state, used by presentation, narrative and validation band selection ONLY.
# A lint fails the build if any mechanic reads a label.
[eras]
ids = ["agrarian", "early_modern", "industrialising", "industrial", "contemporary"]
frontier = "agrarian"            # last era the engine build supports; reaching beyond it files a gap report

# ----------------------------------------------------------------------------- sifting vocabulary
# Anchored attributes readable by patterns as `name(args)@eN`. Stored in event_snapshot.value as INTEGER:
#   q8_8 = fixed-point (value/256); bool = 0/1; enum = index into `values`; int = raw.
[attributes]
fear                      = { type = "q8_8", args = ["actor"] }
trust                     = { type = "q8_8", args = ["actor", "partner"] }
suspicion                 = { type = "q8_8", args = ["actor", "partner"] }
succession_rank           = { type = "int",  args = ["actor", "partner"] }
is_self_or_kin            = { type = "bool", args = ["actor", "partner"] }
is_parent                 = { type = "bool", args = ["actor", "partner"] }
notable                   = { type = "bool", args = ["actor"] }
hive_member               = { type = "bool", args = ["actor"] }
used_hive_only_knowledge  = { type = "bool", args = ["actor"] }
knows_event               = { type = "bool", args = ["actor", "event"] }
in_realm                  = { type = "bool", args = ["event", "actor"] }
faith                     = { type = "q8_8", args = ["actor"] }         # confidence in the deity's goodness (micro worlds, ADR-0028)
integrity                 = { type = "q8_8", args = ["actor"] }         # commitment to one's own innocence and conduct
grief                     = { type = "q8_8", args = ["actor"] }
test_result               = { type = "enum", args = ["actor"], values = ["negative", "positive", "inconclusive"] }

# Concrete verbs (subset). Systems emit these. The world compiler maps setting verbs onto them.
[verbs]
FAMINE_DECLARED = { act_classes = ["death"], emitted_by = "M4.economy", aggregate = true }
ISSUE_DECREE    = { act_classes = ["coerce"], emitted_by = "M6.polity" }
ARREST          = { act_classes = ["coerce", "harm"], emitted_by = "rh-minds" }
PURGE           = { act_classes = ["purge", "harm"], emitted_by = "rh-minds" }
REVENGE         = { act_classes = ["harm"], emitted_by = "rh-minds", references = ["harm"] }
BLOOD_TEST      = { act_classes = ["test"], emitted_by = "M5.contagion" }
RAID_LIVESTOCK  = { act_classes = ["raid", "harm"], emitted_by = "S4.ecology" }
SUCCEED         = { act_classes = ["succeed_to"], emitted_by = "M7.dynasty" }
INCITE_RAID     = { act_classes = ["harm", "raid"], emitted_by = "agents" }     # an agent moves an off-map actor to raid
CALL_FIRE       = { act_classes = ["harm"], emitted_by = "agents" }
RAISE_WIND      = { act_classes = ["harm"], emitted_by = "agents" }
AFFLICT         = { act_classes = ["harm"], emitted_by = "agents" }
COUNSEL         = { act_classes = ["counsel"], emitted_by = "rh-minds" }
LAMENT          = { act_classes = ["lament"], emitted_by = "rh-minds" }
RENOUNCE_FAITH  = { act_classes = ["renounce"], emitted_by = "rh-minds" }
RESTORE         = { act_classes = ["restore", "aid"], emitted_by = "rh-minds" }
