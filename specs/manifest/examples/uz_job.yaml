# Reference world uz_job (micro scale, N ≈ 60), at rung 2 (hamlet) of the complexity ladder: the trials
# of Job (ADR-0028).
# One household and its neighbours, at daily cadence, with every person a full mind.
# The Adversary intervenes only within the wager's permission scope. Its verbs are journaled
# material inputs; what they do, and how Job, his wife and his friends respond, is simulated.
# Nothing is forced: Job may hold fast or renounce, and the friends may persuade him or fail.
manifest_version: 0
registry_version: "0.2.0"
world:
  id: uz_job
  display_name: "The Land of Uz"
  template: pastoral_household
  seed: 42
  calendar: {days_per_year: 360, months: 12, seasons: 4, epoch_label: "Days of Job"}
  horizon: {years: 150, label: historical}
  fidelity_profile: {M2.demography: F1, M4.economy: F1}
  activity_resolution: blocks    # every day of every person in Uz is authoritative (ADR-0031); 'minutes' is affordable too
geography:
  raster_resolution: 256
  region_count: 4                # Job's tents and pastures; the friends' towns of Teman, Shuah and Naamah
  heightmap_template: desert_fringe
  climate: {zone: arid, harvest_sigma: 0.25, autocorr: 0.1, spatial_share: 0.8, volcanic_rate: 0.0}
  ecology: {livestock_kg_per_capita: 0, wild_prey_tonnes: 0}
peoples:
  - archetype: human
    population: 60
    class_shares: {commoner: 0.80, burgher: 0.05, elite: 0.15}
    cultures:
      - {id: uzites, name: "People of Uz", naming_seed: "ancient Semitic pastoral names, desert places", value_bias: {tradition: 0.5, benevolence: 0.4}}
    faiths:
      - {id: el_shaddai, name: "Worship of El Shaddai", doctrine_tags: [monotheism, divine_justice]}
cast:
  - {id: job, name: "Job", sex: male, age_years: 50, household: job_house, flags: [protagonist, deep], initial: {faith: 0.95, integrity: 0.95}}
  - {id: job_wife, name: "Job's wife", sex: female, age_years: 45, household: job_house, flags: [deep], initial: {faith: 0.8}}
  - {id: eliphaz, name: "Eliphaz the Temanite", sex: male, age_years: 70, flags: [deep], initial: {faith: 0.9}}
  - {id: bildad, name: "Bildad the Shuhite", sex: male, age_years: 65, flags: [deep], initial: {faith: 0.9}}
  - {id: zophar, name: "Zophar the Naamathite", sex: male, age_years: 60, flags: [deep], initial: {faith: 0.9}}
  - {id: elihu, name: "Elihu son of Barachel", sex: male, age_years: 25, flags: [deep], initial: {faith: 0.85}}
households:
  - id: job_house
    head: job
    children: {sons: 7, daughters: 3}
    servants: 30
    holdings: {sheep: 7000, camels: 3000, oxen: 1000, donkeys: 500}
off_map_actors:
  - {id: sabeans, name: "Sabean raiders", kind: raiders, strength: 0.6}
  - {id: chaldeans, name: "Chaldean bands", kind: raiders, strength: 0.7}
agents:
  - {id: the_adversary, name: "The Adversary", archetype: supernatural_agent, verbs: [INCITE_RAID, CALL_FIRE, RAISE_WIND, AFFLICT], policy: deterministic}
systems:
  M2.demography: {e0: 30, tfr: 6.0}
catalysts:
  - kind: wager
    agent: the_adversary
    protagonist: job
    stages:
      - {allow: [INCITE_RAID, CALL_FIRE, RAISE_WIND], spare_life: true}
      - {allow: [AFFLICT], spare_life: true, unlock_when: "integrity(job) >= 0.8 for 30 days after the last stage-1 verb"}
overlays: [despair]
narrative:
  pattern_packs: [trial_of_faith, grief_and_lament, counsel_dispute, restoration]
  default_style_card: wisdom_dialogue
presentation:
  era_art: lofi_ancient
  palette: ochre_and_ash
