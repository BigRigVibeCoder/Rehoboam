# Reference world, rung 1 of the complexity ladder (docs/11; BCK-002 A-06; SPR-011 ruling 18): one household.
# A couple and their three children on a tiny map. In P1a it runs the same slice as solo (SPR-011 ruling 2): five founders
# age and die, with no births, so the household dies out within about a century (V-SCALE-04). Partnering, births and
# kinship come with P1.3; the household's food with P1b. Until then the couple are household members, not yet married
# (person.spouse = 0), and the template's other systems are listed as not built in the run header (SPR-011 ruling 3).
# M2 takes its Registry defaults (e0 = 30, beta = 1; SPR-011 ruling 8): systems sets nothing.
manifest_version: 0
registry_version: "0.2.0"
world:
  id: household
  display_name: "One household"
  template: pastoral_household
  seed: 7
  calendar: {days_per_year: 360, months: 12, seasons: 4, epoch_label: "Year"}
  horizon: {years: 200, label: historical}
  fidelity_profile: {M2.demography: F1}
geography:
  raster_resolution: 64          # a tiny map, as solo's: one valley, a house, a field
  region_count: 1
  heightmap_template: flat
  climate: {zone: temperate_maritime, harvest_sigma: 0.15, autocorr: 0.1, spatial_share: 0.9, volcanic_rate: 0.0}
  ecology: {livestock_kg_per_capita: 0, wild_prey_tonnes: 0}
peoples:
  - archetype: human
    population: 5                # the couple and their three children: nobody else
    class_shares: {commoner: 1.0, burgher: 0.0, elite: 0.0}
    cultures:
      - {id: valefolk, name: "Valefolk", naming_seed: "plain rural names", value_bias: {tradition: 0.3}}
    faiths:
      - {id: hearth, name: "Hearth custom", doctrine_tags: []}
cast:
  - {id: oswin, name: "Oswin", sex: male, age_years: 34, household: oswin_house}    # ages: design values
  - {id: maren, name: "Maren", sex: female, age_years: 31, household: oswin_house}
households:
  - id: oswin_house
    head: oswin
    children: {sons: 2, daughters: 1}   # ages drawn by rh-worldgen, uniform in [0, 18) years (SPR-011 ruling 10)
systems: {}
narrative:
  pattern_packs: [solitary_life]  # life_ends (SPR-011 ruling 14)
  default_style_card: historian
presentation:
  era_art: lofi_plain
  palette: mono
