# Reference world, rung 1 of the complexity ladder (docs/11; BCK-002 A-06; SPR-011 ruling 18): one household.
# A couple, their three children and one unrelated founder on a tiny map. In P1.0 it ran the rung-0 slice (SPR-011
# ruling 2): founders age and die, no births. From SPR-015 (M2 F1) the couple are married at genesis, the children are
# theirs, and the unrelated founder Wulf makes a marriage possible (siblings never marry: kin within two degrees), so
# the household is not childless by construction (REV-SPR-015 R8). Six people are still too few: it dies out in every
# replica over the horizon (median extinction year 88; alive at 100 years in 39%, at 200 in 3%), and rung 1's test is
# the distribution of extinction times, not persistence (REV-SPR-015 R17.5). The household's food comes with P1b. M2 takes its Registry defaults (e0 = 30, beta = 1, tfr = 4.9; SPR-011 ruling 8): systems sets nothing.
manifest_version: 0
registry_version: "0.2.0"
world:
  id: household
  display_name: "One household"
  template: pastoral_household
  seed: 7
  calendar: {days_per_year: 360, months: 12, seasons: 4, epoch_label: "Year"}
  horizon: {years: 200, label: historical}
  fidelity_profile: {M2.demography: F1}
geography:
  raster_resolution: 64          # a tiny map, as solo's: one valley, a house, a field
  region_count: 1
  heightmap_template: flat
  climate: {zone: temperate_maritime, harvest_sigma: 0.15, autocorr: 0.1, spatial_share: 0.9, volcanic_rate: 0.0}
  ecology: {livestock_kg_per_capita: 0, wild_prey_tonnes: 0}
peoples:
  - archetype: human
    population: 6                # the couple, their three children and Wulf: nobody else
    class_shares: {commoner: 1.0, burgher: 0.0, elite: 0.0}
    cultures:
      - {id: valefolk, name: "Valefolk", naming_seed: "plain rural names", value_bias: {tradition: 0.3}}
    faiths:
      - {id: hearth, name: "Hearth custom", doctrine_tags: []}
cast:
  - {id: oswin, name: "Oswin", sex: male, age_years: 34, household: oswin_house}    # ages: design values
  - {id: maren, name: "Maren", sex: female, age_years: 31, household: oswin_house}
  - {id: wulf, name: "Wulf", sex: male, age_years: 19, household: wulf_house}       # unrelated: a possible husband for the daughter (SPR-015)
households:
  - id: oswin_house
    head: oswin
    children: {sons: 2, daughters: 1}   # ages drawn by rh-worldgen, uniform in [0, 18) years (SPR-011 ruling 10); Oswin and Maren are their parents from SPR-015
  - id: wulf_house
    head: wulf
systems: {}
narrative:
  pattern_packs: [solitary_life]  # life_ends (SPR-011 ruling 14)
  default_style_card: historian
presentation:
  era_art: lofi_plain
  palette: mono
