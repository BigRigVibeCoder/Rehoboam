# The 10k dynastic manifest for SPR-030's G1a performance run (docs/11 P1.14 and §G1a: 10,000 persons, at most
# 500 named actors, 1,000 years in at most 60 s on 8 cores), V-SAGA-15's P1a variant (stored bytes over 100 years)
# and V-PERF-09's P1a variant (headless, then with rh-cli tail, the TUI stub and a stalled consumer). One manifest
# serves all three (specs/worldgen/fixture_worlds.md §3 says why): three polities under three laws, twelve great
# houses of 3 to 6 back-filled generations, twelve seats. The named-actor bound is checkable: a person is named at
# world start iff a cast member or a great-house member who meets M7's rule (SIM-9; dormancy and on_birth; T1
# [initialization]): holding a seat, office or claim, or within dormancy_degrees of a holder of a title, claim or
# office of its house, or the ruling house's heir, or first or second in a title's line; with dormancy_degrees = 2
# the exact reference counts the named at genesis per house at seeds 1 and 2 under that full rule (and under the
# dormancy clause alone), in specs/worldgen/golden/fixture_worlds_v0.txt, and §3 gives the expected range over
# 1,000 years. No cast. Systems of the template that P1a does not build (M3, M4, M6, M8)
# are listed as not built (SPR-011 ruling 3). Every M7 and T1 parameter is set (no Registry defaults yet).
manifest_version: 0
registry_version: "0.2.0"
world:
  id: kingdom_10k
  display_name: "The Kingdom of the Three Rivers"
  template: feudal_realm
  seed: 1
  calendar: {days_per_year: 360, months: 12, seasons: 4, epoch_label: "Year of the Rivers"}
  horizon: {years: 1000, label: historical}
  fidelity_profile: {M2.demography: F1, M7.dynasty: F1, T1.minds: F1}
geography:
  raster_resolution: 256
  region_count: 40
  heightmap_template: continental_plains
  climate: {zone: temperate_continental, harvest_sigma: 0.2, autocorr: 0.1, spatial_share: 0.6, volcanic_rate: 0.0}
  ecology: {livestock_kg_per_capita: 0, wild_prey_tonnes: 0}
peoples:
  - archetype: human
    population: 10000
    class_shares: {commoner: 0.88, burgher: 0.08, elite: 0.04}
    cultures:
      - {id: riverfolk, name: "River-folk", naming_seed: "river and ford names, saints' days", value_bias: {tradition: 0.3, conformity: 0.2}}
      - {id: marchers, name: "Marchers", naming_seed: "border names, iron and watch places", value_bias: {power: 0.2}}
      - {id: fellmen, name: "Fell-men", naming_seed: "upland names, stone and weather", value_bias: {tradition: 0.3}}
    faiths:
      - {id: hearth, name: "Hearth custom", doctrine_tags: []}
polities:
  - id: crownlands
    name: "The Crownlands"
    government: feudal_monarchy
    succession_law: primogeniture
    titles: {authority: King, successor: Crown_Prince, subordinate: Castellan}
    dynasties:
      - {id: aldric, name: "House Aldric", generations: 6}
      - {id: beaumont, name: "House Beaumont", generations: 5}
      - {id: corvay, name: "House Corvay", generations: 4}
      - {id: dunmere, name: "House Dunmere", generations: 4}
      - {id: estwick, name: "House Estwick", generations: 3}
  - id: marches
    name: "The Marches"
    government: feudal_monarchy
    succession_law: seniority
    titles: {authority: Margrave, successor: Tanist, subordinate: Warden}
    dynasties:
      - {id: ferrand, name: "House Ferrand", generations: 5}
      - {id: gault, name: "House Gault", generations: 4}
      - {id: hollin, name: "House Hollin", generations: 3}
      - {id: ingram, name: "House Ingram", generations: 3}
  - id: high_fells
    name: "The High Fells"
    government: tribal_confederation
    succession_law: tanistry
    titles: {authority: Chieftain, successor: Tanist}
    dynasties:
      - {id: fell, name: "House Fell", generations: 6}
      - {id: carrow, name: "House Carrow", generations: 4}
      - {id: moss, name: "House Moss", generations: 3}
systems:
  M2.demography: {e0: 30, tfr: 4.9, elite_fertility_mult: 1.2}
  M7.dynasty:
    murder_hazard_base: 0.01
    deposition_hazard_ref: 0.03
    primogeniture_hr: 0.3
    seniority_hr: 2.0
    predecessor_killed_or: 2.8
    predecessor_deposed_hr: 1.7
    exec_constraint_hr: 0.5
    majority_age: 16
    arb_legal_weight: 1.0
    arb_claim_weight: 0.6
    arb_military_weight: 0.3
    arb_treasury_weight: 0.3
    contest_margin: 0.5
    interregnum_max_days: 180
    dormancy_degrees: 2            # the named-actor lever: 2 keeps twelve houses under 500 named (fixture_worlds.md §3)
    vocation_holy_orders: 0.2
    vocation_mercenary: 0.15
  T1.minds:
    stress_threshold: 70
    stress_decay: 3
    vow_conflict_gain: 5
    break_delay_max_days: 30
    grief_gain: 20
    grief_instant_cap: 40
    loyalty_conflict_gain: 5
    dissonance_gain: 10
    break_refractory_days: 365
    attempt_success: 0.3
    trait_sd: 25
    iaus_top_k: 3
    interrupt_daily_cap: 2
    thought_cap: 20
    thought_decay: 2
    marriage_min_age: 16
narrative:
  pattern_packs: [succession, solitary_life]
  default_style_card: historian
presentation:
  era_art: early_medieval
  palette: mono
