# Worldgen-lite heightmap templates, version 0 (SPR-018; P1.1a). Data read by [algorithm.worldgen_lite] of
# specs/systems/M1.regions.odd.toml (steps W1-W4) and by specs/worldgen/selftest_worldgen_lite.py, the exact reference.
# One table per id of the Registry's [heightmap_templates]. Every number is an integer: heights are u16 elevation units
# (0..65535; a negative height is a pit), positions and radii are per-mille of the raster side, so a template is the same
# shape at every raster_resolution. Design values (FMG's templates are the precedent, docs/14 §B; R06 §4): they shape a
# few regions, settlements and routes, not a climate. Changing any number changes every rung's genesis: a C3 change.
version = "worldgen-lite-templates-v0"

# Rung 0 and rung 1 (solo, household): one valley, all land, one region.
[templates.flat]
base = 30000
sea_level = 0
smooth_passes = 0
ops = []

[templates.continental_plains]
base = 26000
sea_level = 20000
smooth_passes = 1
ops = [
  { kind = "dome", count = 3, height = [3000, 9000],   radius = [300, 600], x = [100, 900], y = [100, 900] },
  { kind = "dome", count = 2, height = [-9000, -4000], radius = [120, 250], x = [50, 950],  y = [50, 950] },
]

