# Population synthesis v0 and the dynastic back-fill (SPR-019, P1.2): the algorithm tables rh-worldgen
# implements at genesis, stated as exactly as [algorithm.worldgen_lite] (SPR-018) and
# [algorithm.mortality_rung0] (SPR-011). A fold file in the form of specs/demography/mortality_f1.toml:
# it binds nothing until the Architect folds its [[amendments]] into the owning specs (M2, M7, S3, the
# channel-A DDL) at SPR-019's freeze; until then the exact reference and its golden file are the contract.
#
# Exact reference: specs/worldgen/selftest_population_synthesis.py (standard library, on the rh-ids
# reference bin/gen_rng_golden.py, the rung-0 schedule reference and the worldgen-lite reference), golden
# file specs/worldgen/golden/population_synthesis_v0.txt (hamlet and manor at two seeds each).
# Companion (reasoning, reuse, open points): specs/worldgen/population_synthesis.md.
#
# Contracts bound: ADR-0026 (founders H64(seed, "founder", k); the life-course log for everyone; signed
# time); ADR-0024 (plane A only); ADR-0025 (nothing dated at or after tick 0 is written by genesis); 05.1 §6
# items 2 and 5 (keyed draws under the reserved id rh-worldgen, SPR-011 ruling 10; no HashMap iteration, no
# float); 05.2 §1 (events only at t >= 0; pre-epoch births live in the life-course log); SPR-011 ruling 5
# and VER-SPR-011 DEF-3 (a life-course row appended closed is free, unless its person is a ledger row);
# the decisions log's P1a spec rulings (V-DATA-04's P1a span is [entry_tick, exit_tick), excluding
# back-filled rows; S3 R7: no residence row for the dead); M2 F1 (next draft) F0-F10, N1-N7, H1-H6; M7
# 0.3.2 (houses, titles, the append-only tenure log, house_member); the effect language's title-blood
# precondition (REV-SPR-017 N5: holders_of(title, 16) over a log that reaches before the epoch).

[fold]
targets = [
  "specs/systems/M2.demography.odd.toml [initialization] (the next draft already defers to SPR-019), the meanings of marriage.start_tick, household.formed_tick and person.last_birth_tick",
  "specs/systems/M7.dynasty.odd.toml [initialization] (frozen 0.3.2: a C2 amendment through the Architect)",
  "specs/systems/S3.migration.odd.toml [initialization] (already names SPR-019; no text change needed, confirmed below)",
  "specs/stream/channel_a_v0.sql R3 (the tick-0 record order gains the back-filled rows' LIFE_ENTRY and LIFE_EXIT; a decision below)",
  "crates/rh-ids: two additive layouts, house/v1 and title/v1 (beside SPR-015's household/v1), pinned by bin/gen_rng_golden.py",
  "crates/rh-worldgen/src/rng_purposes.rs: the seven new purposes of [[rng_purposes]] after the three of SPR-011 and the three of SPR-018",
]
spec_version = "0.1.0"
status = "draft"

# ----------------------------------------------------------------------------- rh-worldgen purposes
# Every draw is u = H(world_seed, the canonical salt, system_id("rh-worldgen"), epoch 0, purpose, entity,
# t = 0, k) (W0; 05.1 §6 item 2), one u64 per key, never a stream: no rejection loop anywhere, so a
# purpose's draw count for an entity depends only on the stated structure (a fixed count, or one per
# month of a stated loop). Entities are raw u64s (a PersonId, a HouseId, a TitleId, or a slot number).
[[rng_purposes]]
purpose = "founder_birthday"
reused = true
use = "P4: entity = the synthesised person's PersonId, k = 0: the offset of the birth inside its year of age, as SPR-011 ruling 10 (an unchanged purpose: the cast, children and servants keep it)"
[[rng_purposes]]
purpose = "founder_residence"
reused = true
use = "P12: entity = a household's head, k = 0: S3's [algorithm.residence_f0] R1-R3, unchanged (a synthesised or back-filled household is a manifest-shaped household)"
[[rng_purposes]]
purpose = "synth_offset"
use = "P3: entity = the allocation slot (0 the age-sex cells, 1 the married women by age, 2 the married men by band, 3 + c the children of band c), k = 0: the systematic allocation's offset phi = u / 2^64"
[[rng_purposes]]
purpose = "backfill_spine"
use = "B4: entity = the HouseId; k = 0 the youngest generation's birth day; k = 1 + 4 (G - 1 - g) + j for g = G-1 down to 0: j = 0 the father's age at the heir's birth, 1 the mother's, 2 the wife's age at her marriage, 3 the marriage day"
[[rng_purposes]]
purpose = "backfill_marriage"
use = "B8: entity = the groom's PersonId; k = 0 his age at marriage, 1 the marriage day, 2 the bride's age, 3 the bride's birthday"
[[rng_purposes]]
purpose = "backfill_conception"
use = "B6: entity = the wife's PersonId; k = 2 m' whether she conceives at the m'-th pulse after the marriage pulse (one draw per susceptible pulse), k = 2 m' + 1 the birth day of that conception (only on a hit)"
[[rng_purposes]]
purpose = "backfill_sex"
use = "B6: entity = the mother's PersonId, k = the child's index among her children in creation order (the forced heir counts): male iff the draw hits SEX_M"
[[rng_purposes]]
purpose = "backfill_death"
use = "B3: entity = the person's PersonId, k = 0: the survivorship level at death, conditional on the tick the person is known to be alive at"
[[rng_purposes]]
purpose = "backfill_sortition"
use = "B9: entity = the TitleId, k = the tenure index (the number of rows already written): under the sortition law, the next holder among the living adult males of the house"

# ----------------------------------------------------------------------------- population synthesis
[algorithm.population_synthesis]
# Every quantity is an exact integer or an exact rational of integers (a Rust implementation carries a
# rational as a (u128 numerator, u128 denominator) pair or in the stated fixed point); every rounding is
# stated; no float. The persons it writes take M2's [initialization] values except where a step says.
version = "popsynth-v0"
constants = { age_max = 100, child_max = 15, wide_bands = 14, husband_shift_years = 3, marriage_ref_age = 19, gap_seed = [8, 8, 8, 4, 4, 1], ipf_sweeps = 32, ipf_fraction_bits = 32, child_bands = [5, 10, 15], sibling_gap_years = 2, band_representative_years = 2 }
steps = [
  "P0 Keys, rounding, calendar. Draws as [[rng_purposes]] (W0); pick(u, n) = floor(u n / 2^64). rhe(n / d) as [algorithm.mortality_rung0] S0. Y, D and the month starts t_m as S7, S8 and F0; n_m = D_m / 1440. Ages in whole years at the epoch: a person born at tick b has a = floor(-b / Y) (b <= 0). The compiled schedule l(x) is M2's: S1-S7 today, [algorithm.mortality_f1] MR1-MR9 once SPR-016 folds in (a C3 that moves this table's goldens: the stationary marginal reads l).",
  "P1 Who is synthesised. For the first human people (a later human people, none in P1a, is synthesised the same way with its own population and no dynasts): N = population - (the cast count + the sum over manifest households of children.sons + children.daughters + servants) - the number of persons alive at tick 0 that [algorithm.dynastic_backfill] wrote (the dynasties are generated first, B1-B10, so the living count at tick 0 is exactly the manifest's population: INV-PS-07). N < 0 is a load error naming the people and the three counts. The cast and the manifest households stay as SPR-011 ruling 10 and [algorithm.households_f1] H2 lay them out; nothing here touches them.",
  "P2 The stationary age-sex marginal. L_a = l(a Y) + l((a + 1) Y) for a = 0..99 (u64: at most 2^33; twice the person-years lived in the year of age a under the schedule; L_99 = l(99 Y) since l(100 Y) = 0), Lambda = the sum of the L_a (< 2^40). The exact target of cell (a, s), s = male then female, is X_(a,s) = N L_a w_s / (205 Lambda) with w_male = 105 and w_female = 100 (F2's sex ratio at birth, SEX_M; both sexes run the same schedule in P1a, so the ratio holds at every age). Why stationary: a closed population under a fixed schedule and a growth rate of 0 has the age distribution c(a) proportional to l(a) (Lotka), and V-SF-01's band for r, [-0.1%, +0.3%] a year, straddles 0; r = 0 is the design value, the manifest declares no age structure in v0 (the companion's open point 1).",
  "P3 Systematic allocation A(targets, total, slot). Given exact targets T_1..T_K >= 0 with a positive sum and an integer total: scale T'_k = T_k total / sum(T) (so the T'_k sum to the total exactly); C_0 = 0, C_k = C_(k-1) + T'_k; phi = u / 2^64 with u = H(synth_offset, slot, 0), a rational in [0, 1); cell k receives n_k = ceil(C_k - phi) - ceil(C_(k-1) - phi) units: the number of the points phi, phi + 1, ..., phi + total - 1 that fall in [C_(k-1), C_k). The n_k sum to the total, each n_k is floor(T'_k) or ceil(T'_k), and a cell whose target is an integer receives exactly it (so a target clipped to a cap, P5, never exceeds the cap). A total of 0 allocates nothing. Why not largest remainder: on a grid of many small cells (hamlet's 14 anonymous persons over 200 cells) largest remainder puts every unit in the cells of largest target, the youngest ages, and the population has no adult; systematic allocation spreads the units along the cumulative targets. One keyed draw per allocation.",
  "P4 Persons. n_(a,s) = A(X, N, slot 0) over the 200 cells in the order a = 0..99, s = male then female (INV-PS-01: sum = N, each cell within one of its target). For each cell in that order, n_(a,s) persons, each the next founder k of SPR-011 ruling 10's order (the cast, the manifest households' children and servants, then the back-filled rows of B4-B8 in their creation order, then these): PersonId founder(seed, k) with the deterministic rehash (never the sex and age draws of ruling 10, which this step replaces for the anonymous rest: founder_sex and founder_age are not drawn for a synthesised person); sex = s; birth tick b = -(a Y) - pick(H(founder_birthday, id, 0), Y), a minute inside the year of age as ruling 10 draws it, so the age at tick 0 is in [a, a + 1) years; alive = 1, death_tick = i64::MAX, death_cause = none, mother = father = spouse = 0 until P8-P10, parity = 0, last_birth_tick = i64::MIN, conceived_tick = i64::MIN, unborn_father = 0; the life-course row {origin = founder, entry_tick = 0, exit open}.",
  "P5 Marital status. E(a), the share of women ever married at whole-year age a: 0 for a < 15; for 15 <= a < 50 the F3 chain's S(12 (a - 15) + 6), the share ever married at the start of the middle month of that year of age (an exact rational of N1's Prob32 bits); for a >= 50, S(419). C(a) = E(a) for a <= 19 (marriage_ref_age, N1's mean age at first marriage 18.8), else E(a) l((a + 3) Y) / l(22 Y): the husband, three years older (the F1 reference's widowhood chain), married when she was 19, has survived since (design: it removes the widows; a widow is an unmarried woman at genesis and M2 remarries her from the first pulse, N3). Women: the exact target of age a is W_a = n_(a,f) C(a), M_f = rhe(sum of W_a). Men by wide band j = min(floor((a - 15) / 5), 13) for ages 15-19 (only 18 and 19 count: a man marries from 18, N2), 20-24, ..., 80 and over: the weight U_j = sum over the band's ages a >= 18 of n_(a,m) C(a - 3), the cap cap_j = the number of those men. M = min(M_f, sum of cap_j), or 0 when every U_j is 0. Water-filling WF(weights, caps, total): the targets proportional to the weights, each clipped to its cap: repeatedly fix at its cap every free cell whose share of the remaining total, in proportion to the free weights, exceeds its cap, until none does; the free cells then take their shares (the caps sum to at least the total by construction). The married women by age are A(WF(W, n_(.,f), M), M, slot 1) and the married men by band A(WF(U, cap, M), M, slot 2); r_i = the married women summed over the ages of wide band i. INV-PS-02: both sum to M; no age exceeds its women, no band its men.",
  "P6 The couple table by iterative proportional fitting (docs/14 §C: the method of humanleague and ipfn, PORT of the idea; the arithmetic is ours). Rows i = the wife's wide band, columns j = the husband's (14 x 14). Seed Z_ij = 8 when j - i is 0, 1 or 2; 4 when j - i is -1 or 3; else 1 (N2's preferred gap: the husband older by -5 to +15 years; a positive seed everywhere keeps every marginal reachable). Fixed point with 32 fraction bits: X_ij = Z_ij 2^32; then exactly 32 sweeps, each a row step then a column step: the row step sets X_ij := rhe(X_ij r_i 2^32 / S_i) with S_i the row's current sum (a row with S_i = 0 or r_i = 0 becomes 0); the column step likewise with c_j (the married men of band j) and the column sum. Widths: X_ij <= r_i 2^32 < 2^56, the product X r 2^32 < 2^112 (u128). The stopping rule is the sweep count, so the fit is a pure function of (Z, r, c). The fitted cell is the rational X_ij / 2^32 (the row sums equal r_i to within the last roundings after a column step; the residual is below one unit: P7 checks it).",
  "P7 Two-marginal rounding. Floor every fitted cell; d_i = r_i - the row's floors, e_j = c_j - the column's floors (every d_i, e_j >= 0 and sum d = sum e = R, else a construction error naming the table: the residual exceeded a unit). Place the R units one per cell as a flow from rows to columns: a cell is open when its fitted value has a positive fractional part (first pass) or always (second pass); a unit is placed by the shortest augmenting path found by breadth-first search from the first row with d_i > 0: from a row, its open unused cells in ascending column; from a column with e_j > 0 the path ends; from a column with e_j = 0, its used cells' rows in ascending row (traversed backwards: that unit moves); a path marks its forward cells used and its backward cells unused and lowers d of its first row and e of its last column by one. The first pass repeats while a path exists, then the second (a theorem of bipartite flows places every unit; the second pass exists for the residual's tie cases and is never reached on the golden cases). The rounded cell is the floor plus one if used: INV-PS-03: rows sum to r_i, columns to c_j, every cell within one of its fitted value.",
  "P8 Pairing. The married women of wide band i: for each age a of the band in ascending a, the first W'_a women of that age in ascending PersonId (W' the allocation of P5), then the band's list sorted ascending; the married men of band j: the band's men aged 18 and over in ascending PersonId, the first c_j. For each cell (i, j) in row-major order, the next n_ij women of band i and men of band j in those orders marry: spouse columns both ways; a marriage row {husband, wife, start_tick = 0, end_tick = i64::MAX, source = genesis} (H2's genesis form: the pre-epoch date is not known); a household {id = H64(household/v1, [husband, 0]), head = husband, formed_tick = 0} with both as members (H2).",
  "P9 Dependent children: allocation. The dependants are the synthesised persons aged 0..14 at the epoch, in three child bands c: 0-4, 5-9, 10-14; n_c is their count. The mothers are the married women of P8 by wide band i. Seed B_(i,c) = the sum over the years of age d of band c of n(A_i - d) L_d, with A_i = 15 + 5 i + 2 the band's representative age, n(.) the Coale-Trussell thousandths of [algorithm.fertility_f1] F1 at a whole-year age (0 outside 15-49) and L_d the person-years of P2 (the children a woman now in band i bore at her age A_i - d, surviving to age d). Weight_(i,c) = (the number of mothers in band i) B_(i,c). For each c with a positive weight sum: the allocation of the n_c children over i is A(Weight_(.,c), n_c, slot 3 + c); a band c with no eligible mothers (every weight 0) puts its children in the leftover list.",
  "P10 Dependent children: assignment. For each c in order, the band's children sorted by (age descending, PersonId ascending) are consumed in that order by the cells (i, c) in ascending i, n_ic each: a child takes the eligible mother of band i with the fewest children assigned so far, ties to the lower PersonId; eligible means, on ticks: 15 Y <= child.birth_tick - mother.birth_tick < 50 Y (the fertility window), child.birth_tick - husband.birth_tick >= 18 Y, and every child already hers differs from this one by at least two years of whole-year age (the closed period G + P = 20 months, 05.1 §9's minimum spacing). A child with no eligible mother in its cell joins the leftover list; the leftover list, by (age descending, PersonId ascending), is offered to every married woman in ascending PersonId by the same rule; a child still without a mother is an orphan: no parents, counted and reported by the run header (INV-PS-05 bounds it; the golden cases have none). An assigned child gets mother = the wife, father = the husband (person.* and life_course.*), joins their household, and raises the mother's parity by one.",
  "P11 Singles. Every synthesised person without a household (an unmarried person of 15 and over, an orphan) heads a one-person household {id = H64(household/v1, [self, 0]), head = self, formed_tick = 0} (H2).",
  "P12 Residence. S3's R1-R3 verbatim: one draw per household keyed by its head (founder_residence), the settlement with probability proportional to its region's land cells, every member living there; the residence_interval rows per R4. (Headship of the back-filled households is B11's; a synthesised household's head is always alive.)",
]
# Check values (the reference asserts them; the births draft's constants and the hamlet and manor cases).
check_values = { tfr1_bits = 615614, level_bits_at_default = 34186, sex_male_bits = 2199861298, hamlet_42_synthesised = 14, hamlet_42_married = 4, manor_1_living_dynasts = 14, manor_1_synthesised = 386, manor_1_married = 78, manor_1_orphans = 0 }

# ----------------------------------------------------------------------------- the dynastic back-fill
[algorithm.dynastic_backfill]
# Written before P1 so that the living dynasts count against the population. Every tick it writes is a day
# start before the epoch (a birth or death at or after tick 0 is never written: ADR-0025); every row it
# writes for a dead person is appended closed (VER-SPR-011 DEF-3).
version = "backfill-v0"
constants = { youngest_years = 20, father_age_years = [19, 45], mother_age_years = [16, 35], groom_age_years = [18, 30], bride_age_years = [15, 25], adult_years = 16, max_rows = 4096 }
steps = [
  "B0 Keys and ids. Draws as [[rng_purposes]]. HouseId = H64 over the rh-ids tag rehoboam/rh-ids/house/v1 of [world_seed, k] (M7's H64(seed, \"house\", k)), TitleId = H64 over rehoboam/rh-ids/title/v1 of [world_seed, k_t]; both additive rh-ids layouts pinned by bin/gen_rng_golden.py in SPR-019. PersonIds are founder(seed, k) in creation order (B4, B6, B8), continuing ruling 10's k after the cast and the manifest households' members (decision D-02 below). HouseholdId per H1 with the marriage tick as the formation tick.",
  "B1 Houses and titles. Polities in manifest order, p = 1, 2, ...: a polity with no dynasty gets nothing. One sovereign title per polity with a dynasty: tier = sovereign, law = the polity's succession_law, liege = 0, polity = p; then, for every dynasty after the polity's first, one major title: tier = major, the same law, liege = the sovereign, polity = 0. k_t counts titles in that creation order over the manifest. The dynasties in manifest order are the houses k = 0, 1, ... (great = true, extinct_at = 0); the polity's first dynasty holds its sovereign title, each later dynasty its major title. No office, minor title, claim or regent is written (M7's own passes: decision D-09). A manifest with a dynasty must register M7.dynasty and M2.demography (genesis refuses a column without an owner, ruling 10).",
  "B2 Calendar before the epoch. t_m for any integer m: t_m = floor(m / 12) Y + the start offset of month (m mod 12) in the calendar's month table (thirty-day months, or rh-core's 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31); n_m = that month's days; month_of(t) = the m with t_m <= t < t_(m+1). So the pulse grid is the same periodic grid M2 uses from tick 0, extended backwards.",
  "B3 A death draw. For a person with birth tick b known to be alive at tick y_t (age y = y_t - b >= 0, l(y) > 0): u = H(backfill_death, id, 0); T = floor(u l(y) / 2^64), in [0, l(y)); the death age x is the least whole minute at which the linear interpolation of the schedule's grid falls to T or below: with i the first grid index with L_i <= T, x = A_(i-1) + ceil((L_(i-1) - T)(A_i - A_(i-1)) / (L_(i-1) - L_i)) (x > y; T = 0 gives the schedule's end, 100 Y); the death tick is the day start at or after b + x. A death tick at or after 0 means the person is alive at genesis: a ledger row, no death timer (M2 draws its first month at the first pulse, as for every founder); a death tick before 0 means a closed life-course row (exit death, cause natural, no event). P(x >= a) = l(a) / l(y) up to the interpolation: the same schedule M2 runs.",
  "B4 The spine. A dynasty of G = generations (1 to 6) has G + 1 generations: g = 0 the root couple, g = G the youngest generation, born before the epoch; a person of generation g < G marries and bears here, a person of generation G from tick 0 by M2. Anchors, under backfill_spine (entity = the HouseId): b(S_G) = -1440 (1 + pick(u_0, 20 dpy)) with dpy = days per year (a day start in the twenty years before the epoch, strictly before 0); then for g = G-1 down to 0, with the heir's birth h = b(S_(g+1)): the father's age at it fa = 19 dpy + pick(u, 26 dpy) days, b(S_g) = h - 1440 fa; the mother's ma = 16 dpy + pick(u, 19 dpy) days, b(W_g) = h - 1440 ma; c_h = month_of(h) - 9, the heir's conception pulse; earliest = month_of(b(S_g) + 18 Y) + 1 (the first pulse after the father's 18th birthday, N2); wanted = month_of(b(W_g) + 1440 (15 dpy + pick(u, 10 dpy))) + 1 (the first pulse after the wife's drawn marriage age, 15 to 24 years: N1's early pattern); the marriage pulse m = max(min(wanted, c_h - 1), earliest), which is at most c_h - 1 by the age bounds (the mother is at least 15 and the father at least 18 at the pulse before the conception); the marriage tick = t_m + 1440 (1 + pick(u, n_m - 1)), a day start inside the month other than its pulse. Rows are issued in the order S_0, W_0, S_1, W_1, ..., W_(G-1), S_G (the k order); S_(g+1) gets mother W_g and father S_g; the root S_0 and every W_g have no parents (mother = father = 0: founders in ADR-0026's sense, with pre-epoch births); every S_g is a house_member of the house, no W_g is (M7: the father's house, else the mother's, else none). Deaths (B3): S_g and W_g for g < G conditional on being alive at b(S_(g+1)) (the father too: no posthumous heir in the back-fill), S_G conditional on being alive at tick 0. Consequence: at every pre-epoch death of a holder some male of the house is alive (induction over the spine), so B9 always finds a holder.",
  "B5 A marriage (a spine couple at its anchored tick; a younger son at B8's). A marriage row {husband, wife, start_tick = the tick, end_tick = the first spouse's death tick if it is before 0, else i64::MAX, source = genesis}; the spouse columns both ways iff both are alive at tick 0; a household {id = H64(household/v1, [husband, the tick]), head = husband, formed_tick = the tick}; the husband leaves his parental household for it (H3), the wife joins it. The marriage tick is before both deaths by construction.",
  "B6 Bearing. For a married couple (h, w) from pulse m_0 = month_of(marriage tick) + 1, pulse by pulse while t_m < min(0, w.death, h.death, b(w) + 50 Y) (both alive at the pulse, the wife under 50, the pulse before the epoch): i = the wife's band at t_m (F0; a pulse before her 15th birthday takes no draw); the forced heir of a spine couple is conceived at c_h with no draw, and no draw is taken in [c_h - 20, c_h + 20] (its closed period and the period that would close it); otherwise, if the last conception was at pulse p and m <= p + 20 (F5's closed period G + P), no draw; otherwise d_0 = H(backfill_conception, w, 2 (m - m_0)): she conceives iff d_0 hits c_i (F6's Prob32 mapping; the ordinary table c_i of F4, because a wife married in has no house_member row; a wife with one, none in v0, would draw against c_i^e). On a conception at m: due = m + 9; d_1 = H(backfill_conception, w, 2 (m - m_0) + 1); birth = t_due + 1440 (1 + pick(d_1, n_due - 1)) (F6's rule); if birth >= 0 the pregnancy is not carried (decision D-08: no timer and no conceived_tick at genesis) and if the mother's death tick is before the birth no child is born (F9's rule for a mother compacted before the instant); otherwise the child: the next PersonId; sex male iff H(backfill_sex, w, j) hits SEX_M, j = the count of her children so far (the forced heir counts first); mother = w, father = h; generation = h's + 1; a house_member of h's house; its death by B3 conditional on being alive at its birth; it joins the couple's household (H5). Every draw of this step is keyed by the wife and the pulse index, so the count of draws depends only on the stated loop.",
  "B7 Rows per dynasty. If the dynasty has written more than max_rows = 4096 life-course rows (the effect language's lineage bound), genesis refuses the manifest naming the dynasty (never a truncation).",
  "B8 Younger sons. The house's non-spine members in creation order form a queue; for each male of generation < G in queue order: ag = 18 + pick(H(backfill_marriage, id, 0), 12) whole years; the marriage tick = b + 1440 (ag dpy + pick(H(backfill_marriage, id, 1), dpy)); if it is at or after his death or at or after 0 he does not marry here (M2 may marry a living one from tick 0); else the bride: aw = 15 + pick(H(backfill_marriage, id, 2), 10) whole years, born at the tick - 1440 (aw dpy + pick(H(backfill_marriage, id, 3), dpy)), a new row with no parents and no house, of the groom's generation, her death by B3 conditional on being alive at the marriage; then B5 and B6 with no forced heir; the children appended to the queue (so grandsons of a younger son marry too, down to generation G). Daughters of the house do not marry in the back-fill (M2 marries the living ones from tick 0; a daughter married out would need a husband of no house: decision D-07).",
  "B9 The tenure log. The root S_0 takes the title at the day start at or after b(S_0) + 16 Y (adult_years: the back-fill's majority, inside M7's majority_age bounds [12, 21]; M7's parameter has no default yet). While the holder's death tick is before 0: close the row at the death and choose the next holder at that tick t, with index = the number of rows closed so far, among the house's males alive at t (birth <= t < death; the dead holder is not), in ascending PersonId; adults = those aged 16 Y or more at t. By law: seniority, tanistry and elective take the oldest adult (least birth tick, ties the lower PersonId); sortition takes adults[pick(H(backfill_sortition, title, index), |adults|)]; primogeniture and partition, and every law when no adult is alive, take the first living male in the pre-order of the agnatic tree from the root (a father before his sons, sons in ascending birth tick, ties the lower PersonId: male-preference primogeniture by representation); ultimogeniture the same pre-order with sons in descending birth tick (ties the lower PersonId). The last row is open (end = i64::MAX) with the holder alive at tick 0. These are the back-fill's own agnatic reductions of the Registry laws, not the effect language's programs, which govern from tick 0 (decision D-04).",
  "B10 The title at genesis. holder = the open row's holder; held_since = its start (pre-epoch); state = held; predecessor_exit = natural if the log has two rows or more, else none; regent = 0 and exit_timer = 0; tier, law, liege and polity as B1. INV-BF-05: the log is contiguous (each end is the next start), non-overlapping, every holder a house male alive through his row, and the last row is the title's holder.",
  "B11 Rows written. For every back-filled person: a life-course row {origin = founder, mother, father, sex, birth_tick, entry_tick = 0, exit: open if alive at 0, else exit_kind = death, exit_tick = the death tick, death_cause = natural}, in ascending PersonId with every other genesis row; for the living: a ledger row (alive = 1, death_tick = i64::MAX, spouse per B5, household per B5-B8, parity = the number of her children for a woman, last_birth_tick = her last child's birth tick, or i64::MIN with none (decision D-11), conceived_tick = i64::MIN, unborn_father = 0) and a residence per P12; a marriage row per B5; a household row per B5 (dissolved_tick = the last member's death tick when every member died before 0, else i64::MAX; the head at genesis: the husband if alive, else the wife if alive, else the oldest living member by (birth_tick, PersonId): H4 at genesis); a house_member row for the root and every member; the tenure rows of B9; the title and house rows of B1 and B10. Channel A at tick 0: decision D-03.",
]
