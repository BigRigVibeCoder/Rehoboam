# Population synthesis v0 and the dynastic back-fill (SPR-019, P1.2): the algorithm tables rh-worldgen
# implements at genesis, stated as exactly as [algorithm.worldgen_lite] (SPR-018) and
# [algorithm.mortality_rung0] (SPR-011). A fold file in the form SPR-016's mortality_f1.toml took: it binds
# nothing until the Architect folds the two tables into the owning specs at SPR-019's freeze; until then the
# exact reference and its golden file are the contract. This file holds the algorithm only (REV-SPR-019 R4):
# the amendments of the frozen M2 and M7 texts live in specs/systems/next/ as lint-checked [[amends]] records
# (M2.demography.odd.toml 0.3.0, M7.dynasty.odd.toml 0.4.0), the decisions and the director items in the
# companion.
#
# Exact reference: specs/worldgen/selftest_population_synthesis.py (standard library, on the rh-ids
# reference bin/gen_rng_golden.py, the M2 F1 mortality and births references and the worldgen-lite
# reference), golden file specs/worldgen/golden/population_synthesis_v0.txt (hamlet and manor at two seeds
# each, and the law sweep: the manor's tenure logs under each of the seven laws over twenty seeds, at the
# manifest's generations and at six on the 365-day calendar, as per-law digests). The reference reads this file: its
# `constants` must equal the reference's and its `check_values` must hold (REV-SPR-019 R5).
# Companion (reasoning, reuse, the decisions, open points): specs/worldgen/population_synthesis.md.
#
# Contracts bound: ADR-0026 (founders H64(seed, "founder", k); the life-course log for everyone; signed
# time); ADR-0024 (plane A only); ADR-0025 (nothing dated at or after tick 0 is written by genesis); 05.1 §6
# items 2 and 5 (keyed draws under the reserved id rh-worldgen, SPR-011 ruling 10; no HashMap iteration, no
# float); 05.2 §1 (events only at t >= 0; pre-epoch births live in the life-course log); SPR-011 ruling 5
# and VER-SPR-011 DEF-3 (a life-course row appended closed is free, unless its person is a ledger row);
# the decisions log's P1a spec rulings (V-DATA-04's P1a span is [entry_tick, exit_tick), excluding
# back-filled rows; S3 R7: no residence row for the dead); M2 F1 0.3.0 (specs/systems/next) F0-F10, N1-N7,
# H1-H6, and [algorithm.mortality_f1] through the schedule's knots (MR9) and K (MR5) only, P0; M7 0.3.2
# (houses, titles, the append-only tenure log, house_member); the effect language's succession laws (§8 of
# specs/registry/effect_language_v0.md, PR #41) and its title-blood precondition (REV-SPR-017 N5:
# holders_of(title, 16) over a log that reaches before the epoch).

[fold]
targets = [
  "specs/systems/next/M2.demography.odd.toml (0.3.0 draft): [initialization] amended, the meanings of marriage.start_tick, household.formed_tick and person.last_birth_tick, H2's genesis clause (this PR)",
  "specs/systems/next/M7.dynasty.odd.toml (0.4.0 draft, new): [initialization] amended, the meanings of tenure.title and house_member.house (this PR)",
  "specs/systems/S3.migration.odd.toml [initialization]: already names SPR-019; no text change (P12, B11 keep R1-R3 and R7 as written)",
  "crates/rh-ids: two additive layouts, house/v1 and title/v1 (beside SPR-015's household/v1), pinned by bin/gen_rng_golden.py",
  "crates/rh-worldgen/src/rng_purposes.rs: the six new purposes of [[rng_purposes]] after the three of SPR-011 and the three of SPR-018",
  "specs/registry/effect_ref.py: once PR #41 merges, the reference's --effect-ref gate runs in bin/check_all.sh --part core (REV-SPR-019 R3)",
]
spec_version = "0.2.0"
status = "draft"

# ----------------------------------------------------------------------------- rh-worldgen purposes
# Every draw is u = H(world_seed, the canonical salt, system_id("rh-worldgen"), epoch 0, purpose, entity,
# t = 0, k) (W0; 05.1 §6 item 2), one u64 per key, never a stream: no rejection loop anywhere, so a
# purpose's draw count for an entity depends only on the stated structure (a fixed count, or one per
# month of a stated loop). Entities are raw u64s (a PersonId, a HouseId, or a slot number).
[[rng_purposes]]
purpose = "founder_birthday"
reused = true
use = "P4: entity = the synthesised person's PersonId, k = 0: the offset of the birth inside its year of age, as SPR-011 ruling 10 (an unchanged purpose: the cast, children and servants keep it)"
[[rng_purposes]]
purpose = "founder_residence"
reused = true
use = "P12: entity = a household's head, k = 0: S3's [algorithm.residence_f0] R1-R3, unchanged (a synthesised or back-filled household is a manifest-shaped household)"
[[rng_purposes]]
purpose = "synth_offset"
use = "P3: entity = 16 i + slot for the people index i (0 for the first human people) and the allocation slot (0 the age-sex cells, 1 the married women by age, 2 the married men by band, 3 + c the children of band c), k = 0: the systematic allocation's offset phi = (u >> 32) / 2^32"
[[rng_purposes]]
purpose = "backfill_spine"
use = "B4: entity = the HouseId; k = 0 the youngest generation's birth day; k = 1 + 4 (G - 1 - g) + j for g = G-1 down to 0: j = 0 the father's age at the heir's birth, 1 the mother's, 2 the wife's age at her marriage, 3 the marriage day"
[[rng_purposes]]
purpose = "backfill_marriage"
use = "B8: entity = the groom's PersonId; k = 0 his age at marriage, 1 the marriage day, 2 the bride's age, 3 the bride's birthday"
[[rng_purposes]]
purpose = "backfill_conception"
use = "B6: entity = the wife's PersonId; k = 2 m' whether she conceives at the m'-th pulse after the marriage pulse (one draw per susceptible pulse), k = 2 m' + 1 the birth day of that conception (only on a hit)"
[[rng_purposes]]
purpose = "backfill_sex"
use = "B6: entity = the mother's PersonId, k = the child's index among her children in creation order (the forced heir counts): male iff the draw hits SEX_M"
[[rng_purposes]]
purpose = "backfill_death"
use = "B3: entity = the person's PersonId, k = 0: the survivorship level at death, conditional on the tick the person is known to be alive at"

# ----------------------------------------------------------------------------- population synthesis
[algorithm.population_synthesis]
# Every quantity is an integer in a stated width or fixed point (Q0.32 shares, Q0.64 for the nuptiality
# chain, 2^-32 units for the fitted table); every rounding is stated; no float, no rational wider than u128.
# The persons it writes take M2's [initialization] values except where a step says.
version = "popsynth-v0"
constants = { child_max = 15, wide_bands = 14, husband_shift_years = 3, marriage_ref_age = 19, gap_seed = [8, 8, 8, 4, 4, 1], ipf_sweeps = 32, ipf_fraction_bits = 32, child_bands = [5, 10, 15], sibling_gap_minutes = 876960, band_representative_years = 2, offset_bits = 32, weight_product_bits = 96, slot_stride = 16, max_population = 10000000 }
steps = [
  "P0 Keys, rounding, calendar, the schedule. Draws as [[rng_purposes]] (W0); pick(u, n) = floor(u n / 2^64). rhe(n / d) as [algorithm.mortality_rung0] S0. Y, D and the month starts t_m as S7, S8 and F0; n_m = D_m / 1440. Ages in whole years at the epoch: a person born at tick b has a = floor(-b / Y) (b <= 0). The schedule l(x) is M2's compiled [algorithm.mortality_f1] schedule read as knots: MR9's 438 knots (age in twelfths of a year, exact minutes for both calendars; survivorship in 2^-32 units), strictly increasing in age, non-increasing in l, ending at the zero knot j_0 of MR8 (120 Y at most); l(x) between knots by MR9's interpolation (the same rhe); K from MR5. A = the least whole number of years at or past the zero knot (120 at e0 = 30, beta = 1; at most 120), the schedule's end for P2. Nothing else of mortality_f1 is read: not MR10's monthly q, not MR11's modifiers (the back-fill's deaths are the schedule's own, B3). A changed knot moves this table's goldens (the stationary marginal and every death draw read l).",
  "P1 Who is synthesised. For the first human people, people index i = 0 (a later human people, none in P1a, is synthesised the same way with its own population, its own i and no dynasts): N = population - (the cast count + the sum over manifest households of children.sons + children.daughters + servants) - the number of persons alive at tick 0 that [algorithm.dynastic_backfill] wrote (the dynasties are generated first, B1-B10, so the living count at tick 0 is exactly the manifest's population: INV-PS-07). N < 0 is a load error naming the people and the three counts; N <= max_population = 10^7 (the manifest's bound; the widths below assume N < 2^24). The cast and the manifest households stay as SPR-011 ruling 10 and [algorithm.households_f1] H2 lay them out; nothing here touches them.",
  "P2 The stationary age-sex marginal. L_a = l(a Y) + l((a + 1) Y) for a = 0..A-1 (u64, below 2^33: twice the person-years lived in the year of age a under the schedule; l(A Y) = 0), Lambda = the sum of the L_a (< 2^40). The integer weight of cell (a, s), s = male then female, is w_(a,s) = L_a w_s with w_male = 105 and w_female = 100 (F2's sex ratio at birth, SEX_M; both sexes run the same schedule in P1a, so the ratio holds at every age): w < 2^40, the 2 A weights sum to 205 Lambda < 2^48. The exact target of the cell is X_(a,s) = N w_(a,s) / (205 Lambda). Why stationary: a closed population under a fixed schedule and a growth rate of 0 has the age distribution c(a) proportional to l(a) (Lotka), and V-SF-01's band for r, [-0.1%, +0.3%] a year, straddles 0; r = 0 is the design value, the manifest declares no age structure in v0 (the companion's open point 1).",
  "P3 Systematic allocation A(w_1..w_K, total, slot). Given integer weights w_k >= 0 with S = sum(w) > 0 and an integer total >= 0 such that S (total + 1) < 2^96 (the precondition every caller meets below; then every quantity in this step is unsigned and below 2^128): the exact targets are T_k = w_k total / S (they sum to the total); W_k = w_1 + ... + w_k (W_0 = 0), so the running target C_k = W_k total / S; u = H(synth_offset, 16 i + slot, 0) and phi' = u >> 32 (the high 32 bits), the offset phi = phi' / 2^32 in [0, 1); cell k receives n_k = ceil(C_k - phi) - ceil(C_(k-1) - phi) units, computed unsigned as ceil(C_k - phi) = ceil(C_k + 1 - phi) - 1 = ceil((W_k total 2^32 + (2^32 - phi') S) / (S 2^32)) - 1 (the numerator is at most S (total + 1) 2^32 < 2^128, u128; the quotient's ceiling is exact integer division). n_k counts the points phi, phi + 1, ..., phi + total - 1 that fall in [C_(k-1), C_k), so the n_k sum to the total, each n_k is floor(T_k) or ceil(T_k), and a cell whose target is an integer receives exactly it. A total of 0 allocates nothing. Why not largest remainder: on a grid of many small cells (hamlet's 14 anonymous persons over 240 cells) largest remainder puts every unit in the cells of largest target, the youngest ages, and the population has no adult; systematic allocation spreads the units along the cumulative targets. One keyed draw per allocation, and one per people and slot (a later people reuses no offset).",
  "P4 Persons. n_(a,s) = A(w, N, slot 0) over the 2 A cells in the order a = 0..A-1, s = male then female (INV-PS-01: sum = N, each cell within one of its target; 205 Lambda (N + 1) < 2^72). For each cell in that order, n_(a,s) persons, each the next founder k of SPR-011 ruling 10's order (the cast, the manifest households' children and servants, then the back-filled rows of B4-B8 in their creation order, then these): PersonId founder(seed, k) with the deterministic rehash (never the sex and age draws of ruling 10, which this step replaces for the anonymous rest: founder_sex and founder_age are not drawn for a synthesised person); sex = s; birth tick b = -(a Y) - pick(H(founder_birthday, id, 0), Y), a minute inside the year of age as ruling 10 draws it, so the age at tick 0 is in [a, a + 1) years; alive = 1, death_tick = i64::MAX, death_cause = none, mother = father = spouse = 0 until P8-P10, parity = 0, last_birth_tick = i64::MIN, conceived_tick = i64::MIN, unborn_father = 0; the life-course row {origin = founder, entry_tick = 0, exit open}.",
  "P5 Marital status, in fixed point. N1's monthly first-marriage probabilities as Prob32: nu_i = rhe(2^32 h_i / 1000) for the thousandths h_i of band i (the births reference's nuptiality_bits). The unmarried chain of F3 in Q0.64: U_0 = 2^64 and, for a = 0..418 (months from exact age 15), U_(a+1) = rhe(U_a (2^32 - nu_(floor(a / 60))) / 2^32) (U_a <= 2^64, the product < 2^96: u128; U stays positive inside the Registry bounds, the reference checks it). E(a), the share of women ever married at whole-year age a, in Q0.32: 0 for a < 15; 2^32 - rhe(U_(12 (a - 15) + 6) / 2^32) for 15 <= a < 50 (the start of the middle month of that year of age); 2^32 - rhe(U_419 / 2^32) for a >= 50. Why a Q0.64 chain rounded once, not N1's Prob32 per band compounded: the chain keeps 55 significant bits of the unmarried share where it has fallen to 3 x 10^-3 at 50, and its 419 roundings move U by at most 419 x 2^-64, far below Q0.32's resolution, so E(a) equals the exact rational chain of F3 rounded once to Q0.32 at every age (check 4 of the reference proves it against the births reference's fractions); a Prob32 chain would compound 419 roundings of 2^-32 and could differ from the exact chain by a unit. Check values: E(19) = 2684395077, E(49) = 4282935761. C(a) in Q0.32: C(a) = E(a) for a <= 19 (marriage_ref_age, N1's mean age at first marriage 18.8); for a > 19, C(a) = rhe(E(a) l((a + 3) Y) / l(22 Y)) (one rounding; the product < 2^64; l(22 Y) > 0 inside the bounds): the husband, three years older (the F1 reference's widowhood chain), married when she was 19, has survived since (design: it removes the widows; a widow is an unmarried woman at genesis and M2 remarries her from the first pulse, N3). C(a) < 2^32 at every age (U > 0 and the factor is at most 1). Women: the integer weight of age a is W_a = n_(a,f) C(a) (< 2^56; the sum is at most N 2^32 < 2^56), M_f = floor(sum(W) / 2^32). Men by wide band j = min(floor((a - 15) / 5), 13) for ages 15-19 (only 18 and 19 count: a man marries from 18, N2), 20-24, ..., 80 and over: U_j = the sum over the band's ages a >= 18 of n_(a,m) C(a - 3) (the sum over bands at most N 2^32), M_m = floor(sum(U) / 2^32). M = min(M_f, M_m) (0 when either sum is below 2^32). The married women by age are A(W, M, slot 1) and the married men by band A(U, M, slot 2) (both S (M + 1) below 2^80); r_i = the married women summed over the ages of wide band i. No clipping is needed: M 2^32 <= sum(W) gives the exact target of age a, W_a M / sum(W) <= W_a / 2^32 < n_(a,f), so its ceiling is at most the age's women; likewise a band's target is below its men aged 18 and over (INV-PS-02: both allocations sum to M; no age exceeds its women, no band its men).",
  "P6 The couple table by iterative proportional fitting (docs/14 §C: the method of humanleague and ipfn, PORT of the idea; the arithmetic is ours). Rows i = the wife's wide band, columns j = the husband's (14 x 14). Seed Z_ij = 8 when j - i is 0, 1 or 2; 4 when j - i is -1 or 3; else 1 (N2's preferred gap: the husband older by -5 to +15 years; a positive seed everywhere keeps every marginal reachable). Fixed point with 32 fraction bits: X_ij = Z_ij 2^32; then exactly 32 sweeps, each a row step then a column step: the row step sets X_ij := rhe(X_ij r_i 2^32 / S_i) with S_i the row's current sum (a row with S_i = 0 or r_i = 0 becomes 0); the column step likewise with c_j (the married men of band j) and the column sum. Widths: X_ij <= r_i 2^32 < 2^56, the product X r 2^32 < 2^112 (u128). The stopping rule is the sweep count, so the fit is a pure function of (Z, r, c). The fitted cell is X_ij in 2^-32 units (the row sums equal r_i 2^32 to within the last roundings after a column step; the residual is below one unit: P7 checks it).",
  "P7 Two-marginal rounding. Floor every fitted cell (X_ij >> 32); d_i = r_i - the row's floors, e_j = c_j - the column's floors (every d_i, e_j >= 0 and sum d = sum e = R, else a construction error naming the table: the residual exceeded a unit). Place the R units one per cell as a flow from rows to columns: a cell is open when its fitted value has a positive fractional part (first pass) or always (second pass); a unit is placed by the shortest augmenting path found by breadth-first search from each row with a deficit, in ascending row (the first row with a deficit and a path): from a row, its open unused cells in ascending column; from a column with e_j > 0 the path ends; from a column with e_j = 0, its used cells' rows in ascending row (traversed backwards: that unit moves); a path marks its forward cells used and its backward cells unused and lowers d of its first row and e of its last column by one. The first pass repeats while a path exists, then the second (a theorem of bipartite flows places every unit; the second pass exists for the residual's tie cases and is never reached on the golden cases). The rounded cell is the floor plus one if used: INV-PS-03: rows sum to r_i, columns to c_j, every cell within one of its fitted value.",
  "P8 Pairing. The married women of wide band i: for each age a of the band in ascending a, the first W'_a women of that age in ascending PersonId (W' the allocation of P5), then the band's list sorted ascending; the married men of band j: the band's men aged 18 and over in ascending PersonId, the first c_j. For each cell (i, j) in row-major order, the next n_ij women of band i and men of band j in those orders marry: spouse columns both ways; a marriage row {husband, wife, start_tick = 0, end_tick = i64::MAX, source = genesis} (H2's genesis form: the pre-epoch date is not known); a household {id = H64(household/v1, [husband, 0]), head = husband, formed_tick = 0} with both as members (H2).",
  "P9 Dependent children: allocation. The dependants are the synthesised persons aged 0..14 at the epoch, in three child bands c: 0-4, 5-9, 10-14; n_c is their count. The mothers are the married women of P8 by wide band i. Seed B_(i,c) = the sum over the years of age d of band c of n(A_i - d) L_d, with A_i = 15 + 5 i + 2 the band's representative age, n(.) the Coale-Trussell thousandths of [algorithm.fertility_f1] F1 at a whole-year age (0 outside 15-49) and L_d the person-years of P2 (the children a woman now in band i bore at her age A_i - d, surviving to age d; B < 5 x 460 x 2^33 < 2^45). The integer weight is Weight_(i,c) = (the number of mothers in band i) B_(i,c); the weights of a band c sum to at most (N / 2) 2^45 and n_c + 1 <= N, so S (n_c + 1) is below 2^92 (P3's precondition). For each c with a positive weight sum: the allocation of the n_c children over i is A(Weight_(.,c), n_c, slot 3 + c); a band c with no eligible mothers (every weight 0) puts its children in the leftover list.",
  "P10 Dependent children: assignment. For each c in order, the band's children sorted by (age descending, PersonId ascending) are consumed in that order by the cells (i, c) in ascending i, n_ic each: a child takes the eligible mother of band i with the fewest children assigned so far, ties to the lower PersonId; eligible means, on ticks: 15 Y <= child.birth_tick - mother.birth_tick < 50 Y (the fertility window at the birth; a synthesised child has no conception pulse), child.birth_tick - husband.birth_tick >= 18 Y, and every child already hers differs from this one in birth tick by at least sibling_gap_minutes = 609 x 1440 = 876960 (609 days): M2's least birth-to-birth gap on either calendar, since two conceptions more than the closed period apart (pulses m and m + 21 at the closest) give a first birth no later than t_(m+10) - 1 day and a second no earlier than t_(m+30) + 1 day, a gap of twenty months and two days, at least 602 days on the 360-day calendar and 609 on the 365-day one (the reference computes both and asserts the constant is at least each); so a synthesised pair of siblings is never closer than a born pair, because the gap is at least M2's least gap. A child with no eligible mother in its cell joins the leftover list; the leftover list, by (age descending, PersonId ascending), is offered to every married woman in ascending PersonId by the same rule; a child still without a mother is an orphan: no parents, counted and reported by the run header (INV-PS-05 bounds it; the golden cases have none). An assigned child gets mother = the wife, father = the husband (person.* and life_course.*) and joins their household. Then one rule for every genesis mother, a manifest household's (H2), a synthesised or a back-filled one: parity = the number of her genesis children and last_birth_tick = the birth tick of her latest genesis child, i64::MIN when she has none (decision D-11, REV-SPR-019 R14: F5's postpartum period holds across the epoch, so a mother of a newborn at genesis does not conceive at the first pulse; the next M2's [initialization] and H2 say the same).",
  "P11 Singles. Every synthesised person without a household (an unmarried person of 15 and over, an orphan) heads a one-person household {id = H64(household/v1, [self, 0]), head = self, formed_tick = 0} (H2).",
  "P12 Residence. S3's R1-R3 verbatim: one draw per household keyed by its head (founder_residence), the settlement with probability proportional to its region's land cells, every member living there; the residence_interval rows per R4. (Headship of the back-filled households is B11's; a synthesised household's head is always alive.)",
]
# Check values the reference asserts (check 4): the births spec's compiled constants, E(a) at two ages, the
# schedule's end at the defaults, and the golden cases' counts.
check_values = { tfr1_bits = 615614, level_bits_at_default = 34186, sex_male_bits = 2199861298, ever_married_q32_at_19 = 2684395077, ever_married_q32_at_49 = 4282935761, schedule_end_years_at_default = 120, least_birth_gap_minutes_360 = 866880, least_birth_gap_minutes_365 = 876960, hamlet_42_synthesised = 14, hamlet_42_married = 1, hamlet_7_married = 1, manor_1_living_dynasts = 14, manor_1_synthesised = 386, manor_1_married = 78, manor_1_orphans = 0, manor_2_living_dynasts = 15, manor_2_synthesised = 385, manor_2_married = 79 }

# ----------------------------------------------------------------------------- the dynastic back-fill
[algorithm.dynastic_backfill]
# Written before P1 so that the living dynasts count against the population. Every tick it writes is a day
# start before the epoch (a birth or death at or after tick 0 is never written: ADR-0025); every row it
# writes for a dead person is appended closed (VER-SPR-011 DEF-3); it emits no event and writes no channel-A
# record (REV-SPR-019 R1).
version = "backfill-v0"
constants = { youngest_years = 20, father_age_years = [19, 45], mother_age_years = [16, 35], groom_age_years = [18, 30], bride_age_years = [15, 25], max_rows = 4096, lineage_height = 3, descent_max = 6, kin_max = 6, holders_window = 16 }
steps = [
  "B0 Keys and ids. Draws as [[rng_purposes]] (six purposes: backfill_spine, backfill_marriage, backfill_conception, backfill_sex, backfill_death, and P12's founder_residence). HouseId = H64 over the rh-ids tag rehoboam/rh-ids/house/v1 of [world_seed, k] (M7's H64(seed, \"house\", k)), TitleId = H64 over rehoboam/rh-ids/title/v1 of [world_seed, k_t]; both additive rh-ids layouts pinned by bin/gen_rng_golden.py in SPR-019. PersonIds are founder(seed, k) in creation order (B4, B6, B8), continuing ruling 10's k after the cast and the manifest households' members (decision D-02 in the companion). HouseholdId per H1 with the marriage tick as the formation tick. M7's majority_age (Q16_16, compiled from the manifest; the Registry has no default, so a manifest with a dynasty must set it until SPR-021 gives one) is read as the effect language's tanistry program reads it: majority = floor(majority_age x days_per_year) days, in minutes.",
  "B1 Houses and titles. Polities in manifest order, p = 1, 2, ...: a polity with no dynasty gets nothing. One sovereign title per polity with a dynasty: tier = sovereign, law = the polity's succession_law, liege = 0, polity = p; then, for every dynasty after the polity's first, one major title: tier = major, the same law, liege = the sovereign, polity = 0. k_t counts titles in that creation order over the manifest. The dynasties, polities in manifest order and each polity's dynasties in manifest order, are the houses k = 0, 1, ... (great = true, extinct_at = 0), each back-filled in full (B4-B10) before the next; the polity's first dynasty holds its sovereign title, each later dynasty its major title. No office, minor title, claim or regent is written (M7's own passes: decision D-09). A manifest with a dynasty must register M7.dynasty and M2.demography (genesis refuses a column without an owner, ruling 10).",
  "B2 Calendar before the epoch. t_m for any integer m: t_m = floor(m / 12) Y + the start offset of month (m mod 12) in the calendar's month table (thirty-day months, or rh-core's 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31); n_m = that month's days; month_of(t) = the m with t_m <= t < t_(m+1). So the pulse grid is the same periodic grid M2 uses from tick 0, extended backwards.",
  "B3 A death draw. For a person with birth tick b known to be alive at tick y_t (age y = y_t - b >= 0, l(y) > 0): u = H(backfill_death, id, 0); T = floor(u l(y) / 2^64), in [0, l(y)); the death age x is the least whole minute at which the linear interpolation of the schedule's knots (P0) falls to T or below: with i the first knot index with L_i <= T, x = A_(i-1) + ceil((L_(i-1) - T)(A_i - A_(i-1)) / (L_(i-1) - L_i)) (L_(i-1) > T >= L_i, so the divisor is positive; x > y always, since T < l(y) and l(y) is within half a unit of the interpolant at y; T = 0 gives the zero knot); the death tick is the day start at or after b + x. A death tick at or after 0 means the person is alive at genesis: a ledger row, no death timer (M2 draws its first month at the first pulse, as for every founder); a death tick before 0 means a closed life-course row (exit death, cause natural, no event). P(x >= a) = l(a) / l(y) up to the interpolation: the same schedule M2 runs.",
  "B4 The spine. A dynasty of G = generations (1 to 6) has G + 1 generations: g = 0 the root couple, g = G the youngest generation, born before the epoch; a person of generation g < G marries and bears here, a person of generation G from tick 0 by M2. Anchors, under backfill_spine (entity = the HouseId), drawn youngest first: b(S_G) = -1440 (1 + pick(u_0, 20 dpy)) with dpy = days per year (a day start in the twenty years before the epoch, strictly before 0); then for g = G-1 down to 0, with the heir's birth h = b(S_(g+1)): the father's age at it fa = 19 dpy + pick(u, 26 dpy) days, b(S_g) = h - 1440 fa; the mother's ma = 16 dpy + pick(u, 19 dpy) days, b(W_g) = h - 1440 ma; c_h = month_of(h) - 9, the heir's conception pulse; earliest = month_of(b(S_g) + 18 Y) + 1 (the first pulse after the father's 18th birthday, N2); wanted = month_of(b(W_g) + 1440 (15 dpy + pick(u, 10 dpy))) + 1 (the first pulse after the wife's drawn marriage age, 15 to 24 years: N1's early pattern); the marriage pulse m = max(min(wanted, c_h - 1), earliest), which is at most c_h - 1 by the age bounds (the mother is at least 15 and the father at least 18 at the pulse before the conception); the marriage tick = t_m + 1440 (1 + pick(u, n_m - 1)), a day start inside the month other than its pulse. Rows are issued, after every anchor is drawn, in the order S_0, W_0, S_1, W_1, ..., W_(G-1), S_G (the k order); S_(g+1) gets mother W_g and father S_g; the root S_0 and every W_g have no parents (mother = father = 0: founders in ADR-0026's sense, with pre-epoch births); every S_g is a house_member of the house, no W_g is (M7's membership rule: the father's house, else, from the 0.5.0 draft, the mother's only when she is named-eligible for it, else none; a wife married in has no house, so the back-fill and the rule agree). Deaths (B3), in the order S_0, W_0, ..., S_(G-1), W_(G-1), then S_G: S_g and W_g for g < G conditional on being alive at b(S_(g+1)) (the father too: no posthumous heir in the back-fill), S_G conditional on being alive at tick 0. Then, for g = 0..G-1 in that order, B5 and B6 for the couple (S_g, W_g) with the forced heir S_(g+1). Consequence: at every pre-epoch death of a holder some male of the house is alive (induction over the spine), so B9 always finds a holder.",
  "B5 A marriage (a spine couple at its anchored tick; a younger son at B8's). A marriage row {husband, wife, start_tick = the tick, end_tick = the first spouse's death tick if it is before 0, else i64::MAX, source = genesis}; the spouse columns both ways iff both are alive at tick 0; a household {id = H64(household/v1, [husband, the tick]), head = husband, formed_tick = the tick}; the husband leaves his parental household for it (H3), the wife joins it. The marriage tick is before both deaths by construction.",
  "B6 Bearing. For a married couple (h, w) from pulse m_0 = month_of(marriage tick) + 1, pulse by pulse while t_m < min(0, w.death, h.death, b(w) + 50 Y) (both alive at the pulse, the wife under 50, the pulse before the epoch): i = the wife's band at t_m (F0; a pulse before her 15th birthday takes no draw); the forced heir of a spine couple is conceived at c_h with no draw, and no draw is taken in [c_h - 20, c_h + 20] (its closed period and the period that would close it); otherwise, if the last conception was at pulse p and m <= p + 20 (F5's closed period G + P), no draw; otherwise d_0 = H(backfill_conception, w, 2 (m - m_0)): she conceives iff d_0 hits c_i (F6's Prob32 mapping; the ordinary table c_i of F4, because a wife married in has no house_member row; a wife with one, none in v0, would draw against c_i^e; M7's membership rule (0.5.0 draft, BCK-002 A-56: the father's house, else the mother's only when she is named-eligible for it) gives every back-filled child its father's house, since no daughter of a house bears here (D-07)). On a conception at m: due = m + 9; d_1 = H(backfill_conception, w, 2 (m - m_0) + 1); birth = t_due + 1440 (1 + pick(d_1, n_due - 1)) (F6's rule); if birth >= 0 the pregnancy is not carried (decision D-08: no timer and no conceived_tick at genesis) and if the mother's death tick is before the birth no child is born (F9's rule for a mother compacted before the instant); otherwise the child: the next PersonId; sex male iff H(backfill_sex, w, j) hits SEX_M, j = the count of her children so far (the forced heir counts first); mother = w, father = h; generation = h's + 1; a house_member of h's house; its death by B3 conditional on being alive at its birth; it joins the couple's household (H5). Every draw of this step is keyed by the wife and the pulse index, so the count of draws depends only on the stated loop.",
  "B7 Rows per dynasty. If the dynasty has written more than max_rows = 4096 life-course rows (the effect language's lineage bound), genesis refuses the manifest naming the dynasty (never a truncation).",
  "B8 Younger sons. The house's non-spine members in creation order (the order their rows were issued by B6, spine couple by spine couple) form a queue; for each male of generation < G in queue order: ag = 18 + pick(H(backfill_marriage, id, 0), 12) whole years; the marriage tick = b + 1440 (ag dpy + pick(H(backfill_marriage, id, 1), dpy)); if it is at or after his death or at or after 0 he does not marry here (M2 may marry a living one from tick 0); else the bride: aw = 15 + pick(H(backfill_marriage, id, 2), 10) whole years, born at the tick - 1440 (aw dpy + pick(H(backfill_marriage, id, 3), dpy)), a new row with no parents and no house, of the groom's generation, her death by B3 conditional on being alive at the marriage; then B5 and B6 with no forced heir; the children are appended to the end of the queue in their creation order (so grandsons of a younger son marry too, down to generation G). Daughters of the house do not marry in the back-fill (M2 marries the living ones from tick 0; a daughter married out would need a husband of no house: decision D-07).",
  "B9 The tenure log, by the title's succession law (REV-SPR-019 R3: the back-fill's tenures are what the law selects). Court laws (elective, sortition: the effect language's candidates are court(title), the holders of the title's vassal titles and offices, which genesis does not back-fill): one row only, the genesis holder's, {holder = the stand-in below at tick 0, start = 0 (frozen M7's 'held_since from the manifest (or world start)'), end = i64::MAX}; no past holder is invented, so the title-blood rule sees one holder. Genealogical laws (primogeniture, ultimogeniture, seniority, partition, tanistry): the root S_0 takes the title at start_0 = min(the day start at or after b(S_0) + majority, b(S_1)) (his majority, or the heir's birth if he died first; a day start before his death either way). While the holder's death tick t is before 0: close the row at t and seat the first of the law's line at t; the line is the effect language's succession protocol (§7.2) for the law's program (§8), evaluated on the back-filled rows as they stand at t, which the reference states as follows and the differential gate checks against specs/registry/effect_ref.py (R3). The genealogy at t: a person exists iff born at or before t (the runtime has no row for the unborn); alive(x) iff born and not dead at t (the holder, dead at t, is not alive); parents(x) = [father, mother] when not 0, father first; children(x) = every existing person with mother or father = x, ascending PersonId; ancestors-or-self(x, n) over both parents (over the father only in the agnatic forms) within n generations; descends(x, a) iff a is in ancestors-or-self(x, 6); descendants(a, 6) by generation then ascending id; lineage(holder, 3) = the union of descendants(a, 6) over every ancestor-or-self a of the holder within height 3, the holder removed, then pruned: a dead member stays only with a living descendant among the members (N2); up(x, holder) and common(x, holder) = the least height h at which an ancestor-or-self of the holder at height h, visited father first within each height, is an ancestor-or-self of x within 6, and that ancestor (7 and 0 when none within 6); line(a, x) = the shortest father-first parent chain from x up to a, listed downward from a's child to x; holders_of(title, 16) = the holders of the last 16 tenure rows written so far, the row being closed included, most recent first, each once; blood(x) iff descends(x, holder) or descends(x, h) for some h in holders_of(title, 16); the agnatic forms up_agnatic, common_agnatic and line_agnatic use the father only. The programs: primogeniture: candidates lineage(holder, 3); eligible alive(x) and x != holder and not descends(holder, x) and blood(x); key (up(x, holder), [(sex(y) = female, birth_tick(y)) for y in line(common(x, holder), x)]). ultimogeniture: the same with -birth_tick(y). seniority: eligible as primogeniture and sex(x) = male and up_agnatic(x, holder) <= 3; key (count(line_agnatic(common_agnatic(x, holder), x)) - up_agnatic(x, holder), birth_tick(x)). partition: candidates children(holder); eligible alive(x) and x != holder; key (sex(x) = female, birth_tick(x)). tanistry: eligible as seniority and count(line_agnatic(common_agnatic(x, holder), x)) <= 3 and t - birth_tick(x) >= majority; key birth_tick(x). Keys compare as tuples; a list compares element by element with a proper prefix first; ties by ascending PersonId; the line is the eligible candidates in key order and the next holder its first. When the line is empty, the stand-in rule seats the oldest living male of the house at t (least birth tick, ties the lower PersonId): an adult when the house has a living adult male (the oldest male is then its oldest adult), else a minor. That is the whole rule; 'the oldest living adult male, else the oldest living male' is the same function, and the reference checks the two agree at every succession of the sweep. It is the back-fill's stand-in for M7's arbitration, which needs claims and a court that genesis does not write (REV-SPR-019 R9; decision D-04 states the cost). Every genealogical law falls back: tanistry whenever no adult agnate within reach is alive (then the stand-in is a minor in nearly every case, since the house has no living adult male: 6 of 6 fallbacks on the manor over seeds 1-20, 23 of 25 at six generations on the 365-day calendar), partition when the holder has no living child (22 of 204 successions at six generations, 1 a minor), primogeniture and ultimogeniture when the blood rule leaves the pruned lineage empty (1 of 200 and 1 of 192 at six generations, adults). The reference counts and pins, per configuration and law, the fallbacks, the minors seated and the adult fallbacks, requires an adult fallback to occur in the sweep, and digests every tenure log and succession head, so a stand-in that picks the youngest, or a changed title-blood window, moves the pinned counts and the digests. No regency is written before tick 0; a minor seated at tick 0 is decision D-09's case (regent = 0 until SPR-021). The last row is open (end = i64::MAX) with the holder alive at tick 0. A woman may hold under the cognatic laws and is a house member like her brothers (the companion's §5 counts them).",
  "B10 The title at genesis. holder = the open row's holder; held_since = its start (pre-epoch, or 0 for a court law); state = held; predecessor_exit = natural if the log has two rows or more, else none; regent = 0 and exit_timer = 0; tier, law, liege and polity as B1. INV-BF-05: the log is contiguous (each end is the next start), non-overlapping, every holder a house member alive through his or her row, the last row the title's holder, and a court law's log exactly the genesis row.",
  "B11 Rows written. For every back-filled person: a life-course row {origin = founder, mother, father, sex, birth_tick, entry_tick = 0, exit: open if alive at 0, else exit_kind = death, exit_tick = the death tick, death_cause = natural}, in ascending PersonId with every other genesis row; a back-filled dead row is the one kind of row with exit_tick < entry_tick (the discriminator: REV-SPR-019 R1; its V-DATA-04 span [0, exit_tick) is empty, the Architect's exemption of the back-filled rows from the residence tiling); for the living: a ledger row (alive = 1, death_tick = i64::MAX, spouse per B5, household per B5-B8, parity and last_birth_tick per P10's final pass (decision D-11), conceived_tick = i64::MIN, unborn_father = 0) and a residence per P12; a marriage row per B5; a household row per B5 (dissolved_tick = the last member's death tick when every member died before 0, else i64::MAX; the head at genesis: the husband if alive, else the wife if alive, else the oldest living member by (birth_tick, PersonId): H4 at genesis); a house_member row for the root and every member (B4, B6), the dead included; the tenure rows of B9; the title and house rows of B1 and B10. Channel A at tick 0 carries nothing for the back-filled dead (R1): the chronicle reads them from the genesis keyframe and the life-course log; the founders' LIFE_ENTRY records at tick 0 stay as SPR-013's R3 states them, for the living only.",
]
check_values = { manor_1_house_0 = { generations = 3, rows = 21, members = 17, living = 6, tenures = 3 }, manor_1_house_1 = { generations = 2, rows = 12, members = 9, living = 4, tenures = 2 }, manor_2_house_0 = { generations = 3, rows = 25, members = 19, living = 11, tenures = 3 }, manor_2_house_1 = { generations = 2, rows = 7, members = 5, living = 2, tenures = 2 }, sweep_manor_primogeniture = { successions = 51, fallbacks = 0, minors = 0, adult_fallbacks = 0 }, sweep_manor_ultimogeniture = { successions = 51, fallbacks = 0, minors = 0, adult_fallbacks = 0 }, sweep_manor_seniority = { successions = 55, fallbacks = 0, minors = 0, adult_fallbacks = 0 }, sweep_manor_partition = { successions = 51, fallbacks = 0, minors = 0, adult_fallbacks = 0 }, sweep_manor_elective = { successions = 0, fallbacks = 0, minors = 0, adult_fallbacks = 0 }, sweep_manor_tanistry = { successions = 55, fallbacks = 6, minors = 6, adult_fallbacks = 0 }, sweep_manor_sortition = { successions = 0, fallbacks = 0, minors = 0, adult_fallbacks = 0 }, sweep_manor_g6_primogeniture = { successions = 200, fallbacks = 1, minors = 0, adult_fallbacks = 1 }, sweep_manor_g6_ultimogeniture = { successions = 192, fallbacks = 1, minors = 0, adult_fallbacks = 1 }, sweep_manor_g6_seniority = { successions = 266, fallbacks = 0, minors = 0, adult_fallbacks = 0 }, sweep_manor_g6_partition = { successions = 204, fallbacks = 22, minors = 1, adult_fallbacks = 21 }, sweep_manor_g6_elective = { successions = 0, fallbacks = 0, minors = 0, adult_fallbacks = 0 }, sweep_manor_g6_tanistry = { successions = 264, fallbacks = 25, minors = 23, adult_fallbacks = 2 }, sweep_manor_g6_sortition = { successions = 0, fallbacks = 0, minors = 0, adult_fallbacks = 0 }, sweep_adult_fallbacks = 25 }

# ----------------------------------------------------------------------------- invariants (the reference's check 2)
[[invariants]]
id = "INV-PS-01"
statement = "The age-sex cells sum to the synthesised count and each is within one of its exact stationary target (P3, P4)"
test = "V-DATA-04"
[[invariants]]
id = "INV-PS-02"
statement = "The married women by age and the married men by band both sum to M and each cell is within one of its exact target; no age holds more married women than women, no band more married men than its men aged 18 and over, without any clipping (P5)"
test = "V-DATA-04"
[[invariants]]
id = "INV-PS-03"
statement = "The couple table's row sums are the married women per band, its column sums the married men per band, and every cell is within one of its fitted value (P6, P7)"
test = "V-DATA-04"
[[invariants]]
id = "INV-PS-04"
statement = "Spouse columns are symmetric between two living persons of opposite sex; every genesis marriage row names them (P8)"
test = "V-INV-01"
[[invariants]]
id = "INV-PS-05"
statement = "Every synthesised child with parents was born between its mother's 15th and 50th birthday and after its father's 18th; two synthesised children of one mother are born at least sibling_gap_minutes apart (609 days, at least M2's least birth-to-birth gap on either calendar); a genesis mother's parity is her genesis child count and her last_birth_tick her latest genesis child's birth tick, i64::MIN with none; orphans are counted (P10)"
test = "V-INV-01"
[[invariants]]
