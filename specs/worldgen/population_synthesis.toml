test = "V-INV-01"
[[invariants]]
id = "INV-PS-07"
statement = "The living count at tick 0 equals the manifest's population exactly: the manifest founders, the living back-filled persons and the synthesised persons (P1)"
test = "V-INV-01"
[[invariants]]
