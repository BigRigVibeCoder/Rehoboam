# ----------------------------------------------------------------------------- decisions (recommendation, confidence)
[[decisions]]
id = "D-01"
question = "Where the algorithm text lives: a companion markdown with prose (the brief's first option), or [algorithm.*] tables in TOML."
recommendation = "TOML tables, in this standalone fold file with the markdown as companion (ADR-0033 §4: the TOML is the spec; SPR-016's mortality_f1.toml is the precedent for a slice that touches frozen specs). The three owning specs are frozen (M2 0.2.0 on main with 0.3.0 in PR #50; M7 0.3.2; S3 0.1.0), so the tables cannot land in them before SPR-019's freeze without conflicting with the births PR; the Architect folds the [[amendments]] then. lint_odd.py does not read specs/worldgen, so nothing lints these tables until the fold: the exact reference and its gates stand in."
confidence = "8/10"
[[decisions]]
id = "D-02"
question = "The id scheme for back-filled rows (ADR-0026): H64(mother, parity) as runtime births, or founder(seed, k) in creation order."
recommendation = "founder(seed, k) for every genesis row, back-filled or synthesised, living or dead, with origin = founder and parent links where authored. Why: (a) one id rule for all of genesis, continuing ruling 10's k; (b) the domains differ (person/founder/v1 against person/child/v1), so a back-filled id can collide with a runtime birth only by a 64-bit coincidence, which the deterministic rehash resolves (V-DATA-05's table holds every id ever issued); (c) origin = founder keeps STEP_DIGEST.births and V-DATA-04's reconciliation clean: a living dynast born before the epoch is not a birth of month 1; (d) INV-M2-07 holds as written ('plus her genesis children'): a mother's parity counts her genesis children and her runtime births continue the H64(mother, parity) sequence from it; (e) genesis is identical across branches, so content-addressing buys nothing at tick 0. The alternative (child ids for every row with a mother) needs origin = born for pre-epoch rows, which inflates the first digest's births, and a new INV-M2-07 clause."
confidence = "8/10"
[[decisions]]
id = "D-03"
question = "How a back-filled ancestor appears to M2's ledger, to kinship walks (SPR-017) and to V-DATA-04."
recommendation = "No ledger row (the dead leave the ledger: ADR-0026 item 2); a closed life-course row with entry_tick = 0 (the instant it was appended, as every genesis row), exit_tick = the pre-epoch death tick and death_cause = natural; so V-DATA-04's P1a span [entry_tick, exit_tick) is empty for it, which is the Architect's ruling that the back-filled rows are exempt from the residence tiling (REV-SPR-018 R7, the decisions log), and no residence row exists for it; kinship walks (the effect language's genealogy prelude over life_course.person_id, mother, father, birth_tick, sex) see it exactly as a runtime dead person, which is the point of the back-fill (holders_of(title, 16) anchors on the dead holders; descends reaches six generations). Channel A at tick 0: emit, for each closed row, a LIFE_ENTRY and a LIFE_EXIT record in PersonId order among the founders' entries (the entry carries birth_tick, so the chronicle's life_course join and the family annals (SPR-029) see the ancestors; without the records the stream's chronicle lacks them, while a keyframe has them). The stream order rule R3 changes (a C2 amendment of SPR-013's DDL; the Architect's). Alternative: no records for the dead (the chronicle then reads them from the keyframe), rejected because the stream is the engine's only output (ADR-0035 §6)."
confidence = "7/10"
[[decisions]]
id = "D-04"
question = "Tenure rows 'by the title's succession law': evaluate the effect language's programs on the growing log, or state the back-fill's own rules."
recommendation = "The back-fill's own agnatic rules (B9), exactly stated, with the pre-order of the agnatic tree as male-preference primogeniture by representation. Why: (a) the programs are not frozen (PR #41 awaits D37) and have no Python twin in the engine's test tier, so an exact reference could not pin tenure goldens against them; (b) a second implementation of the seven programs inside rh-worldgen would have to stay bit-equal to rh-registry's evaluator, a contract without a test; (c) the blood rule needs only who held and who descends from whom, which any plausible agnatic sequence gives; (d) history is authored, the law adjudicates from tick 0 (SIM-14 makes the law itself history in P4). Cost: a cognatic or elective law's past holders are chosen by the agnatic reduction, never a woman; the companion's open point 2 lists the alternative (SPR-019's Rust calls rh-registry's evaluator at each pre-epoch death, with the Python reference bypassing tenures) for the Architect."
confidence = "6/10"
[[decisions]]
id = "D-05"
question = "The marginals: what the manifest supplies in v0."
recommendation = "Only population: the age-sex marginal is the compiled schedule's stationary population (P2), marriage from the F1 nuptiality chain (P5), children from the Coale-Trussell schedule (P9). class_shares, cultures and faiths are not synthesised: no P1a system owns class, culture or faith (M4 F0 and S1 are P1b), and genesis writes only owned columns (ruling 10). No manifest field is added in v0 (V-WC-04 parity untouched); an optional peoples[].age_structure and class marginals arrive with their owners (open point 1)."
confidence = "7/10"
[[decisions]]
id = "D-06"
question = "Which titles a polity's dynasties hold, given the manifest's abstract roles only."
recommendation = "One sovereign title per polity with dynasties, held by its first dynasty; one major title per further dynasty, liege = the sovereign (B1). The successor role is M7's heir, not a seat; subordinate and the other roles are not seats in v0. Every great house then holds a seat, which dormancy (SIM-9) needs. Alternative: a Dynasty.tier field in the manifest (a schema change with parity work) when SPR-030's dynastic fixture needs minor titles."
confidence = "6/10"
[[decisions]]
id = "D-07"
question = "The back-fill's shape constants: the youngest generation born in [0, 20) years before the epoch, father 19-44 and mother 16-34 at the heir's birth, brides 15-24, grooms 18-29, adult at 16; daughters of the house do not marry in the back-fill."
recommendation = "Accept as design values (none is sourced; the F1 constants N1, N2 and the schedule carry the sourced part: the conception hazard, the closed period, the mortality). The youngest generation as children or young adults makes generation G-1 the usual genesis holder, with heirs and siblings alive (a 3-generation court at G = 3). Daughters: a married-out daughter needs a husband of no house (one new row each) and her children would be of no house; cheap to add if the annals want them (open point 3)."
confidence = "6/10"
[[decisions]]
id = "D-08"
question = "Pregnancies pending at the epoch."
recommendation = "Not carried: a conception whose birth would fall at or after tick 0 bears no child, and the mother starts the run not pregnant. Carrying it needs a BIRTH_TIMER at genesis ('no timer exists at genesis', ruling 10; keyframe anchors). Cost: the dynasts' first births come nine months after the first pulse at the earliest; the commoners' too."
confidence = "7/10"
[[decisions]]
id = "D-09"
question = "A genesis holder under majority_age (a child heir under a lineal law)."
recommendation = "regent = 0 at genesis; M7's first Day/Polity binding names the regent by its rule and emits REGENCY_BEGUN (an SPR-021 item: M7's spec has no world-start regency step today). Worldgen cannot: the regency-end timer is M7's and no timer exists at genesis."
confidence = "7/10"
[[decisions]]
id = "D-10"
question = "Integerisation: largest remainder with a keyed tie-break (the brief's example), or systematic allocation with a keyed offset plus a flow rounding for the couple table."
recommendation = "Systematic allocation (P3) for the one-dimensional tables and the bipartite flow (P7) for the two-marginal table. Largest remainder failed on the first run of the reference: with 14 persons over 200 cells every unit went to the youngest ages (the largest targets) and hamlet's anonymous rest had no adult; systematic allocation keeps every cell at its floor or ceiling and spreads small counts along the cumulative targets. The keyed offset is the brief's keyed tie-break in a form that decides every cell. The flow rounding meets both marginals exactly (a greedy rounding could raise one cell twice)."
confidence = "8/10"
[[decisions]]
id = "D-11"
question = "last_birth_tick of a back-filled mother alive at genesis."
recommendation = "Her last child's birth tick (B11): F5's postpartum period then holds across the epoch (a mother who bore three months before tick 0 is not susceptible at month 1). The frozen meaning says i64::MIN for every founder; the fold amends it. The alternative (i64::MIN for her too) lets her conceive at month 1 against F5."
confidence = "7/10"

