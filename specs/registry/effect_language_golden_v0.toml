# ============================================================================= cases
# Unless stated, a case runs as M7.dynasty in world dynasty with holder = Halvard (7), title = 100 and
# x = Kell (10). Sections follow the spec: literals (§3.2), arithmetic (§4.3), constants and division (§4.4),
# types and operators (§3.3, §4.1), reads (§4.5), randomness (§4.6), names (§4.7), relations and aggregates
# (§5), keys (§3.4), effects (§6), program kinds and the laws (§7, §8), rejections (§10).

# ----------------------------------------------------------------------------- literals (§3.2)
[[case]]
id = "lit_true"
kind = "expr"
system = "M7.dynasty"
text = 'true'
expect = "bool:true"
[[case]]
id = "lit_false"
kind = "expr"
system = "M7.dynasty"
text = 'false'
expect = "bool:false"
[[case]]
id = "lit_int"
kind = "expr"
system = "M7.dynasty"
text = '42'
expect = "int:42"
[[case]]
id = "lit_int_negative"
kind = "expr"
system = "M7.dynasty"
text = '-42'
expect = "int:-42"
[[case]]
id = "lit_dec_defaults_to_q16"
kind = "expr"
system = "M7.dynasty"
text = '0.5'
expect = "q16_16:32768"
[[case]]
id = "lit_none_without_a_kind"
kind = "expr"
system = "M7.dynasty"
text = 'none'
expect = "error:E_TYPE"
[[case]]
id = "lit_int_adopts_q16"
kind = "expr"
system = "M7.dynasty"
text = '1 + 0.5'
expect = "q16_16:98304"
[[case]]
id = "lit_int_adopts_q8"
kind = "expr"
system = "M7.dynasty"
text = 'q8(0) + 1'
expect = "q8_8:256"
[[case]]
id = "lit_dec_adopts_q8_rounds"
kind = "expr"
system = "M7.dynasty"
text = 'q8(0) + 0.1'
expect = "q8_8:26"
[[case]]
id = "lit_dec_q16_rounds"
kind = "expr"
system = "M7.dynasty"
text = '0.1 + 0.0'
expect = "q16_16:6554"
[[case]]
id = "lit_dec_tie_to_even_q8"
kind = "expr"
system = "M7.dynasty"
text = 'q8(0) + 0.001953125'
expect = "q8_8:0"
[[case]]
