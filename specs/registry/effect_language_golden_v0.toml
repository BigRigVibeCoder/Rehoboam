# Golden cases of the Registry effect language v0 (specs/registry/effect_language_v0.md §13).
#
# Every case is a program, the system that declares it, the fixture world and variable bindings it runs in,
# and the exact result it must produce or the code it must be rejected with. specs/registry/effect_ref.py
# --check reproduces every case; the Rust evaluator of SPR-017 (rh-registry, V-WC-10) must match it bit for
# bit. The expected values are hand-derived from the spec, not generated by the reference.
#
# Rendering of results (one line per case, exact text):
#   bool:true | int:N | q8_8:<raw bits> | q16_16:<raw bits> | enum:<type>.<value> | <kind>:<id> | <kind>:none
#   key:<key>       tuples as (a, b), lists as [a, b], scalars as above            (kind = "order")
#   relation:[ids]  the relation's elements in canonical order                     (kind = "candidates")
#   effects:[Name(person=<id>, args=[<i64>, ...]); ...]   the queue form of §6     (kind = "effects")
#   line:[ids]      the law's line by the succession protocol of §7.2              (kind = "succession")
#   error:E_CODE    a rejected program (§10)
#   invariant:E_TRUNCATED   a hard invariant failure at evaluation (a candidates relation above its bound)
#   invariant:E_RNG_REUSE   a hard invariant failure at evaluation (one (purpose, entity, k) drawn twice in one evaluation)
# A case may pin the evaluator's diagnostics with `missing_reads`, `neutral_reads`, `dropped_actions` or `truncated`
# (default: not checked). Ticks are SimTime minutes (B1); a day is rh_core::time::MINUTES_PER_DAY = 1440, an
# engine constant (minor 6), so no world states it.
# Variable bindings are "kind:id" strings (an entity), integers or booleans; `now` comes from the world. An
# effects case binds `event` implicitly: the verb's own event, of the opaque type `event` (§3.1, N3), rendered
# as the text `event` inside `args` because the rh-core merge rewrites event-typed payload fields; `none` in an
# event-typed field renders as 0. A verb's payload fields (`success` of MURDER_ATTEMPT, N4) come through `payload`
# (a table name -> value), bound like variables; a program of a verb with a payload draws nothing (minor 2).
# `evaluations = N` evaluates the case N times in the same world, as one step would: the results must be equal
# (the run-time draw ledger is per evaluation, N6). `events = [{...}, ...]` evaluates an effects program once per
# event binding at one instant, sharing the ledger across them (verb programs are never re-evaluated, r4-2); a
# draw in an effects program must key on `actor` or `target`, so distinct events draw independently.
# `extra_reads` (a table column -> neutral value) and `extra_sends` give a case a variant of its declaring
# system (§7.4), used to show what a spec change would accept (open question Q7 of the spec).
# A world may be generated instead of listed: `[worlds.<name>.fan]` with `fanout`, `depth`, optional
# `dead_leaves` and `generation_days` (default 10,800) builds the regular tree that effect_ref.fan_rows
# documents (person 1 the root, breadth-first ids, the father of i >= 2 is (i - 2) div fanout + 1, every
# person male with an unknown mother, one generation per level; with dead_leaves the last generation died a
# day ago and is compacted: life-course rows only). The Rust test builds the same rows from the same table.

language = "effect_language_v0"
version = "0.5.1"
spec = "specs/registry/effect_language_v0.md"

# ============================================================================= the Registry slice (§7.4)
[registry]
effect_language_version = "0.5.1"

# Every enum declares its default: the value a missing read yields (minor 2); it is not the first value by position.
[registry.enums]
sex               = { values = ["male", "female"], default = "male" }
death_cause       = { values = ["none", "natural", "murder", "battle", "execution", "accident"], default = "none" }   # M2 0.2.2 (frozen): person.death_cause and life_course.death_cause share it (minor 2)
vocations         = { values = ["none", "holy_orders", "mercenary", "household"], default = "none" }
title_tiers       = { values = ["sovereign", "major", "minor"], default = "minor" }
office_kinds      = { values = ["chancellor", "marshal", "steward", "spymaster", "chaplain"], default = "chancellor" }
title_state       = { values = ["held", "awaiting", "interregnum"], default = "held" }
claim_status      = { values = ["active", "realised", "renounced", "void"], default = "void" }
artifact_state    = { values = ["borne", "placed", "lost", "destroyed"], default = "lost" }
vow_status        = { values = ["active", "fulfilled", "broken", "void"], default = "void" }
vow_kinds         = { values = ["AVENGE_KIN", "RECOVER_RELIC", "DESTROY_RELIC", "PROTECT", "CLAIM_TITLE", "PILGRIMAGE", "GRUDGE"], default = "GRUDGE" }
opinion_modifiers = { values = ["KIN_HARMED_BY", "PASSED_OVER", "DEPOSED_BY", "CLAIM_PRESSED_BY", "FEUD_WITH", "MARRIED_TO", "GRANTED_BY", "DESPAIR_PACT_WITH", "VOW_BROKEN_BY", "VOW_FULFILLED_BY"], default = "KIN_HARMED_BY" }
succession_laws   = { values = ["primogeniture", "ultimogeniture", "seniority", "partition", "elective", "tanistry", "sortition"], default = "primogeniture" }
overlays          = { values = ["paranoia", "filial_piety", "despair", "hubris", "corruption", "dragon_sympathy"], default = "paranoia" }
region_conditions = { values = ["normal", "famine", "siege", "war"], default = "normal" }

[registry.entities]
kinds = ["person", "life_course", "tenure", "title", "office", "claim", "house", "household", "polity", "artifact", "vow", "region", "mind"]   # household: M4's (P1b), a command parameter kind only
keys = { life_course = "person_id" }   # the log's rows are keyed by person_id, not by their row id (M7)

# Columns as the system specs declare them ([[owns]]), with language types: bool | int | q8_8 | q16_16 |
# enum (+ enum) | ref (+ ref). Spec storage types map as u64/i64/u32/u16/u8 -> int, a "<Kind>Id" u64 -> ref.
# `key` is the entity kind a read takes when it is not the table's own: the life-course log is read by person.
[registry.columns]
"person.alive"       = { entity = "person", type = "bool", plane = "A", owner = "M2.demography" }
"person.sex"         = { entity = "person", type = "enum", enum = "sex", plane = "A", owner = "M2.demography" }
"person.birth_tick"  = { entity = "person", type = "int", plane = "A", owner = "M2.demography" }
"person.death_tick"  = { entity = "person", type = "int", plane = "A", owner = "M2.demography" }
"person.death_cause" = { entity = "person", type = "enum", enum = "death_cause", plane = "A", owner = "M2.demography" }
"person.mother"      = { entity = "person", type = "ref", ref = "person", plane = "A", owner = "M2.demography" }
"person.father"      = { entity = "person", type = "ref", ref = "person", plane = "A", owner = "M2.demography" }
"person.spouse"      = { entity = "person", type = "ref", ref = "person", plane = "A", owner = "M2.demography" }
"person.house"       = { entity = "person", type = "ref", ref = "house", plane = "A", owner = "M7.dynasty" }
"person.vocation"    = { entity = "person", type = "enum", enum = "vocations", plane = "A", owner = "M7.dynasty" }
"person.named"       = { entity = "person", type = "bool", plane = "A", owner = "T1.minds" }
"person.residence"   = { entity = "person", type = "ref", ref = "region", plane = "A", owner = "S3.migration" }
"life_course.person_id" = { entity = "life_course", key = "person", type = "ref", ref = "person", plane = "A", owner = "M2.demography" }   # the log keeps the dead
"life_course.mother" = { entity = "life_course", key = "person", type = "ref", ref = "person", plane = "A", owner = "M2.demography" }
"life_course.father" = { entity = "life_course", key = "person", type = "ref", ref = "person", plane = "A", owner = "M2.demography" }
"life_course.birth_tick" = { entity = "life_course", key = "person", type = "int", plane = "A", owner = "M2.demography" }
"life_course.sex"    = { entity = "life_course", key = "person", type = "enum", enum = "sex", plane = "A", owner = "M2.demography" }   # REV-P1a NEW-7
"life_course.death_cause" = { entity = "life_course", key = "person", type = "enum", enum = "death_cause", plane = "A", owner = "M2.demography" }   # PR #37 (Q7)
# The tenure log (B3): M7's append-only record of who held which title, one row per tenure; `end` is i64::MAX while held.
"tenure.title"       = { entity = "tenure", type = "ref", ref = "title", plane = "A", owner = "M7.dynasty" }
"tenure.holder"      = { entity = "tenure", type = "ref", ref = "person", plane = "A", owner = "M7.dynasty" }
"tenure.start"       = { entity = "tenure", type = "int", plane = "A", owner = "M7.dynasty" }
"tenure.end"         = { entity = "tenure", type = "int", plane = "A", owner = "M7.dynasty" }
"title.tier"         = { entity = "title", type = "enum", enum = "title_tiers", plane = "A", owner = "M7.dynasty" }
"title.liege"        = { entity = "title", type = "ref", ref = "title", plane = "A", owner = "M7.dynasty" }
"title.polity"       = { entity = "title", type = "ref", ref = "polity", plane = "A", owner = "M7.dynasty" }
"title.law"          = { entity = "title", type = "enum", enum = "succession_laws", plane = "A", owner = "M7.dynasty" }
"title.holder"       = { entity = "title", type = "ref", ref = "person", plane = "A", owner = "M7.dynasty" }
"title.state"        = { entity = "title", type = "enum", enum = "title_state", plane = "A", owner = "M7.dynasty" }
"title.held_since"   = { entity = "title", type = "int", plane = "A", owner = "M7.dynasty" }
"title.regent"       = { entity = "title", type = "ref", ref = "person", plane = "A", owner = "M7.dynasty" }
"office.title"       = { entity = "office", type = "ref", ref = "title", plane = "A", owner = "M7.dynasty" }
"office.kind"        = { entity = "office", type = "enum", enum = "office_kinds", plane = "A", owner = "M7.dynasty" }
"office.holder"      = { entity = "office", type = "ref", ref = "person", plane = "A", owner = "M7.dynasty" }
"claim.claimant"     = { entity = "claim", type = "ref", ref = "person", plane = "A", owner = "M7.dynasty" }
"claim.title"        = { entity = "claim", type = "ref", ref = "title", plane = "A", owner = "M7.dynasty" }
"claim.status"       = { entity = "claim", type = "enum", enum = "claim_status", plane = "A", owner = "M7.dynasty" }
"claim.pressed"      = { entity = "claim", type = "bool", plane = "A", owner = "M7.dynasty" }
"polity.exec_constraint" = { entity = "polity", type = "q8_8", plane = "A", owner = "M6.polity" }
"region.conditions"  = { entity = "region", type = "enum", enum = "region_conditions", plane = "A", owner = "M6.polity" }
"artifact.bearer"    = { entity = "artifact", type = "ref", ref = "person", plane = "A", owner = "S6.artifacts" }
"artifact.state"     = { entity = "artifact", type = "enum", enum = "artifact_state", plane = "A", owner = "S6.artifacts" }
"artifact.location"  = { entity = "artifact", type = "ref", ref = "region", plane = "A", owner = "S6.artifacts" }
"artifact.exposure"  = { entity = "artifact", type = "q16_16", plane = "A", owner = "S6.artifacts" }
"artifact.charge"    = { entity = "artifact", type = "q8_8", plane = "A", owner = "S6.artifacts" }
"vow.vower"          = { entity = "vow", type = "ref", ref = "person", plane = "A", owner = "S7.vows" }
"vow.kind"           = { entity = "vow", type = "enum", enum = "vow_kinds", plane = "A", owner = "S7.vows" }
"vow.target"         = { entity = "vow", type = "int", plane = "A", owner = "S7.vows" }
"vow.status"         = { entity = "vow", type = "enum", enum = "vow_status", plane = "A", owner = "S7.vows" }
"vow.priority"       = { entity = "vow", type = "q8_8", plane = "A", owner = "S7.vows" }
"vow.conflict"       = { entity = "vow", type = "q8_8", plane = "A", owner = "S7.vows" }
"mind.stress"        = { entity = "mind", type = "q8_8", plane = "A", owner = "T1.minds" }
"mind.conscientiousness" = { entity = "mind", type = "q8_8", plane = "A", owner = "T1.minds" }
"mind.honesty_humility"  = { entity = "mind", type = "q8_8", plane = "A", owner = "T1.minds" }
"knowledge.knows"    = { entity = "knowledge", type = "bool", plane = "A", owner = "T1.minds" }
"pin.flag"           = { entity = "person", type = "bool", plane = "B", owner = "console" }   # a plane-B column (ADR-0024)

# The declaring systems: reads, sends, RNG purposes and parameter bounds from the frozen specs on main (M7 0.3.4,
# T1 0.3.3, M2 0.2.2; minor 1, r4-5) and the Registry. `neutral` is the machine-readable `neutral` field of each `[[reads]]` entry (minor 5):
# every read of a column another system owns carries one, whatever the world registers, and the checker rejects
# a program's read without one (E_NO_NEUTRAL); the evaluator substitutes it only when the owner is absent (NEW-4).
[registry.systems."M2.demography"]
reads = []
sends = []
rng = ["death_time"]
params = { e0 = [20.0, 85.0] }

[registry.systems."M7.dynasty"]
reads = ["person.alive", "person.death_cause", "person.death_tick", "person.birth_tick", "person.sex", "person.mother", "person.father", "life_course.person_id", "life_course.mother", "life_course.father", "life_course.birth_tick", "life_course.sex", "person.named", "vow.vower", "vow.status", "polity.exec_constraint"]   # life_course.*: same_instant (Q11, closed)
neutral = { "person.alive" = false, "person.death_cause" = "none", "person.death_tick" = 0, "person.birth_tick" = 0, "person.sex" = "male", "person.mother" = 0, "person.father" = 0, "life_course.person_id" = 0, "life_course.mother" = 0, "life_course.father" = 0, "life_course.birth_tick" = 0, "life_course.sex" = "male", "person.named" = false, "vow.vower" = 0, "vow.status" = "void", "polity.exec_constraint" = "0.0" }   # M6: exec_constraint = 0 (m_ec = 1); S7: no active vow
sends = [
  { command = "ScheduleDeath", target = "M2.demography" },
  { command = "Promote", target = "T1.minds" },
  { command = "Demote", target = "T1.minds" },
  { command = "OpinionModifier", target = "T1.minds" },
  { command = "TransferHoldings", target = "M4.economy" },   # property inheritance, P1b: M4 is absent in the P1a world
]
rng = ["exit_murder", "exit_deposition", "exit_day", "murder_culprit", "arbitration_tie", "regrant_tie", "sortition", "interregnum_delay", "vocation"]   # M7 0.3.4: sortition keyed (candidate, k = the title, t)
params = { murder_hazard_base = [0.001, 0.03], deposition_hazard_ref = [0.01, 0.05], primogeniture_hr = [0.2, 0.55], seniority_hr = [1.3, 2.6], predecessor_killed_or = [1.5, 3.5], predecessor_deposed_hr = [1.3, 2.0], exec_constraint_hr = [0.3, 1.0], majority_age = [12.0, 21.0], arb_legal_weight = [0.0, 1.0], arb_claim_weight = [0.0, 1.0], arb_military_weight = [0.0, 1.0], arb_treasury_weight = [0.0, 1.0], contest_margin = [0.0, 1.0], interregnum_max_days = [7, 730], dormancy_degrees = [1, 6], vocation_holy_orders = [0.0, 0.6], vocation_mercenary = [0.0, 0.6] }

[registry.systems."T1.minds"]
# Exactly the reads and sends T1 0.3.3 declares (minor 1, r4-3), restricted to the columns this slice carries.
reads = ["person.alive", "person.death_tick", "person.birth_tick", "person.sex", "person.mother", "person.father", "life_course.person_id", "life_course.mother", "life_course.father", "person.spouse", "title.holder", "title.liege", "title.tier", "title.regent", "office.holder", "office.title", "claim.claimant", "claim.title", "claim.status", "vow.vower", "vow.conflict", "artifact.bearer", "artifact.location"]
neutral = { "person.alive" = false, "person.death_tick" = 0, "person.birth_tick" = 0, "person.sex" = "male", "person.mother" = 0, "person.father" = 0, "life_course.person_id" = 0, "life_course.mother" = 0, "life_course.father" = 0, "person.spouse" = 0, "title.holder" = 0, "title.liege" = 0, "title.tier" = "minor", "title.regent" = 0, "office.holder" = 0, "office.title" = 0, "claim.claimant" = 0, "claim.title" = 0, "claim.status" = "void", "vow.vower" = 0, "vow.conflict" = "0.0", "artifact.bearer" = 0, "artifact.location" = 0 }
sends = [
  { command = "Marry", target = "M2.demography" },
  { command = "ScheduleDeath", target = "M2.demography" },
  { command = "OpinionModifier", target = "T1.minds" },   # the DESPAIR_PACT self-send (Q6 closed)
  { command = "PetitionSeat", target = "M7.dynasty" },
  { command = "PressClaim", target = "M7.dynasty" },
  { command = "RenounceClaim", target = "M7.dynasty" },
  { command = "Resign", target = "M7.dynasty" },
  { command = "SwearVow", target = "S7.vows" },
  { command = "Transfer", target = "S6.artifacts" },
  { command = "Search", target = "S6.artifacts" },
  { command = "Destroy", target = "S6.artifacts" },
  { command = "BurnHoldings", target = "M4.economy" },   # HOLDINGS_BURNED (P1b): T1 0.3.3 declares it; M4 is absent in the P1a world
]
rng = ["trait_draw", "poll_jitter", "iaus_select", "action_order", "break_delay", "break_act", "break_outcome", "attack_outcome"]
params = { stress_threshold = [50.0, 95.0], stress_decay = [0.0, 10.0], vow_conflict_gain = [0.0, 20.0], break_delay_max_days = [1, 90], grief_gain = [0.0, 60.0], grief_instant_cap = [5.0, 60.0], loyalty_conflict_gain = [0.0, 20.0], dissonance_gain = [0.0, 30.0], break_refractory_days = [30, 1825], attempt_success = [0.05, 0.6], trait_sd = [15.0, 50.0], iaus_top_k = [1, 5], interrupt_daily_cap = [1, 4], thought_cap = [0.0, 50.0], thought_decay = [0.0, 10.0], marriage_min_age = [12.0, 20.0] }

[registry.systems."S6.artifacts"]
reads = ["person.alive", "person.residence", "title.holder", "mind.honesty_humility"]
neutral = { "person.alive" = false, "person.residence" = 0, "title.holder" = 0, "mind.honesty_humility" = "0.0" }
sends = [{ command = "ApplyInfluence", target = "T1.minds" }]
rng = ["loss_on_death", "theft_outcome", "search_find"]
params = { influence_base = [0.0, 0.05], resist_slope = [0.0, 1.0], corruption_threshold = [0.2, 0.9], rumour_max_hops = [1, 20], rumour_decay_years = [5, 200], find_chance = [0.0, 0.2], theft_success = [0.05, 0.6], loss_on_death = [0.0, 0.5] }

[registry.systems."S7.vows"]
reads = ["person.alive", "artifact.bearer", "artifact.state", "title.holder", "knowledge.knows", "mind.conscientiousness", "region.conditions", "life_course.death_cause"]   # life_course.death_cause: S7 declares it in PR #32's next round (Q7)
neutral = { "person.alive" = false, "artifact.bearer" = 0, "artifact.state" = "lost", "title.holder" = 0, "knowledge.knows" = false, "mind.conscientiousness" = "0.0", "region.conditions" = "normal", "life_course.death_cause" = "none" }   # M6 absent in P1a: normal conditions
sends = [
  { command = "AgendaGoal", target = "T1.minds" },
  { command = "ClearGoal", target = "T1.minds" },
  { command = "OpinionModifier", target = "T1.minds" },
  { command = "ApplyThought", target = "T1.minds" },
]
rng = ["grudge_form", "break_mode"]
params = { vow_priority_base = [0.05, 0.5], vow_priority_cap = [0.1, 0.8], max_active_vows = [1, 8], strain_rate = [0.0, 0.1], strain_decay = [0.0, 0.1], resolve_base = [0.2, 1.0], resolve_slope = [0.0, 0.9], grudge_on_harm = [0.0, 1.0], broken_vow_opinion = [-60.0, 0.0] }

# A fixture system with deliberately wrong declarations, for the rejection cases only.
[registry.systems."X.fixture"]
reads = ["pin.flag", "person.alive", "polity.exec_constraint", "title.holder"]   # exec_constraint and title.holder without a neutral value: E_NO_NEUTRAL
neutral = { "person.alive" = false }
sends = [{ command = "PressClaim", target = "M2.demography" }]
rng = ["sortition"]
params = { tiny = [0.000001, 1.0] }   # a lower bound that rounds to 0 bits in q16_16 (M1)

# Command signatures (§7.3, the new [commands] section): owner, the name of the queue-key person, parameters.
# A parameter of type `event` (cause_event, source_event) takes the verb's own `event` or `none`, nothing else (N3).
[registry.commands]
# ScheduleDeath and Marry are M2 0.2.2's [[applies]] payloads (M6): the lint checks them in both directions.
ScheduleDeath    = { owner = "M2.demography", person = "victim", params = [{ name = "tick", type = "int" }, { name = "cause", type = "enum", enum = "death_cause" }, { name = "culprit", type = "ref", ref = "person" }, { name = "cause_event", type = "event" }] }
Marry            = { owner = "M2.demography", person = "a", params = [{ name = "b", type = "ref", ref = "person" }, { name = "tick", type = "int" }] }
Promote          = { owner = "T1.minds", person = "person", params = [] }
Demote           = { owner = "T1.minds", person = "person", params = [] }
OpinionModifier  = { owner = "T1.minds", person = "holder", params = [{ name = "about", type = "ref", ref = "person" }, { name = "kind", type = "enum", enum = "opinion_modifiers" }, { name = "magnitude", type = "q8_8" }, { name = "source_event", type = "event" }] }   # T1's and M7's payload
AgendaGoal       = { owner = "T1.minds", person = "holder", params = [{ name = "vow", type = "ref", ref = "vow" }, { name = "kind", type = "enum", enum = "vow_kinds" }, { name = "target", type = "int" }, { name = "priority", type = "q8_8" }] }
ClearGoal        = { owner = "T1.minds", person = "holder", params = [{ name = "vow", type = "ref", ref = "vow" }] }
ApplyThought     = { owner = "T1.minds", person = "holder", params = [{ name = "overlay", type = "enum", enum = "overlays" }, { name = "delta", type = "q8_8" }, { name = "source_event", type = "event" }] }   # T1's [[applies]] (M6)
ApplyInfluence   = { owner = "T1.minds", person = "bearer", params = [{ name = "overlay", type = "enum", enum = "overlays" }, { name = "delta", type = "q16_16" }] }
TransferHoldings = { owner = "M4.economy", person = "heir", params = [] }
BurnHoldings     = { owner = "M4.economy", person = "actor", params = [{ name = "household", type = "ref", ref = "household" }, { name = "cause_event", type = "event" }] }   # T1 0.3.3's [[commands]] payload { actor, household, cause_event } (r4-3)
PetitionSeat     = { owner = "M7.dynasty", person = "person", params = [{ name = "target", type = "int" }] }
PressClaim       = { owner = "M7.dynasty", person = "claimant", params = [{ name = "claim", type = "ref", ref = "claim" }] }
RenounceClaim    = { owner = "M7.dynasty", person = "claimant", params = [{ name = "claim", type = "ref", ref = "claim" }] }
Resign           = { owner = "M7.dynasty", person = "person", params = [{ name = "office", type = "ref", ref = "office" }] }
SwearVow         = { owner = "S7.vows", person = "vower", params = [{ name = "kind", type = "enum", enum = "vow_kinds" }, { name = "target", type = "int" }, { name = "public", type = "bool" }] }
Transfer         = { owner = "S6.artifacts", person = "from", params = [{ name = "artifact", type = "ref", ref = "artifact" }, { name = "to", type = "ref", ref = "person" }] }
Search           = { owner = "S6.artifacts", person = "seeker", params = [{ name = "artifact", type = "ref", ref = "artifact" }] }
Destroy          = { owner = "S6.artifacts", person = "actor", params = [{ name = "artifact", type = "ref", ref = "artifact" }] }

# The registered systems of the P1a world: no M4.economy (P1b).
[registry.registered]
systems = ["M2.demography", "M7.dynasty", "T1.minds", "S6.artifacts", "S7.vows"]

# ----------------------------------------------------------------------------- the laws (spec §8)
# Lineage laws (B2, M8): candidates are the lineage of the holder (the descendants of its ancestors up to height 3,
# the dead without a living line pruned, N2); `not descends(holder, x)` keeps the holder's ancestors out (D5, N1;
# round 4 minor 1: the `common` form leaked under uncle-niece marriage); the title-blood rule (B3, N5) keeps a
# collateral only if it descends from the holder or from one of the title's last sixteen holders
# (`holders_of(title, 16)`, the tenure log, which worldgen back-fills); siblings order by birth tick, ties by
# person_id (the host's final tie-break), so twins' keys are equal.
[registry.programs.succession_laws.primogeniture]
candidates = 'lineage(holder, 3)'
eligible   = 'person.alive(x) and x != holder and not descends(holder, x) and (descends(x, holder) or any(h in holders_of(title, 16): descends(x, h)))'
order      = '(up(x, holder), [(life_course.sex(y) == sex.female, life_course.birth_tick(y)) for y in line(common(x, holder), x)])'

[registry.programs.succession_laws.primogeniture_open]   # the unrestricted variant (no title-blood rule): for the director (D14)
candidates = 'lineage(holder, 3)'
eligible   = 'person.alive(x) and x != holder and not descends(holder, x)'
order      = '(up(x, holder), [(life_course.sex(y) == sex.female, life_course.birth_tick(y)) for y in line(common(x, holder), x)])'

[registry.programs.succession_laws.ultimogeniture]
candidates = 'lineage(holder, 3)'
eligible   = 'person.alive(x) and x != holder and not descends(holder, x) and (descends(x, holder) or any(h in holders_of(title, 16): descends(x, h)))'
order      = '(up(x, holder), [(life_course.sex(y) == sex.female, -life_course.birth_tick(y)) for y in line(common(x, holder), x)])'

[registry.programs.succession_laws.seniority]
candidates = 'lineage(holder, 3)'
eligible   = 'person.alive(x) and x != holder and not descends(holder, x) and life_course.sex(x) == sex.male and up_agnatic(x, holder) <= 3 and (descends(x, holder) or any(h in holders_of(title, 16): descends(x, h)))'
order      = '(count(y in line_agnatic(common_agnatic(x, holder), x)) - up_agnatic(x, holder), life_course.birth_tick(x))'

[registry.programs.succession_laws.partition]
candidates = 'children(holder)'
eligible   = 'person.alive(x) and x != holder'
order      = '(life_course.sex(x) == sex.female, life_course.birth_tick(x))'

[registry.programs.succession_laws.elective]
candidates = 'court(title)'
eligible   = 'person.alive(x) and x != holder'
order      = '(min(t in titles(x): ordinal(title.tier(t)) else 3), life_course.birth_tick(x))'

[registry.programs.succession_laws.tanistry]
candidates = 'lineage(holder, 3)'
eligible   = 'person.alive(x) and x != holder and not descends(holder, x) and life_course.sex(x) == sex.male and up_agnatic(x, holder) <= 3 and count(y in line_agnatic(common_agnatic(x, holder), x)) <= 3 and (descends(x, holder) or any(h in holders_of(title, 16): descends(x, h))) and now - life_course.birth_tick(x) >= floor(params.majority_age * q16(calendar.days_per_year)) * calendar.minutes_per_day'
order      = 'life_course.birth_tick(x)'

# sortition: 05.5 §2.1's rng_permutation(purpose = "sortition") is this order plus the host's PersonId tie-break: ascending
# draw keyed (person = the candidate, k = the title, t = the arbitration instant), ties in ascending PersonId (minor 4).
[registry.programs.succession_laws.sortition]
candidates = 'court(title)'
eligible   = 'person.alive(x) and x != holder'
order      = 'draw(sortition, x, title)'

[registry.programs.succession_laws.sortition_lots_then_age]   # a data-only variant using the same draw site: two laws never run in one step for one title (minor 5)
candidates = 'court(title)'
eligible   = 'person.alive(x) and x != holder'
order      = '(draw(sortition, x, title), life_course.birth_tick(x))'

# Data-only extensions (§8): variants are Registry edits, not code.
[registry.programs.succession_laws.absolute_primogeniture]
candidates = 'lineage(holder, 3)'
eligible   = 'person.alive(x) and x != holder and not descends(holder, x) and (descends(x, holder) or any(h in holders_of(title, 16): descends(x, h)))'
order      = '(up(x, holder), [life_course.birth_tick(y) for y in line(common(x, holder), x)])'

[registry.programs.succession_laws.agnatic_primogeniture]
candidates = 'lineage(holder, 3)'
eligible   = 'person.alive(x) and x != holder and not descends(holder, x) and life_course.sex(x) == sex.male and up_agnatic(x, holder) <= 3 and (descends(x, holder) or any(h in holders_of(title, 16): descends(x, h)))'
order      = '(up_agnatic(x, holder), [life_course.birth_tick(y) for y in line_agnatic(common_agnatic(x, holder), x)])'

[registry.programs.succession_laws.primogeniture_lay]   # open question Q1: holy orders excluded by the law itself
candidates = 'lineage(holder, 3)'
eligible   = 'person.alive(x) and x != holder and not descends(holder, x) and (descends(x, holder) or any(h in holders_of(title, 16): descends(x, h))) and person.vocation(x) != vocations.holy_orders'
order      = '(up(x, holder), [(life_course.sex(y) == sex.female, life_course.birth_tick(y)) for y in line(common(x, holder), x)])'

# ============================================================================= the fixture world
# House Khorvath at the instant High King Halvard (7) is murdered: `now` = 0; the tree gives ages in days before it,
# the rows hold minutes (days x 1440).
#
#   Aldric (1, m, dead) = Bera (2, f, dead)
#   ├── Cedric (3, m, dead -2000) = Dagny (4, f)        ├── Freya (6, f)        └── Edmund (5, m)
#   │   ├── HALVARD (7, m, dies now, murdered) = Liv (11, f)                      ├── Sif (17, f)
#   │   │   ├── Mara (12, f, -8500)                                               └── Ulf (19, m, holy orders)
#   │   │   ├── Kell (10, m, -8000) ── Thora (18, f, -300)
#   │   │   └── Nils (13, m, dead -100) = Pia (15, f) ── Orm (14, m, -400)
#   │   │   └── Brynja (25, f, -9000, dead -500; the eldest child) ── Sten (26, m, -1000; father unknown)
#   │   ├── Ingrid (8, f, -13500) ── Wulf (21, m, -9000; father unknown)
#   │   └── Jorund (9, m, -12500) ── Hakon (23, m, -5000, dead -800) ── Ivar (24, m, -200)
#   │                             ── Ragnar (16, m, -3000) and Rolf (27, m, -3000): twins
#   │                             ── Varg (20, m, -1500)
#   └── Yrsa (22, f, -11000): Dagny's daughter by an unknown father (a half-sister of Halvard through the mother)
#
# The ledger (worlds.dynasty.person) holds the living and Halvard, who dies at this instant; Aldric, Bera, Cedric,
# Nils, Hakon and Brynja died earlier and are compacted (SPR-011 ruling 5), so they exist only in the life-course log.
# Titles: 100 the sovereign seat (holder 7), its vassals 101 (major, Edmund), 102 (minor, Jorund), 103 (minor,
# Freya); 104 a vacant vassal of 101. Offices of 100: marshal Ragnar (16), steward Liv (11), chaplain Ulf (19),
# spymaster vacant; of 101: steward Sif (17). Claims: 300 Jorund on 100 (active, pressed), 301 Jorund on 101
# (renounced), 302 Edmund on 100 (active). Artifacts: 400 borne by Kell, 401 destroyed. Vows: 500 Edmund
# CLAIM_TITLE 100; 501 Ragnar AVENGE_KIN against Halvard. The tenure log (B3): 100 Aldric then Halvard; 101
# Aldric then Edmund; 102 Jorund; 103 Freya; 104 Nils, ended at his death (vacant since).
[worlds.dynasty]
now = 0            # SimTime minutes from the epoch (B1); every tick below is in minutes, 1440 to a day
days_per_year = 360

