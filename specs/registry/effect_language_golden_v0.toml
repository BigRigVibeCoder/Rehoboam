system = "M7.dynasty"
text = 'q8(0) + 0.005859375'
expect = "q8_8:2"
[[case]]
id = "lit_dec_tie_to_even_q16"
kind = "expr"
system = "M7.dynasty"
text = '0.00000762939453125 + 0.0'
expect = "q16_16:0"
[[case]]
id = "lit_dec_tie_to_even_q16_odd"
kind = "expr"
system = "M7.dynasty"
text = '0.00002288818359375 + 0.0'
expect = "q16_16:2"
[[case]]
id = "lit_dec_with_int_literal"
kind = "expr"
system = "M7.dynasty"
text = '1.5 + 1'
expect = "q16_16:163840"
[[case]]
id = "lit_int_max"
kind = "expr"
system = "M7.dynasty"
text = '9223372036854775807'
expect = "int:9223372036854775807"
[[case]]
id = "lit_int_too_large"
kind = "expr"
system = "M7.dynasty"
