"sortition/person:19/2"  = "281474976710656"      # 2^48: the first that misses it
"act_outcome/person:9/0" = "42"
"act_outcome/person:16/0" = "9223372036854775808"  # 2^63: u / 2^64 = 0.5, misses p = 0.3

