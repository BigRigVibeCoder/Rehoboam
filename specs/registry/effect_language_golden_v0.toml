expect = "error:E_TYPE"
[[case]]
id = "mod_of_literals_beside_a_decimal_is_e_type"
kind = "expr"
system = "M7.dynasty"
text = '0.5 + 7 mod 2'
expect = "error:E_TYPE"
[[case]]
id = "mod_of_literals_under_a_decimal_difference_is_e_type"
