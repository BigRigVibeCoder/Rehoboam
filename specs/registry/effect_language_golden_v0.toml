# ----------------------------------------------------------------------------- erratum 0.5.1 (Architect, 2026-10-18)
# A relation is not a value (§3.5): an expression program, an `if` or a key element of relation type is E_TYPE; a
# relation is legal only after `in` and as a `candidates` program. A bodyless `all` takes `where` as its predicate,
# as `any` does (§5.4): true iff every element satisfies it, true on an empty relation. Rows added; none moved.
[[case]]
id = "relation_as_an_expression_program_is_e_type"
kind = "expr"
system = "M7.dynasty"
bind = { x = "person:10" }
text = 'children(x)'
expect = "error:E_TYPE"
[[case]]
id = "relation_typed_if_is_e_type"
kind = "expr"
system = "M7.dynasty"
bind = { x = "person:10" }
text = 'if true then children(x) else children(x)'
expect = "error:E_TYPE"
[[case]]
id = "relation_in_a_key_tuple_is_e_type"
kind = "order"
system = "M7.dynasty"
bind = { x = "person:10" }
text = '(children(x), 1)'
expect = "error:E_TYPE"
[[case]]
id = "all_where_on_an_empty_relation_is_true"   # Thora (18) has no children
kind = "expr"
system = "M7.dynasty"
bind = { x = "person:18" }
text = 'all(y in children(x) where false)'
expect = "bool:true"
[[case]]
id = "all_where_on_a_mixed_relation_is_false"   # Halvard's children: Kell and Mara alive, Nils and Brynja dead and compacted
kind = "expr"
system = "M7.dynasty"
bind = { holder = "person:7" }
text = 'all(y in children(holder) where person.alive(y))'
expect = "bool:false"
missing_reads = 2
[[case]]
id = "all_where_on_an_all_true_relation_is_true"
kind = "expr"
system = "M7.dynasty"
bind = { holder = "person:7" }
text = 'all(y in children(holder) where y != none)'
expect = "bool:true"
# DEF-1 and DEF-2 (Tester, VER-SPR-017-TEST; Architect, 2026-10-18): div and mod demand int operands; a literal under
# them is int whatever the outer context, and their result is a concrete int, so it cannot meet a fixed-point operand.
[[case]]
id = "mod_of_literals_beside_q16_is_e_type"
