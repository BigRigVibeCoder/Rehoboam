# In the births draft's format (specs/systems/next/registry_delta.toml, merged into registry_v0.toml when 0.3.0
# freezes): the next-mode lint lets a delta add parameters and defaults, never change an existing bound or default.
registry_delta_needed = [
  "[systems.\"M2.demography\"] params: add density_capacity = [1, 10000000] (integer) and density_mortality_slope = [0.0, 3.0]; every existing bound unchanged",
  "[systems.\"M2.demography\"] defaults: add density_capacity = 10000000 and density_mortality_slope = 1.0 beside e0, brass_beta, tfr and elite_fertility_mult (a parameter default is C3: SPR-016's class already)",
  "No new verb, role, column or purpose. brass_alpha and eps_m keep their bounds and stay without a default (refused at load; unread) in P1a",
  "manifest_v0.py: the M2 system parameter block accepts the two new names with the Registry's bounds (it validates every system parameter against the Registry, so this follows from the Registry change)",
]

# ----------------------------------------------------------------------------- the seam with births (SPR-015 <-> SPR-016)
[seam]
newborn_first_draw = "Mortality owns it (M10). A child born at a day start inside a month (births F9) is alive at the next Month pulse with age x = t_m - b < D; S8's q covers [x, x + D) and leaves [0, x) without a hazard. M10 closes the gap: for a person with b > t_(m-1) (born since the previous Month pulse; never a founder, whose birth tick is at or before the epoch), q covers [0, x + D): q = 2^32 - l(x + D). SPR-015 runs rung 0's S8 for newborns until SPR-016 merges; closing the gap is part of SPR-016's golden change"
infant_death = "Mortality owns it. A newborn is on M7's infant knots from its first draw: no separate purpose, no draw at the birth. Stillbirth and twins stay in births' not_yet (a birth is always one live child)"
maternal_death = "Not in F1 (births' not_yet: the mother's death is the ordinary schedule). When it comes (F2), it is mortality's: a new purpose maternal_death keyed by (the mother, the birth instant), drawn in apply_birth's instant and applied through apply_death, after the birth timer by births' F10 ordering, so the child is born first. It is not a death_time draw, so the CRN rule of death_time is untouched"
death_path = "apply_death stays the single death path: M13 = S12, then births' H4 (widowhood, headship, pending births and marriages dropped when they fire), whatever hazard produced the death (the schedule, the modifier, a ScheduleDeath command from P1.13)"

# ----------------------------------------------------------------------------- director items raised (D-; the director decides)
[[director_items]]
id = "D-SPR016-1"
question = "The density modifier's form and parameters: a one-sided multiplier on the monthly probability, m_d = 1 + density_mortality_slope max(0, N / density_capacity - 1), capped at 4, with two new M2 Registry parameters (density_capacity, default 10,000,000; density_mortality_slope, default 1). Registry semantics are the director's (docs/13 §1)."
recommendation = "Approve. One-sided because a positive check bites above capacity and the schedule already is the normal-times level; below capacity nothing changes, so the P1a goldens (rungs 0-2, which never exceed the default capacity) do not move for it, and the last survivors of a dying world do not become longer-lived. On the probability rather than on alpha or the hazard because it is exact in integers at one multiply per person-month, while a proportional-hazards form needs exp and ln per person-month (about 36 s per 10k-person millennium, outside the G1a budget) and a level shift would recompute M6-M8 every month. The first-order error against proportional hazards is (m - 1) q / 2 relative: at m = 2 below 1% wherever q < 0.02 per month, which at e0 = 30 excludes only the first two months of life and ages above about 88 (1.4% at 90, 2.1% at 110); at the ceiling m = 4, below 1% for q < 0.0067. The entitlement term keeps R09 §2's own form (a survival factor with eps_m as the exponent), which is cheap because y / y* is per household, not per person."
alternative = "Symmetric: m_d = N / K_cap (R09's toy), which lowers mortality below capacity; it changes every P1a golden as a world dies out and gives a dying household's last member a lower hazard. Or no density term in P1a at all (V-SF-01 then has no brake until M3)."
confidence = "6/10"
[[director_items]]
id = "D-SPR016-2"
question = "brass_alpha as a manifest input: keep it refused in P1a (e0 is the level), or accept exactly one of e0 and brass_alpha per manifest (a tagged level value in the compiled WorldSpec)?"
recommendation = "Keep it refused in P1a. Any (alpha, beta) is reachable through e0 at the given beta (K = exp(2 alpha) is a bijection), the Registry default e0 = 30 then needs no 'unless alpha is set' rule, rh_manifest::compile stays as SPR-011 T-04 built it, and the harness reports alpha = ln(K) / 2 from the schedule's K. Brass's own finding (R12 §9) is that long-run change is in alpha, which P1b applies as era-state shifts on K, not as a manifest number."
alternative = "Accept either, exactly one (WorldSpec level = E0(bits) | Alpha(bits)); the manifest author's choice, at the price of a sum type in the compiled spec and a compile rule for the default."
confidence = "7/10"
[[director_items]]
id = "D-SPR016-3"
question = "The old-age tail: Beard's Perks logistic (R12 §9, p. 59) with both parameters derived from the Brass schedule at 90 (M8), a hard cap at 120, and the compiled e0 kept as the Brass-grid e0 (so rung 0's K is unchanged at beta = 1; the realized e0 of the F1 schedule exceeds it by the tail's life past 100: +0.003 years at e0 = 30, +0.5 at e0 = 85)."
recommendation = "Approve. The research names the logistic and no constants; deriving (a, b) from the schedule's own hazard and log-slope at 90 adds no Registry constant, is continuous in level and in hazard at 90, scales with (alpha, beta), and keeps K identical to rung 0's. SPR-028 reports l(100) / l(90) and the centenarian count, and the R12 batch-3 item checks Thatcher, Kannisto and Vaupel (1998) for the slope b, after which b can become a Registry constant if the derived one is off."
alternative = "Kannisto constants from the literature (b about 0.1 per year, a from a modern level): a research item first, and a tail that does not scale with the schedule's level. Or Gompertz (unbounded, which the research argues against)."
confidence = "6/10"
[[director_items]]
id = "D-SPR016-4"
question = "The infant sub-schedule's shape: Bourgeois-Pichat's biometric law with an endogenous share of 0.15 (32% of the first year's deaths in the first month), as a 13-entry table of constants (specs/demography/infant_sub_schedule.toml) that plane A holds and never recomputes."
recommendation = "Approve as design values, with the R12 batch-3 research item (Bourgeois-Pichat 1951 and a pre-transition neonatal share; the births companion §4 names Coale-Demeny West q0 and q1-4 by e0 as the alternative lookup) that replaces the table if the sources disagree. The table changes the within-year timing only: l(0) = 1 and l(1) are Brass's, so q(0), q(15) and every band stay what rung 0 gives; what moves is which month an infant dies in, which the family annals (SPR-029) and the famine coupling (P1.5a) need to be plausible."
alternative = "Keep rung 0's flat hazard through year 0 (no sub-schedule): simplest, but 05.1 §3 and R12 §9 both ask for the sub-schedule, and a flat first year puts only 8% of infant deaths in the first month. Or the Coale-Demeny lookup by e0, which needs the West tables in research/ first."
confidence = "6/10"

# ----------------------------------------------------------------------------- the algorithm
[algorithm.mortality_f1]
# Stated as [algorithm.mortality_rung0] is. Every quantity is an exact integer; every width is the smallest standard
# width that holds every intermediate; every division is rounded exactly once, as stated. The only non-rational
# functions are the exp and ln of 05.1 §6 item 4 (v1.10): integer procedures with a stated error bound, evaluated at
# construction on fixed grids (and, from P1.5a, once per household per month), never per person per month. The exact
# reference (specs/demography/selftest_m2_f1_mortality.py) reproduces every step bit for bit; SPR-016's
# bin/gen_m2_reference.py ports it and generates the golden vectors the crate replays.
# Rung 0 is the special case beta = 1, N <= K_cap, no newborn, ages 1 to 90: there M3-M6 are S3-S6 bit for bit (the
# odds grid is the exact rational one, by pow(x, 1) = x), M9 is S7 on the same grid points, M10 is S8 and M11 is the
# identity. F1 differs from rung 0 exactly (i) below age 1, where M7 replaces the linear year 0 (l(0) and l(1)
# unchanged) and M10 starts a newborn's hazard at its birth, (ii) above 90, where M8 replaces the grid points 92.5 to
# 100 and the certain death at 100 with the logistic tail and a certain death at 120, and (iii) above the capacity,
# where M11 raises q. Where the P1a goldens move when SPR-016 merges: a founder under one year old, a child born
# since SPR-015 (its first months) or a person who lives past 90 draws against a different q; nothing else (SPR-016 is
# C3 and announces the change with its evidence).
version = "m2-f1-v1"
steps = [
  "M0 Rounding and the transcendentals. rhe(n / d) as S0 (n signed, d > 0, ties to even). exp(y) and ln(n / d) are 05.1 §6 item 4's functions on Q32_32 (an i64 with 32 fraction bits; results within 3/4 ulp, faithful), with their refusals: a refusal during construction is a load error naming the step. No float, no truncating cast, no other rounding.",
  "M1 Standard. As S1: h_i = 2 a_i (u8) and s_i = 10^4 ls_i (u16) for the 71 grid ages. The interior odds O_i = (10^4 - s_i) / s_i, i = 1..69, exact rationals; their logarithms lambda_i = ln_ratio(10^4 - s_i, s_i) (Q32_32 bits, i64), 69 compiled-in constants that the reference pins (lambda_1 = ln(0.1766...) < 0, lambda_69 = ln 9999 = 9.2102...).",
  "M2 Parameters. E = e0 bits (Q16_16, as S2; the Registry default 30 when the manifest sets none). B = brass_beta bits (Q16_16), in the Registry bounds [0.6, 1.65] (bits 39322 to 108134, rounded half to even from the literal; the manifest validator checks the decimal against the bounds). brass_alpha set in a manifest is refused at load by name (D-SPR016-2). K_cap = density_capacity (a count, u64; default 10,000,000) and S_d = density_mortality_slope bits (Q16_16; default 1.0 = 65536). eps_m is not read (M11). rh_manifest::compile fills each of these from the manifest, else from the Registry default, as SPR-011 T-04 does; tfr and elite_fertility_mult are births' ([algorithm.fertility_f1] F2, F3); eps_f is unread until P1.5a.",
  "M3 Odds grid. For i = 1..69: if B = 65536 (beta exactly 1) then W_i is the exact rational O_i and M4 uses its rational form (pow(x, 1) = x exactly, as IEEE 754's pow: the rung-0 schedule is reproduced bit for bit); otherwise w_i = exp(rhe(B lambda_i / 2^16)) (the product has 48 fraction bits and is rounded once to 32; exp's argument is in [-1.1, 15.2] inside the bounds, within its domain y <= 16), a u64 with 32 fraction bits (w_i < 2^54: W_69 <= 9999^1.65 < 4 x 10^6). w_0 = 0 and w_70 = infinity stand for l = 1 and l = 0.",
  "M4 Survivors at a grid age for a level k (K = k / 2^32, k a u64 in [0, 2^40]). L_0(k) = 2^32; L_70(k) = 0; for i = 1..69: rational form (beta = 1) L_i(k) = rhe(s_i 2^64 / (s_i 2^32 + k (10^4 - s_i))) (S3 verbatim; numerator < 2^78, denominator < 2^54); power form L_i(k) = rhe(2^96 / (2^64 + k w_i)) (numerator 2^96, k w_i < 2^94, denominator < 2^95: u128). Both are 2^32 / (1 + K W_i) rounded once; L_i(k) is in [0, 2^32], non-increasing in i and in k.",
  "M5 Level from e0. The trapezoid T(k) over the 71 grid points (S4 verbatim, with M4's L_i(k)) and the 40-step bisection (S5 verbatim): K = the largest k with T(k) >= E 2^18. The infant knots and the tail do not enter the bisection: the compiled e0 is the Brass e0 of (K, beta) on the standard grid, so at beta = 1 K is rung 0's K exactly (the seven check values of mortality_rung0 hold). The F1 schedule's own trapezoid e0 differs from E by the infant redistribution (-0.06 years at e0 = 30) and by the tail's life past Brass's l(100) = 0 (+0.003 years at e0 = 30, +0.5 at e0 = 85); the reference measures it (check 8). Bracketing holds at every corner of the bounds (check 3): T(1) / 2^34 > 85 and T(2^40) / 2^34 < 20 years for beta in [0.6, 1.65]. Computed once, at construction.",
  "M6 Brass schedule. L_i = L_i(K) for i = 0..70 (S6 verbatim).",
  "M7 Infant sub-schedule. Thirteen knots at ages j Y / 12 minutes, j = 0..12 (Y the calendar's minutes per year, divisible by 12 for both calendars: 43200 and 43800 per knot). q0 = 2^32 - L_1 (the year's Prob32). c_j = cumulative_share_q16[j] from specs/demography/infant_sub_schedule.toml (13 u16 constants: c_0 = 0, c_12 = 65536, non-decreasing; Bourgeois-Pichat's biometric law with endogenous share 0.15, a design table, D-SPR016-4). I_j = 2^32 - rhe(q0 c_j / 2^16): I_0 = 2^32, I_12 = L_1 exactly, non-increasing. The grid's age-0 and age-1 points are these knots; q(0) = q0 is unchanged from rung 0, only its timing within the year moves (32% of it in the first month).",
  "M8 Old-age tail (Beard's Perks logistic, R12 §9 p. 59: mu(u) = a e^{b u} / (1 + a e^{b u}), the simplest member of Perks's family, bounded; the Gompertz mu = B c^x is unbounded and Brass's own grid reaches l = 0 at 100). Anchor: age 90 = grid index 66, with L_65 (87.5), L_66 (90), L_67 (92.5), all > 0 and strictly decreasing inside the bounds (L_i >= 4 since K W_i < 2^30; a violation is a construction error naming M8). Brass's per-year interval hazards: m1 = rhe(2 ln_ratio(L_65, L_66) / 5), m2 = rhe(2 ln_ratio(L_66, L_67) / 5) (Q32_32; 2.5 years = 5 half-years). m2 > m1 for every K > 0 and beta > 0 (proof: with r1 = W_66 / W_65 < r2 = W_67 / W_66 and u = K W_66, (1 + u r2) / (1 + u) > (1 + u r1) / (1 + u) >= r1 (1 + u) / (r1 + u) because (1 + u r1)(r1 + u) - r1 (1 + u)^2 = u (1 - r1)^2 >= 0). The hazard at 90: mu = rhe((m1 + m2) / 2), which must be < 2^32 (one per year; it is at most 0.55 inside the bounds; otherwise a construction error naming M8). a = rhe(mu 2^32 / (2^32 - mu)). The log-slope g = rhe(2 ln_ratio(m2, m1) / 5) > 0 and b = rhe(g 2^32 / (2^32 - mu)) (the logistic's d ln mu / du at u = 0 is b (1 - mu), matched to Brass's g); b (120 - 90) <= 16 2^32 must hold (exp's domain; it is at most 0.17 x 30 inside the bounds; otherwise a construction error naming M8). Knots at ages 90 Y + j Y / 12 minutes, j = 0..360: T_0 = L_66; for j = 1..359: E_j = exp(rhe(b j / 12)); A_j = 2^32 + rhe(a E_j / 2^32) (1 + a e^{b u}, Q32_32, < 2^44); R_j = ln_ratio(2^32 + a, A_j) (<= 0); y_j = rhe(R_j 2^32 / b) (ln S(u) = (1 / b) ln((1 + a) / (1 + a e^{b u})), the closed form of the logistic's survival); S_j = exp(y_j) (0 when y_j < -23 2^32, exp's rule); T_j = min(T_(j-1), rhe(L_66 S_j / 2^32)) (forced non-increasing: faithful rounding is not monotone below 2^-27); T_360 = 0: death is certain in the month a person reaches 120 (as rung 0's at 100). The grid points 92.5, 95, 97.5 and 100 are not knots. Continuity: l(90) = L_66 exactly; the tail's first-month hazard is within 1% of mu (check 4).",
  "M9 Knots and survivors at an age in minutes. The knot ages, in twelfths of a year (exact minutes for both calendars: twelfth x Y / 12): the infant knots 0..12, the grid ages 2..90 (h_i / 2 years for i = 2..66), the tail knots 90 + j / 12 for j = 1..360: 438 knots, strictly increasing in age (0 to 120 years), non-increasing in survivorship (2^32 to 0). For an age x (i64 minutes, x >= 0; negative is an error): if x >= 120 Y then l(x) = 0; otherwise, for the unique knot interval [A_j, A_(j+1)) holding x, l(x) = T_j + rhe((T_(j+1) - T_j)(x - A_j) / (A_(j+1) - A_j)) (S7's rule; |T_(j+1) - T_j| <= 2^32 and x - A_j < 2.5 x 525600 < 2^21, so the product is < 2^53, i64). l(x) is in [0, 2^32] and non-increasing in x; on [Y, 90 Y] it is rung 0's S7 value at every minute when beta = 1 (check 1).",
  "M10 Monthly probability. As S8, with M9's l: at the Month pulse instant t_m with month length D (minutes), a living person with birth tick b has x = t_m - b; q = 2^32 if l(x) = 0, else rhe(2^32 (l(x) - l(x + D)) / l(x)) (numerator u128). q is a Prob32 (bits in [0, 2^32]); q = 2^32 iff x + D >= 120 Y. A newborn's first draw (the seam with births, [seam]): if m >= 1 and b > t_(m-1) (born since the previous Month pulse; a founder's birth tick is at or before the epoch, so never a founder), the probability covers [0, x + D) instead of [x, x + D): q = rhe(2^32 (2^32 - l(x + D)) / 2^32) = 2^32 - l(x + D) exactly. Without it a child born inside a month would carry no hazard for its first x minutes (SPR-015 as drafted; closed by SPR-016).",
  "M11 Density modifier and the entitlement hook. Once per Month pulse, before any draw: N = the number of ledger rows with alive = 1 at that instant (M2's own column, so no coupling and no lag). The density term m_d (Q16_16 bits): if N <= K_cap then m_d = 65536 exactly; else m_d = min(4 x 65536, 65536 + rhe(S_d (N - K_cap) / K_cap)) (a one-sided positive check: 1 + slope (N / K_cap - 1), ceiling 4; R09 §2's d (1 + x) above capacity only; D-SPR016-1). Per person: q' = min(2^32, rhe(q m_d / 2^16)); with m_d = 65536, q' = q exactly, so rung 0's draws are unchanged at or under the capacity. Form: a multiplier on the monthly probability, exact in integers at one multiply per person-month; it is the first-order form of a proportional hazard, 1 - (1 - q)^m, whose relative difference is (m - 1) q / 2 (below 1% wherever q < 0.02 / (m - 1): at m = 2 that is q < 0.02 per month, which at e0 = 30 excludes only the first two months of life and ages above about 88; at the ceiling m = 4 it is q < 0.0067). The entitlement term, R09 §2's form q'' = 1 - (1 - q')(y / y*)^eps_m, clamped: once per household per month, with w = the household's food_entitlement_ratio (Q16_16 bits, the declared read) and eps = eps_m bits (Q16_16): f = 2^32 if w >= 65536, else f = exp(rhe(eps ln_ratio(w, 65536) / 2^16)) (Q32_32, in (0, 2^32); the argument is <= 0, and below -23 exp gives 0); per member q'' = 2^32 - rhe((2^32 - q') f / 2^32) (numerator u128; q'' in [q', 2^32]). With f = 2^32, q'' = q' exactly. In P1a the term is not evaluated: the read's owner is absent (rh-core supplies the neutral 65536), eps_m is not compiled (the births Registry delta keeps it unread), and q'' = q'; P1.5a turns the evaluation on with eps_m's default, which is then a C3 change on no P1a golden (every P1a household has the neutral ratio).",
