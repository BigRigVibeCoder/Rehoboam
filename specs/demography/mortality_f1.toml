# ----------------------------------------------------------------------------- the entitlement hook (MR11), stubbed
# A declared read with a neutral value, in the next file's own format ([[reads]] with the neutral in `why`, an
# in-coupling with the RT-2026-10-16 fields, a forcing series in [isolation]). SPR-014's absent-owner rule gives
# the step view the neutral until M4.economy registers, so the hook is wired now and does nothing until P1.5a.
# The column name is the Architect's to confirm against M4's spec when it exists (none today; lint_odd warns
# "owner has no spec yet", as it does for S7's read of MR6).
[[reads_added]]
column = "household.food_entitlement_ratio"
owner = "M4.economy"
lag = "start_of_day"
use = "rate"
neutral = 1.0                                # EVO-001's typed neutral (REV-SPR-016 R8): the column's own type, q16_16 65536
why = "MR11's entitlement term: a household's calorie-entitlement ratio y / y* below 1 raises its members' monthly death probability in R09 §2's form (V-SF-20b: a raised hunger-mortality hazard below the bread-only floor 0.44 for more than a year). Neutral: 1.0 (q16_16 65536), no shortfall; the term is the identity. Not evaluated in P1a (eps_m unread)"
[[couplings_added]]
system = "M4.economy"
direction = "in"
column = "household.food_entitlement_ratio"
via = "MR11: f = (y / y*)^eps_m, clamped to 1 from above, computed once per household per month with 05.1 §6 item 4's exp and ln; q'' = 1 - (1 - q') f per member (R09 §2). The one-year dwell of V-SF-20b and the exact clamp are P1.5a's to state. In P1a the owner is absent: SPR-014's registration rule drops the read and the neutral applies"
lag = "start of day"
form = "survival factor: 1 - q'' = (1 - q') (y / y*)^eps_m, 1 at y / y* >= 1"
neutral = "household.food_entitlement_ratio = 1.0 for every household (no shortfall: f = 1, q'' = q')"
output_bounds = "f in (0, 1]; q'' in [q', 1]"
data_range = "y / y* in [0.3, 3] (R12 §17-18, Allen 2001 welfare ratios)"
beyond_range = "clamped on both sides before the logarithm: w := min(max(w, 19661), 65536) (0.3 to 1.0 in q16_16), so ln_ratio never sees 0 and f = 1 above 1 (P1.5a confirms the floor)"
source = "R09 §2 (the entitlement form; famine kills infants and the old); V-SF-20b"
isolation_forcing_added = { input = "household.food_entitlement_ratio", series = "constant:1.0", note = "no MR4: no shortfall, the term is the identity; from P1.5a also sine:[0.6, 1.4]/7y and step:1.0->0.4@year50/2y, as the next file's [isolation] expect already names" }

# ----------------------------------------------------------------------------- [[params]] (changes and additions)
[[params_changed]]
name = "brass_beta"
meaning = "Slope of mortality on the logit scale: O(x)^beta on the General Standard (MR3). Any value in the Registry bounds; 1 is the standard's own shape and reproduces rung 0 bit for bit (M3, MR4)"
source = "Brass 1971; observed 0.64 to 1.64 (R12 §9); default 1 (SPR-011 ruling 8)"
default = 1.0
[[params_changed]]
name = "brass_alpha"
meaning = "Level of mortality on the logit scale. Still refused at load in P1a (as at rung 0): e0 is the level input, and K = exp(2 alpha) is its image, so any (alpha, beta) is reachable through e0 at the given beta (DV-SPR016-2 offers the alternative). P1b reads era-state shifts delta_alpha through K_eff = K exp(2 delta_alpha)"
source = "Brass 1971; observed -1.36 to 0.55"
[[params_added]]
name = "density_capacity"
meaning = "The living count K_cap at and under which the density modifier is exactly 1 (MR11); above it mortality rises linearly in N / K_cap - 1. A count (integer), compiled as u64, the world's one capacity in P1a (not_yet: settlement capacities from M1 F0 / M3). Default 10,000,000, the manifest's maximum population, so no P1a world is above it unless its manifest sets one: the P1a goldens do not move for it"
source = "R09 §2: density dependence d (1 + x), x = N / K - 1, which removed every extinction and bounded the band in R09's own simulation; V-SF-01 reads K for its population band [0.3, 5] K"
default = 10000000
registry_bounds = [1, 10000000]
[[params_added]]
name = "density_mortality_slope"
meaning = "The slope of the density modifier above the capacity (MR11): m_d = 1 + slope (N / K_cap - 1), capped at 4. A q16_16"
source = "R09 §2 uses slope 1 in its toy; a design value until SPR-028 calibrates it against V-SF-01 on the dynastic fixture world"
default = 1.0
registry_bounds = [0.0, 3.0]
[[params_unchanged_not_read]]
name = "eps_m"
note = "Not read in P1a (the entitlement term is declared but not evaluated: MR11), as the births Registry delta states; so it needs no default yet. P1.5a reads it and gives it one (Registry bounds [0.5, 3.0] exist)"

