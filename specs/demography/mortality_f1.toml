# REV-SPR-016 R1 (MAJ-1): the frozen death_time entry (purpose, key ["person", "month"], use, resample_on_fork,
# the stream-key comment and the two `draws` lines) is kept VERBATIM: the births next-mode lint refuses a
# changed `draws` text on a frozen purpose. Its k = 0 line already reads "the monthly Bernoulli on the month's
