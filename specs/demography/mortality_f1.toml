# M2 F1 mortality (SPR-016, P1.3 b): the standalone spec section the Architect folds into the next-version M2 spec,
# specs/systems/next/M2.demography.odd.toml (0.3.0 draft, SPR-015, arch/M2-F1-births 421f2e1), after the births PR
# merges. Drafted 2026-10-17 for the Architect's ruling (AGT-001); it binds nothing until it is folded in. It holds:
# the [algorithm.mortality_f1] text, stated as exactly as [algorithm.mortality_rung0] (steps M0-M13; the births
# tables use F, N and H, rung 0 uses S); the [[rng]] and not_yet changes; the [[reads]], [[couplings]] and
# [isolation] stub of the entitlement hook; the [[params]] it reads; the Registry delta SPR-016 needs (listed, not
# made); the seam with births (who owns what at a birth and a death); and the director items (D-) it raises, each
# with a recommendation and a confidence.
#
# Research: Brass (1971) through R12 §9 (the relational logit, the General Standard, the observed ranges, "weak at
# both ends": p. 86 and p. 95; Beard's Perks logistic for old age, p. 59); the demographic facts of R09 §2 (infant
# mortality a quarter to a third; density dependence as d (1 + x), x = N / K - 1; the entitlement form
# q = 1 - (1 - q0)(y / y*)^eps_m, clamped; famine kills infants and the old). Contracts: 05.1 §3 (the M2 row:
# fixed-point odds form, alpha a function of era state, an infant sub-schedule below 1 and an old-age tail above
# 90, entitlement and density modifiers); 05.1 §6 item 4 v1.10 (Q32_32 exp and ln; Prob32); SPR-011 rulings 4,
# 7 (amended), 8, 9; SIM-5 (age-specific, density-dependent hazards, binomial draws); V-INV-08; V-SF-01, V-SF-02,
# V-SF-02b; the births draft's companion, docs/05_architecture/systems/M2.demography_F1.md §4 (what SPR-016 needs).
# Exact reference: specs/demography/selftest_m2_f1_mortality.py (standard library), golden file
# specs/demography/golden/m2_f1_mortality.txt. Data: specs/demography/brass_general_standard.toml (M1),
# specs/demography/infant_sub_schedule.toml (M7).

[fold]
target = "specs/systems/next/M2.demography.odd.toml"   # 0.3.0 draft (SPR-015); not the frozen 0.2.0 file
spec_version = "0.3.0"                                   # the same next version: births and mortality freeze together
adds_beside = "[algorithm.mortality_rung0]"              # the next-mode lint keeps every 0.2.0 algorithm table byte for byte
                                                         # (specs/systems/next/README.md); mortality_f1 is a new table, and
                                                         # rung 0 is its beta = 1, N <= capacity case on ages 1 to 90
fidelity_ladder_F1_representation = "Per-person Brass relational-logit hazards on the General Standard at any (alpha, beta) in fixed point (specs/demography; 05.1 §6 item 4 exp and ln), with an infant sub-schedule below 1, a logistic old-age tail above 90, a density modifier and a stubbed entitlement hook ([algorithm.mortality_f1]); births, partnering and households as [algorithm.fertility_f1], [algorithm.partnering_f1], [algorithm.households_f1]; monthly Bernoulli draws"
submodel_mortality_summary = "[algorithm.mortality_f1] M1-M12: the odds grid O(x)^beta by fixed-point exp and ln (M3); K from e0 by the rung-0 bisection on that grid (M5); the infant sub-schedule (M7) and the logistic tail to 120 (M8) as knots in minutes of age; monthly q = 1 - l(x + D) / l(x) as Prob32 (M10), a newborn's first draw from birth; the density modifier and the stubbed entitlement term (M11); one keyed Bernoulli per living person per month (k = 0) and a death timer at a keyed day start (k = 1)"

# ----------------------------------------------------------------------------- not_yet (changes to the next file's list)
# Removed by this fold: the next file's first two entries ("Brass at any (alpha, beta) ... (SPR-016)" and "An infant
# sub-schedule below age 1 and an old-age tail above 90 (SPR-016)"). Its third entry is replaced by the first below;
# its fourth (maternal mortality, stillbirth and twins) stays and gains the ownership note in [seam]. Added:
not_yet_replaced = [
  "Density and entitlement modifiers: the density term is in ([algorithm.mortality_f1] M11, on the world's density_capacity until M1 F0 / M3 give a settlement capacity, SPR-018 and P1b); the entitlement term is declared (the read of M4's household entitlement ratio, neutral 1) and stated in R09 §2's form, but not evaluated until M4 F0 (P1.5a) registers and eps_m gets its default; the same hook on fertility (eps_f) multiplies [algorithm.fertility_f1]'s level M. V-SF-20b",
]
not_yet_added = [
  "Era-state level shifts (05.1 §3.1; ADR-0027): medical_level and sanitation_level (S2.technology, P1b) move alpha; F1 applies them as K_eff = K exp(2 delta_alpha) through 05.1 §6 item 4's exp, recomputing M6-M8 when the era state changes. Not read in P1a: S2 has no owner",
  "Sex-specific schedules: Brass's Table 8 differentials (p. 86) are not applied; both sexes run the same (alpha, beta). A P1b item if V-SF-02b or the harness (SPR-028) needs it",
  "Minute-level death times (BCK-002 A-35): M12 keeps rung 0's day starts",
]

# ----------------------------------------------------------------------------- [[rng]] death_time (changes only)
# The purpose, its key ["person", "month"], resample_on_fork = true, the stream key, the k = 1 draw and its place
# as the first purpose (the RngPurpose prefix the next-mode lint preserves) are unchanged from 0.2.0 and from the
# births draft. Only the k = 0 line changes: the probability is M11's q'', not S8's q. No new purpose.
[[rng_changes]]
purpose = "death_time"
draws = [
  "k = 0: the monthly Bernoulli on the month's modified Prob32 probability q'' ([algorithm.mortality_f1] M10, M11); exactly one draw per living person per month, whatever q'' (CRN)",
  "k = 1: only on a hit, the day of death: unchanged (M12 = S9; in a re-sample S11)",
]
no_new_purposes = true

# ----------------------------------------------------------------------------- the entitlement hook (M11), stubbed
# A declared read with a neutral value, in the next file's own format ([[reads]] with the neutral in `why`, an
# in-coupling with the RT-2026-10-16 fields, a forcing series in [isolation]). SPR-014's absent-owner rule gives
# the step view the neutral until M4.economy registers, so the hook is wired now and does nothing until P1.5a.
# The column name is the Architect's to confirm against M4's spec when it exists (none today; lint_odd warns
# "owner has no spec yet", as it does for S7's read of M6).
[[reads_added]]
column = "household.food_entitlement_ratio"
owner = "M4.economy"
lag = "start_of_day"
use = "rate"
why = "M11's entitlement term: a household's calorie-entitlement ratio y / y* below 1 raises its members' monthly death probability in R09 §2's form (V-SF-20b: a raised hunger-mortality hazard below the bread-only floor 0.44 for more than a year). Neutral: 1.0 (q16_16 65536), no shortfall; the term is the identity. Not evaluated in P1a (eps_m unread)"
[[couplings_added]]
system = "M4.economy"
direction = "in"
column = "household.food_entitlement_ratio"
via = "M11: f = (y / y*)^eps_m, clamped to 1 from above, computed once per household per month with 05.1 §6 item 4's exp and ln; q'' = 1 - (1 - q') f per member (R09 §2). The one-year dwell of V-SF-20b and the exact clamp are P1.5a's to state. In P1a the owner is absent: SPR-014's registration rule drops the read and the neutral applies"
lag = "start of day"
form = "survival factor: 1 - q'' = (1 - q') (y / y*)^eps_m, 1 at y / y* >= 1"
neutral = "household.food_entitlement_ratio = 1.0 for every household (no shortfall: f = 1, q'' = q')"
output_bounds = "f in (0, 1]; q'' in [q', 1]"
data_range = "y / y* in [0.3, 3] (R12 §17-18, Allen 2001 welfare ratios)"
beyond_range = "clamped: f = 1 above 1; below 0.3 the ratio is taken as 0.3 (P1.5a confirms)"
source = "R09 §2 (the entitlement form; famine kills infants and the old); V-SF-20b"
isolation_forcing_added = { input = "household.food_entitlement_ratio", series = "constant:1.0", note = "no M4: no shortfall, the term is the identity; from P1.5a also sine:[0.6, 1.4]/7y and step:1.0->0.4@year50/2y, as the next file's [isolation] expect already names" }

# ----------------------------------------------------------------------------- [[params]] (changes and additions)
[[params_changed]]
name = "brass_beta"
meaning = "Slope of mortality on the logit scale: O(x)^beta on the General Standard (M3). Any value in the Registry bounds; 1 is the standard's own shape and reproduces rung 0 bit for bit (M3, M4)"
source = "Brass 1971; observed 0.64 to 1.64 (R12 §9); default 1 (SPR-011 ruling 8)"
default = 1.0
[[params_changed]]
name = "brass_alpha"
meaning = "Level of mortality on the logit scale. Still refused at load in P1a (as at rung 0): e0 is the level input, and K = exp(2 alpha) is its image, so any (alpha, beta) is reachable through e0 at the given beta (D-SPR016-2 offers the alternative). P1b reads era-state shifts delta_alpha through K_eff = K exp(2 delta_alpha)"
source = "Brass 1971; observed -1.36 to 0.55"
[[params_added]]
name = "density_capacity"
meaning = "The living count K_cap at and under which the density modifier is exactly 1 (M11); above it mortality rises linearly in N / K_cap - 1. A count (integer), compiled as u64, the world's one capacity in P1a (not_yet: settlement capacities from M1 F0 / M3). Default 10,000,000, the manifest's maximum population, so no P1a world is above it unless its manifest sets one: the P1a goldens do not move for it"
source = "R09 §2: density dependence d (1 + x), x = N / K - 1, which removed every extinction and bounded the band in R09's own simulation; V-SF-01 reads K for its population band [0.3, 5] K"
default = 10000000
registry_bounds = [1, 10000000]
[[params_added]]
name = "density_mortality_slope"
meaning = "The slope of the density modifier above the capacity (M11): m_d = 1 + slope (N / K_cap - 1), capped at 4. A q16_16"
source = "R09 §2 uses slope 1 in its toy; a design value until SPR-028 calibrates it against V-SF-01 on the dynastic fixture world"
default = 1.0
registry_bounds = [0.0, 3.0]
[[params_unchanged_not_read]]
name = "eps_m"
note = "Not read in P1a (the entitlement term is declared but not evaluated: M11), as the births Registry delta states; so it needs no default yet. P1.5a reads it and gives it one (Registry bounds [0.5, 3.0] exist)"

