[workspace]
resolver = "3"
members = ["rh-view-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
allow_attributes_without_reason = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package.rh-view-core]
opt-level = 2
